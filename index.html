<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>My AI</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#0b0d10;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body{
  overflow:hidden;
}

.app{
  width:100%;
  height:100dvh;
  display:flex;
  flex-direction:column;
  background:#0b0d10;
}

/* HEADER */

.header{
  height:62px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  border-bottom:1px solid #20242a;
  background:#0d0f12;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:20px;
  font-weight:700;
}

.logo-icon{
  width:36px;
  height:36px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#20252c;
  font-size:20px;
}

.header-actions{
  display:flex;
  gap:7px;
}

.icon-btn{
  width:40px;
  height:40px;
  border:0;
  border-radius:12px;
  background:#1b1f24;
  color:#fff;
  font-size:19px;
  cursor:pointer;
}

.icon-btn:active{
  transform:scale(.95);
}

/* CHAT */

.chat{
  flex:1;
  overflow-y:auto;
  padding:18px 12px 120px;
  scroll-behavior:smooth;
}

.chat::-webkit-scrollbar{
  width:4px;
}

.chat::-webkit-scrollbar-thumb{
  background:#30353c;
  border-radius:10px;
}

/* WELCOME */

.welcome{
  max-width:650px;
  margin:70px auto 30px;
  text-align:center;
  padding:20px;
}

.welcome-icon{
  width:72px;
  height:72px;
  margin:auto;
  border-radius:24px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#20252c;
  font-size:38px;
}

.welcome h1{
  margin:18px 0 8px;
  font-size:28px;
}

.welcome p{
  margin:0;
  color:#9298a1;
  line-height:1.5;
}

/* MESSAGE */

.message-row{
  width:100%;
  display:flex;
  margin:12px 0;
}

.message-row.user{
  justify-content:flex-end;
}

.message-row.assistant{
  justify-content:flex-start;
}

.message{
  max-width:min(88%,720px);
  border-radius:18px;
  padding:12px 14px;
  line-height:1.55;
  font-size:15px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.user .message{
  background:#2457d6;
  border-bottom-right-radius:5px;
}

.assistant .message{
  background:#181c21;
  border:1px solid #252a31;
  border-bottom-left-radius:5px;
}

.message img{
  display:block;
  max-width:100%;
  border-radius:12px;
  margin-top:8px;
}

.message-tools{
  display:flex;
  gap:7px;
  margin-top:9px;
  flex-wrap:wrap;
}

.tool-btn{
  border:1px solid #30363e;
  background:#20252b;
  color:#fff;
  border-radius:10px;
  padding:7px 10px;
  font-size:13px;
  cursor:pointer;
}

.tool-btn:active{
  transform:scale(.97);
}

/* LOADING */

.typing{
  display:flex;
  align-items:center;
  gap:5px;
  padding:5px 2px;
}

.dot{
  width:7px;
  height:7px;
  background:#aaa;
  border-radius:50%;
  animation:blink 1.2s infinite;
}

.dot:nth-child(2){
  animation-delay:.2s;
}

.dot:nth-child(3){
  animation-delay:.4s;
}

@keyframes blink{
  0%,80%,100%{opacity:.3}
  40%{opacity:1}
}

/* IMAGE PREVIEW */

.preview{
  display:none;
  position:fixed;
  left:10px;
  right:10px;
  bottom:92px;
  z-index:20;
  background:#15191e;
  border:1px solid #30363e;
  border-radius:15px;
  padding:8px;
}

.preview-inner{
  display:flex;
  align-items:center;
  gap:10px;
}

.preview img{
  width:60px;
  height:60px;
  object-fit:cover;
  border-radius:10px;
}

.preview-info{
  flex:1;
  min-width:0;
}

.preview-name{
  font-size:13px;
  color:#ddd;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.preview-remove{
  width:34px;
  height:34px;
  border:0;
  border-radius:10px;
  background:#292e35;
  color:#fff;
  font-size:18px;
}

/* INPUT */

.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:30;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  background:linear-gradient(
    to top,
    #0b0d10 75%,
    rgba(11,13,16,0)
  );
}

.input-box{
  max-width:850px;
  margin:auto;
  display:flex;
  align-items:flex-end;
  gap:7px;
  padding:7px;
  border:1px solid #30363e;
  border-radius:18px;
  background:#15191e;
}

.input-box textarea{
  flex:1;
  min-width:0;
  max-height:130px;
  min-height:42px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  font-size:16px;
  line-height:1.4;
  padding:10px 5px;
  font-family:inherit;
}

.input-box textarea::placeholder{
  color:#747b84;
}

.input-btn{
  width:42px;
  height:42px;
  flex-shrink:0;
  border:0;
  border-radius:13px;
  background:#242a31;
  color:#fff;
  font-size:19px;
}

.input-btn:active{
  transform:scale(.94);
}

.send-btn{
  background:#2457d6;
}

.recording{
  background:#a52c38 !important;
}

/* STATUS */

.status{
  text-align:center;
  font-size:11px;
  color:#666d76;
  margin-top:5px;
  min-height:16px;
}

/* MENU */

.menu{
  display:none;
  position:fixed;
  top:58px;
  right:10px;
  z-index:50;
  width:220px;
  background:#171b20;
  border:1px solid #30363e;
  border-radius:14px;
  padding:7px;
  box-shadow:0 15px 40px rgba(0,0,0,.45);
}

.menu.show{
  display:block;
}

.menu button{
  width:100%;
  border:0;
  background:transparent;
  color:#fff;
  text-align:left;
  padding:12px;
  border-radius:10px;
  font-size:14px;
}

.menu button:active{
  background:#252a30;
}

/* MODAL */

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.65);
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(500px,100%);
  background:#171b20;
  border:1px solid #30363e;
  border-radius:18px;
  padding:18px;
}

.modal-title{
  font-size:19px;
  font-weight:700;
  margin-bottom:14px;
}

.modal textarea{
  width:100%;
  min-height:120px;
  resize:vertical;
  background:#0f1216;
  border:1px solid #30363e;
  border-radius:12px;
  color:#fff;
  padding:12px;
  outline:none;
  font-family:inherit;
  font-size:15px;
}

.modal-actions{
  display:flex;
  gap:8px;
  justify-content:flex-end;
  margin-top:12px;
}

.modal-actions button{
  border:0;
  border-radius:10px;
  padding:10px 15px;
  background:#252a30;
  color:#fff;
}

.modal-actions .primary{
  background:#2457d6;
}

/* MOBILE */

@media(max-width:600px){

  .header{
    height:58px;
  }

  .logo{
    font-size:18px;
  }

  .logo-icon{
    width:34px;
    height:34px;
  }

  .chat{
    padding:14px 9px 120px;
  }

  .message{
    max-width:94%;
    font-size:15px;
  }

  .welcome{
    margin-top:55px;
  }

  .welcome h1{
    font-size:25px;
  }

}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->

  <header class="header">

    <div class="logo">
      <div class="logo-icon">🤖</div>
      <span>My AI</span>
    </div>

    <div class="header-actions">

      <button
        class="icon-btn"
        onclick="newChat()"
        title="Жаңа чат">
        ＋
      </button>

      <button
        class="icon-btn"
        onclick="toggleMenu()"
        title="Мәзір">
        ☰
      </button>

    </div>

  </header>


  <!-- MENU -->

  <div
    id="menu"
    class="menu">

    <button onclick="newChat()">
      🆕 Жаңа чат
    </button>

    <button onclick="openImageGenerator()">
      🎨 Сурет жасау
    </button>

    <button onclick="openURLReader()">
      🌐 URL оқу
    </button>

    <button onclick="clearChat()">
      🗑️ Чатты тазалау
    </button>

  </div>


  <!-- CHAT -->

  <main
    id="chat"
    class="chat">

    <div
      id="welcome"
      class="welcome">

      <div class="welcome-icon">
        🤖
      </div>

      <h1>
        Сәлем!
      </h1>

      <p>
        Мен My AI көмекшісімін.<br>
        Қазақша сұрақ қой, сурет немесе файл жібер.
      </p>

    </div>

  </main>


  <!-- IMAGE PREVIEW -->

  <div
    id="preview"
    class="preview">

    <div class="preview-inner">

      <img
        id="previewImage"
        src=""
        alt="">

      <div class="preview-info">

        <div
          id="previewName"
          class="preview-name">
        </div>

      </div>

      <button
        class="preview-remove"
        onclick="removeImage()">
        ×
      </button>

    </div>

  </div>


  <!-- BOTTOM -->

  <div class="bottom">

    <div class="input-box">

      <button
        class="input-btn"
        onclick="openFile()"
        title="Файл">
        📎
      </button>

      <button
        class="input-btn"
        onclick="openCamera()"
        title="Камера">
        📷
      </button>

      <textarea
        id="messageInput"
        placeholder="Хабарлама жазыңыз..."
        rows="1"
        oninput="autoResize(this)"
        onkeydown="handleKey(event)">
      </textarea>

      <button
        id="micButton"
        class="input-btn"
        onclick="toggleRecording()"
        title="Дауыс">
        🎤
      </button>

      <button
        class="input-btn send-btn"
        onclick="sendMessage()"
        title="Жіберу">
        ➤
      </button>

    </div>

    <div
      id="status"
      class="status">
    </div>

  </div>

</div>


<!-- HIDDEN FILE INPUT -->

<input
  id="fileInput"
  type="file"
  accept="image/*,.txt,.md,.csv,.json,.html"
  hidden
  onchange="handleFile(event)">


<!-- CAMERA -->

<input
  id="cameraInput"
  type="file"
  accept="image/*"
  capture="environment"
  hidden
  onchange="handleFile(event)">


<!-- MODAL -->

<div
  id="modal"
  class="modal">

  <div class="modal-box">

    <div
      id="modalTitle"
      class="modal-title">
    </div>

    <textarea
      id="modalInput"
      placeholder="">
    </textarea>

    <div class="modal-actions">

      <button
        onclick="closeModal()">
        Болдырмау
      </button>

      <button
        class="primary"
        onclick="modalSubmit()">
        Орындау
      </button>

    </div>

  </div>

</div>


<script>

/*
============================================================
 CONFIG
============================================================
*/

const WORKER_URL =
  "https://my-ai-backend.razinavsegda84.workers.dev";


/*
============================================================
 STATE
============================================================
*/

let chatHistory = [];

let selectedImage = null;

let selectedFileText = "";

let selectedFileName = "";

let mediaRecorder = null;

let audioChunks = [];

let recording = false;

let currentModalAction = "";


/*
============================================================
 ELEMENTS
============================================================
*/

const chat =
  document.getElementById("chat");

const input =
  document.getElementById("messageInput");

const statusEl =
  document.getElementById("status");

const preview =
  document.getElementById("preview");

const previewImage =
  document.getElementById("previewImage");

const previewName =
  document.getElementById("previewName");

const menu =
  document.getElementById("menu");


/*
============================================================
 STATUS
============================================================
*/

function setStatus(text){

  statusEl.textContent =
    text || "";

}


/*
============================================================
 MENU
============================================================
*/

function toggleMenu(){

  menu.classList.toggle("show");

}


document.addEventListener(
  "click",
  function(event){

    if(
      !menu.contains(event.target) &&
      !event.target.closest(".icon-btn")
    ){

      menu.classList.remove("show");

    }

  }
);


/*
============================================================
 NEW CHAT
============================================================
*/

function newChat(){

  chatHistory = [];

  selectedImage = null;

  selectedFileText = "";

  selectedFileName = "";

  removeImage();

  chat.innerHTML = `

    <div class="welcome" id="welcome">

      <div class="welcome-icon">
        🤖
      </div>

      <h1>
        Сәлем!
      </h1>

      <p>
        Мен My AI көмекшісімін.<br>
        Қазақша сұрақ қой, сурет немесе файл жібер.
      </p>

    </div>

  `;

  input.value = "";

  autoResize(input);

  setStatus("");

  menu.classList.remove("show");

}


/*
============================================================
 CLEAR
============================================================
*/

function clearChat(){

  if(
    confirm("Чатты тазалаймыз ба?")
  ){

    newChat();

  }

}


/*
============================================================
 AUTO RESIZE
============================================================
*/

function autoResize(el){

  el.style.height = "auto";

  el.style.height =
    Math.min(
      el.scrollHeight,
      130
    ) + "px";

}


/*
============================================================
 KEYBOARD
============================================================
*/

function handleKey(event){

  if(
    event.key === "Enter" &&
    !event.shiftKey
  ){

    event.preventDefault();

    sendMessage();

  }

}


/*
============================================================
 FILE
============================================================
*/

function openFile(){

  document
    .getElementById("fileInput")
    .click();

}


/*
============================================================
 CAMERA
============================================================
*/

function openCamera(){

  document
    .getElementById("cameraInput")
    .click();

}


/*
============================================================
 HANDLE FILE
============================================================
*/

async function handleFile(event){

  const file =
    event.target.files?.[0];

  if(!file){

    return;

  }


  selectedFileName =
    file.name;


  /*
  IMAGE
  */

  if(
    file.type.startsWith("image/")
  ){

    try{

      const dataURL =
        await readFileAsDataURL(file);

      selectedImage =
        await compressImage(dataURL);

      previewImage.src =
        selectedImage;

      previewName.textContent =
        file.name;

      preview.style.display =
        "block";

      setStatus(
        "Сурет дайын."
      );

    }catch(err){

      console.error(err);

      setStatus(
        "Суретті оқу қатесі."
      );

    }

  }


  /*
  TEXT FILE
  */

  else{

    try{

      selectedFileText =
        await file.text();

      setStatus(
        "Файл дайын: " +
        file.name
      );

    }catch(err){

      console.error(err);

      setStatus(
        "Файлды оқу мүмкін болмады."
      );

    }

  }


  event.target.value = "";

}


/*
============================================================
 READ DATA URL
============================================================
*/

function readFileAsDataURL(file){

  return new Promise(
    (resolve,reject)=>{

      const reader =
        new FileReader();

      reader.onload =
        () => resolve(
          reader.result
        );

      reader.onerror =
        reject;

      reader.readAsDataURL(file);

    }
  );

}


/*
============================================================
 COMPRESS IMAGE
============================================================
*/

function compressImage(
  dataURL
){

  return new Promise(
    (resolve)=>{

      const img =
        new Image();

      img.onload =
        () => {

          const MAX =
            1280;

          let width =
            img.width;

          let height =
            img.height;


          if(
            width > MAX ||
            height > MAX
          ){

            if(
              width > height
            ){

              height =
                Math.round(
                  height *
                  MAX /
                  width
                );

              width =
                MAX;

            }else{

              width =
                Math.round(
                  width *
                  MAX /
                  height
                );

              height =
                MAX;

            }

          }


          const canvas =
            document.createElement(
              "canvas"
            );

          canvas.width =
            width;

          canvas.height =
            height;


          const ctx =
            canvas.getContext(
              "2d"
            );

          ctx.drawImage(
            img,
            0,
            0,
            width,
            height
          );


          resolve(
            canvas.toDataURL(
              "image/jpeg",
              0.70
            )
          );

        };

      img.src =
        dataURL;

    }
  );

}


/*
============================================================
 REMOVE IMAGE
============================================================
*/

function removeImage(){

  selectedImage = null;

  preview.style.display =
    "none";

  previewImage.src =
    "";

  previewName.textContent =
    "";

}


/*
============================================================
 ADD USER MESSAGE
============================================================
*/

function addUserMessage(
  text,
  image
){

  const row =
    document.createElement(
      "div"
    );

  row.className =
    "message-row user";


  const box =
    document.createElement(
      "div"
    );

  box.className =
    "message";


  if(image){

    const img =
      document.createElement(
        "img"
      );

    img.src =
      image;

    box.appendChild(img);

  }


  if(text){

    const textDiv =
      document.createElement(
        "div"
      );

    textDiv.textContent =
      text;

    box.appendChild(
      textDiv
    );

  }


  row.appendChild(box);

  chat.appendChild(row);

  scrollBottom();

}


/*
============================================================
 ADD AI MESSAGE
============================================================
*/

function addAssistantMessage(
  text,
  type = "chat"
){

  const row =
    document.createElement(
      "div"
    );

  row.className =
    "message-row assistant";


  const box =
    document.createElement(
      "div"
    );

  box.className =
    "message";


  box.textContent =
    text;


  const tools =
    document.createElement(
      "div"
    );

  tools.className =
    "message-tools";


  /*
  SPEAK
  */

  const speak =
    document.createElement(
      "button"
    );

  speak.className =
    "tool-btn";

  speak.textContent =
    "🔊 Тыңдау";

  speak.onclick =
    () => speakAnswer(
      text,
      speak
    );

  tools.appendChild(
    speak
  );


  box.appendChild(
    tools
  );

  row.appendChild(
    box
  );

  chat.appendChild(
    row
  );

  scrollBottom();

}


/*
============================================================
 LOADING
============================================================
*/

function showLoading(){

  const row =
    document.createElement(
      "div"
    );

  row.id =
    "loadingMessage";

  row.className =
    "message-row assistant";


  row.innerHTML = `

    <div class="message">

      <div class="typing">

        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>

      </div>

    </div>

  `;

  chat.appendChild(row);

  scrollBottom();

}


/*
============================================================
 REMOVE LOADING
============================================================
*/

function removeLoading(){

  document
    .getElementById(
      "loadingMessage"
    )
    ?.remove();

}


/*
============================================================
 SCROLL
============================================================
*/

function scrollBottom(){

  setTimeout(
    () => {

      chat.scrollTop =
        chat.scrollHeight;

    },
    30
  );

}


/*
============================================================
 SEND MESSAGE
============================================================
*/

async function sendMessage(){

  const message =
    input.value.trim();


  if(
    !message &&
    !selectedImage &&
    !selectedFileText
  ){

    return;

  }


  addUserMessage(
    message,
    selectedImage
  );


  const oldImage =
    selectedImage;

  const oldFileText =
    selectedFileText;

  const oldFileName =
    selectedFileName;


  input.value = "";

  autoResize(input);

  removeImage();


  showLoading();

  setStatus(
    "AI жауап дайындап жатыр..."
  );


  try{

    const payload = {

      action:
        "chat",

      message,

      history:
        chatHistory

    };


    if(oldImage){

      payload.image =
        oldImage;

    }


    if(oldFileText){

      payload.fileText =
        oldFileText;

      payload.fileName =
        oldFileName;

    }


    const response =
      await fetch(
        WORKER_URL,
        {

          method:
            "POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(
              payload
            )

        }
      );


    const result =
      await response.json();


    removeLoading();


    if(
      !response.ok ||
      !result.ok
    ){

      throw new Error(
        result.error ||
        "Сервер қатесі."
      );

    }


    const answer =
      result.answer ||
      "AI жауап бермеді.";


    addAssistantMessage(
      answer,
      result.type
    );


    /*
    HISTORY
    */

    if(message){

      chatHistory.push({

        role:
          "user",

        content:
          message

      });

    }


    chatHistory.push({

      role:
        "assistant",

      content:
        answer

    });


    /*
    LIMIT
    */

/*
============================================================
 TTS
============================================================
*/

async function speakAnswer(
  text,
  button
){

  if(
    !text
  ){

    return;

  }


  /*
  Қазір браузердің TTS-ын
  бірінші қолданамыз.

  Егер kk-KZ қолдаса,
  қазақша дауысты таңдауға тырысады.
  */

  try{

    if(
      "speechSynthesis" in window
    ){

      window.speechSynthesis.cancel();


      const utterance =
        new SpeechSynthesisUtterance(
          text
        );


      utterance.lang =
        "kk-KZ";

      utterance.rate =
        0.95;

      utterance.pitch =
        1;


      const voices =
        window.speechSynthesis
          .getVoices();


      const kkVoice =
        voices.find(
          voice =>
            voice.lang
              .toLowerCase()
              .startsWith("kk")
        );


      if(kkVoice){

        utterance.voice =
          kkVoice;

      }


      if(button){

        button.textContent =
          "⏹️ Тоқтату";

      }


      utterance.onend =
        () => {

          if(button){

            button.textContent =
              "🔊 Тыңдау";

          }

        };


      window.speechSynthesis
        .speak(
          utterance
        );


      return;

    }

  }catch(err){

    console.error(
      "Browser TTS error:",
      err
    );

  }


  /*
  Cloudflare TTS fallback
  */

  try{

    if(button){

      button.textContent =
        "⏳";

    }


    const response =
      await fetch(
        WORKER_URL,
        {

          method:
            "POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              action:
                "tts",

              text

            })

        }
      );


    const contentType =
      response.headers.get(
        "content-type"
      ) || "";


    if(
      contentType.includes(
        "audio/"
      )
    ){

      const blob =
        await response.blob();

      const url =
        URL.createObjectURL(
          blob
        );

      const audio =
        new Audio(url);

      await audio.play();

      audio.onended =
        () => URL.revokeObjectURL(
          url
        );

      if(button){

        button.textContent =
          "🔊 Тыңдау";

      }

      return;

    }


    const result =
      await response.json();


    if(
      !result.ok
    ){

      throw new Error(
        result.error ||
        "TTS қатесі"
      );

    }


  }catch(err){

    console.error(
      "TTS:",
      err
    );

    if(button){

      button.textContent =
        "🔊 Тыңдау";

    }

    alert(
      "Дауыс шығару мүмкін болмады."
    );

  }

}


/*
============================================================
 MICROPHONE
============================================================
*/

async function toggleRecording(){

  if(recording){

    stopRecording();

    return;

  }


  try{

    const stream =
      await navigator.mediaDevices
        .getUserMedia({
          audio:true
        });


    audioChunks = [];


    let mimeType = "";


    const types = [

      "audio/webm;codecs=opus",

      "audio/mp4",

      "audio/webm",

      "audio/ogg;codecs=opus"

    ];


    for(
      const type
      of types
    ){

      if(
        MediaRecorder
          .isTypeSupported(type)
      ){

        mimeType =
          type;

        break;

      }

    }


    mediaRecorder =
      new MediaRecorder(
        stream,
        mimeType
          ? {mimeType}
          : undefined
      );


    mediaRecorder.ondataavailable =
      event => {

        if(
          event.data &&
          event.data.size > 0
        ){

          audioChunks.push(
            event.data
          );

        }

      };


    mediaRecorder.onstop =
      async () => {

        stream
          .getTracks()
          .forEach(
            track =>
              track.stop()
          );


        const blob =
          new Blob(
            audioChunks,
            {
              type:
                mimeType ||
                "audio/webm"
            }
          );


        await sendAudio(
          blob
        );

      };


    mediaRecorder.start();

    recording = true;

    const mic =
      document.getElementById(
        "micButton"
      );

    mic.classList.add(
      "recording"
    );

    mic.textContent =
      "⏹️";

    setStatus(
      "🎤 Тыңдап тұрмын..."
    );

  }catch(err){

    console.error(err);

    alert(
      "Микрофонға рұқсат берілмеді."
    );

  }

}


/*
============================================================
 STOP RECORDING
============================================================
*/

function stopRecording(){

  if(
    mediaRecorder &&
    mediaRecorder.state !==
    "inactive"
  ){

    mediaRecorder.stop();

  }


  recording = false;


  const mic =
    document.getElementById(
      "micButton"
    );

  mic.classList.remove(
    "recording"
  );

  mic.textContent =
    "🎤";

}


/*
============================================================
 BLOB TO BASE64
============================================================
*/

function blobToBase64(
  blob
){

  return new Promise(
    (resolve,reject)=>{

      const reader =
        new FileReader();

      reader.onload =
        () => {

          const result =
            String(
              reader.result
            );

          const base64 =
            result.split(
              ","
            )[1] || "";

          resolve(base64);

        };

      reader.onerror =
        reject;

      reader.readAsDataURL(
        blob
      );

    }
  );

}


/*
============================================================
 SEND AUDIO
============================================================
*/

async function sendAudio(
  blob
){

  setStatus(
    "🎤 Дауыс өңделіп жатыр..."
  );

  showLoading();


  try{

    const base64 =
      await blobToBase64(
        blob
      );


    const response =
      await fetch(
        WORKER_URL,
        {

          method:
            "POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              action:
                "transcribe",

              audioBase64:
                base64,

              audioMimeType:
                blob.type,

              language:
                "kk"

            })

        }
      );


    const result =
      await response.json();


    removeLoading();


    if(
      !response.ok ||
      !result.ok
    ){

      throw new Error(
        result.error ||
        "Дауыс қатесі."
      );

    }


    const text =
      result.text ||
      "";


    if(!text){

      setStatus(
        "Дауыс түсінілмеді."
      );

      return;

    }


    /*
    Дауыс мәтінін
    чатқа автоматты енгізу
    */

    input.value =
      text;

    autoResize(input);

    setStatus(
      "Дауыс мәтінге айналды."
    );


    /*
    Бірден жіберу
    */

    await sendMessage();


  }catch(err){

    removeLoading();

    console.error(err);

    addAssistantMessage(
      "Дауыс өңдеу қатесі: " +
      err.message
    );

    setStatus("");

  }

}
