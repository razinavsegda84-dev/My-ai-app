<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #000;
      color: #fff;
      height: 100vh;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid #222;
      font-size: 20px;
      font-weight: 700;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .welcome {
      text-align: center;
      margin-top: 25vh;
      color: #aaa;
    }

    .welcome h1 {
      color: white;
      font-size: 32px;
      margin-bottom: 10px;
    }

    .message {
      max-width: 85%;
      margin: 12px auto;
      padding: 13px 16px;
      border-radius: 18px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user {
      background: #2563eb;
      margin-right: 0;
    }

    .ai {
      background: #1f1f1f;
      margin-left: 0;
    }

    .input-area {
      padding: 12px;
      border-top: 1px solid #222;
      display: flex;
      gap: 8px;
      background: #000;
    }

    textarea {
      flex: 1;
      resize: none;
      min-height: 48px;
      max-height: 140px;
      border: 1px solid #333;
      border-radius: 16px;
      background: #171717;
      color: white;
      padding: 14px;
      font-size: 16px;
      outline: none;
    }

    button {
      border: none;
      border-radius: 16px;
      padding: 0 20px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: 600;
    }

    button:disabled {
      opacity: .5;
    }
  </style>
</head>

<body>

<div class="app">

  <header>🤖 My AI</header>

  <div id="chat">

    <div class="welcome" id="welcome">
      <h1>My AI</h1>
      <p>Сәлем! Мен саған көмектесуге дайынмын.</p>
    </div>

  </div>

  <div class="input-area">

    <textarea
      id="message"
      placeholder="Хабарлама жазыңыз..."
      rows="1"
    ></textarea>

    <button id="send">➤</button>

  </div>

</div>

<script>

const WORKER_URL =
  "https://my-ai-backend.razinavsegda84.workers.dev";

const chat = document.getElementById("chat");
const input = document.getElementById("message");
const sendButton = document.getElementById("send");
const welcome = document.getElementById("welcome");

let messages = [];

function addMessage(text, type) {

  if (welcome) {
    welcome.style.display = "none";
  }

  const div = document.createElement("div");

  div.className = "message " + type;

  div.textContent = text;

  chat.appendChild(div);

  chat.scrollTop = chat.scrollHeight;

  return div;
}

async function sendMessage() {

  const text = input.value.trim();

  if (!text) return;

  input.value = "";

  addMessage(text, "user");

  sendButton.disabled = true;

  const loading = addMessage("Жауап дайындалып жатыр...", "ai");

  messages.push({
    role: "user",
    content: text
  });

  try {

    const response = await fetch(WORKER_URL, {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        messages: messages
      })

    });

    const data = await response.json();

    loading.remove();

    if (!response.ok) {

      throw new Error(
        data.error || "Сервер қатесі"
      );

    }

    const answer =
      data.answer ||
      data.response ||
      "Жауап алынбады.";

    addMessage(answer, "ai");

    messages.push({
      role: "assistant",
      content: answer
    });

  } catch (error) {

    loading.remove();

    addMessage(
      "Қате: " + error.message,
      "ai"
    );

    console.error(error);

  } finally {

    sendButton.disabled = false;

    input.focus();

  }
}

sendButton.addEventListener(
  "click",
  sendMessage
);

input.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);

</script>

</body>
</html>
