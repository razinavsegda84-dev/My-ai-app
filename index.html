<!DOCTYPE html>
<html lang="kk">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>My AI</title>


<!-- PDF -->

<script
  src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs"
  type="module"
></script>


<!-- DOCX -->

<script
  src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"
></script>


<!-- XLSX -->

<script
  src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"
></script>


<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

button{
  border:0;
  color:#fff;
  cursor:pointer;
}

.app{
  width:100%;
  height:100dvh;
  display:flex;
  flex-direction:column;
}

header{
  height:60px;
  min-height:60px;
  border-bottom:1px solid #222;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px;
}

.header-side{
  width:44px;
}

.header-title{
  font-size:20px;
  font-weight:bold;
}

.icon-button{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#222;
  font-size:20px;
}

#chat{
  flex:1;
  overflow-y:auto;
  padding:16px;
  padding-bottom:115px;
}

.welcome{
  text-align:center;
  margin-top:21vh;
  color:#888;
}

.welcome h1{
  color:#fff;
  font-size:30px;
}

.message{
  max-width:92%;
  padding:12px 16px;
  margin:12px 0;
  border-radius:18px;
  line-height:1.5;
  white-space:pre-wrap;
  word-break:break-word;
}

.user{
  background:#2563eb;
  margin-left:auto;
  border-bottom-right-radius:5px;
}

.ai{
  background:#1d1d1d;
  margin-right:auto;
  border-bottom-left-radius:5px;
}

.message img{
  display:block;
  max-width:100%;
  max-height:420px;
  border-radius:14px;
  margin:5px 0;
  cursor:pointer;
}

.message-tools{
  display:flex;
  gap:6px;
  margin-top:10px;
  flex-wrap:wrap;
}

.small-button{
  background:#333;
  border-radius:10px;
  padding:7px 10px;
  font-size:13px;
}

.file-card{
  display:flex;
  align-items:center;
  gap:10px;
  background:rgba(0,0,0,.22);
  border-radius:12px;
  padding:9px;
  margin-bottom:8px;
}

.file-icon{
  font-size:28px;
}

.file-info{
  flex:1;
  min-width:0;
}

.file-name{
  font-size:14px;
  font-weight:bold;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.file-type{
  color:#aaa;
  font-size:11px;
  margin-top:3px;
}

.file-open{
  background:#333;
  border-radius:9px;
  padding:7px 9px;
  font-size:12px;
  text-decoration:none;
  color:#fff;
}

.bottom-area{
  background:#000;
  border-top:1px solid #222;
  padding:8px;
  padding-bottom:calc(8px + env(safe-area-inset-bottom));
}

.preview{
  display:none;
  overflow-x:auto;
  padding-bottom:8px;
}

.preview-row{
  display:flex;
  gap:7px;
}

.preview-item{
  position:relative;
  flex:0 0 auto;
}

.preview-item img{
  width:64px;
  height:64px;
  object-fit:cover;
  border-radius:10px;
}

.preview-file{
  width:64px;
  height:64px;
  background:#222;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  font-size:24px;
}

.preview-file span{
  font-size:8px;
  max-width:58px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.preview-remove{
  position:absolute;
  right:-4px;
  top:-4px;
  width:22px;
  height:22px;
  border-radius:50%;
  background:#333;
  font-size:12px;
}

.controls{
  display:flex;
  align-items:flex-end;
  gap:5px;
}

textarea{
  flex:1;
  min-width:0;
  min-height:44px;
  max-height:120px;
  resize:none;
  background:#1b1b1b;
  color:#fff;
  border:1px solid #333;
  border-radius:18px;
  padding:12px;
  font-size:16px;
  font-family:Arial,sans-serif;
  outline:none;
}

.control-button,
.send-button{
  width:44px;
  min-width:44px;
  height:44px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
}

.control-button{
  background:#222;
  font-size:18px;
}

.send-button{
  background:#fff;
  color:#000;
  font-size:19px;
}

.send-button:disabled{
  opacity:.5;
}

input[type=file]{
  display:none;
}

.status{
  position:fixed;
  left:0;
  bottom:73px;
  width:100%;
  text-align:center;
  color:#777;
  font-size:12px;
  pointer-events:none;
  z-index:20;
}

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:50;
}

.overlay.show{
  display:block;
}

.chat-panel{
  position:fixed;
  top:0;
  left:0;
  bottom:0;
  width:min(340px,88vw);
  background:#111;
  z-index:60;
  transform:translateX(-100%);
  transition:transform .2s;
  display:flex;
  flex-direction:column;
}

.chat-panel.show{
  transform:translateX(0);
}

.panel-header{
  height:60px;
  border-bottom:1px solid #292929;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px;
}

.panel-title{
  font-size:18px;
  font-weight:bold;
}

.panel-button{
  margin:10px;
  padding:12px;
  border-radius:12px;
  background:#2563eb;
}

.search-box{
  margin:0 10px 10px;
  background:#1d1d1d;
  border:1px solid #333;
  color:#fff;
  border-radius:12px;
  padding:11px;
  outline:none;
}

.chat-list{
  flex:1;
  overflow-y:auto;
  padding:4px 8px 20px;
}

.chat-item{
  display:flex;
  gap:4px;
  align-items:center;
  border-radius:12px;
  margin-bottom:4px;
}

.chat-item.active{
  background:#222;
}

.chat-open{
  flex:1;
  min-width:0;
  background:transparent;
  text-align:left;
  padding:12px 10px;
}

.chat-name{
  display:block;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.chat-date{
  display:block;
  margin-top:4px;
  color:#666;
  font-size:11px;
}

.chat-action{
  width:38px;
  height:38px;
  border-radius:50%;
  background:transparent;
}

.empty{
  text-align:center;
  color:#666;
  padding:30px 15px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.9);
  z-index:100;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal.show{
  display:flex;
}

.modal img{
  max-width:100%;
  max-height:90vh;
  object-fit:contain;
}

.modal-close{
  position:absolute;
  right:15px;
  top:15px;
  width:42px;
  height:42px;
  border-radius:50%;
  background:#222;
  font-size:20px;
}

@media(max-width:600px){

  #chat{
    padding:13px;
  }

  .message{
    max-width:94%;
  }

  textarea{
    font-size:15px;
  }

}

</style>

</head>


<body>


<div class="app">


<header>

  <div class="header-side">

    <button
      id="menuButton"
      class="icon-button"
    >
      ☰
    </button>

  </div>


  <div class="header-title">
    🤖 My AI
  </div>


  <div class="header-side">

    <button
      id="newChatButton"
      class="icon-button"
    >
      ＋
    </button>

  </div>

</header>


<div id="chat"></div>


<div
  id="status"
  class="status"
></div>


<div class="bottom-area">


  <div
    id="preview"
    class="preview"
  >

    <div
      id="previewRow"
      class="preview-row"
    ></div>

  </div>


  <div class="controls">


    <button
      id="fileButton"
      class="control-button"
    >
      📎
    </button>


    <input
      id="fileInput"
      type="file"
      accept="image/*,.pdf,.txt,.docx,.xlsx,.csv"
      multiple
    >


    <button
      id="cameraButton"
      class="control-button"
    >
      📷
    </button>


    <input
      id="cameraInput"
      type="file"
      accept="image/*"
      capture="environment"
    >


    <textarea
      id="input"
      rows="1"
      placeholder="Хабарлама жазыңыз..."
    ></textarea>

      class="send-button"

      ➤
    </button>

</div>

</div>


<div
  id="overlay"
  class="overlay"
></div>


<div
  id="panel"
  class="chat-panel"
>

  <div class="panel-header">

    <div class="panel-title">
      Чаттар
    </div>

    <button
      id="closePanelButton"
      class="icon-button"
    >
      ✕
    </button>

  </div>


  <button
    id="newChatPanelButton"
    class="panel-button"
  >
    ＋ Жаңа чат
  </button>


  <input
    id="chatSearch"
    class="search-box"
    placeholder="Чатты іздеу..."
  >


  <div
    id="chatList"
    class="chat-list"
  ></div>

</div>


<div
  id="imageModal"
  class="modal"
>

  <button
    id="modalClose"
    class="modal-close"
  >
    ✕
  </button>

  <img
    id="modalImage"
    alt=""
  >

</div>


<script type="module">


/* =========================================================
   PDF.JS
========================================================= */

import * as pdfjsLib
  from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";


/* =========================================================
   WORKER
========================================================= */

const WORKER_URL =
  "https://my-ai-backend.razinavsegda84.workers.dev";


const STORAGE_KEY =
  "my_ai_chats_v7";


let chats = [];

let currentChatId = null;

let history = [];

let selectedImages = [];

let selectedFiles = [];

let sending = false;


/* =========================================================
   ELEMENTS
========================================================= */

const chatBox =
  document.getElementById("chat");

const input =
  document.getElementById("input");

const sendButton =
  document.getElementById("sendButton");

const fileInput =
  document.getElementById("fileInput");

const cameraInput =
  document.getElementById("cameraInput");

const preview =
  document.getElementById("preview");

const previewRow =
  document.getElementById("previewRow");

const status =
  document.getElementById("status");


/* =========================================================
   STORAGE
========================================================= */

function loadChats(){

  try{

    const saved =
      localStorage.getItem(STORAGE_KEY);

    return saved
      ? JSON.parse(saved)
      : [];

  }catch{

    return [];

  }

}


function saveChats(){

  try{

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(chats)
    );

  }catch(error){

    console.error(
      "STORAGE ERROR:",
      error
    );

  }

}


/* =========================================================
   ID
========================================================= */

function makeId(){

  return Date.now().toString(36) +
    Math.random()
      .toString(36)
      .slice(2);

}


/* =========================================================
   CHAT
========================================================= */

function createChat(){

  const chat = {

    id:makeId(),

    title:"Жаңа чат",

    history:[],

    createdAt:Date.now(),

    updatedAt:Date.now()

  };


  chats.unshift(chat);

  currentChatId =
    chat.id;

  history = [];


  saveChats();

  renderChats();

}


function getCurrentChat(){

  return chats.find(
    chat =>
      chat.id === currentChatId
  );

}


function updateChat(){

  const chat =
    getCurrentChat();

  if(!chat) return;


  chat.history =
    history.slice(-12);


  chat.updatedAt =
    Date.now();


  saveChats();

  renderChats();

}


/* =========================================================
   CURRENT CHAT
========================================================= */

function renderCurrent(){

  chatBox.innerHTML = "";


  if(!history.length){

    chatBox.innerHTML = `
      <div class="welcome">
        <h1>Сәлем! 👋</h1>
        <p>Мен — My AI</p>
        <p>Сұрақ қойыңыз немесе сурет/файл жіберіңіз.</p>
      </div>
    `;

    return;

  }


  history.forEach(item => {

    if(
      item.role !== "user" &&
      item.role !== "assistant"
    ){

      return;

    }


    addMessage(
      item.content,
      item.role === "user"
        ? "user"
        : "ai",
      item.images || [],
      item.files || []
    );

  });

}


/* =========================================================
   ADD MESSAGE
========================================================= */

function addMessage(
  text,
  type,
  images=[],
  files=[]
){

  const div =
    document.createElement("div");


  div.className =
    "message " + type;


  /* IMAGES */

  images.forEach(src => {

    const img =
      document.createElement("img");


    img.src = src;


    img.onclick =
      () => openImage(src);


    div.appendChild(img);

  });


  /* FILES */

  files.forEach(file => {

    if(!file) return;


    const card =
      document.createElement("div");


    card.className =
      "file-card";


    const icon =
      document.createElement("div");


    icon.className =
      "file-icon";


    icon.textContent =
      getFileIcon(
        file.type,
        file.name
      );


    const info =
      document.createElement("div");


    info.className =
      "file-info";


    const name =
      document.createElement("div");


    name.className =
      "file-name";


    name.textContent =
      file.name ||
      "Файл";


    const typeText =
      document.createElement("div");


    typeText.className =
      "file-type";


    typeText.textContent =
      file.type ||
      "Файл";


    info.appendChild(name);

    info.appendChild(typeText);


    if(file.dataUrl){

      const open =
        document.createElement("a");


      open.className =
        "file-open";


      open.textContent =
        "Ашу ›";


      open.href =
        file.dataUrl;


      open.target =
        "_blank";


      open.rel =
        "noopener";


      card.appendChild(icon);

      card.appendChild(info);

      card.appendChild(open);

    }else{

      card.appendChild(icon);

      card.appendChild(info);

    }


    div.appendChild(card);

  });


  /* TEXT */

  if(text){

    const textDiv =
      document.createElement("div");


    textDiv.className =
      "message-content";


    textDiv.textContent =
      text;


    div.appendChild(textDiv);

  }


  /* AI BUTTONS */

  if(type === "ai"){

    const tools =
      document.createElement("div");


    tools.className =
      "message-tools";


    const copy =
      document.createElement("button");


    copy.type =
      "button";


    copy.className =
      "small-button";


    copy.textContent =
      "📋 Көшіру";


    copy.onclick =
      async () => {

        try{

          await navigator.clipboard.writeText(
            text || ""
          );


          copy.textContent =
            "✅ Көшірілді";


          setTimeout(() => {

            copy.textContent =
              "📋 Көшіру";

          },1500);

        }catch{

          copy.textContent =
            "❌ Қате";

        }

      };


    const regenerate =
      document.createElement("button");


    regenerate.type =
      "button";


    regenerate.className =
      "small-button";


    regenerate.textContent =
      "🔄 Қайта жауап";


    regenerate.onclick =
      () => regenerateAnswer();


    tools.appendChild(copy);

    tools.appendChild(regenerate);

    div.appendChild(tools);

  }


  chatBox.appendChild(div);


  chatBox.scrollTop =
    chatBox.scrollHeight;


  return div;

}


/* =========================================================
   FILE ICON
========================================================= */

function getFileIcon(type,name){

  const lower =
    String(name || "")
      .toLowerCase();


  if(
    type === "application/pdf" ||
    lower.endsWith(".pdf")
  ){

    return "📕";

  }


  if(
    lower.endsWith(".docx")
  ){

    return "📝";

  }


  if(
    lower.endsWith(".xlsx") ||
    lower.endsWith(".xls") ||
    lower.endsWith(".csv")
  ){

    return "📊";

  }


  if(
    lower.endsWith(".txt")
  ){

    return "📄";

  }


  if(
    String(type)
      .startsWith("image/")
  ){

    return "🖼️";

  }


  return "📎";

}


/* =========================================================
   CHAT LIST
========================================================= */

function renderChats(){

  const list =
    document.getElementById("chatList");


  const search =
    document.getElementById("chatSearch")
      .value
      .toLowerCase()
      .trim();


  list.innerHTML = "";


  const filtered =
    chats.filter(chat =>
      !search ||
      chat.title
        .toLowerCase()
        .includes(search)
    );


  if(!filtered.length){

    list.innerHTML =
      `<div class="empty">
        Чат табылмады.
      </div>`;

    return;

  }


  filtered.forEach(chat => {

    const row =
      document.createElement("div");


    row.className =
      "chat-item" +
      (
        chat.id === currentChatId
          ? " active"
          : ""
      );


    const open =
      document.createElement("button");


    open.className =
      "chat-open";


    open.innerHTML =
      `<span class="chat-name"></span>
       <span class="chat-date"></span>`;


    open.querySelector(".chat-name")
      .textContent =
      chat.title;


    open.querySelector(".chat-date")
      .textContent =
      new Date(chat.updatedAt)
        .toLocaleString(
          "kk-KZ",
          {
            day:"2-digit",
            month:"2-digit",
            hour:"2-digit",
            minute:"2-digit"
          }
        );


    open.onclick =
      () => openChat(chat.id);


    const rename =
      document.createElement("button");


    rename.className =
      "chat-action";


    rename.textContent =
      "✏️";


    rename.onclick =
      event => {

        event.stopPropagation();


        const name =
          prompt(
            "Жаңа чат атауы:",
            chat.title
          );


        if(name && name.trim()){

          chat.title =
            name.trim().slice(0,80);


          chat.updatedAt =
            Date.now();


          saveChats();

          renderChats();

        }

      };


    const del =
      document.createElement("button");


    del.className =
      "chat-action";


    del.textContent =
      "🗑️";


    del.onclick =
      event => {

        event.stopPropagation();


        if(
          !confirm(
            "Бұл чатты өшіру керек пе?"
          )
        ){

          return;

        }


        chats =
          chats.filter(
            x => x.id !== chat.id
          );


        if(currentChatId === chat.id){

          if(chats.length){

            currentChatId =
              chats[0].id;


            history =
              chats[0].history || [];

          }else{

            createChat();

          }

        }


        saveChats();

        renderCurrent();

        renderChats();

      };


    row.appendChild(open);

    row.appendChild(rename);

    row.appendChild(del);


    list.appendChild(row);

  });

}


/* =========================================================
   OPEN CHAT
========================================================= */

function openChat(chatId){

  const chat =
    chats.find(
      x => x.id === chatId
    );


  if(!chat) return;


  currentChatId =
    chat.id;


  history =
    Array.isArray(chat.history)
      ? chat.history.slice(-12)
      : [];


  renderCurrent();

  renderChats();

  closePanel();

}


/* =========================================================
   PANEL
========================================================= */

function openPanel(){

  document
    .getElementById("overlay")
    .classList.add("show");


  document
    .getElementById("panel")
    .classList.add("show");

}


function closePanel(){

  document
    .getElementById("overlay")
    .classList.remove("show");


  document
    .getElementById("panel")
    .classList.remove("show");

}


/* =========================================================
   SELECT FILES
========================================================= */

function selectFiles(event){

  const files =
    Array.from(
      event.target.files || []
    );


  files.forEach(file => {

    if(file.type.startsWith("image/")){

      if(
        file.size <=
        20 * 1024 * 1024
      ){

        selectedImages.push(file);

      }

    }else{

      selectedFiles.push(file);

    }

  });


  renderPreview();


  event.target.value = "";

}


/* =========================================================
   PREVIEW
========================================================= */

function renderPreview(){

  previewRow.innerHTML = "";


  selectedImages.forEach(
    (file,index) => {

      const item =
        document.createElement("div");


      item.className =
        "preview-item";


      const img =
        document.createElement("img");


      const reader =
        new FileReader();


      reader.onload =
        event => {

          img.src =
            event.target.result;

        };


      reader.readAsDataURL(file);


      const remove =
        document.createElement("button");


      remove.className =
        "preview-remove";


      remove.textContent =
        "✕";


      remove.onclick =
        () => {

          selectedImages.splice(
            index,
            1
          );


          renderPreview();

        };


      item.appendChild(img);

      item.appendChild(remove);


      previewRow.appendChild(item);

    }
  );


  selectedFiles.forEach(
    (file,index) => {

      const item =
        document.createElement("div");


      item.className =
        "preview-item";


      item.innerHTML = `
        <div class="preview-file">
          ${getFileIcon(file.type,file.name)}
          <span>${escapeHtml(file.name)}</span>
        </div>
      `;


      const remove =
        document.createElement("button");


      remove.className =
        "preview-remove";


      remove.textContent =
        "✕";


      remove.onclick =
        () => {

          selectedFiles.splice(
            index,
            1
          );


          renderPreview();

        };


      item.appendChild(remove);


      previewRow.appendChild(item);

    }
  );


  preview.style.display =
    (
      selectedImages.length ||
      selectedFiles.length
    )
      ? "block"
      : "none";

}

/* =========================================================
   BASE64
========================================================= */

function fileToBase64(file){

  return new Promise(
    (resolve,reject) => {

      const reader =
        new FileReader();


      reader.onload =
        () => resolve(
          reader.result
        );


      reader.onerror =
        reject;


      reader.readAsDataURL(file);

    }
  );

}


/* =========================================================
   IMAGE COMPRESS
========================================================= */

function compressImage(file){

  return new Promise(
    (resolve,reject) => {

      const reader =
        new FileReader();


      reader.onload =
        event => {

          const img =
            new Image();


          img.onload =
            () => {

              const max = 1280;


              let width =
                img.width;


              let height =
                img.height;


              if(
                width > max ||
                height > max
              ){

                if(width > height){

                  height =
                    Math.round(
                      height *
                      max /
                      width
                    );

                  width = max;

                }else{

                  width =
                    Math.round(
                      width *
                      max /
                      height
                    );

                  height = max;

                }

              }


              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                width;


              canvas.height =
                height;


              const ctx =
                canvas.getContext("2d");


              ctx.drawImage(
                img,
                0,
                0,
                width,
                height
              );


              resolve(
                canvas.toDataURL(
                  "image/jpeg",
                  0.72
                )
              );

            };


          img.onerror =
            reject;


          img.src =
            event.target.result;

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(file);

    }
  );

}


/* =========================================================
   PDF TEXT
========================================================= */

async function readPDF(file){

  const buffer =
    await file.arrayBuffer();


  const pdf =
    await pdfjsLib.getDocument({
      data:buffer
    }).promise;


  let text = "";


  for(
    let pageNumber = 1;
    pageNumber <= pdf.numPages;
    pageNumber++
  ){

    const page =
      await pdf.getPage(
        pageNumber
      );


    const content =
      await page.getTextContent();


    const pageText =
      content.items
        .map(
          item =>
            item.str || ""
        )
        .join(" ");


    text +=
      `\n\n--- ${pageNumber}-бет ---\n` +
      pageText;

  }


  return text.trim();

}


/* =========================================================
   DOCX TEXT
========================================================= */

async function readDOCX(file){

  if(
    typeof mammoth === "undefined"
  ){

    throw new Error(
      "DOCX оқу кітапханасы жүктелмеді."
    );

  }


  const arrayBuffer =
    await file.arrayBuffer();


  const result =
    await mammoth.extractRawText({
      arrayBuffer
    });


  return (
    result.value ||
    ""
  ).trim();

}


/* =========================================================
   XLSX
========================================================= */

async function readXLSX(file){

  if(
    typeof XLSX === "undefined"
  ){

    throw new Error(
      "Excel оқу кітапханасы жүктелмеді."
    );

  }


  const buffer =
    await file.arrayBuffer();


  const workbook =
    XLSX.read(
      buffer,
      {
        type:"array"
      }
    );


  let output = "";


  workbook.SheetNames.forEach(
    sheetName => {

      const sheet =
        workbook.Sheets[
          sheetName
        ];


      const csv =
        XLSX.utils.sheet_to_csv(
          sheet
        );


      output +=
        `\n\n--- ${sheetName} ---\n` +
        csv;

    }
  );


  return output.trim();

}


/* =========================================================
   TEXT / CSV
========================================================= */

async function readTextFile(file){

  return (
    await file.text()
  ).trim();

}


/* =========================================================
   READ FILE
========================================================= */

async function extractFileText(file){

  const name =
    file.name.toLowerCase();


  if(
    file.type === "application/pdf" ||
    name.endsWith(".pdf")
  ){

    return await readPDF(file);

  }


  if(
    name.endsWith(".docx")
  ){

    return await readDOCX(file);

  }


  if(
    name.endsWith(".xlsx") ||
    name.endsWith(".xls")
  ){

    return await readXLSX(file);

  }


  if(
    name.endsWith(".csv") ||
    name.endsWith(".txt")
  ){

    return await readTextFile(file);

  }


  return "";

}


/* =========================================================
   FILE DATA
========================================================= */

async function makeFileObject(file){

  let dataUrl = null;


  try{

    dataUrl =
      await fileToBase64(file);

  }catch{

    dataUrl = null;

  }


  return {

    name:file.name,

    type:
      file.type ||
      "application/octet-stream",

    dataUrl

  };

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage(){

  if(sending) return;


  const text =
    input.value.trim();


  if(
    !text &&
    !selectedImages.length &&
    !selectedFiles.length
  ){

    return;

  }


  if(!currentChatId){

    createChat();

  }


  const welcome =
    document.querySelector(
      ".welcome"
    );


  if(welcome){

    welcome.remove();

  }


  sending = true;

  sendButton.disabled = true;


  setStatus(
    "Дайындалып жатыр..."
  );


  let loading = null;


  try{

    /* IMAGE */

    let imageData = null;


    if(selectedImages.length){

      setStatus(
        "Сурет дайындалып жатыр..."
      );


      imageData =
        await compressImage(
          selectedImages[0]
        );

    }


    /* FILE TEXT */

    let fileText = "";


    const fileObjects = [];


    for(
      const file of selectedFiles
    ){

      setStatus(
        file.name +
        " оқылып жатыр..."
      );


      const extracted =
        await extractFileText(file);


      if(extracted){

        fileText +=
          "\n\n--- " +
          file.name +
          " ---\n" +
          extracted;

      }


      fileObjects.push(
        await makeFileObject(file)
      );

    }


    /* FILE REQUEST */

    let userText =
      text;


    if(!userText){

      if(imageData){

        userText =
          "Осы суретті талда.";

      }else if(fileText){

        userText =
          "Осы файлдағы ақпаратты талда және түсіндір.";

      }else{

        userText =
          "Сәлем.";

      }

    }


    /* USER MESSAGE */

    addMessage(
      text || userText,
      "user",
      imageData
        ? [imageData]
        : [],
      fileObjects
    );


    /* LOADING */

    loading =
      addMessage(
        "AI жауап дайындап жатыр...",
        "ai"
      );


    setStatus(
      "AI жауап дайындап жатыр..."
    );


    /* WORKER */

    const response =
      await fetch(
        WORKER_URL,
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },


          body:JSON.stringify({

            action:"chat",

            message:userText,

            images:
              imageData
                ? [imageData]
                : [],

            fileText:

              fileText.slice(
                0,
                30000
              ),

            history:
              history.slice(-12)

          })

        }
      );


    let data;


    try{

      data =
        await response.json();

    }catch{

      throw new Error(
        "Worker JSON жауап қайтармады."
      );

    }


    if(!response.ok){

      throw new Error(
        data?.error ||
        "Сервер қатесі: " +
        response.status
      );

    }


    const answer =
      typeof data.answer === "string"
        ? data.answer
        : JSON.stringify(
            data.answer
          );


    if(loading){

      loading.remove();

      loading = null;

    }


    addMessage(
      answer ||
      "AI жауап бере алмады.",
      "ai"
    );


    /* HISTORY USER */

    history.push({

      role:"user",

      content:userText,

      images:
        imageData
          ? [imageData]
          : [],

      files:fileObjects

    });


    /* HISTORY AI */

    history.push({

      role:"assistant",

      content:
        answer ||
        "AI жауап бере алмады.",

      images:[],

      files:[]

    });


    history =
      history.slice(-12);


    const chat =
      getCurrentChat();


    if(
      chat &&
      chat.title === "Жаңа чат"
    ){

      chat.title =
        (
          text ||
          (
            fileObjects[0]
              ?.name ||
            "Жаңа сұрақ"
          )
        ).slice(0,45);

    }


    updateChat();


    input.value = "";

    input.style.height =
      "auto";


    clearSelection();


    setStatus("");

  }catch(error){

    console.error(
      "SEND ERROR:",
      error
    );


    if(loading){

      loading.remove();

    }


    addMessage(
      "Қате: " +
      (
        error?.message ||
        "Белгісіз қате"
      ),
      "ai"
    );


    setStatus("");

  }finally{

    sending = false;

    sendButton.disabled = false;

  }

}


/* =========================================================
   REGENERATE
========================================================= */

async function regenerateAnswer(){

  if(sending) return;


  if(history.length < 2) return;


  const last =
    history[
      history.length - 1
    ];


  if(
    !last ||
    last.role !== "assistant"
  ){

    return;

  }


  const user =
    history[
      history.length - 2
    ];


  if(
    !user ||
    user.role !== "user"
  ){

    return;

  }


  history.pop();


  renderCurrent();


  sending = true;


  setStatus(
    "Жаңа жауап дайындалып жатыр..."
  );


  try{

    const response =
      await fetch(
        WORKER_URL,
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },


          body:JSON.stringify({

            action:"chat",

            message:user.content,

            images:
              user.images || [],

            fileText:"",

            history:
              history.slice(-12)

          })

        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data?.error ||
        "Қайта жауап қатесі."
      );

    }


    const answer =
      data.answer ||
      "AI жауап бере алмады.";


    addMessage(
      answer,
      "ai"
    );


    history.push({

      role:"assistant",

      content:answer,

      images:[],

      files:[]

    });


    history =
      history.slice(-12);


    updateChat();


  }catch(error){

    addMessage(
      "Қате: " +
      (
        error?.message ||
        "Белгісіз қате"
      ),
      "ai"
    );

  }finally{

    sending = false;

    setStatus("");

  }

}

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}
