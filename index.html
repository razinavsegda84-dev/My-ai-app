<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
  height: 100vh;
}

.app {
  height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  height: 60px;
  border-bottom: 1px solid #222;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  font-size: 20px;
  font-weight: bold;
}

.header-title {
  margin: auto;
  transform: translateX(18px);
}

.new-chat {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: #222;
  color: #fff;
  font-size: 20px;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  padding-bottom: 110px;
}

.welcome {
  text-align: center;
  margin-top: 25vh;
  color: #888;
}

.welcome h1 {
  color: #fff;
  font-size: 32px;
}

.message {
  max-width: 85%;
  padding: 12px 16px;
  margin: 12px 0;
  border-radius: 18px;
  line-height: 1.5;
  white-space: pre-wrap;
}

.user {
  background: #2563eb;
  margin-left: auto;
}

.ai {
  background: #1d1d1d;
  margin-right: auto;
}

.message img {
  display: block;
  max-width: 100%;
  max-height: 400px;
  border-radius: 14px;
  margin-bottom: 8px;
}

.bottom {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  padding: 10px;
  background: #000;
  border-top: 1px solid #222;
  display: flex;
  gap: 8px;
  z-index: 20;
}

textarea {
  flex: 1;
  resize: none;
  background: #1b1b1b;
  color: white;
  border: 1px solid #333;
  border-radius: 18px;
  padding: 13px;
  font-size: 16px;
  outline: none;
}

button {
  border: none;
  border-radius: 50%;
  width: 48px;
  height: 48px;
  background: white;
  color: black;
  font-size: 20px;
  flex-shrink: 0;
}

.file-button,
.camera-button,
.mic-button {
  background: #222;
  color: white;
}

.send-button {
  background: white;
  color: black;
}

#file,
#camera {
  display: none;
}

#preview {
  display: none;
  position: fixed;
  bottom: 72px;
  left: 10px;
  background: #222;
  padding: 8px;
  border-radius: 12px;
  z-index: 30;
}

#preview img {
  width: 70px;
  height: 70px;
  object-fit: cover;
  border-radius: 8px;
}

.status {
  text-align: center;
  color: #777;
  font-size: 12px;
  padding: 5px;
}

@media (max-width: 600px) {

  .bottom {
    padding: 7px;
    gap: 5px;
  }

  .bottom button {
    width: 44px;
    height: 44px;
  }

  textarea {
    font-size: 15px;
    padding: 11px;
  }

  #chat {
    padding: 14px;
  }

}
</style>
</head>

<body>

<div class="app">

<header>

  <button
    class="new-chat"
    onclick="newChat()"
    title="Жаңа чат">
    ＋
  </button>

  <div class="header-title">
    🤖 My AI
  </div>

  <div style="width:42px;"></div>

</header>

<div id="chat">

  <div class="welcome" id="welcome">

    <h1>Сәлем! 👋</h1>

    <p>Мен — My AI</p>

    <p>
      Сұрақ қойыңыз немесе сурет жіберіңіз.
    </p>

  </div>

</div>

<div id="status" class="status"></div>

<div id="preview">
  <img id="previewImage">
</div>

<div class="bottom">

  <button
    class="file-button"
    onclick="document.getElementById('file').click()"
    title="Сурет таңдау">
    📎
  </button>

  <input
    type="file"
    id="file"
    accept="image/jpeg,image/png,image/webp"
    onchange="selectImage(event)">


  <button
    class="camera-button"
    onclick="document.getElementById('camera').click()"
    title="Камера">
    📷
  </button>

  <input
    type="file"
    id="camera"
    accept="image/*"
    capture="environment"
    onchange="selectImage(event)">


  <button
    class="mic-button"
    id="micButton"
    onclick="toggleMicrophone()"
    title="Дауыс">
    🎤
  </button>


  <textarea
    id="input"
    placeholder="Хабарлама жазыңыз..."
    rows="1"></textarea>


  <button
    class="send-button"
    onclick="sendMessage()"
    title="Жіберу">
    ➤
  </button>

</div>

</div>

<script>

const WORKER_URL =
"https://my-ai-backend.razinavsegda84.workers.dev";


/* =========================
   CHAT HISTORY
========================= */

let chatHistory = [];

let selectedImage = null;


/* =========================
   VOICE
========================= */

let recognition = null;

let isListening = false;


/* =========================
   ЖАҢА ЧАТ
========================= */

function newChat() {

  const confirmed =
    confirm(
      "Жаңа чат бастаймыз ба?"
    );

  if (!confirmed) return;

  chatHistory = [];

  selectedImage = null;

  document.getElementById("chat").innerHTML = `
    <div class="welcome" id="welcome">

      <h1>Сәлем! 👋</h1>

      <p>Мен — My AI</p>

      <p>
        Сұрақ қойыңыз немесе сурет жіберіңіз.
      </p>

    </div>
  `;

  document.getElementById("input").value = "";

  document.getElementById("preview").style.display =
    "none";

  document.getElementById("file").value = "";

  document.getElementById("camera").value = "";

  setStatus("");

}


/* =========================
   STATUS
========================= */

function setStatus(text) {

  document.getElementById("status").textContent =
    text || "";
}


/* =========================
   IMAGE SELECT
========================= */

function selectImage(event) {

  const file =
    event.target.files[0];

  if (!file) return;

  if (!file.type.startsWith("image/")) {

    alert("Тек сурет таңдаңыз.");

    event.target.value = "";

    return;
  }

  if (file.size > 20 * 1024 * 1024) {

    alert(
      "Сурет 20 MB-тан үлкен."
    );

    event.target.value = "";

    return;
  }

  selectedImage = file;

  const reader =
    new FileReader();

  reader.onload =
    function(e) {

      document.getElementById(
        "previewImage"
      ).src = e.target.result;

      document.getElementById(
        "preview"
      ).style.display = "block";
    };

  reader.readAsDataURL(file);
}


/* =========================
   IMAGE COMPRESSION
========================= */

function compressImage(file) {

  return new Promise(
    function(resolve, reject) {

      const reader =
        new FileReader();

      reader.onload =
        function(e) {

          const img =
            new Image();

          img.onload =
            function() {

              const MAX_SIZE = 1280;

              let width =
                img.width;

              let height =
                img.height;


              if (width > height) {

                if (width > MAX_SIZE) {

                  height =
                    Math.round(
                      height *
                      MAX_SIZE /
                      width
                    );

                  width =
                    MAX_SIZE;
                }

              } else {

                if (height > MAX_SIZE) {

                  width =
                    Math.round(
                      width *
                      MAX_SIZE /
                      height
                    );

                  height =
                    MAX_SIZE;
                }
              }


              const canvas =
                document.createElement(
                  "canvas"
                );

              canvas.width =
                width;

              canvas.height =
                height;


              const ctx =
                canvas.getContext(
                  "2d"
                );

              ctx.drawImage(
                img,
                0,
                0,
                width,
                height
              );


              const compressed =
                canvas.toDataURL(
                  "image/jpeg",
                  0.70
                );


              resolve(
                compressed
              );
            };


          img.onerror =
            function() {

              reject(
                new Error(
                  "Суретті ашу мүмкін болмады."
                )
              );
            };


          img.src =
            e.target.result;
        };


      reader.onerror =
        function() {

          reject(
            new Error(
              "Суретті оқу мүмкін болмады."
            )
          );
        };


      reader.readAsDataURL(file);

    }
  );
}


/* =========================
   ADD MESSAGE
========================= */

function addMessage(
  text,
  type,
  image = null
) {

  const chat =
    document.getElementById(
      "chat"
    );

  const div =
    document.createElement(
      "div"
    );

  div.className =
    "message " + type;


  if (image) {

    const img =
      document.createElement(
        "img"
      );

    img.src =
      image;

    div.appendChild(
      img
    );
  }


  if (text) {

    const textDiv =
      document.createElement(
        "div"
      );

    textDiv.textContent =
      text;

    div.appendChild(
      textDiv
    );
  }


  chat.appendChild(
    div
  );

  chat.scrollTop =
    chat.scrollHeight;


  return div;
}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage() {

  const input =
    document.getElementById(
      "input"
    );

  const text =
    input.value.trim();


  if (
    !text &&
    !selectedImage
  ) {
    return;
  }


  const welcome =
    document.getElementById(
      "welcome"
    );

  if (welcome) {

    welcome.style.display =
      "none";
  }


  let imageData =
    null;


  /* IMAGE */

  if (selectedImage) {

    try {

      setStatus(
        "Сурет дайындалып жатыр..."
      );

      imageData =
        await compressImage(
          selectedImage
        );

    } catch (error) {

      addMessage(
        "Суретті дайындау мүмкін болмады: " +
        error.message,
        "ai"
      );

      return;
    }
  }


  const userText =
    text ||
    "Осы суретте не бар екенін айтып бер.";


  /* SHOW USER */

  addMessage(
    userText,
    "user",
    imageData
  );


  /*
   * ТЕК СОҢҒЫ 12
   * МӘТІНДІК ХАБАРЛАМАНЫ ЖІБЕРЕМІЗ
   */

  const historyToSend =
    chatHistory.slice(-12);


  input.value = "";

  document.getElementById(
    "preview"
  ).style.display =
    "none";


  setStatus(
    "AI жауап дайындап жатыр..."
  );


  const loading =
    addMessage(
      "AI жауап дайындап жатыр...",
      "ai"
    );


  try {

    const body = {

      message:
        userText,

      image:
        imageData,

      history:
        historyToSend
    };


    const response =
      await fetch(
        WORKER_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(
              body
            )
        }
      );


    const data =
      await response.json();


    loading.remove();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Сервер қатесі: " +
        response.status
      );
    }


    let answer =
      data.answer;


    if (
      typeof answer !==
      "string"
    ) {

      answer =
        answer?.response ||
        answer?.result ||
        JSON.stringify(
          answer
        );
    }


    if (!answer) {

      answer =
        "AI жауап бере алмады.";
    }


    addMessage(
      answer,
      "ai"
    );


    /*
     * КОНТЕКСТКЕ ҚОСУ
     */

    chatHistory.push({

      role:
        "user",

      content:
        userText

    });


    chatHistory.push({

      role:
        "assistant",

      content:
        answer

    });


    if (
      chatHistory.length >
      12
    ) {

      chatHistory =
        chatHistory.slice(
          -12
        );
    }


    /*
     * AI ЖАУАБЫН ДАУЫСТАП ОҚУ
     */

    speakAnswer(
      answer
    );


    setStatus("");


  } catch (error) {

    loading.remove();

    addMessage(
      "Қате: " +
      error.message,
      "ai"
    );

    setStatus("");
  }


  selectedImage =
    null;

  document.getElementById(
    "file"
  ).value = "";

  document.getElementById(
    "camera"
  ).value = "";
}


/* =========================
   MICROPHONE
========================= */

function toggleMicrophone() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if (!SpeechRecognition) {

    alert(
      "Бұл браузерде дауыс арқылы енгізу қолдау көрсетілмейді."
    );

    return;
  }


  if (isListening) {

    if (recognition) {

      recognition.stop();
    }

    return;
  }


  recognition =
    new SpeechRecognition();


  recognition.lang =
    "kk-KZ";

  recognition.continuous =
    false;

  recognition.interimResults =
    false;


  recognition.onstart =
    function() {

      isListening =
        true;

      document.getElementById(
        "micButton"
      ).textContent =
        "🔴";

      setStatus(
        "Тыңдап тұрмын..."
      );
    };


  recognition.onresult =
    function(event) {

      const transcript =
        event
        .results[0][0]
        .transcript;

      const input =
        document.getElementById(
          "input"
        );

      input.value =
        transcript;
    };


  recognition.onerror =
    function(event) {

      console.log(
        "Speech error:",
        event.error
      );

      setStatus("");

      isListening =
        false;

      document.getElementById(
        "micButton"
      ).textContent =
        "🎤";
    };


  recognition.onend =
    function() {

      isListening =
        false;

      document.getElementById(
        "micButton"
      ).textContent =
        "🎤";

      setStatus("");
    };


  recognition.start();
}


/* =========================
   TEXT TO SPEECH
========================= */

function speakAnswer(text) {

  if (
    !("speechSynthesis" in window)
  ) {
    return;
  }


  if (!text) {
    return;
  }


  /*
   * Өте ұзын жауапты
   * дауыстамаймыз.
   */

  const shortText =
    text.slice(
      0,
      1500
    );


  window.speechSynthesis.cancel();


  const speech =
    new SpeechSynthesisUtterance(
      shortText
    );


  speech.lang =
    "kk-KZ";

  speech.rate =
    1.0;

  speech.pitch =
    1.0;


  window.speechSynthesis.speak(
    speech
  );
}


/* =========================
   ENTER
========================= */

document
.getElementById(
  "input"
)
.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();
    }

  }
);

</script>

</body>
</html>
