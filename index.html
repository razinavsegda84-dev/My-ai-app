<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My AI</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
background:#000;
color:#fff;
font-family:Arial,sans-serif;
overflow:hidden
}

button{
border:0;
color:#fff;
cursor:pointer
}

.app{
height:100dvh;
display:flex;
flex-direction:column
}

header{
height:60px;
min-height:60px;
border-bottom:1px solid #222;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 12px
}

.header-side{
width:44px
}

.header-title{
font-size:20px;
font-weight:bold
}

.icon-button{
width:42px;
height:42px;
border-radius:50%;
background:#222;
font-size:20px
}

#chat{
flex:1;
overflow-y:auto;
padding:15px;
padding-bottom:110px
}

.welcome{
text-align:center;
margin-top:21vh;
color:#888
}

.welcome h1{
color:#fff;
font-size:30px
}

.message{
max-width:92%;
padding:12px 15px;
margin:12px 0;
border-radius:18px;
line-height:1.5;
white-space:pre-wrap;
word-break:break-word
}

.user{
background:#2563eb;
margin-left:auto;
border-bottom-right-radius:5px
}

.ai{
background:#1d1d1d;
margin-right:auto;
border-bottom-left-radius:5px
}

.message img{
display:block;
max-width:100%;
max-height:420px;
border-radius:14px;
margin:5px 0
}

.message-tools{
display:flex;
gap:6px;
margin-top:9px
}

.small-button{
background:#333;
border-radius:10px;
padding:7px 10px;
font-size:13px
}

.bottom{
border-top:1px solid #222;
background:#000;
padding:8px;
padding-bottom:calc(8px + env(safe-area-inset-bottom))
}

.preview{
display:none;
overflow-x:auto;
padding-bottom:8px
}

.preview-row{
display:flex;
gap:7px
}

.preview-item{
position:relative
}

.preview-item img{
width:64px;
height:64px;
object-fit:cover;
border-radius:10px
}

.remove{
position:absolute;
right:-4px;
top:-4px;
width:22px;
height:22px;
border-radius:50%;
background:#333
}

.controls{
display:flex;
align-items:flex-end;
gap:6px
}

textarea{
flex:1;
min-width:0;
min-height:44px;
max-height:120px;
resize:none;
background:#1b1b1b;
color:#fff;
border:1px solid #333;
border-radius:18px;
padding:12px;
font-size:16px;
outline:none
}

.control-button,
.send-button{
width:44px;
min-width:44px;
height:44px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center
}

.control-button{
background:#222;
font-size:18px
}

.send-button{
background:#fff;
color:#000;
font-size:20px
}

.status{
position:fixed;
bottom:70px;
left:0;
width:100%;
text-align:center;
font-size:12px;
color:#777;
pointer-events:none
}

input[type=file]{
display:none
}

.overlay{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.65);
z-index:50
}

.overlay.show{
display:block
}

.panel{
position:fixed;
top:0;
left:0;
bottom:0;
width:min(340px,88vw);
background:#111;
z-index:60;
transform:translateX(-100%);
transition:.2s;
display:flex;
flex-direction:column
}

.panel.show{
transform:translateX(0)
}

.panel-header{
height:60px;
border-bottom:1px solid #292929;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 12px
}

.panel-title{
font-size:18px;
font-weight:bold
}

.new-chat{
margin:10px;
padding:12px;
border-radius:12px;
background:#2563eb
}

.search{
margin:0 10px 10px;
background:#1d1d1d;
border:1px solid #333;
color:#fff;
border-radius:12px;
padding:11px;
outline:none
}

.chat-list{
flex:1;
overflow-y:auto;
padding:4px 8px 20px
}

.chat-item{
display:flex;
align-items:center;
gap:3px;
margin-bottom:4px;
border-radius:12px
}

.chat-item.active{
background:#222
}

.chat-open{
flex:1;
min-width:0;
background:transparent;
text-align:left;
padding:12px 10px
}

.chat-name{
display:block;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap
}

.chat-date{
display:block;
color:#666;
font-size:11px;
margin-top:4px
}

.chat-action{
width:38px;
height:38px;
border-radius:50%;
background:transparent
}

.empty{
text-align:center;
color:#666;
padding:30px
}

.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.9);
z-index:100;
align-items:center;
justify-content:center;
padding:15px
}

.modal.show{
display:flex
}

.modal img{
max-width:100%;
max-height:90vh
}

.modal-close{
position:absolute;
right:15px;
top:15px;
width:42px;
height:42px;
border-radius:50%;
background:#222
}
</style>
</head>

<body>

<div class="app">

<header>
<div class="header-side">
<button id="menuBtn" class="icon-button">☰</button>
</div>

<div class="header-title">🤖 My AI</div>

<div class="header-side">
<button id="newBtn" class="icon-button">＋</button>
</div>
</header>

<div id="chat">

<div id="welcome" class="welcome">
<h1>Сәлем! 👋</h1>
<p>Мен — My AI</p>
<p>Сұрақ қойыңыз немесе сурет/файл жіберіңіз.</p>
</div>

</div>

<div id="status" class="status"></div>

<div class="bottom">

<div id="preview" class="preview">
<div id="previewRow" class="preview-row"></div>
</div>

<div class="controls">

<button id="fileBtn" class="control-button">📎</button>

<input
id="fileInput"
type="file"
accept="image/*,.txt,.csv,.pdf,.doc,.docx,.xlsx"
multiple
>

<button id="cameraBtn" class="control-button">📷</button>

<input
id="cameraInput"
type="file"
accept="image/*"
capture="environment"
>

<textarea
id="input"
rows="1"
placeholder="Хабарлама жазыңыз..."
></textarea>

<button id="sendBtn" class="send-button">➤</button>

</div>
</div>
</div>

<div id="overlay" class="overlay"></div>

<div id="panel" class="panel">

<div class="panel-header">
<div class="panel-title">Чаттар</div>
<button id="closePanel" class="icon-button">✕</button>
</div>

<button id="panelNew" class="new-chat">＋ Жаңа чат</button>

<input
id="search"
class="search"
placeholder="Чатты іздеу..."
>

<div id="chatList" class="chat-list"></div>

</div>

<div id="modal" class="modal">
<button id="modalClose" class="modal-close">✕</button>
<img id="modalImage">
</div>

<script>

const WORKER_URL =
"https://my-ai-backend.razinavsegda84.workers.dev";

const STORAGE_KEY =
"my_ai_chats_final_v1";

let chats=[];
let currentChatId=null;
let history=[];
let selectedImages=[];
let selectedFiles=[];
let sending=false;


/* =========================
   STORAGE
========================= */

function loadChats(){

try{
return JSON.parse(
localStorage.getItem(STORAGE_KEY)
)||[];
}catch{
return[];
}

}

function saveChats(){

localStorage.setItem(
STORAGE_KEY,
JSON.stringify(chats)
);

}


/* =========================
   ID
========================= */

function makeId(){

return Date.now().toString(36)+
Math.random().toString(36).slice(2);

}


/* =========================
   CHAT
========================= */

function createChat(){

const chat={
id:makeId(),
title:"Жаңа чат",
history:[],
createdAt:Date.now(),
updatedAt:Date.now()
};

chats.unshift(chat);

currentChatId=chat.id;
history=[];

saveChats();
renderChats();
renderCurrent();

}


function currentChat(){

return chats.find(
x=>x.id===currentChatId
);

}


function updateChat(){

const chat=currentChat();

if(!chat)return;

chat.history=history.slice(-12);
chat.updatedAt=Date.now();

saveChats();
renderChats();

}


function newChat(){

if(
history.length &&
!confirm("Жаңа чат бастаймыз ба?")
)return;

clearSelection();
createChat();

}


function openChat(id){

const chat=chats.find(
x=>x.id===id
);

if(!chat)return;

currentChatId=id;

history=Array.isArray(chat.history)
?chat.history.slice(-12)
:[];

renderCurrent();
renderChats();
closePanel();

}


/* =========================
   RENDER
========================= */

function renderCurrent(){

const box=document.getElementById("chat");

box.innerHTML="";

if(!history.length){

box.innerHTML=`
<div id="welcome" class="welcome">
<h1>Сәлем! 👋</h1>
<p>Мен — My AI</p>
<p>Сұрақ қойыңыз немесе сурет/файл жіберіңіз.</p>
</div>
`;

return;

}

history.forEach(item=>{

if(
item.role!=="user" &&
item.role!=="assistant"
)return;

addMessage(
item.content,
item.role==="user"?"user":"ai",
item.images||[]
);

});

}


function addMessage(
text,
type,
images=[]
){

const box=document.getElementById("chat");

const div=document.createElement("div");

div.className="message "+type;

images.forEach(src=>{

const img=document.createElement("img");

img.src=src;

img.onclick=()=>{
openImage(src);
};

div.appendChild(img);

});

if(text){

const t=document.createElement("div");

t.textContent=text;

div.appendChild(t);

}

if(type==="ai" && text){

const tools=document.createElement("div");

tools.className="message-tools";

const copy=document.createElement("button");

copy.className="small-button";
copy.textContent="📋 Көшіру";

copy.onclick=()=>{
navigator.clipboard?.writeText(text);
};

tools.appendChild(copy);

div.appendChild(tools);

}

box.appendChild(div);

box.scrollTop=box.scrollHeight;

return div;

}


/* =========================
   CHAT LIST
========================= */

function renderChats(){

const list=document.getElementById("chatList");

const q=document.getElementById("search").value
.toLowerCase()
.trim();

list.innerHTML="";

const filtered=chats.filter(chat=>
!q ||
chat.title.toLowerCase().includes(q)
);

if(!filtered.length){

list.innerHTML=
'<div class="empty">Чат табылмады.</div>';

return;

}

filtered.forEach(chat=>{

const row=document.createElement("div");

row.className=
"chat-item "+
(chat.id===currentChatId?"active":"");

const open=document.createElement("button");

open.className="chat-open";

open.innerHTML=
`<span class="chat-name"></span>
<span class="chat-date"></span>`;

open.querySelector(".chat-name")
.textContent=chat.title;

open.querySelector(".chat-date")
.textContent=
new Date(chat.updatedAt)
.toLocaleString("kk-KZ");

open.onclick=()=>{
openChat(chat.id);
};

const del=document.createElement("button");

del.className="chat-action";
del.textContent="🗑️";

del.onclick=e=>{
e.stopPropagation();

if(confirm("Бұл чатты өшіру керек пе?")){

chats=chats.filter(
x=>x.id!==chat.id
);

if(currentChatId===chat.id){

if(chats.length){

currentChatId=chats[0].id;
history=chats[0].history||[];

}else{

createChat();
return;

}

}

saveChats();
renderCurrent();
renderChats();

}

};

row.appendChild(open);
row.appendChild(del);

list.appendChild(row);

});

}


/* =========================
   FILES
========================= */

function selectFiles(event){

const files=[
...event.target.files
];

files.forEach(file=>{

if(file.type.startsWith("image/")){

if(file.size<=20*1024*1024){

selectedImages.push(file);

}

}else{

selectedFiles.push(file);

}

});

event.target.value="";

renderPreview();

}


function renderPreview(){

const preview=document.getElementById("preview");
const row=document.getElementById("previewRow");

row.innerHTML="";

selectedImages.forEach((file,index)=>{

const item=document.createElement("div");

item.className="preview-item";

const img=document.createElement("img");

const reader=new FileReader();

reader.onload=e=>{
img.src=e.target.result;
};

reader.readAsDataURL(file);

const remove=document.createElement("button");

remove.className="remove";
remove.textContent="✕";

remove.onclick=()=>{

selectedImages.splice(index,1);
renderPreview();

};

item.appendChild(img);
item.appendChild(remove);
row.appendChild(item);

});


selectedFiles.forEach((file,index)=>{

const item=document.createElement("div");

item.className="preview-item";

item.innerHTML=
`<div style="
width:64px;
height:64px;
background:#222;
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
font-size:24px
">📄</div>`;

const remove=document.createElement("button");

remove.className="remove";
remove.textContent="✕";

remove.onclick=()=>{

selectedFiles.splice(index,1);
renderPreview();

};

item.appendChild(remove);
row.appendChild(item);

});


preview.style.display=
selectedImages.length||selectedFiles.length
?"block":"none";

}


function clearSelection(){

selectedImages=[];
selectedFiles=[];

renderPreview();

}


/* =========================
   IMAGE
========================= */

function compressImage(file){

return new Promise((resolve,reject)=>{

const reader=new FileReader();

reader.onload=e=>{

const img=new Image();

img.onload=()=>{

const max=1280;

let w=img.width;
let h=img.height;

if(w>max||h>max){

if(w>h){

h=Math.round(h*max/w);
w=max;

}else{

w=Math.round(w*max/h);
h=max;

}

}

const canvas=document.createElement("canvas");

canvas.width=w;
canvas.height=h;

const ctx=canvas.getContext("2d");

ctx.drawImage(img,0,0,w,h);

resolve(
canvas.toDataURL("image/jpeg",.75)
);

};

img.onerror=reject;
img.src=e.target.result;

};

reader.onerror=reject;
reader.readAsDataURL(file);

});

}


/* =========================
   FILE TEXT
========================= */

async function readTextFile(file){

if(
file.type==="text/plain" ||
file.type==="text/csv" ||
file.name.toLowerCase().endsWith(".txt") ||
file.name.toLowerCase().endsWith(".csv")
){

return await file.text();

}

return "";

}


/* =========================
   SEND
========================= */

async function sendMessage(){

if(sending)return;

const input=document.getElementById("input");

const text=input.value.trim();

if(
!text &&
!selectedImages.length &&
!selectedFiles.length
)return;

if(!currentChatId){

createChat();

}

const welcome=document.getElementById("welcome");

if(welcome)welcome.remove();

sending=true;

setStatus("Дайындалып жатыр...");

let loading=null;

try{

const images=[];

for(const file of selectedImages){

images.push(
await compressImage(file)
);

}

let fileText="";

for(const file of selectedFiles){

if(
file.type==="text/plain" ||
file.type==="text/csv" ||
file.name.toLowerCase().endsWith(".txt") ||
file.name.toLowerCase().endsWith(".csv")
){

fileText+=
"\n\n--- "+file.name+" ---\n"+
await readTextFile(file);

}

}

const userText=
text ||
(images.length
?"Осы суретті қазақ тілінде талда."
:"Осы файлды талда.");

addMessage(
userText,
"user",
images
);

setStatus("AI жауап дайындап жатыр...");

loading=addMessage(
"AI жауап дайындап жатыр...",
"ai"
);


const response=await fetch(
WORKER_URL,
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({

action:"chat",

message:
fileText
?userText+
"\n\nҚұжат:\n"+
fileText
:userText,

images:images,

history:history.slice(-12)

})
}
);


let data;

try{

data=await response.json();

}catch{

throw new Error(
"Worker JSON жауап қайтармады."
);

}


if(!response.ok || data.ok===false){

throw new Error(
data.error ||
"Сервер қатесі: "+
response.status
);

}


if(loading){

loading.remove();
loading=null;

}


const answer=
typeof data.answer==="string"
?data.answer
:JSON.stringify(data.answer);


addMessage(answer,"ai");


history.push({

role:"user",
content:userText,
images:images

});

history.push({

role:"assistant",
content:answer,
images:[]

});

history=history.slice(-12);


const chat=currentChat();

if(
chat &&
chat.title==="Жаңа чат"
){

chat.title=
userText.length>45
?userText.slice(0,45)+"..."
:userText;

}

updateChat();

input.value="";
input.style.height="auto";

clearSelection();

setStatus("");

}catch(error){

console.error(error);

if(loading){

loading.remove();

}

addMessage(
"Қате: "+
(error.message||"Белгісіз қате"),
"ai"
);

setStatus("");

}finally{

sending=false;

}

}


/* =========================
   UI
========================= */

function setStatus(text){

document.getElementById(
"status"
).textContent=text;

}


function openPanel(){

document.getElementById("overlay")
.classList.add("show");

document.getElementById("panel")
.classList.add("show");

}


function closePanel(){

document.getElementById("overlay")
.classList.remove("show");

document.getElementById("panel")
.classList.remove("show");

}


function openImage(src){

document.getElementById("modalImage")
.src=src;

document.getElementById("modal")
.classList.add("show");

}


function closeImage(){

document.getElementById("modal")
.classList.remove("show");

}


/* =========================
   BUTTONS
========================= */

document.getElementById("sendBtn")
.addEventListener("click",sendMessage);

document.getElementById("fileBtn")
.addEventListener("click",()=>{
document.getElementById("fileInput").click();
});

document.getElementById("cameraBtn")
.addEventListener("click",()=>{
document.getElementById("cameraInput").click();
});

document.getElementById("fileInput")
.addEventListener("change",selectFiles);

document.getElementById("cameraInput")
.addEventListener("change",selectFiles);

document.getElementById("menuBtn")
.addEventListener("click",openPanel);

document.getElementById("closePanel")
.addEventListener("click",closePanel);

document.getElementById("overlay")
.addEventListener("click",closePanel);

document.getElementById("newBtn")
.addEventListener("click",newChat);

document.getElementById("panelNew")
.addEventListener("click",()=>{
createChat();
closePanel();
});

document.getElementById("search")
.addEventListener("input",renderChats);

document.getElementById("modalClose")
.addEventListener("click",closeImage);

document.getElementById("modal")
.addEventListener("click",e=>{
if(e.target.id==="modal"){
closeImage();
}
});


/* =========================
   ENTER
========================= */

document.getElementById("input")
.addEventListener(
"keydown",
e=>{

if(
e.key==="Enter" &&
!e.shiftKey
){

e.preventDefault();
sendMessage();

}

});


/* =========================
   TEXTAREA HEIGHT
========================= */

document.getElementById("input")
.addEventListener(
"input",
function(){

this.style.height="auto";

this.style.height=
Math.min(this.scrollHeight,120)+"px";

});


/* =========================
   START
========================= */

chats=loadChats();

if(!chats.length){

createChat();

}else{

currentChatId=chats[0].id;

history=
chats[0].history||[];

renderCurrent();
renderChats();

}

</script>

</body>
</html>
