<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My AI</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#0b0b0f;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

button{
  font-family:inherit;
  -webkit-tap-highlight-color:transparent;
}

.app{
  width:100%;
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* ================= HEADER ================= */

header{
  height:58px;
  min-height:58px;
  display:flex;
  align-items:center;
  padding:0 12px;
  background:#101014;
  border-bottom:1px solid #292929;
  position:relative;
  z-index:200;
}

.menu-btn{
  width:42px;
  height:42px;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:transparent;
  color:#fff;
  border:0;
  border-radius:10px;
  font-size:25px;
  cursor:pointer;
  position:relative;
  z-index:210;
}

.menu-btn:hover{
  background:#222229;
}

.menu-btn:active{
  background:#303038;
}

.logo{
  margin-left:6px;
  font-size:20px;
  font-weight:bold;
}

.status{
  margin-left:auto;
  font-size:12px;
  color:#8f8f8f;
}

.status.online{
  color:#54d17a;
}

/* ================= SIDEBAR ================= */

.sidebar{
  position:fixed;
  top:0;
  left:0;
  width:285px;
  height:100vh;
  background:#111116;
  border-right:1px solid #29292f;

  transform:translateX(-100%);
  transition:transform .25s ease;

  z-index:1000;

  display:flex;
  flex-direction:column;

  padding:12px;
}

.sidebar.open{
  transform:translateX(0);
}

.sidebar-top{
  height:48px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
}

.sidebar-title{
  font-size:20px;
  font-weight:bold;
}

.close-menu{
  width:38px;
  height:38px;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;

  background:#25252c;
  color:#fff;
  border:0;
  border-radius:10px;

  font-size:22px;
  cursor:pointer;
}

.close-menu:active{
  background:#35353e;
}

.new-chat{
  width:100%;
  padding:12px;

  background:#fff;
  color:#000;

  border:0;
  border-radius:12px;

  font-weight:bold;
  font-size:14px;

  cursor:pointer;
  margin-bottom:12px;
}

.new-chat:active{
  transform:scale(.98);
}

.history-title{
  color:#888;
  font-size:12px;
  padding:8px 5px;
}

.history{
  flex:1;
  overflow-y:auto;
  min-height:0;
}

.history-item{
  padding:11px;
  border-radius:10px;
  cursor:pointer;
  margin-bottom:4px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;

  color:#ddd;
}

.history-item:hover{
  background:#222229;
}

.no-history{
  color:#666;
  padding:10px;
  font-size:14px;
}

.clear-history{
  width:100%;

  background:#25252c;
  color:#fff;

  border:0;
  border-radius:10px;

  padding:11px;
  margin-top:10px;

  cursor:pointer;
}

.clear-history:hover{
  background:#35353e;
}

/* ================= OVERLAY ================= */

.overlay{
  position:fixed;
  inset:0;

  background:rgba(0,0,0,.55);

  z-index:900;

  opacity:0;
  visibility:hidden;

  transition:
    opacity .25s ease,
    visibility .25s ease;
}

.overlay.show{
  opacity:1;
  visibility:visible;
}

/* ================= CHAT ================= */

#chat{
  flex:1;
  overflow-y:auto;

  padding:20px 14px 150px;

  position:relative;
  z-index:1;
}

.message{
  max-width:850px;
  margin:0 auto 18px;

  display:flex;
  flex-direction:column;
}

.message.user{
  align-items:flex-end;
}

.message.assistant{
  align-items:flex-start;
}

.bubble{
  max-width:85%;

  padding:12px 15px;

  border-radius:16px;

  line-height:1.5;

  white-space:pre-wrap;
  word-wrap:break-word;
  overflow-wrap:anywhere;
}

.assistant .bubble{
  background:#17171c;
  border:1px solid #29292f;
}

.user .bubble{
  background:#303036;
}

/* ================= MESSAGE BUTTONS ================= */

.message-actions{
  display:flex;
  gap:6px;
  margin-top:7px;
}

.message-actions button{
  background:#202027;
  border:1px solid #303038;
  color:#bbb;

  border-radius:8px;

  padding:6px 9px;

  font-size:12px;

  cursor:pointer;
}

.message-actions button:hover{
  background:#303038;
  color:#fff;
}

/* ================= FILE ================= */

.file-card{
  max-width:85%;

  background:#17171c;
  border:1px solid #303038;

  border-radius:14px;

  padding:12px;

  display:flex;
  align-items:center;

  gap:10px;
}

.file-icon{
  font-size:30px;
  flex-shrink:0;
}

.file-info{
  min-width:0;
}

.file-name{
  font-size:14px;
  font-weight:bold;
  word-break:break-word;
}

.file-type{
  color:#888;
  font-size:12px;
  margin-top:3px;
}

.file-open{
  margin-left:auto;

  background:#27272e;
  color:#fff;

  border:0;
  border-radius:8px;

  padding:7px 9px;
}

/* ================= IMAGES ================= */

.generated-image{
  max-width:100%;
  height:auto;

  border-radius:14px;

  display:block;
}

.preview-image{
  max-width:100px;
  max-height:100px;

  border-radius:10px;
}

/* ================= WELCOME ================= */

.welcome{
  max-width:850px;

  margin:80px auto;

  text-align:center;

  color:#888;
}

.welcome h2{
  color:#fff;
  margin-bottom:8px;
}

/* ================= COMPOSER ================= */

.composer{
  position:fixed;

  bottom:0;
  left:0;
  right:0;

  background:
    linear-gradient(
      transparent,
      #0b0b0f 22%
    );

  padding:35px 12px 12px;

  z-index:100;
}

.composer-inner{
  max-width:850px;

  margin:auto;

  background:#15151a;

  border:1px solid #303038;

  border-radius:18px;

  padding:8px;
}

textarea{
  width:100%;

  resize:none;

  min-height:48px;
  max-height:150px;

  background:transparent;

  border:0;
  outline:0;

  color:white;

  font-size:16px;

  padding:10px;

  font-family:inherit;
}

textarea::placeholder{
  color:#777;
}

.toolbar{
  display:flex;
  align-items:center;

  gap:7px;

  padding:5px;
}

.toolbar button{
  border:0;

  cursor:pointer;

  color:white;

  background:#27272e;

  border-radius:10px;

  padding:9px 12px;

  font-size:14px;
}

.toolbar button:hover{
  background:#35353e;
}

.toolbar button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.send{
  margin-left:auto;

  background:#fff !important;
  color:#000 !important;

  font-weight:bold;
}

input[type=file]{
  display:none;
}

.preview{
  display:none;

  padding:8px;

  border-bottom:1px solid #29292f;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

  .sidebar{
    width:290px;
  }

  .bubble,
  .file-card{
    max-width:92%;
  }

  #chat{
    padding-left:8px;
    padding-right:8px;
  }

  textarea{
    font-size:16px;
  }

}
</style>
</head>

<body>

<div class="app">

<!-- ================= SIDEBAR ================= -->

<aside
  id="sidebar"
  class="sidebar"
>

  <div class="sidebar-top">

    <div class="sidebar-title">
      My AI
    </div>

    <button
      type="button"
      class="close-menu"
      onclick="closeSidebar()"
    >
      ×
    </button>

  </div>


  <button
    type="button"
    class="new-chat"
    onclick="newChat()"
  >
    ＋ Жаңа чат
  </button>


  <div class="history-title">
    Чат тарихы
  </div>


  <div
    id="historyList"
    class="history"
  ></div>


  <button
    type="button"
    class="clear-history"
    onclick="clearHistory()"
  >
    🗑️ Тарихты тазалау
  </button>

</aside>


<!-- ================= OVERLAY ================= -->

<div
  id="overlay"
  class="overlay"
  onclick="closeSidebar()"
></div>


<!-- ================= HEADER ================= -->

<header>

  <button
    type="button"
    class="menu-btn"
    onclick="openSidebar()"
    aria-label="Мәзір"
  >
    ☰
  </button>


  <div class="logo">
    My AI
  </div>


  <div
    id="status"
    class="status"
  >
    Қосылуда...
  </div>

</header>


<!-- ================= CHAT ================= -->

<main id="chat">

  <div
    id="welcome"
    class="welcome"
  >

    <h2>
      My AI
    </h2>

    <div>
      Сұрағыңызды жазыңыз
    </div>

  </div>

</main>


<!-- ================= COMPOSER ================= -->

<div class="composer">

  <div class="composer-inner">


    <div
      id="preview"
      class="preview"
    ></div>


    <textarea
      id="message"
      placeholder="My AI-ға сұрақ қойыңыз..."
      autocomplete="off"
    ></textarea>


    <div class="toolbar">


      <!-- IMAGE -->

      <button
        type="button"
        onclick="document.getElementById('imageInput').click()"
      >
        📷
      </button>

      <input
        id="imageInput"
        type="file"
        accept="image/*"
      >


      <!-- FILE -->

      <button
        type="button"
        onclick="document.getElementById('fileInput').click()"
      >
        📎
      </button>

      <input
        id="fileInput"
        type="file"
        accept=".txt,.md,.json,.csv,.html,.js,.css,.xml,.pdf"
      >


      <!-- IMAGE GENERATION -->

      <button
        type="button"
        onclick="generateImage()"
      >
        🖼️
      </button>


      <!-- SEND -->

      <button
        type="button"
        class="send"
        id="sendButton"
        onclick="sendMessage()"
      >
        ➤
      </button>

    </div>

  </div>

</div>

</div>


<script>

/* =====================================================
   API
===================================================== */

const API_URL =
  "https://my-ai-backend.razinavsegda84.workers.dev";


/* =====================================================
   ELEMENTS
===================================================== */

const chatElement =
  document.getElementById("chat");

const messageElement =
  document.getElementById("message");

const sendButton =
  document.getElementById("sendButton");

const statusElement =
  document.getElementById("status");

const imageInput =
  document.getElementById("imageInput");

const fileInput =
  document.getElementById("fileInput");

const previewElement =
  document.getElementById("preview");

const sidebar =
  document.getElementById("sidebar");

const overlay =
  document.getElementById("overlay");

const historyList =
  document.getElementById("historyList");


/* =====================================================
   VARIABLES
===================================================== */

let selectedImages = [];

let selectedFileText = "";

let selectedFile = null;

let history = [];


let chatSessions = [];

try{

  chatSessions =
    JSON.parse(
      localStorage.getItem(
        "myAI_chat_sessions"
      ) || "[]"
    );

  if(!Array.isArray(chatSessions)){
    chatSessions = [];
  }

}catch(error){

  chatSessions = [];

}


/* =====================================================
   START
===================================================== */

window.addEventListener(
  "load",
  async function(){

    renderHistory();

    await checkBackend();

    messageElement.focus();

  }
);


/* =====================================================
   SIDEBAR
===================================================== */

function openSidebar(){

  sidebar.classList.add("open");

  overlay.classList.add("show");

}


function closeSidebar(){

  sidebar.classList.remove("open");

  overlay.classList.remove("show");

}


/* =====================================================
   NEW CHAT
===================================================== */

function newChat(){

  saveCurrentChat();

  history = [];

  selectedImages = [];

  selectedFileText = "";

  selectedFile = null;

  chatElement.innerHTML = `

    <div
      id="welcome"
      class="welcome"
    >

      <h2>My AI</h2>

      <div>
        Сұрағыңызды жазыңыз
      </div>

    </div>

  `;

  messageElement.value = "";

  previewElement.style.display =
    "none";

  previewElement.innerHTML = "";

  closeSidebar();

  messageElement.focus();

}


/* =====================================================
   SAVE CURRENT CHAT
===================================================== */

function saveCurrentChat(){

  if(!history.length){
    return;
  }

  const firstUser =
    history.find(
      item =>
        item.role === "user"
    );

  if(!firstUser){
    return;
  }

  const title =
    String(
      firstUser.content || ""
    ).slice(0,60);


  const existing =
    chatSessions.find(
      session =>
        session.active === true
    );


  if(existing){

    existing.messages =
      [...history];

    existing.title =
      title;

  }else{

    chatSessions.forEach(
      session =>
        session.active = false
    );


    chatSessions.unshift({

      id:Date.now(),

      title:title,

      active:true,

      messages:[
        ...history
      ]

    });

  }


  chatSessions =
    chatSessions.slice(0,30);


  localStorage.setItem(
    "myAI_chat_sessions",
    JSON.stringify(
      chatSessions
    )
  );


  renderHistory();

}


/* =====================================================
   RENDER HISTORY
===================================================== */

function renderHistory(){

  historyList.innerHTML = "";


  if(!chatSessions.length){

    historyList.innerHTML = `

      <div class="no-history">
        Әзірге чат тарихы жоқ.
      </div>

    `;

    return;
  }


  chatSessions.forEach(
    session => {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "history-item";


      item.textContent =
        session.title ||
        "Жаңа чат";


      item.onclick =
        function(){

          loadChat(
            session.id
          );

        };


      historyList.appendChild(
        item
      );

    }
  );

}


/* =====================================================
   LOAD CHAT
===================================================== */

function loadChat(id){

  const session =
    chatSessions.find(
      item =>
        item.id === id
    );


  if(!session){
    return;
  }


  chatSessions.forEach(
    item =>
      item.active = false
  );


  session.active = true;


  history =
    Array.isArray(
      session.messages
    )
      ? [...session.messages]
      : [];


  chatElement.innerHTML = "";


  history.forEach(
    item => {

      if(
        item.role === "user"
      ){

        addMessage(
          "user",
          item.content,
          false
        );

      }


      if(
        item.role === "assistant"
      ){

        addMessage(
          "assistant",
          item.content,
          true
        );

      }

    }
  );


  localStorage.setItem(
    "myAI_chat_sessions",
    JSON.stringify(
      chatSessions
    )
  );


  closeSidebar();

}


/* =====================================================
   CLEAR HISTORY
===================================================== */

function clearHistory(){

  const confirmed =
    window.confirm(
      "Барлық чат тарихын өшіру керек пе?"
    );


  if(!confirmed){
    return;
  }


  chatSessions = [];

  history = [];


  localStorage.removeItem(
    "myAI_chat_sessions"
  );


  renderHistory();


  newChat();

}


/* =====================================================
   BACKEND CHECK
===================================================== */

async function checkBackend(){

  statusElement.textContent =
    "Қосылуда...";

  statusElement.classList.remove(
    "online"
  );


  try{

    const controller =
      new AbortController();


    const timeout =
      setTimeout(
        () => controller.abort(),
        8000
      );


    const response =
      await fetch(
        API_URL,
        {
          method:"GET",
          cache:"no-store",
          signal:controller.signal
        }
      );


    clearTimeout(timeout);


    if(!response.ok){

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const text =
      await response.text();


    let data = null;


    try{

      data =
        JSON.parse(text);

    }catch{

      throw new Error(
        "Backend JSON жауап қайтармады."
      );

    }


    if(
      data &&
      data.ok === true
    ){

      statusElement.textContent =
        "Онлайн";

      statusElement.classList.add(
        "online"
      );

    }else{

      statusElement.textContent =
        "Backend қатесі";

    }


  }catch(error){

    console.error(
      "Backend check:",
      error
    );


    statusElement.textContent =
      "Backend қосылмады";

  }

}


/* =====================================================
   ENTER
===================================================== */

messageElement.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =====================================================
   IMAGE SELECT
===================================================== */

imageInput.addEventListener(
  "change",
  function(){

    const file =
      this.files[0];


    if(!file){
      return;
    }


    const reader =
      new FileReader();


    reader.onload =
      function(event){

        selectedImages = [
          event.target.result
        ];


        previewElement.style.display =
          "block";


        previewElement.innerHTML = `

          <img
            class="preview-image"
            src="${event.target.result}"
            alt="Таңдалған сурет"
          >

        `;

      };


    reader.readAsDataURL(file);

  }
);


/* =====================================================
   FILE SELECT
===================================================== */

fileInput.addEventListener(
  "change",
  async function(){

    const file =
      this.files[0];


    if(!file){
      return;
    }


    selectedFile =
      file;


    previewElement.style.display =
      "block";


    previewElement.innerHTML = `

      <div class="file-card">

        <div class="file-icon">
          📄
        </div>

        <div class="file-info">

          <div class="file-name">
            ${escapeHtml(file.name)}
          </div>

          <div class="file-type">
            ${escapeHtml(
              file.type || "PDF / файл"
            )}
          </div>

        </div>

      </div>

    `;


    const lowerName =
      file.name.toLowerCase();


    const textFile =
      file.type === "text/plain" ||
      lowerName.endsWith(".txt") ||
      lowerName.endsWith(".md") ||
      lowerName.endsWith(".json") ||
      lowerName.endsWith(".csv") ||
      lowerName.endsWith(".js") ||
      lowerName.endsWith(".css") ||
      lowerName.endsWith(".html") ||
      lowerName.endsWith(".xml");


    if(textFile){

      try{

        selectedFileText =
          await file.text();

      }catch(error){

        selectedFileText = "";

        console.error(error);

      }

    }else{

      /*
        PDF үшін файлдың өзі Worker-ге
        жіберіледі.
      */

      selectedFileText = "";

    }

  }
);


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(){

  const message =
    messageElement.value.trim();


  if(
    !message &&
    selectedImages.length === 0 &&
    !selectedFile
  ){

    return;

  }


  setLoading(true);


  if(message){

    addMessage(
      "user",
      message
    );

  }


  const currentImages =
    [...selectedImages];


  const currentFileText =
    selectedFileText;


  const currentFile =
    selectedFile;


  messageElement.value = "";

  selectedImages = [];

  selectedFileText = "";

  selectedFile = null;


  previewElement.style.display =
    "none";

  previewElement.innerHTML = "";


  try{

    const response =
      await fetch(
        API_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              action:"chat",

              message:
                message ||
                (
                  currentFile
                    ? "Құжатты талдаңыз."
                    : "Суретті талда."
                ),

              history:
                history.slice(-20),

              images:
                currentImages,

              fileText:
                currentFileText,

              fileName:
                currentFile
                  ? currentFile.name
                  : "",

              mimeType:
                currentFile
                  ? currentFile.type
                  : ""

            })

        }
      );


    const text =
      await response.text();


    let data;


    try{

      data =
        JSON.parse(text);

    }catch{

      throw new Error(
        "Worker JSON емес жауап қайтарды: " +
        text.slice(0,200)
      );

    }


    if(
      !response.ok ||
      !data.ok
    ){

      throw new Error(
        data.error ||
        `HTTP ${response.status}`
      );

    }


    const answer =
      data.answer ||
      "AI жауап бере алмады.";


    addMessage(
      "assistant",
      answer
    );


    history.push({

      role:"user",

      content:
        message ||
        (
          currentFile
            ? `Файл: ${currentFile.name}`
            : "Суретті талдау"
        )

    });


    history.push({

      role:"assistant",

      content:answer

    });


    history =
      history.slice(-20);


    saveHistoryLocally();


  }catch(error){

    console.error(error);


    addMessage(
      "assistant",
      "Қате: " +
      error.message
    );


  }finally{

    setLoading(false);

  }

}


/* =====================================================
   IMAGE GENERATION
===================================================== */

async function generateImage(){

  const prompt =
    messageElement.value.trim();


  if(!prompt){

    addMessage(
      "assistant",
      "Сурет жасау үшін алдымен сипаттама жазыңыз."
    );

    return;

  }


  setLoading(true);


  addMessage(
    "user",
    "🖼️ " + prompt
  );


  messageElement.value = "";


  try{

    const response =
      await fetch(
        API_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              action:"image",

              prompt:prompt,

              width:1024,

              height:1024

            })

        }
      );


    const text =
      await response.text();


    let data;


    try{

      data =
        JSON.parse(text);

    }catch{

      throw new Error(
        "Worker JSON емес жауап қайтарды."
      );

    }


    if(
      !response.ok ||
      !data.ok
    ){

      throw new Error(
        data.error ||
        `HTTP ${response.status}`
      );

    }


    if(!data.image){

      throw new Error(
        "Сурет қайтарылмады."
      );

    }


    addImageMessage(
      data.image
    );


  }catch(error){

    console.error(error);


    addMessage(
      "assistant",
      "Сурет жасау қатесі: " +
      error.message
    );


  }finally{

    setLoading(false);

  }

}


/* =====================================================
   ADD MESSAGE
===================================================== */

function addMessage(
  role,
  text,
  actions = true
){

  const wrapper =
    document.createElement(
      "div"
    );


  wrapper.className =
    `message ${role}`;


  const bubble =
    document.createElement(
      "div"
    );


  bubble.className =
    "bubble";


  bubble.textContent =
    text;


  wrapper.appendChild(
    bubble
  );


  if(
    role === "assistant" &&
    actions
  ){

    const actionBar =
      document.createElement(
        "div"
      );


    actionBar.className =
      "message-actions";


    const copyButton =
      document.createElement(
        "button"
      );


    copyButton.type =
      "button";


    copyButton.textContent =
      "📋 Көшіру";


    copyButton.onclick =
      async function(){

        try{

          await navigator.clipboard.writeText(
            text
          );


          copyButton.textContent =
            "✓ Көшірілді";


          setTimeout(
            function(){

              copyButton.textContent =
                "📋 Көшіру";

            },
            1500
          );


        }catch(error){

          alert(
            "Көшіру мүмкін болмады."
          );

        }

      };


    const retryButton =
      document.createElement(
        "button"
      );


    retryButton.type =
      "button";


    retryButton.textContent =
      "🔄 Қайта жауап";


    retryButton.onclick =
      function(){

        retryLast();

      };


    actionBar.appendChild(
      copyButton
    );


    actionBar.appendChild(
      retryButton
    );


    wrapper.appendChild(
      actionBar
    );

  }


  chatElement.appendChild(
    wrapper
  );


  scrollChat();

}


/* =====================================================
   RETRY
===================================================== */

async function retryLast(){

  let lastUser = null;


  for(
    let i =
      history.length - 1;

    i >= 0;

    i--
  ){

    if(
      history[i].role === "user"
    ){

      lastUser =
        history[i].content;

      break;

    }

  }


  if(!lastUser){
    return;
  }


  messageElement.value =
    lastUser;


  await sendMessage();

}


/* =====================================================
   IMAGE MESSAGE
===================================================== */

function addImageMessage(
  image
){

  const wrapper =
    document.createElement(
      "div"
    );


  wrapper.className =
    "message assistant";


  const bubble =
    document.createElement(
      "div"
    );


  bubble.className =
    "bubble";


  const img =
    document.createElement(
      "img"
    );


  img.className =
    "generated-image";


  img.src =
    image;


  img.alt =
    "Generated image";


  bubble.appendChild(
    img
  );


  wrapper.appendChild(
    bubble
  );


  chatElement.appendChild(
    wrapper
  );


  scrollChat();

}


/* =====================================================
   SAVE HISTORY LOCALLY
===================================================== */

function saveHistoryLocally(){

  if(!history.length){
    return;
  }


  const first =
    history.find(
      item =>
        item.role === "user"
    );


  if(!first){
    return;
  }


  const title =
    String(
      first.content || ""
    ).slice(0,60);


  let existing =
    chatSessions.find(
      session =>
        session.active === true
    );


  if(existing){

    existing.messages =
      [...history];

    existing.title =
      title;

  }else{

    chatSessions.forEach(
      session =>
        session.active = false
    );


    existing = {

      id:Date.now(),

      title:title,

      active:true,

      messages:[
        ...history
      ]

    };


    chatSessions.unshift(
      existing
    );

  }


  chatSessions =
    chatSessions.slice(0,30);


  localStorage.setItem(
    "myAI_chat_sessions",
    JSON.stringify(
      chatSessions
    )
  );


  renderHistory();

}


/* =====================================================
   LOADING
===================================================== */

function setLoading(
  loading
){

  sendButton.disabled =
    loading;


  messageElement.disabled =
    loading;


  if(loading){

    statusElement.textContent =
      "Жауап дайындалуда...";

  }else{

    /*
      Сұрау аяқталғаннан кейін
      Worker-ді қайта тексереміз.
    */

    checkBackend();

  }

}


/* =====================================================
   SCROLL
===================================================== */

function scrollChat(){

  setTimeout(
    function(){

      chatElement.scrollTop =
        chatElement.scrollHeight;

    },
    50
  );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
  text
){

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}
