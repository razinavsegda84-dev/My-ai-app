body{

.logo{

.headerButtons{

.iconBtn{

.smallBtn{

.inputRow{

textarea{

.send{

  border-radius:15px;

.toolRow{

.tool{

.status{

.modal{

.modalBox{

){

event.preventDefault();

sendMessage();

}

/* =========================================================
   ADD MESSAGE
========================================================= */

function addMessage(
role,
text,
media = null
){

const row =
document.createElement("div");

row.className =
"message " +
(
role === "user"
? "user"
: "ai"
);


const bubble =
document.createElement("div");

bubble.className =
"bubble";


if(text){

const textNode =
document.createElement(
"div"
);

textNode.textContent =
text;

bubble.appendChild(
textNode
);

}


if(media){

if(
media.type ===
"image"
){

const img =
document.createElement(
"img"
);

img.src =
media.src;

bubble.appendChild(
img
);

}


if(
media.type ===
"video"
){

const video =
document.createElement(
"video"
);

video.src =
media.src;

video.controls =
true;

video.playsInline =
true;

bubble.appendChild(
video
);

}

}


if(
role ===
"assistant" &&
text
){

const actions =
document.createElement(
"div"
);

actions.className =
"actions";


const speak =
document.createElement(
"button"
);

speak.className =
"smallBtn";

speak.textContent =
"🔊 Тыңдау";

speak.onclick =
() =>
speakText(
text
);


actions.appendChild(
speak
);


bubble.appendChild(
actions
);

}


row.appendChild(
bubble
);


chat.appendChild(
row
);


chat.scrollTop =
chat.scrollHeight;

}

   IMAGE SELECT
========================================================= */

const file =
event.target.files[0];

return;


selectedImage =
file;


const reader =
new FileReader();


reader.onload =
e => {

e.target.result;

<button

onclick="removeImage()">
×

"block";

reader.readAsDataURL(
file
);

null;

editImageData =
null;

preview.innerHTML =
"";

preview.style.display =
"none";

document.getElementById(
"imageInput"
).value =
"";

if(selectedImage){

const userText =

========================================================= */

========================================================= */

/* =========================================================
   IMAGE EDITOR
========================================================= */

function openImageEditor(){

if(!editImageData){

setStatus(
"Алдымен сурет таңдаңыз."
);


document.getElementById(
"imageInput"
).click();


return;

}


document.getElementById(
"editorModal"
).style.display =
"block";


prepareEditor();

}


/* =========================================================
   PREPARE EDITOR
========================================================= */

function prepareEditor(){

const img =
new Image();


img.onload =
() => {

const maxWidth =
Math.min(
window.innerWidth -
40,
900
);


const scale =
Math.min(
1,
maxWidth /
img.width
);


const width =
Math.round(
img.width *
scale
);


const height =
Math.round(
img.height *
scale
);


const editCanvas =
document.getElementById(
"editCanvas"
);


const maskCanvas =
document.getElementById(
"maskCanvas"
);


editCanvas.width =
width;


editCanvas.height =
height;


maskCanvas.width =
width;


maskCanvas.height =
height;


const ctx =
editCanvas.getContext(
"2d"
);


ctx.drawImage(
img,
0,
0,
width,
height
);


clearMask();

enableMaskDrawing();

};


img.src =
editImageData;

}


/* =========================================================
   MASK DRAWING
========================================================= */

function enableMaskDrawing(){

const canvas =
document.getElementById(
"maskCanvas"
);


const ctx =
canvas.getContext(
"2d"
);


ctx.lineCap =
"round";

ctx.lineJoin =
"round";

ctx.lineWidth =
Math.max(
25,
canvas.width /
30
);


function getPosition(
event
){

const rect =
canvas.getBoundingClientRect();


let clientX;
let clientY;


if(
event.touches &&
event.touches.length
){

clientX =
event.touches[0]
.clientX;

clientY =
event.touches[0]
.clientY;

}else{

clientX =
event.clientX;

clientY =
event.clientY;

}


return {

x:
clientX -
rect.left,

y:
clientY -
rect.top

};

}


function start(event){

event.preventDefault();

drawing =
true;


const p =
getPosition(
event
);


ctx.beginPath();

ctx.moveTo(
p.x,
p.y
);

}


function move(event){

if(!drawing)
return;


event.preventDefault();


const p =
getPosition(
event
);


ctx.strokeStyle =
"rgba(255,0,0,1)";


ctx.lineTo(
p.x,
p.y
);


ctx.stroke();

}


function end(event){

if(event)
event.preventDefault();


drawing =
false;


ctx.closePath();

}


canvas.onmousedown =
start;

canvas.onmousemove =
move;

canvas.onmouseup =
end;

canvas.onmouseleave =
end;


canvas.ontouchstart =
start;

canvas.ontouchmove =
move;

canvas.ontouchend =
end;

}

   CLEAR MASK
========================================================= */

function clearMask(){

const canvas =
document.getElementById(
"maskCanvas"
);


const ctx =
canvas.getContext(
"2d"
);

0,
0,
canvas.width,

);

/* =========================================================
   IMAGE EDIT
========================================================= */

async function editImage(){

const editCanvas =
document.getElementById(
"editCanvas"
);


const maskCanvas =
document.getElementById(
"maskCanvas"
);


const prompt =
document.getElementById(
"editPrompt"
).value.trim();


if(!prompt){

setStatus(
"Не істеу керегін жазыңыз."
);

return;

}


/*
------------------------------------------------------------
Check whether mask is actually painted.
------------------------------------------------------------
*/

const maskCtx =
maskCanvas.getContext(
"2d"
);


const pixels =
maskCtx.getImageData(
0,
0,
maskCanvas.width,
maskCanvas.height
).data;


let hasMask =
false;


for(
let i = 3;
i < pixels.length;
i += 4
){

if(
pixels[i] >
20
){

hasMask =
true;

break;

}

}


if(!hasMask){

setStatus(
"Алдымен өзгертілетін объектіні қызыл түспен белгілеңіз."
);

return;

}


const image =
editCanvas.toDataURL(
"image/png"
);


const mask =
createBinaryMask(
maskCanvas
);


closeModal(
"editorModal"
);


setStatus(
"🖼️ Сурет дәл белгіленген аймақ бойынша өңделуде..."
);


const result =
await callWorkerRaw({

action:
"image_edit",

prompt,

image,

mask

});


if(
result &&
result.image
){

addMessage(
"assistant",

"✨ Сурет өңделді.",

{
type:
"image",

src:
result.image
}
);


editImageData =
result.image;

}


setStatus("");

}


/* =========================================================
   CREATE BINARY MASK
========================================================= */

function createBinaryMask(
sourceCanvas
){

const canvas =
document.createElement(
"canvas"
);


canvas.width =
sourceCanvas.width;


canvas.height =
sourceCanvas.height;


const ctx =
canvas.getContext(
"2d"
);


const source =
sourceCanvas
.getContext(
"2d"
)
.getImageData(
0,
0,
sourceCanvas.width,
sourceCanvas.height
);


const output =
ctx.createImageData(
canvas.width,
canvas.height
);


for(
let i = 0;
i < source.data.length;
i += 4
){

const alpha =
source.data[i + 3];


if(alpha > 20){

/*
  White = area to edit
*/

output.data[i] =
255;

output.data[i + 1] =
255;

output.data[i + 2] =
255;

output.data[i + 3] =
255;

}else{

/*
  Black = preserve
*/

output.data[i] =
0;

output.data[i + 1] =
0;

output.data[i + 2] =
0;

output.data[i + 3] =
255;

}

}


ctx.putImageData(
output,
0,
0
);


return canvas.toDataURL(
"image/png"
);

}


/* =========================================================
   RECORDING
========================================================= */

async function toggleRecording(){

if(
mediaRecorder &&
mediaRecorder.state ===
"recording"
){

stopRecording();

return;

}


await startRecording();

}


/* =========================================================
   START RECORDING
========================================================= */

async function startRecording(){

try{

const stream =
await navigator.mediaDevices
.getUserMedia({
audio:true
});


audioChunks =
[];


/*
------------------------------------------------------------
iPhone Safari compatibility
------------------------------------------------------------
*/

let mimeType =
"";


const candidates = [

"audio/webm;codecs=opus",

"audio/mp4",

"audio/webm",

"audio/ogg;codecs=opus"

];


for(
const candidate
of candidates
){

if(
MediaRecorder.isTypeSupported &&
MediaRecorder.isTypeSupported(
candidate
)
){

mimeType =
candidate;

break;

}

}


if(mimeType){

mediaRecorder =
new MediaRecorder(
stream,
{
mimeType
}
);

}else{

mediaRecorder =
new MediaRecorder(
stream
);

}


mediaRecorder.ondataavailable =
event => {

if(
event.data &&
event.data.size
){

audioChunks.push(
event.data
);

}

};


mediaRecorder.onstop =
async () => {

clearTimeout(
recordingTimer
);


stream
.getTracks()
.forEach(
track =>
track.stop()
);


const actualType =
mediaRecorder.mimeType ||
"audio/mp4";


const blob =
new Blob(
audioChunks,
{
type:
actualType
}
);


setRecordingUI(
false
);


setStatus(
"🎧 Дауыс мәтінге айналдырылуда..."
);


try{

const audioBase64 =
await blobToBase64(
blob
);


const result =
await callWorkerRaw({

action:
"transcribe",

audioBase64

});


if(
result &&
result.text
){

messageInput.value =
result.text;


setStatus(
"Мәтін дайын. Жіберу үшін ➤ басыңыз."
);

}else{

setStatus(
"Дауыс танылмады."
);

}

}catch(error){

setStatus(
"Дауыс қатесі: " +
error.message
);

}

};


mediaRecorder.start(
250
);


setRecordingUI(
true
);


setStatus(
"🎤 Тыңдап тұрмын... Тоқтату үшін қайта басыңыз."
);


/*
------------------------------------------------------------
Maximum 30 seconds
------------------------------------------------------------
*/

recordingTimer =
setTimeout(
() => {

if(
mediaRecorder &&
mediaRecorder.state ===
"recording"
){

stopRecording();

}

},
30000
);


}catch(error){

console.error(
error
);


setStatus(
"Микрофонға рұқсат берілмеді."
);

}

}


/* =========================================================
   STOP RECORDING
========================================================= */

function stopRecording(){

if(
mediaRecorder &&
mediaRecorder.state ===
"recording"
){

mediaRecorder.stop();

return;

}


setRecordingUI(
false
);

}


/* =========================================================
   RECORDING UI
========================================================= */

function setRecordingUI(
recording
){

if(recording){

recordButton.classList.add(
"recording"
);

recordButton.textContent =
"⏹️ Тоқтату";

}else{

recordButton.classList.remove(
"recording"
);

recordButton.textContent =
"🎤 Дауыс";

}

}


/* =========================================================
   TTS
========================================================= */

async function speakText(
text
){

setStatus(
"🔊 Дауыс дайындалуда..."
);


try{

const response =
await fetch(
REAL_WORKER_URL,
{

method:
"POST",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify({

action:
"tts",

text

})

}
);


const raw =
await response.text();


let result;


try{

result =
JSON.parse(
raw
);

}catch{

throw new Error(
raw ||
"TTS JSON қайтармады."
);

}


if(
!response.ok ||
result.ok === false
){

throw new Error(
result.error ||
"TTS қатесі."
);

}


if(
result.audio
){

const audio =
new Audio(
result.audio
);


audio.playsInline =
true;


await audio.play();


audio.onended =
() => {

setStatus("");

};

}else{

throw new Error(
"TTS аудио URL қайтармады."
);

}


}catch(error){

setStatus(
"Дауыс қатесі: " +
error.message
);

}

}


/* =========================================================
   WORKER
========================================================= */

async function callWorker(
data
){

const result =
await callWorkerRaw(
data
);


return result?.answer ||
"";

}


/* =========================================================
   WORKER REQUEST
========================================================= */

async function callWorkerRaw(
data
){

try{

const response =
await fetch(
REAL_WORKER_URL,
{

method:
"POST",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify(
data
)

}
);


const text =
await response.text();


let result;


try{

result =
JSON.parse(
text
);

}catch{

throw new Error(
text ||
"Worker JSON қайтармады."
);

}


if(
!response.ok ||
result.ok === false
){

throw new Error(
result.error ||
"Worker қатесі."
);

}


return result;


}catch(error){

console.error(
error
);


addMessage(
"assistant",
"Қате: " +
error.message
);


return null;

}

}


/* =========================================================
   FILE → DATA URL
========================================================= */

function fileToDataURL(
file
){

return new Promise(
(resolve,reject) => {

const reader =
new FileReader();


reader.onload =
() =>
resolve(
reader.result
);


reader.onerror =
reject;


reader.readAsDataURL(
file
);

}
);


/* =========================================================
   BLOB → BASE64
========================================================= */

function blobToBase64(
blob
){

return new Promise(
(resolve,reject) => {

const reader =
new FileReader();


reader.onload =
() =>
resolve(
reader.result
);


reader.onerror =
reject;


reader.readAsDataURL(
blob
);

}
);


/* =========================================================
   FILE
========================================================= */

async function selectFile(
event
){

const file =
event.target.files[0];


if(!file)
return;


setStatus(
"📎 Файл оқылуда..."
);


if(
file.type.startsWith(
"text/"
)
){

try{

const text =
await file.text();


addMessage(
"user",
"📎 " +
file.name
);


const result =
await callWorkerRaw({

action:
"file_chat",

fileName:
file.name,

fileText:
text

});


if(
result &&
result.answer
){

addMessage(
"assistant",
result.answer
);

}

}catch(error){

setStatus(
"Файл қатесі: " +
error.message
);

}


}else{

addMessage(
"assistant",

"Бұл файл түрін тікелей оқу әзірге қосылмаған. TXT файлымен тексеріңіз."
);

}


setStatus("");

}
