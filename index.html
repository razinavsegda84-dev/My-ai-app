<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My AI</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
}

body{
  background:#0b0b0f;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

button{
  font-family:inherit;
  -webkit-tap-highlight-color:transparent;
}

.app{
  width:100%;
  height:100vh;
  display:flex;
  flex-direction:column;
}


/* =====================================================
   HEADER
===================================================== */

header{
  height:58px;
  min-height:58px;
  display:flex;
  align-items:center;
  padding:0 12px;
  background:#101014;
  border-bottom:1px solid #292929;
  position:relative;
  z-index:20;
}

.menu-btn{
  width:42px;
  height:42px;
  padding:0;
  border:0;
  border-radius:10px;
  background:transparent;
  color:#fff;
  font-size:25px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.menu-btn:active{
  background:#25252c;
}

.logo{
  margin-left:5px;
  font-size:20px;
  font-weight:bold;
}

.status{
  margin-left:auto;
  font-size:12px;
  color:#999;
}

.status.online{
  color:#54d17a;
}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{
  position:fixed;
  top:0;
  left:0;

  width:290px;
  max-width:85vw;
  height:100vh;

  background:#111116;
  border-right:1px solid #29292f;

  z-index:100;

  transform:translateX(-100%);
  transition:transform .25s ease;

  display:flex;
  flex-direction:column;

  padding:12px;

  overflow:hidden;
}

.sidebar.open{
  transform:translateX(0);
}


/* SIDEBAR HEADER */

.sidebar-top{
  height:48px;
  min-height:48px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-bottom:10px;
}

.sidebar-title{
  font-size:20px;
  font-weight:bold;
}

.close-menu{
  width:38px;
  height:38px;

  border:0;
  border-radius:10px;

  background:#25252c;
  color:#fff;

  font-size:22px;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;
}

.close-menu:active{
  background:#35353e;
}


/* =====================================================
   NEW CHAT
===================================================== */

.new-chat{
  width:100%;
  min-height:44px;

  border:0;
  border-radius:12px;

  background:#fff;
  color:#000;

  font-size:15px;
  font-weight:bold;

  cursor:pointer;

  margin-bottom:10px;
}

.new-chat:active{
  background:#ddd;
}


/* =====================================================
   MENU ITEMS
===================================================== */

.menu-section{
  display:flex;
  flex-direction:column;
  gap:4px;
  margin-bottom:10px;
}

.menu-item{
  width:100%;
  min-height:48px;

  display:flex;
  align-items:center;

  border:0;
  border-radius:11px;

  background:transparent;
  color:#fff;

  padding:9px 10px;

  cursor:pointer;
  text-align:left;
}

.menu-item:hover{
  background:#222229;
}

.menu-item:active{
  background:#303038;
}

.menu-icon{
  width:34px;
  min-width:34px;

  font-size:21px;

  display:flex;
  align-items:center;
  justify-content:center;
}

.menu-text{
  margin-left:8px;

  font-size:15px;

  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}


/* =====================================================
   HISTORY
===================================================== */

.history-title{
  color:#888;
  font-size:12px;

  padding:8px 6px 6px;
}

.history{
  flex:1;

  min-height:0;

  overflow-y:auto;
  overflow-x:hidden;

  padding-bottom:8px;
}

.history-empty{
  color:#666;
  font-size:13px;
  padding:10px 7px;
}

.history-item{
  width:100%;

  padding:10px;

  margin-bottom:4px;

  border-radius:10px;

  color:#ddd;

  cursor:pointer;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.history-item:hover{
  background:#222229;
}

.history-item:active{
  background:#303038;
}


/* =====================================================
   CLEAR HISTORY
===================================================== */

.clear-history{
  flex-shrink:0;

  width:100%;

  min-height:48px;

  padding:10px 12px;

  margin-top:8px;

  border:1px solid #3a3a42;
  border-radius:11px;

  background:#25252c;
  color:#fff;

  font-size:14px;

  cursor:pointer;

  display:flex;
  align-items:center;
  justify-content:center;

  white-space:normal;
  text-align:center;
}

.clear-history:hover{
  background:#303038;
}

.clear-history:active{
  background:#3a3a42;
}


/* =====================================================
   OVERLAY
===================================================== */

.overlay{
  position:fixed;
  inset:0;

  background:rgba(0,0,0,.58);

  z-index:90;

  opacity:0;
  visibility:hidden;

  transition:
    opacity .25s ease,
    visibility .25s ease;
}

.overlay.show{
  opacity:1;
  visibility:visible;
}


/* =====================================================
   SETTINGS PANEL
===================================================== */

.settings-panel{
  position:fixed;

  top:0;
  right:0;

  width:330px;
  max-width:90vw;

  height:100vh;

  background:#111116;
  border-left:1px solid #29292f;

  z-index:150;

  transform:translateX(100%);
  transition:transform .25s ease;

  padding:15px;

  overflow-y:auto;
}

.settings-panel.open{
  transform:translateX(0);
}

.settings-header{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-bottom:20px;
}

.settings-title{
  font-size:20px;
  font-weight:bold;
}

.settings-close{
  width:38px;
  height:38px;

  border:0;
  border-radius:10px;

  background:#25252c;
  color:#fff;

  font-size:21px;

  cursor:pointer;
}

.settings-row{
  width:100%;

  min-height:50px;

  margin-bottom:7px;

  padding:10px 12px;

  border:1px solid #29292f;
  border-radius:11px;

  background:#17171c;
  color:#fff;

  display:flex;
  align-items:center;

  cursor:pointer;

  text-align:left;
}

.settings-row:hover{
  background:#222229;
}

.settings-row:active{
  background:#303038;
}

.settings-row-icon{
  width:32px;
  font-size:19px;
}

.settings-row-text{
  font-size:14px;
}

.settings-info{
  color:#777;
  font-size:12px;
  line-height:1.5;

  margin-top:20px;
}


/* =====================================================
   CHAT
===================================================== */

#chat{
  flex:1;

  overflow-y:auto;

  padding:20px 14px 145px;

  scroll-behavior:smooth;
}

.message{
  max-width:850px;

  margin:0 auto 18px;

  display:flex;
  flex-direction:column;
}

.message.user{
  align-items:flex-end;
}

.message.assistant{
  align-items:flex-start;
}

.bubble{
  max-width:85%;

  padding:12px 15px;

  border-radius:16px;

  line-height:1.5;

  white-space:pre-wrap;

  word-wrap:break-word;

  overflow-wrap:anywhere;
}

.assistant .bubble{
  background:#17171c;
  border:1px solid #29292f;
}

.user .bubble{
  background:#303036;
}


/* =====================================================
   MESSAGE ACTIONS
===================================================== */

.message-actions{
  display:flex;

  gap:6px;

  margin-top:7px;
}

.message-actions button{
  border:1px solid #303038;

  background:#202027;
  color:#bbb;

  border-radius:8px;

  padding:6px 9px;

  font-size:12px;

  cursor:pointer;
}

.message-actions button:hover{
  background:#303038;
  color:#fff;
}


/* =====================================================
   FILE CARD
===================================================== */

.file-card{
  max-width:85%;

  background:#17171c;

  border:1px solid #303038;

  border-radius:14px;

  padding:12px;

  display:flex;
  align-items:center;

  gap:10px;
}

.file-icon{
  font-size:30px;
}

.file-info{
  min-width:0;
}

.file-name{
  font-size:14px;
  font-weight:bold;

  word-break:break-word;
}

.file-type{
  color:#888;
  font-size:12px;

  margin-top:3px;
}


/* =====================================================
   IMAGES
===================================================== */

.generated-image{
  max-width:100%;

  border-radius:14px;

  display:block;

  margin-top:2px;
}

.preview-image{
  max-width:100px;
  max-height:100px;

  border-radius:10px;
}


/* =====================================================
   WELCOME
===================================================== */

.welcome{
  max-width:850px;

  margin:80px auto;

  text-align:center;

  color:#888;
}

.welcome h2{
  color:#fff;
}


/* =====================================================
   COMPOSER
===================================================== */

.composer{
  position:fixed;

  bottom:0;
  left:0;
  right:0;

  background:
    linear-gradient(
      transparent,
      #0b0b0f 22%
    );

  padding:35px 12px 12px;

  z-index:20;
}

.composer-inner{
  max-width:850px;

  margin:auto;

  background:#15151a;

  border:1px solid #303038;

  border-radius:18px;

  padding:8px;
}

textarea{
  width:100%;

  resize:none;

  min-height:48px;
  max-height:150px;

  background:transparent;

  border:0;
  outline:0;

  color:white;

  font-size:16px;

  padding:10px;

  font-family:inherit;
}

.toolbar{
  display:flex;

  align-items:center;

  gap:7px;

  padding:5px;
}

.toolbar button{
  border:0;

  cursor:pointer;

  color:white;

  background:#27272e;

  border-radius:10px;

  padding:9px 12px;

  font-size:14px;
}

.toolbar button:hover{
  background:#35353e;
}

.toolbar button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.send{
  margin-left:auto;

  background:#fff !important;

  color:#000 !important;

  font-weight:bold;
}

input[type=file]{
  display:none;
}

.preview{
  display:none;

  padding:8px;

  border-bottom:1px solid #29292f;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

  .bubble,
  .file-card{
    max-width:92%;
  }

  #chat{
    padding-left:8px;
    padding-right:8px;
  }

  textarea{
    font-size:16px;
  }

  .settings-panel{
    width:100%;
    max-width:100%;
  }

}

</style>
</head>


<body>

<div class="app">


<!-- ===================================================
     SIDEBAR
=================================================== -->

<aside
  id="sidebar"
  class="sidebar"
>

  <div class="sidebar-top">

    <div class="sidebar-title">
      My AI
    </div>

    <button
      type="button"
      class="close-menu"
      onclick="closeSidebar()"
    >
      ×
    </button>

  </div>


  <button
    type="button"

    onclick="newChat()"

    <button

      <span class="menu-icon">

      </span>

    <button
      type="button"
      class="menu-item"
      onclick="openDocuments()"
    >

      <span class="menu-icon">
        📄
      </span>

      <span class="menu-text">
        Құжаттар
      </span>

    </button>


    <button
      type="button"
      class="menu-item"
      onclick="openSettings()"
    >

      <span class="menu-icon">
        ⚙️
      </span>

      <span class="menu-text">
        Баптаулар
      </span>

    <button
      type="button"
      class="menu-item"
      onclick="showAbout()"
    >

      <span class="menu-icon">
        ℹ️
      </span>

  </div>


  <div class="history-title">

  </div>


  <div
    id="historyList"

  <button

    onclick="clearHistory()"
  >
    🗑️&nbsp; Чат тарихын толық өшіру
  </button>

</aside>


<!-- ===================================================
     OVERLAY
=================================================== -->

<div
  id="overlay"
  class="overlay"
  onclick="closeAllPanels()"
></div>


<!-- ===================================================
     SETTINGS
=================================================== -->

<section
  id="settingsPanel"
  class="settings-panel"
>

  <div class="settings-header">

    <div class="settings-title">
      ⚙️ Баптаулар
    </div>

    <button
      type="button"
      class="settings-close"
      onclick="closeSettings()"
    >
      ×
    </button>

  </div>


  <button
    type="button"
    class="settings-row"
    onclick="toggleTheme()"
  >

    <span class="settings-row-icon">

    </span>

    <span class="settings-row-text">
      Қараңғы режим
    </span>

  </button>


  <button
    type="button"
    class="settings-row"
    onclick="showLanguage()"
  >

  <button
    type="button"

  >

  <button

  >

    <span class="settings-row-icon">

    </span>

    <span class="settings-row-text">
      Чат тарихын тазалау
    </span>

  </button>


  <div class="settings-info">

    My AI — жеке AI чат интерфейсі.

    <br><br>

    Кейбір функциялар Cloudflare Workers
    және Workers AI қызметтеріне байланысты.

  </div>

</section>


<!-- ===================================================
     HEADER
=================================================== -->

<header>

  <button
    type="button"
    class="menu-btn"
    onclick="toggleSidebar()"
    aria-label="Мәзір"
  >
    ☰
  </button>


  <div class="logo">
    My AI
  </div>


  <div
    id="status"
    class="status"
  >
    Қосылуда...
  </div>

</header>


<!-- ===================================================
     CHAT
=================================================== -->

<main id="chat">

  <div
    id="welcome"
    class="welcome"
  >

    <h2>
      My AI
    </h2>

    <div>
      Сұрағыңызды жазыңыз
    </div>

  </div>

</main>


<!-- ===================================================
     COMPOSER
=================================================== -->

<div class="composer">

  <div class="composer-inner">


    <div
      id="preview"
      class="preview"
    ></div>


    <textarea
      id="message"
      placeholder="My AI-ға сұрақ қойыңыз..."
      autocomplete="off"
    ></textarea>


    <div class="toolbar">


      <button
        type="button"
        onclick="document.getElementById('imageInput').click()"
      >
        📷
      </button>


      <input
        id="imageInput"
        type="file"
        accept="image/*"
      >


      <button
        type="button"
        onclick="document.getElementById('fileInput').click()"
      >
        📎
      </button>


      <input
        id="fileInput"
        type="file"
        accept=".txt,.md,.json,.csv,.html,.js,.css,.xml,.pdf"
      >


      <button
        type="button"
        onclick="generateImage()"
      >
        🖼️
      </button>

        type="button"
        class="send"
        id="sendButton"
        onclick="sendMessage()"

        ➤
      </button>

<script>


/* =====================================================
   API
===================================================== */

const API_URL =
  "https://my-ai-backend.razinavsegda84.workers.dev";


/* =====================================================
   ELEMENTS
===================================================== */

const chatElement =
  document.getElementById("chat");

const messageElement =
  document.getElementById("message");

const sendButton =
  document.getElementById("sendButton");

const statusElement =
  document.getElementById("status");

const imageInput =
  document.getElementById("imageInput");

const fileInput =
  document.getElementById("fileInput");

const previewElement =
  document.getElementById("preview");

const sidebar =
  document.getElementById("sidebar");

const overlay =
  document.getElementById("overlay");

const settingsPanel =
  document.getElementById("settingsPanel");

const historyList =
  document.getElementById("historyList");


/* =====================================================
   VARIABLES
===================================================== */

let selectedImages = [];

let selectedFileText = "";

let selectedFile = null;

let history = [];

let chatSessions =
  JSON.parse(
    localStorage.getItem(
      "myAI_chat_sessions"
    ) || "[]"
  );


/* =====================================================
   START
===================================================== */

window.addEventListener(
  "load",
  async function(){

    renderHistory();

    await checkBackend();

    messageElement.focus();

  }
);


/* =====================================================
   SIDEBAR
===================================================== */

function toggleSidebar(){

  if(
    sidebar.classList.contains("open")
  ){

    closeSidebar();

  }else{

    openSidebar();

  }

}


function openSidebar(){

  closeSettings();

  sidebar.classList.add("open");

  overlay.classList.add("show");

}


function closeSidebar(){

  sidebar.classList.remove("open");

  if(
    !settingsPanel.classList.contains("open")
  ){

    overlay.classList.remove("show");

  }

}


/* =====================================================
   SETTINGS
===================================================== */

function openSettings(){

  closeSidebar();

  settingsPanel.classList.add("open");

  overlay.classList.add("show");

}


function closeSettings(){

  settingsPanel.classList.remove("open");

  if(
    !sidebar.classList.contains("open")
  ){

    overlay.classList.remove("show");

  }

}


function closeAllPanels(){

  sidebar.classList.remove("open");

  settingsPanel.classList.remove("open");

  overlay.classList.remove("show");

}


/* =====================================================
   SETTINGS FUNCTIONS
===================================================== */

function toggleTheme(){

  alert(
    "Қараңғы режим қазір қосулы."
  );

}


function showLanguage(){

  alert(
    "Қазіргі тіл: қазақша."
  );

}


function showModelInfo(){

  alert(
    "AI моделі Cloudflare Workers AI арқылы жұмыс істейді."
  );

}


/* =====================================================
   IMAGES MENU
===================================================== */

function openImages(){

  closeSidebar();

  messageElement.focus();

  alert(
    "Суреттер бөлімі дайын. 📷 батырмасы арқылы сурет жіберуге болады."
  );

}


/* =====================================================
   DOCUMENTS MENU
===================================================== */

function openDocuments(){

  closeSidebar();

  document
    .getElementById("fileInput")
    .click();

}


/* =====================================================
   ABOUT
===================================================== */

function showAbout(){

  closeSidebar();

  alert(
    "My AI\n\nЖеке AI чат қосымшасы."
  );

}


/* =====================================================
   NEW CHAT
===================================================== */

function newChat(){

  saveCurrentChat();

  history = [];

  selectedImages = [];

  selectedFileText = "";

  selectedFile = null;

  chatElement.innerHTML = `

    <div
      id="welcome"
      class="welcome"
    >

      <h2>
        My AI
      </h2>

      <div>
        Сұрағыңызды жазыңыз
      </div>

    </div>

  `;

  messageElement.value = "";

  previewElement.style.display =
    "none";

  previewElement.innerHTML = "";

  closeAllPanels();

  messageElement.focus();

}


/* =====================================================
   SAVE CURRENT CHAT
===================================================== */

function saveCurrentChat(){

  if(!history.length){
    return;
  }

  const firstUser =
    history.find(
      x => x.role === "user"
    );

  if(!firstUser){
    return;
  }

  const title =
    firstUser.content
      .slice(0,60);


  const session = {

    id:Date.now(),

    title:title,

    messages:[
      ...history
    ]

  };


  chatSessions.unshift(
    session
  );


  chatSessions =
    chatSessions.slice(
      0,
      30
    );


  localStorage.setItem(
    "myAI_chat_sessions",
    JSON.stringify(
      chatSessions
    )
  );


  renderHistory();

}


/* =====================================================
   HISTORY
===================================================== */

function renderHistory(){

  historyList.innerHTML = "";


  if(!chatSessions.length){

    historyList.innerHTML = `

      <div class="history-empty">
        Әзірге чат тарихы жоқ
      </div>

    `;

    return;

  }


  chatSessions.forEach(
    session => {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "history-item";


      item.textContent =
        session.title;


      item.onclick =
        function(){

          loadChat(
            session.id
          );

        };


      historyList.appendChild(
        item
      );

    }
  );

}


/* =====================================================
   LOAD CHAT
===================================================== */

function loadChat(id){

  const session =
    chatSessions.find(
      x => x.id === id
    );


  if(!session){
    return;
  }


  history =
    [...session.messages];


  chatElement.innerHTML = "";


  history.forEach(
    item => {

      addMessage(
        item.role,
        item.content,
        false
      );

    }
  );


  closeAllPanels();

}


/* =====================================================
   CLEAR HISTORY
===================================================== */

function clearHistory(){

  const answer =
    confirm(
      "Барлық чат тарихын өшіру керек пе?"
    );


  if(!answer){
    return;
  }


  chatSessions = [];


  localStorage.removeItem(
    "myAI_chat_sessions"
  );


  history = [];


  renderHistory();


  closeAllPanels();


  chatElement.innerHTML = `

    <div
      id="welcome"
      class="welcome"
    >

      <h2>
        My AI
      </h2>

      <div>
        Сұрағыңызды жазыңыз
      </div>

    </div>

  `;

}


/* =====================================================
   BACKEND CHECK
===================================================== */

async function checkBackend(){

  statusElement.textContent =
    "Қосылуда...";

  statusElement.classList.remove(
    "online"
  );


  try{

    const response =
      await fetch(
        API_URL,
        {
          method:"GET",
          cache:"no-store"
        }
      );


    const data =
      await response.json();


    if(
      response.ok &&
      data &&
      data.ok
    ){

      statusElement.textContent =
        "Онлайн";


      statusElement.classList.add(
        "online"
      );

    }else{

      statusElement.textContent =
        "Backend қатесі";

    }


  }catch(error){

    console.error(error);


    statusElement.textContent =
      "Backend қосылмады";

  }

}


/* =====================================================
   ENTER
===================================================== */

messageElement.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =====================================================
   IMAGE SELECT
===================================================== */

imageInput.addEventListener(
  "change",
  function(){

    const file =
      this.files[0];


    if(!file){
      return;
    }


    const reader =
      new FileReader();


    reader.onload =
      function(event){

        selectedImages = [

          event.target.result

        ];


        previewElement.style.display =
          "block";


        previewElement.innerHTML = `

          <img
            class="preview-image"
            src="${event.target.result}"
          >

        `;

      };


    reader.readAsDataURL(file);

  }
);


/* =====================================================
   FILE SELECT
===================================================== */

fileInput.addEventListener(
  "change",
  async function(){

    const file =
      this.files[0];


    if(!file){
      return;
    }


    selectedFile =
      file;


    previewElement.style.display =
      "block";


    previewElement.innerHTML = `

      <div class="file-card">

        <div class="file-icon">
          📄
        </div>

        <div class="file-info">

          <div class="file-name">
            ${escapeHtml(file.name)}
          </div>

          <div class="file-type">
            ${escapeHtml(
              file.type ||
              "PDF / файл"
            )}
          </div>

        </div>

      </div>

    `;


    if(

      file.type === "text/plain" ||

      file.name.endsWith(".txt") ||

      file.name.endsWith(".md") ||

      file.name.endsWith(".json") ||

      file.name.endsWith(".csv") ||

      file.name.endsWith(".js") ||

      file.name.endsWith(".css") ||

      file.name.endsWith(".html") ||

      file.name.endsWith(".xml")

    ){

      try{

        selectedFileText =
          await file.text();

      }catch(error){

        selectedFileText = "";

        console.error(error);

      }

    }else{

      selectedFileText = "";

    }

  }
);


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(){

  const message =
    messageElement.value.trim();


  if(

    !message &&

    selectedImages.length === 0 &&

    !selectedFile

  ){

    return;

  }


  setLoading(true);


  if(message){

    addMessage(
      "user",
      message
    );

  }


  const currentImages =
    [...selectedImages];


  const currentFileText =
    selectedFileText;


  const currentFile =
    selectedFile;


  messageElement.value = "";

  selectedImages = [];

  selectedFileText = "";

  selectedFile = null;


  previewElement.style.display =
    "none";

  previewElement.innerHTML = "";


  try{

    const response =
      await fetch(
        API_URL,
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              action:"chat",

              message:

                message ||

                (
                  currentFile
                    ? `Файлды талдаңыз: ${currentFile.name}`
                    : "Суретті талда."
                ),

              history:
                history.slice(-20),

              images:
                currentImages,

              fileText:
                currentFileText,

              fileName:
                currentFile
                  ? currentFile.name
                  : "",

              mimeType:
                currentFile
                  ? currentFile.type
                  : ""

            })

        }
      );


    const data =
      await response.json();


    if(
      !response.ok ||
      !data.ok
    ){

      throw new Error(
        data.error ||
        `HTTP ${response.status}`
      );

    }


    const answer =
      data.answer ||
      "AI жауап бере алмады.";


    addMessage(
      "assistant",
      answer
    );


    history.push({

      role:"user",

      content:

        message ||

        (
          currentFile
            ? `Файл: ${currentFile.name}`
            : "Суретті талдау"
        )

    });


    history.push({

      role:"assistant",

      content:answer

    });


    history =
      history.slice(-20);


    saveHistoryLocally();


  }catch(error){

    console.error(error);


    addMessage(
      "assistant",
      "Қате: " +
      error.message
    );


  }finally{

    setLoading(false);

  }

}


/* =====================================================
   IMAGE GENERATION
===================================================== */

async function generateImage(){

  const prompt =
    messageElement.value.trim();


  if(!prompt){

    addMessage(
      "assistant",
      "Сурет жасау үшін алдымен сипаттама жазыңыз."
    );

    return;

  }


  setLoading(true);


  addMessage(
    "user",
    "🖼️ " + prompt
  );


  messageElement.value = "";


  try{

    const response =
      await fetch(
        API_URL,
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              action:"image",

              prompt:prompt,

              width:1024,

              height:1024

            })

        }
      );


    const data =
      await response.json();


    if(
      !response.ok ||
      !data.ok
    ){

      throw new Error(
        data.error ||
        `HTTP ${response.status}`
      );

    }


    if(!data.image){

      throw new Error(
        "Сурет қайтарылмады."
      );

    }


    addImageMessage(
      data.image
    );


  }catch(error){

    console.error(error);


    addMessage(
      "assistant",
      "Сурет жасау қатесі: " +
      error.message
    );


  }finally{

    setLoading(false);

  }

}


/* =====================================================
   ADD MESSAGE
===================================================== */

function addMessage(
  role,
  text,
  actions=true
){

  const wrapper =
    document.createElement(
      "div"
    );


  wrapper.className =
    `message ${role}`;


  const bubble =
    document.createElement(
      "div"
    );


  bubble.className =
    "bubble";


  bubble.textContent =
    text;


  wrapper.appendChild(
    bubble
  );


  if(
    role === "assistant" &&
    actions
  ){

    const actionBar =
      document.createElement(
        "div"
      );


    actionBar.className =
      "message-actions";


    const copyButton =
      document.createElement(
        "button"
      );


    copyButton.type =
      "button";


    copyButton.textContent =
      "📋 Көшіру";


    copyButton.onclick =
      async function(){

        try{

          await navigator.clipboard.writeText(
            text
          );


          copyButton.textContent =
            "✓ Көшірілді";


          setTimeout(
            function(){

              copyButton.textContent =
                "📋 Көшіру";

            },
            1500
          );


        }catch(error){

          alert(
            "Көшіру мүмкін болмады."
          );

        }

      };


    const retryButton =
      document.createElement(
        "button"
      );


    retryButton.type =
      "button";


    retryButton.textContent =
      "🔄 Қайта жауап";


    retryButton.onclick =
      function(){

        retryLast();

      };


    actionBar.appendChild(
      copyButton
    );


    actionBar.appendChild(
      retryButton
    );


    wrapper.appendChild(
      actionBar
    );

  }


  chatElement.appendChild(
    wrapper
  );


  scrollChat();

}


/* =====================================================
   RETRY
===================================================== */

async function retryLast(){

  let lastUser = null;


  for(
    let i =
      history.length - 1;

    i >= 0;

    i--
  ){

    if(
      history[i].role === "user"
    ){

      lastUser =
        history[i].content;

      break;

    }

  }


  if(!lastUser){
    return;
  }


  messageElement.value =
    lastUser;


  await sendMessage();

}


/* =====================================================
   IMAGE MESSAGE
===================================================== */

function addImageMessage(
  image
){

  const wrapper =
    document.createElement(
      "div"
    );


  wrapper.className =
    "message assistant";


  const bubble =
    document.createElement(
      "div"
    );


  bubble.className =
    "bubble";


  const img =
    document.createElement(
      "img"
    );


  img.className =
    "generated-image";


  img.src =
    image;


  img.alt =
    "Generated image";


  bubble.appendChild(
    img
  );


  wrapper.appendChild(
    bubble
  );


  chatElement.appendChild(
    wrapper
  );


  scrollChat();

}


/* =====================================================
   LOCAL HISTORY
===================================================== */

function saveHistoryLocally(){

  if(!history.length){
    return;
  }


  const first =
    history.find(
      x => x.role === "user"
    );


  if(!first){
    return;
  }


  const title =
    first.content.slice(
      0,
      60
    );


  let existing =
    chatSessions.find(
      x => x.active === true
    );


  if(existing){

    existing.messages =
      [...history];

    existing.title =
      title;

  }else{

    chatSessions.forEach(
      x => x.active = false
    );


    chatSessions.unshift({

      id:Date.now(),

      title:title,

      active:true,

      messages:[
        ...history
      ]

    });

  }


  chatSessions =
    chatSessions.slice(
      0,
      30
    );


  localStorage.setItem(
    "myAI_chat_sessions",
    JSON.stringify(
      chatSessions
    )
  );


  renderHistory();

}


/* =====================================================
   LOADING
===================================================== */

function setLoading(
  loading
){

  sendButton.disabled =
    loading;


  messageElement.disabled =
    loading;


  if(loading){

    statusElement.textContent =
      "Жауап дайындалуда...";

  }else{

    checkBackend();

  }

}


/* =====================================================
   SCROLL
===================================================== */

function scrollChat(){

  setTimeout(
    function(){

      chatElement.scrollTop =
        chatElement.scrollHeight;

    },
    50
  );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
  text
){

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}
