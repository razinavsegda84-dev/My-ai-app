<!DOCTYPE html>
<html lang="kk">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>My AI</title>

<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

button {
  border: 0;
  cursor: pointer;
  color: #fff;
}

.app {
  width: 100%;
  height: 100dvh;
  display: flex;
  flex-direction: column;
}

/* HEADER */

header {
  height: 60px;
  min-height: 60px;
  border-bottom: 1px solid #222;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 12px;
}

.header-side {
  width: 44px;
}

.header-title {
  font-size: 20px;
  font-weight: bold;
}

.icon-button {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: #222;
  font-size: 20px;
}

/* CHAT */

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  padding-bottom: 110px;
}

.welcome {
  text-align: center;
  margin-top: 21vh;
  color: #888;
}

.welcome h1 {
  color: #fff;
  font-size: 30px;
}

.message {
  max-width: 90%;
  padding: 12px 16px;
  margin: 12px 0;
  border-radius: 18px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
}

.user {
  background: #2563eb;
  margin-left: auto;
  border-bottom-right-radius: 5px;
}

.ai {
  background: #1d1d1d;
  margin-right: auto;
  border-bottom-left-radius: 5px;
}

.message img {
  display: block;
  max-width: 100%;
  max-height: 420px;
  border-radius: 14px;
  margin: 5px 0;
  cursor: pointer;
}

.message-tools {
  display: flex;
  gap: 6px;
  margin-top: 10px;
}

.small-button {
  background: #333;
  border-radius: 10px;
  padding: 7px 10px;
  font-size: 13px;
}

/* INPUT */

.bottom-area {
  background: #000;
  border-top: 1px solid #222;
  padding: 8px;
  padding-bottom:
    calc(8px + env(safe-area-inset-bottom));
}

.preview {
  display: none;
  overflow-x: auto;
  padding-bottom: 8px;
}

.preview-row {
  display: flex;
  gap: 7px;
}

.preview-item {
  position: relative;
}

.preview-item img {
  width: 64px;
  height: 64px;
  object-fit: cover;
  border-radius: 10px;
}

.preview-remove {
  position: absolute;
  right: -4px;
  top: -4px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #333;
  font-size: 12px;
}

.controls {
  display: flex;
  align-items: flex-end;
  gap: 5px;
}

textarea {
  flex: 1;
  min-width: 0;
  min-height: 44px;
  max-height: 120px;
  resize: none;
  background: #1b1b1b;
  color: #fff;
  border: 1px solid #333;
  border-radius: 18px;
  padding: 12px;
  font-size: 16px;
  font-family: Arial, sans-serif;
  outline: none;
}

.control-button,
.send-button {
  width: 44px;
  min-width: 44px;
  height: 44px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.control-button {
  background: #222;
  font-size: 18px;
}

.send-button {
  background: #fff;
  color: #000;
  font-size: 19px;
}

input[type=file] {
  display: none;
}

.status {
  position: fixed;
  left: 0;
  bottom: 73px;
  width: 100%;
  text-align: center;
  color: #777;
  font-size: 12px;
  pointer-events: none;
}

/* PANEL */

.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.65);
  z-index: 50;
}

.overlay.show {
  display: block;
}

.chat-panel {
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  width: min(340px, 88vw);
  background: #111;
  z-index: 60;
  transform: translateX(-100%);
  transition: transform .2s;
  display: flex;
  flex-direction: column;
}

.chat-panel.show {
  transform: translateX(0);
}

.panel-header {
  height: 60px;
  border-bottom: 1px solid #292929;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 12px;
}

.panel-title {
  font-size: 18px;
  font-weight: bold;
}

.panel-button {
  margin: 10px;
  padding: 12px;
  border-radius: 12px;
  background: #2563eb;
}

.search-box {
  margin: 0 10px 10px;
  background: #1d1d1d;
  border: 1px solid #333;
  color: #fff;
  border-radius: 12px;
  padding: 11px;
  outline: none;
}

.chat-list {
  flex: 1;
  overflow-y: auto;
  padding: 4px 8px 20px;
}

.chat-item {
  display: flex;
  gap: 4px;
  align-items: center;
  border-radius: 12px;
  margin-bottom: 4px;
}

.chat-item.active {
  background: #222;
}

.chat-open {
  flex: 1;
  min-width: 0;
  background: transparent;
  text-align: left;
  padding: 12px 10px;
}

.chat-name {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.chat-date {
  display: block;
  margin-top: 4px;
  color: #666;
  font-size: 11px;
}

.chat-action {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: transparent;
}

.empty {
  text-align: center;
  color: #666;
  padding: 30px 15px;
}

/* MODAL */

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.9);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 15px;
}

.modal.show {
  display: flex;
}

.modal img {
  max-width: 100%;
  max-height: 90vh;
  object-fit: contain;
}

.modal-close {
  position: absolute;
  right: 15px;
  top: 15px;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: #222;
  font-size: 20px;
}

@media(max-width:600px) {

  #chat {
    padding: 13px;
  }

  .message {
    max-width: 93%;
  }

  textarea {
    font-size: 15px;
  }

}

</style>

</head>

<body>

<div class="app">

<header>

  <div class="header-side">

    <button
      class="icon-button"
      onclick="openPanel()">
      ☰
    </button>

  </div>

  <div class="header-title">
    🤖 My AI
  </div>

  <div class="header-side">

    <button
      class="icon-button"
      onclick="newChat()">
      ＋
    </button>

  </div>

</header>


<div id="chat">

  <div
    class="welcome"
    id="welcome">

    <h1>Сәлем! 👋</h1>

    <p>Мен — My AI</p>

    <p>
      Сұрақ қойыңыз немесе сурет/файл жіберіңіз.
    </p>

  </div>

</div>


<div
  id="status"
  class="status">
</div>


<div class="bottom-area">

  <div
    id="preview"
    class="preview">

    <div
      id="previewRow"
      class="preview-row">
    </div>

  </div>


  <div class="controls">

    <button
      class="control-button"
      onclick="fileInput.click()">
      📎
    </button>

    <input
      id="fileInput"
      type="file"
      accept="image/*,.pdf,.txt,.docx,.xlsx,.csv"
      multiple
      onchange="selectFiles(event)">


    <button
      class="control-button"
      onclick="cameraInput.click()">
      📷
    </button>

    <input
      id="cameraInput"
      type="file"
      accept="image/*"
      capture="environment"
      onchange="selectFiles(event)">


    <textarea
      id="input"
      rows="1"
      placeholder="Хабарлама жазыңыз...">
    </textarea>


    <button
      class="send-button"
      onclick="sendMessage()">
      ➤
    </button>

  </div>

</div>

</div>


<!-- PANEL -->

<div
  id="overlay"
  class="overlay"
  onclick="closePanel()">
</div>


<div
  id="panel"
  class="chat-panel">

  <div class="panel-header">

    <div class="panel-title">
      Чаттар
    </div>

    <button
      class="icon-button"
      onclick="closePanel()">
      ✕
    </button>

  </div>


  <button
    class="panel-button"
    onclick="newChatFromPanel()">
    ＋ Жаңа чат
  </button>


  <input
    id="chatSearch"
    class="search-box"
    placeholder="Чатты іздеу..."
    oninput="renderChats()">


  <div
    id="chatList"
    class="chat-list">
  </div>

</div>


<!-- IMAGE MODAL -->

<div
  id="imageModal"
  class="modal"
  onclick="closeImage()">

  <button
    class="modal-close"
    onclick="closeImage()">
    ✕
  </button>

  <img
    id="modalImage">

</div>


<script>

/* =========================================================
   WORKER
========================================================= */

const WORKER_URL =
  "https://my-ai-backend.razinavsegda84.workers.dev";


/* =========================================================
   STORAGE
========================================================= */

const STORAGE_KEY =
  "my_ai_chats_v4";


let chats =
  loadChats();

let currentChatId =
  null;

let history =
  [];

let selectedImages =
  [];

let selectedFiles =
  [];

let sending =
  false;


/* =========================================================
   STORAGE
========================================================= */

function loadChats() {

  try {

    const data =
      localStorage.getItem(
        STORAGE_KEY
      );

    return data
      ? JSON.parse(data)
      : [];

  }

  catch {

    return [];

  }

}


function saveChats() {

  try {

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(chats)
    );

  }

  catch {

    alert(
      "Телефон жады толып қалды. Кейбір ескі чаттарды өшіріңіз."
    );

  }

}


/* =========================================================
   CHAT
========================================================= */

function id() {

  return (
    Date.now().toString(36) +
    Math.random()
      .toString(36)
      .slice(2)
  );

}


function createChat() {

  const chat = {

    id: id(),

    title:
      "Жаңа чат",

    history: [],

    createdAt:
      Date.now(),

    updatedAt:
      Date.now()

  };

  chats.unshift(
    chat
  );

  currentChatId =
    chat.id;

  history = [];

  saveChats();

  renderChats();

}


function currentChat() {

  return chats.find(
    x =>
      x.id ===
      currentChatId
  );

}


function updateChat() {

  const chat =
    currentChat();

  if (!chat) return;

  chat.history =
    history.slice(-12);

  chat.updatedAt =
    Date.now();

  saveChats();

  renderChats();

}


function newChat() {

  if (
    history.length &&
    !confirm(
      "Жаңа чат бастаймыз ба?"
    )
  ) {
    return;
  }

  createChat();

  clearSelection();

  renderCurrent();

}


function newChatFromPanel() {

  createChat();

  clearSelection();

  renderCurrent();

  closePanel();

}


function openChat(chatId) {

  const chat =
    chats.find(
      x =>
        x.id === chatId
    );

  if (!chat) return;

  currentChatId =
    chat.id;

  history =
    Array.isArray(chat.history)
      ? chat.history.slice(-12)
      : [];

  renderCurrent();

  renderChats();

  closePanel();

}


/* =========================================================
   CHAT RENDER
========================================================= */

function renderCurrent() {

  const box =
    document.getElementById(
      "chat"
    );

  box.innerHTML = "";

  if (!history.length) {

    box.innerHTML = `
      <div class="welcome" id="welcome">
        <h1>Сәлем! 👋</h1>
        <p>Мен — My AI</p>
        <p>Сұрақ қойыңыз немесе сурет/файл жіберіңіз.</p>
      </div>
    `;

    return;

  }


  history.forEach(
    item => {

      if (
        item.role !== "user" &&
        item.role !== "assistant"
      ) return;

      addMessage(
        item.content,
        item.role === "user"
          ? "user"
          : "ai",
        item.images || []
      );

    }
  );

}


function addMessage(
  text,
  type,
  images = []
) {

  const box =
    document.getElementById(
      "chat"
    );

  const div =
    document.createElement(
      "div"
    );

  div.className =
    "message " + type;


  images.forEach(
    src => {

      const img =
        document.createElement(
          "img"
        );

      img.src =
        src;

      img.onclick =
        function() {

          openImage(
            src
          );

        };

      div.appendChild(
        img
      );

    }
  );


  if (text) {

    const textDiv =
      document.createElement(
        "div"
      );

    textDiv.textContent =
      text;

    div.appendChild(
      textDiv
    );

  }


  if (type === "ai") {

    const tools =
      document.createElement(
        "div"
      );

    tools.className =
      "message-tools";


    const copy =
      document.createElement(
        "button"
      );

    copy.className =
      "small-button";

    copy.textContent =
      "📋 Көшіру";

    copy.onclick =
      function() {

        navigator.clipboard
          ?.writeText(text);

      };


    const regenerate =
      document.createElement(
        "button"
      );

    regenerate.className =
      "small-button";

    regenerate.textContent =
      "🔄 Қайта";

    regenerate.onclick =
      function() {

        regenerateAnswer(
          text
        );

      };


    tools.appendChild(
      copy
    );

    tools.appendChild(
      regenerate
    );

    div.appendChild(
      tools
    );

  }


  box.appendChild(
    div
  );

  box.scrollTop =
    box.scrollHeight;

  return div;

}


/* =========================================================
   CHAT LIST
========================================================= */

function renderChats() {

  const list =
    document.getElementById(
      "chatList"
    );

  const search =
    document.getElementById(
      "chatSearch"
    ).value
      .toLowerCase()
      .trim();


  list.innerHTML = "";


  const filtered =
    chats.filter(
      chat =>
        !search ||
        chat.title
          .toLowerCase()
          .includes(search)
    );


  if (!filtered.length) {

    list.innerHTML =
      `<div class="empty">
        Чат табылмады.
      </div>`;

    return;

  }


  filtered.forEach(
    chat => {

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "chat-item" +
        (
          chat.id === currentChatId
            ? " active"
            : ""
        );


      const open =
        document.createElement(
          "button"
        );

      open.className =
        "chat-open";


      const name =
        document.createElement(
          "span"
        );

      name.className =
        "chat-name";

      name.textContent =
        chat.title;


      const date =
        document.createElement(
          "span"
        );

      date.className =
        "chat-date";

      date.textContent =
        new Date(
          chat.updatedAt
        ).toLocaleString(
          "kk-KZ",
          {
            day: "2-digit",
            month: "2-digit",
            hour: "2-digit",
            minute: "2-digit"
          }
        );


      open.appendChild(
        name
      );

      open.appendChild(
        date
      );


      open.onclick =
        () =>
          openChat(
            chat.id
          );


      const rename =
        document.createElement(
          "button"
        );

      rename.className =
        "chat-action";

      rename.textContent =
        "✏️";

      rename.onclick =
        event => {

          event.stopPropagation();

          renameChat(
            chat.id
          );

        };


      const del =
        document.createElement(
          "button"
        );

      del.className =
        "chat-action";

      del.textContent =
        "🗑️";

      del.onclick =
        event => {

          event.stopPropagation();

          deleteChat(
            chat.id
          );

        };


      row.appendChild(
        open
      );

      row.appendChild(
        rename
      );

      row.appendChild(
        del
      );

      list.appendChild(
        row
      );

    }
  );

}


/* =========================================================
   RENAME
========================================================= */

function renameChat(
  chatId
) {

  const chat =
    chats.find(
      x =>
        x.id === chatId
    );

  if (!chat) return;


  const name =
    prompt(
      "Жаңа чат атауы:",
      chat.title
    );


  if (
    name &&
    name.trim()
  ) {

    chat.title =
      name.trim()
        .slice(0, 80);

    chat.updatedAt =
      Date.now();

    saveChats();

    renderChats();

  }

}


/* =========================================================
   DELETE
========================================================= */

function deleteChat(
  chatId
) {

  if (
    !confirm(
      "Бұл чатты өшіру керек пе?"
    )
  ) {
    return;
  }


  chats =
    chats.filter(
      x =>
        x.id !== chatId
    );


  if (
    currentChatId === chatId
  ) {

    if (chats.length) {

      currentChatId =
        chats[0].id;

      history =
        chats[0].history || [];

    }

    else {

      createChat();

    }

  }


  saveChats();

  renderCurrent();

  renderChats();

}


/* =========================================================
   PANEL
========================================================= */

function openPanel() {

  document
    .getElementById(
      "overlay"
    )
    .classList.add(
      "show"
    );

  document
    .getElementById(
      "panel"
    )
    .classList.add(
      "show"
    );

}


function closePanel() {

  document
    .getElementById(
      "overlay"
    )
    .classList.remove(
      "show"
    );

  document
    .getElementById(
      "panel"
    )
    .classList.remove(
      "show"
    );

}


/* =========================================================
   FILE SELECTION
========================================================= */

function selectFiles(
  event
) {

  const files =
    Array.from(
      event.target.files || []
    );


  if (!files.length) {
    return;
  }


  files.forEach(
    file => {

      if (
        file.type.startsWith(
          "image/"
        )
      ) {

        if (
          file.size <=
          20 * 1024 * 1024
        ) {

          selectedImages.push(
            file
          );

        }

      }

      else {

        selectedFiles.push(
          file
        );

      }

    }
  );


  renderPreview();

  event.target.value =
    "";

}


/* =========================================================
   PREVIEW
========================================================= */

function renderPreview() {

  const preview =
    document.getElementById(
      "preview"
    );

  const row =
    document.getElementById(
      "previewRow"
    );


  row.innerHTML = "";


  selectedImages.forEach(
    (file, index) => {

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "preview-item";


      const img =
        document.createElement(
          "img"
        );


      const reader =
        new FileReader();


      reader.onload =
        event => {

          img.src =
            event.target.result;

        };


      reader.readAsDataURL(
        file
      );


      const remove =
        document.createElement(
          "button"
        );

      remove.className =
        "preview-remove";

      remove.textContent =
        "✕";


      remove.onclick =
        () => {

          selectedImages.splice(
            index,
            1
          );

          renderPreview();

        };


      item.appendChild(
        img
      );

      item.appendChild(
        remove
      );

      row.appendChild(
        item
      );

    }
  );


  selectedFiles.forEach(
    (file, index) => {

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "preview-item";


      item.innerHTML =
        `<div style="
          width:64px;
          height:64px;
          background:#222;
          border-radius:10px;
          display:flex;
          align-items:center;
          justify-content:center;
          font-size:24px;">
          📄
        </div>`;


      const remove =
        document.createElement(
          "button"
        );

      remove.className =
        "preview-remove";

      remove.textContent =
        "✕";


      remove.onclick =
        () => {

          selectedFiles.splice(
            index,
            1
          );

          renderPreview();

        };


      item.appendChild(
        remove
      );

      row.appendChild(
        item
      );

    }
  );


  preview.style.display =
    (
      selectedImages.length ||
      selectedFiles.length
    )
      ? "block"
      : "none";

}


/* =========================================================
   CLEAR
========================================================= */

function clearSelection() {

  selectedImages =
    [];

  selectedFiles =
    [];

  renderPreview();

}


/* =========================================================
   FILE → BASE64
========================================================= */

function fileToBase64(
  file
) {

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();


      reader.onload =
        () =>
          resolve(
            reader.result
          );


      reader.onerror =
        reject;


      reader.readAsDataURL(
        file
      );

    }
  );

}


/* =========================================================
   IMAGE COMPRESS
========================================================= */

function compressImage(
  file
) {

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();


      reader.onload =
        event => {

          const img =
            new Image();


          img.onload =
            () => {

              const max =
                1280;


              let w =
                img.width;

              let h =
                img.height;


              if (
                w > max ||
                h > max
              ) {

                if (
                  w > h
                ) {

                  h =
                    Math.round(
                      h * max / w
                    );

                  w =
                    max;

                }

                else {

                  w =
                    Math.round(
                      w * max / h
                    );

                  h =
                    max;

                }

              }


              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                w;

              canvas.height =
                h;


              const ctx =
                canvas.getContext(
                  "2d"
                );


              ctx.drawImage(
                img,
                0,
                0,
                w,
                h
              );


              resolve(
                canvas.toDataURL(
                  "image/jpeg",
                  0.72
                )
              );

            };


          img.onerror =
            reject;


          img.src =
            event.target.result;

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(
        file
      );

    }
  );

}


/* =========================================================
   SEND FILE TO WORKER
========================================================= */

async function processFile(
  file
) {

  const base64 =
    await fileToBase64(
      file
    );


  const response =
    await fetch(
      WORKER_URL,
      {

        method:
          "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({

            action:
              "file",

            file:
              base64,

            fileName:
              file.name,

            mimeType:
              file.type ||
              "application/octet-stream"

          })

      }
    );


  const data =
    await response.json();


  if (!response.ok) {

    throw new Error(
      data.error ||
      "Файл өңделмеді."
    );

  }


  return data.text || "";

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage() {

  if (sending) {
    return;
  }


  const input =
    document.getElementById(
      "input"
    );


  const text =
    input.value.trim();


  if (
    !text &&
    !selectedImages.length &&
    !selectedFiles.length
  ) {
    return;
  }


  if (!currentChatId) {
    createChat();
  }


  const welcome =
    document.getElementById(
      "welcome"
    );


  if (welcome) {
    welcome.remove();
  }


  sending =
    true;


  setStatus(
    "Дайындалып жатыр..."
  );


  try {

    /* IMAGES */

    const imageData =
      [];


    for (
      const file of selectedImages
    ) {

      imageData.push(
        await compressImage(
          file
        )
      );

    }


    /* FILES */

    let fileText =
      "";


    for (
      const file of selectedFiles
    ) {

      setStatus(
        file.name +
        " оқылып жатыр..."
      );


      const textFromFile =
        await processFile(
          file
        );


      fileText +=
        "\n\n--- " +
        file.name +
        " ---\n" +
        textFromFile;

    }


    const userText =
      text ||
      (
        imageData.length
          ? "Осы суреттерді талда."
          : "Осы файлды талда."
      );


    /* USER MESSAGE */

    addMessage(
      userText,
      "user",
      imageData
    );


    /* WORKER */

    setStatus(
      "AI жауап дайындап жатыр..."
    );


    const loading =
      addMessage(
        "AI жауап дайындап жатыр...",
        "ai"
      );


    const response =
      await fetch(
        WORKER_URL,
        {

          method:
            "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              action:
                "chat",

              message:
                userText,

              images:
                imageData,

              fileText:
                fileText,

              history:
                history.slice(-12)

            })

        }
      );


    const data =
      await response.json();


    loading.remove();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Сервер қатесі."
      );

    }


    const answer =
      typeof data.answer === "string"
        ? data.answer
        : JSON.stringify(
            data.answer
          );


    addMessage(
      answer,
      "ai"
    );


    /* SAVE USER */

    history.push({

      role:
        "user",

      content:
        userText,

      images:
        imageData

    });


    /* SAVE AI */

    history.push({

      role:
        "assistant",

      content:
        answer,

      images:
        []

    });


    history =
      history.slice(-12);


    /* TITLE */

    const chat =
      currentChat();


    if (
      chat &&
      chat.title ===
      "Жаңа чат"
    ) {

      chat.title =
        userText.length > 45
          ? userText.slice(0,45) + "..."
          : userText;

    }


    updateChat();


    input.value =
      "";

    input.style.height =
      "auto";


    clearSelection();


    setStatus("");

  }

  catch (error) {

    console.error(
      error
    );


    addMessage(
      "Қате: " +
      (
        error.message ||
        "Белгісіз қате"
      ),
      "ai"
    );


    setStatus("");

  }

  finally {

    sending =
      false;

  }

}


/* =========================================================
   REGENERATE
========================================================= */

async function regenerateAnswer(
  oldAnswer
) {

  if (sending) {
    return;
  }


  if (
    history.length < 2
  ) {
    return;
  }


  const last =
    history[
      history.length - 1
    ];


  if (
    last.role !==
    "assistant"
  ) {
    return;
  }


  history.pop();


  const previousUser =
    history[
      history.length - 1
    ];


  if (
    !previousUser ||
    previousUser.role !==
    "user"
  ) {
    return;
  }


  const loading =
    addMessage(
      "Жаңа жауап дайындалып жатыр...",
      "ai"
    );


  sending =
    true;


  try {

    const response =
      await fetch(
        WORKER_URL,
        {

          method:
            "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              action:
                "chat",

              message:
                previousUser.content,

              images:
                previousUser.images || [],

              history:
                history.slice(-12)

            })

        }
      );


    const data =
      await response.json();


    loading.remove();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Қайта генерация қатесі."
      );

    }


    const answer =
      data.answer ||
      "AI жауап бере алмады.";


    addMessage(
      answer,
      "ai"
    );


    history.push({

      role:
        "assistant",

      content:
        answer,

      images:
        []

    });


    updateChat();

  }

  catch (error) {

    loading.remove();

    addMessage(
      "Қате: " +
      error.message,
      "ai"
    );

  }

  finally {

    sending =
      false;

  }

}


/* =========================================================
   IMAGE MODAL
========================================================= */

function openImage(
  src
) {

  document.getElementById(
    "modalImage"
  ).src =
    src;

  document.getElementById(
    "imageModal"
  ).classList.add(
    "show"
  );

}


function closeImage() {

  document.getElementById(
    "imageModal"
  ).classList.remove(
    "show"
  );

}


/* =========================================================
   ENTER
========================================================= */

document
  .getElementById(
    "input"
  )
  .addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();

      }

    }
  );


/* =========================================================
   AUTO HEIGHT
========================================================= */

document
  .getElementById(
    "input"
  )
  .addEventListener(
    "input",
    function() {

      this.style.height =
        "auto";

      this.style.height =
        Math.min(
          this.scrollHeight,
          120
        ) + "px";

    }
  );


/* =========================================================
   START
========================================================= */

if (!chats.length) {

  createChat();

}

else {

  currentChatId =
    chats[0].id;

  history =
    chats[0].history || [];

}


renderCurrent();

renderChats();
