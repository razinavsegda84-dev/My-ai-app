<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>My AI</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#0b0d10;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,
  "Segoe UI",Arial,sans-serif;
  height:100vh;
  overflow:hidden;
}

button,
input,
textarea{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* HEADER */

.header{
  height:60px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  border-bottom:1px solid #242830;
  background:#111419;
}

.logo{
  font-size:20px;
  font-weight:700;
}

.header-right{
  display:flex;
  gap:8px;
}

.icon-btn{
  width:40px;
  height:40px;
  border-radius:12px;
  background:#1b1f26;
  color:#fff;
  font-size:20px;
}

/* CHAT */

.chat{
  flex:1;
  overflow-y:auto;
  padding:18px 12px 130px;
}

.welcome{
  max-width:700px;
  margin:40px auto;
  text-align:center;
}

.welcome h1{
  font-size:30px;
  margin-bottom:10px;
}

.welcome p{
  color:#9ba1ab;
}

/* MESSAGE */

.message{
  max-width:850px;
  margin:0 auto 16px;
  display:flex;
}

.message.user{
  justify-content:flex-end;
}

.bubble{
  max-width:88%;
  padding:12px 15px;
  border-radius:18px;
  line-height:1.5;
  white-space:pre-wrap;
  word-break:break-word;
}

.user .bubble{
  background:#2563eb;
}

.assistant .bubble{
  background:#171a20;
  border:1px solid #252a32;
}

.message-actions{
  display:flex;
  gap:7px;
  margin-top:7px;
}

.small-btn{
  background:#20242b;
  color:#ddd;
  border-radius:10px;
  padding:7px 10px;
  font-size:13px;
}

/* IMAGE */

.generated-image{
  display:block;
  max-width:100%;
  border-radius:16px;
  margin-top:10px;
}

/* INPUT AREA */

.bottom{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  background:linear-gradient(
    transparent,
    #0b0d10 20%
  );
  padding:20px 10px 10px;
}

.composer{
  max-width:900px;
  margin:auto;
  background:#15181e;
  border:1px solid #292e37;
  border-radius:18px;
  padding:9px;
}

textarea{
  width:100%;
  resize:none;
  min-height:46px;
  max-height:130px;
  background:transparent;
  color:#fff;
  border:0;
  outline:0;
  padding:8px;
}

.tools{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:7px;
  margin-top:5px;
}

.tool-left,
.tool-right{
  display:flex;
  gap:6px;
}

.tool{
  width:40px;
  height:40px;
  border-radius:12px;
  background:#20242b;
  color:#fff;
  font-size:19px;
}

.send{
  background:#2563eb;
}

/* MENU */

.menu{
  position:fixed;
  top:65px;
  right:10px;
  width:230px;
  background:#171a20;
  border:1px solid #2a2f38;
  border-radius:16px;
  padding:8px;
  z-index:100;
  display:none;
  box-shadow:0 15px 40px rgba(0,0,0,.45);
}

.menu.show{
  display:block;
}

.menu-item{
  width:100%;
  padding:12px;
  border-radius:11px;
  background:transparent;
  color:#fff;
  text-align:left;
  margin-bottom:3px;
}

.menu-item:hover{
  background:#222730;
}

/* MODAL */

.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:200;
}

.modal-bg.show{
  display:flex;
}

.modal{
  width:100%;
  max-width:600px;
  background:#15181e;
  border-radius:22px 22px 0 0;
  padding:20px;
  border:1px solid #292e37;
}

.modal h2{
  margin-bottom:18px;
}

.setting{
  padding:13px 0;
  border-bottom:1px solid #282d35;
}

.setting-title{
  font-weight:600;
}

.setting-sub{
  color:#9298a2;
  font-size:13px;
  margin-top:4px;
}

.close{
  width:100%;
  margin-top:18px;
  padding:13px;
  border-radius:13px;
  background:#2563eb;
  color:white;
}

/* IMAGE MODAL */

.prompt-box{
  width:100%;
  background:#0e1014;
  border:1px solid #30353e;
  color:white;
  padding:12px;
  border-radius:12px;
  min-height:100px;
  resize:none;
  outline:none;
}

.generate{
  width:100%;
  padding:13px;
  background:#2563eb;
  color:#fff;
  border-radius:13px;
  margin-top:10px;
}

.video-note{
  color:#999;
  font-size:13px;
  margin-top:10px;
  line-height:1.4;
}

/* STATUS */

.status{
  position:fixed;
  top:64px;
  left:50%;
  transform:translateX(-50%);
  background:#20242b;
  padding:7px 12px;
  border-radius:10px;
  font-size:13px;
  display:none;
  z-index:150;
}

.status.show{
  display:block;
}

</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->

  <header class="header">

    <div class="logo">
      My AI
    </div>

    <div class="header-right">

      <button
        class="icon-btn"
        onclick="newChat()">
        ＋
      </button>

      <button
        class="icon-btn"
        onclick="toggleMenu()">
        ☰
      </button>

    </div>

  </header>


  <!-- MENU -->

  <div
    id="menu"
    class="menu">

    <button
      class="menu-item"
      onclick="openSettings()">
      ⚙️ Баптаулар
    </button>

    <button
      class="menu-item"
      onclick="newChat()">
      🆕 Жаңа чат
    </button>

    <button
      class="menu-item"
      onclick="openImageGenerator()">
      🎨 Сурет жасау
    </button>

    <button
      class="menu-item"
      onclick="openVideoGenerator()">
      🎬 Видео жасау
    </button>

  </div>


  <!-- STATUS -->

  <div
    id="status"
    class="status">
  </div>


  <!-- CHAT -->

  <main
    id="chat"
    class="chat">

    <div
      id="welcome"
      class="welcome">

      <h1>My AI</h1>

      <p>
        Қазақша AI көмекшісі
      </p>

    </div>

  </main>


  <!-- BOTTOM -->

  <div class="bottom">

    <div class="composer">

      <textarea
        id="messageInput"
        placeholder="Хабарлама жазыңыз..."
        rows="1"
        oninput="autoResize(this)">
      </textarea>


      <div class="tools">

        <div class="tool-left">

          <!-- FILE -->

          <button
            class="tool"
            onclick="document.getElementById('fileInput').click()">
            📎
          </button>

          <input
            id="fileInput"
            type="file"
            hidden
            onchange="handleFile(event)">


          <!-- CAMERA -->

          <button
            class="tool"
            onclick="document.getElementById('cameraInput').click()">
            📷
          </button>

          <input
            id="cameraInput"
            type="file"
            accept="image/*"
            capture="environment"
            hidden
            onchange="handleImage(event)">


          <!-- MICROPHONE -->

          <button
            id="micButton"
            class="tool"
            onclick="toggleRecording()">
            🎤
          </button>

        </div>


        <div class="tool-right">

          <button
            class="tool"
            onclick="openImageGenerator()">
            🎨
          </button>

          <button
            class="tool"
            onclick="openVideoGenerator()">
            🎬
          </button>

          <button
            class="tool send"
            onclick="sendMessage()">
            ➤
          </button>

        </div>

      </div>

    </div>

  </div>

</div>


<!-- SETTINGS -->

<div
  id="settingsModal"
  class="modal-bg">

  <div class="modal">

    <h2>⚙️ Баптаулар</h2>

    <div class="setting">

      <div class="setting-title">
        Тіл
      </div>

      <div class="setting-sub">
        Қазақ тілі
      </div>

    </div>

    <div class="setting">

      <div class="setting-title">
        AI моделі
      </div>

      <div class="setting-sub">
        GLM-4.7-Flash
      </div>

    </div>

    <div class="setting">

      <div class="setting-title">
        Дауыс
      </div>

      <div class="setting-sub">
        Қосу/өшіру үшін жауаптағы 🔊 батырмасын пайдаланыңыз.
      </div>

    </div>

    <div class="setting">

      <div class="setting-title">
        Сурет генерациясы
      </div>

      <div class="setting-sub">
        FLUX 1 Schnell
      </div>

    </div>

    <button
      class="close"
      onclick="closeSettings()">
      Жабу
    </button>

  </div>

</div>


<!-- IMAGE GENERATOR -->

<div
  id="imageModal"
  class="modal-bg">

  <div class="modal">

    <h2>🎨 Сурет жасау</h2>

    <textarea
      id="imagePrompt"
      class="prompt-box"
      placeholder="Мысалы: Қазақстанның тауларында тұрған ақ бүркіт">
    </textarea>

    <button
      class="generate"
      onclick="generateImage()">
      🎨 Сурет жасау
    </button>

    <button
      class="close"
      onclick="closeImageGenerator()">
      Жабу
    </button>

  </div>

</div>


<!-- VIDEO GENERATOR -->

<div
  id="videoModal"
  class="modal-bg">

  <div class="modal">

    <h2>🎬 Видео жасау</h2>

    <textarea
      id="videoPrompt"
      class="prompt-box"
      placeholder="Мысалы: Қазақстан тауларында ұшып жүрген ақ бүркіт">
    </textarea>

    <button
      class="generate"
      onclick="generateVideo()">
      🎬 Видео жасау
    </button>

    <div class="video-note">
      Видео генерациясының Worker бөлігі келесі қадамда қосылады.
    </div>

    <button
      class="close"
      onclick="closeVideoGenerator()">
      Жабу
    </button>

  </div>

</div>


<script>

/*
============================================================
 WORKER
============================================================
*/

const WORKER_URL =
"https://my-ai-backend.razinavsegda84.workers.dev";


/*
============================================================
 STATE
============================================================
*/

let chatHistory = [];

let selectedImage = null;

let selectedFileText = "";

let selectedFileName = "";

let mediaRecorder = null;

let audioChunks = [];

let recording = false;


/*
============================================================
 MENU
============================================================
*/

function toggleMenu(){

  document
    .getElementById("menu")
    .classList.toggle("show");

}


/*
============================================================
 SETTINGS
============================================================
*/

function openSettings(){

  document
    .getElementById("menu")
    .classList.remove("show");

  document
    .getElementById("settingsModal")
    .classList.add("show");

}

function closeSettings(){

  document
    .getElementById("settingsModal")
    .classList.remove("show");

}


/*
============================================================
 IMAGE GENERATOR
============================================================
*/

function openImageGenerator(){

  document
    .getElementById("menu")
    .classList.remove("show");

  document
    .getElementById("imageModal")
    .classList.add("show");

}


function closeImageGenerator(){

  document
    .getElementById("imageModal")
    .classList.remove("show");

}


async function generateImage(){

  const prompt =
    document
      .getElementById("imagePrompt")
      .value
      .trim();

  if(!prompt){

    showStatus("Сурет сипаттамасын жазыңыз.");

    return;

  }

  closeImageGenerator();

  addMessage(
    "user",
    "🎨 " + prompt
  );

  showStatus("Сурет жасалуда...");

  try{

    const response =
      await fetch(

        WORKER_URL,

        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              action:
                "generate_image",

              prompt

            })

        }

      );


    const data =
      await response.json();


    if(!response.ok || !data.ok){

      throw new Error(
        data.error ||
        "Сурет жасау қатесі."
      );

    }


    hideStatus();


    const image =
      document.createElement("img");

    image.className =
      "generated-image";

    image.src =
      data.image;

    image.alt =
      prompt;


    addImageMessage(
      image
    );


  }catch(error){

    hideStatus();

    addMessage(

      "assistant",

      "Сурет жасау қатесі: " +
      error.message

    );

  }

}


/*
============================================================
 VIDEO
============================================================
*/

function openVideoGenerator(){

  document
    .getElementById("menu")
    .classList.remove("show");

  document
    .getElementById("videoModal")
    .classList.add("show");

}


function closeVideoGenerator(){

  document
    .getElementById("videoModal")
    .classList.remove("show");

}


async function generateVideo(){

  const prompt =
    document
      .getElementById("videoPrompt")
      .value
      .trim();


  if(!prompt){

    showStatus(
      "Видео сипаттамасын жазыңыз."
    );

    return;

  }


  addMessage(
    "user",
    "🎬 " + prompt
  );


  closeVideoGenerator();


  /*
  ----------------------------------------------------------
  ҚАЗІРГЕ ЖАЛҒАН ENDPOINT ЖІБЕРМЕЙМІЗ.
  Worker-де video action әлі жоқ.
  ----------------------------------------------------------
  */

  addMessage(

    "assistant",

    "🎬 Видео генерациясы интерфейске қосылды.\n\n" +
    "Енді Cloudflare Worker-ге видео генерация моделін қосу керек. " +
    "Оны келесі кодта қосамыз."

  );

}


/*
============================================================
 CHAT
============================================================
*/

async function sendMessage(){

  const input =
    document.getElementById(
      "messageInput"
    );


  const message =
    input.value.trim();


  if(
    !message &&
    !selectedImage &&
    !selectedFileText
  ){

    return;

  }


  addMessage(
    "user",
    message ||
    "Суретті/файлды талда."
  );


  input.value = "";

  autoResize(input);


  showStatus(
    "AI жауап дайындауда..."
  );


  try{

    const response =
      await fetch(

        WORKER_URL,

        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              action:
                "chat",

              message,

              image:
                selectedImage,

              fileText:
                selectedFileText,

              fileName:
                selectedFileName,

              history:
                chatHistory.slice(-20)

            })

        }

      );


    const data =
      await response.json();


    if(
      !response.ok ||
      !data.ok
    ){

      throw new Error(
        data.error ||
        "AI қатесі."
      );

    }


    hideStatus();


    const answer =
      data.answer || "";


    addMessage(
      "assistant",
      answer
    );


    chatHistory.push({

      role:"user",

      content:
        message

    });


    chatHistory.push({

      role:"assistant",

      content:
        answer

    });


    chatHistory =
      chatHistory.slice(-20);


    selectedImage =
      null;

    selectedFileText =
      "";

    selectedFileName =
      "";


  }catch(error){

    hideStatus();


    addMessage(

      "assistant",

      "Қате: " +
      error.message

    );

  }

}


/*
============================================================
 ADD MESSAGE
============================================================
*/

function addMessage(
  role,
  text
){

  const chat =
    document.getElementById(
      "chat"
    );


  const welcome =
    document.getElementById(
      "welcome"
    );


  if(welcome){

    welcome.remove();

  }


  const wrapper =
    document.createElement(
      "div"
    );


  wrapper.className =
    "message " +
    role;


  const inner =
    document.createElement(
      "div"
    );


  const bubble =
    document.createElement(
      "div"
    );


  bubble.className =
    "bubble";


  bubble.textContent =
    text;


  inner.appendChild(
    bubble
  );


  if(role === "assistant"){

    const actions =
      document.createElement(
        "div"
      );


    actions.className =
      "message-actions";


    const speak =
      document.createElement(
        "button"
      );


    speak.className =
      "small-btn";


    speak.textContent =
      "🔊 Тыңдау";


    speak.onclick =
      () => speakText(text);


    actions.appendChild(
      speak
    );


    inner.appendChild(
      actions
    );

  }


  wrapper.appendChild(
    inner
  );


  chat.appendChild(
    wrapper
  );


  chat.scrollTop =
    chat.scrollHeight;

}


/*
============================================================
 IMAGE MESSAGE
============================================================
*/

function addImageMessage(
  image
){

  const chat =
    document.getElementById(
      "chat"
    );


  const wrapper =
    document.createElement(
      "div"
    );


  wrapper.className =
    "message assistant";


  const inner =
    document.createElement(
      "div"
    );


  const bubble =
    document.createElement(
      "div"
    );


  bubble.className =
    "bubble";


  bubble.textContent =
    "🎨 Дайын:";


  bubble.appendChild(
    image
  );


  inner.appendChild(
    bubble
  );


  wrapper.appendChild(
    inner
  );


  chat.appendChild(
    wrapper
  );


  chat.scrollTop =
    chat.scrollHeight;

}


/*
============================================================
 TTS
============================================================
*/

async function speakText(text){

  try{

    const response =
      await fetch(

        WORKER_URL,

        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              action:"tts",

              text

            })

        }

      );


    const contentType =
      response.headers.get(
        "content-type"
      ) || "";


    if(
      contentType.includes(
        "audio"
      )
    ){

      const blob =
        await response.blob();


      const url =
        URL.createObjectURL(
          blob
        );


      const audio =
        new Audio(url);


      audio.play();


      return;

    }


    const data =
      await response.json();


    if(data.audio){

      const audio =
        new Audio(
          data.audio.startsWith("data:")
            ? data.audio
            : "data:audio/mpeg;base64," +
              data.audio
        );


      audio.play();

      return;

    }


    throw new Error(
      data.error ||
      "Дауыс жасау мүмкін болмады."
    );


  }catch(error){

    /*
    ----------------------------------------------------------
    Егер TTS API істемесе,
    браузердің дауысын қолданамыз.
    ----------------------------------------------------------
    */

    if(
      "speechSynthesis"
      in window
    ){

      speechSynthesis.cancel();

      const utterance =
        new SpeechSynthesisUtterance(
          text
        );

      utterance.lang =
        "kk-KZ";

      utterance.rate =
        0.95;

      speechSynthesis.speak(
        utterance
      );

    }else{

      showStatus(
        "Дауыс функциясы қолжетімсіз."
      );

    }

  }

}


/*
============================================================
 IMAGE FILE
============================================================
*/

function handleImage(event){

  const file =
    event.target.files[0];


  if(!file){

    return;

  }


  const reader =
    new FileReader();


  reader.onload =
    () => {

      selectedImage =
        reader.result;

      showStatus(
        "Сурет қосылды."
      );

    };


  reader.readAsDataURL(
    file
  );

}


/*
============================================================
 FILE
============================================================
*/

async function handleFile(event){

  const file =
    event.target.files[0];


  if(!file){

    return;

  }


  selectedFileName =
    file.name;


  try{

    selectedFileText =
      await file.text();


    selectedFileText =
      selectedFileText
        .slice(0,30000);


    showStatus(
      "Файл қосылды: " +
      file.name
    );


  }catch(error){

    showStatus(
      "Файлды оқу мүмкін болмады."
    );

  }

}


/*
============================================================
 MICROPHONE
============================================================
*/

async function toggleRecording(){

  if(recording){

    stopRecording();

    return;

  }


  try{

    const stream =
      await navigator
        .mediaDevices
        .getUserMedia({
          audio:true
        });


    audioChunks = [];


    let mimeType =
      "";


    if(
      MediaRecorder.isTypeSupported(
        "audio/webm"
      )
    ){

      mimeType =
        "audio/webm";

    }else if(
      MediaRecorder.isTypeSupported(
        "audio/mp4"
      )
    ){

      mimeType =
        "audio/mp4";

    }


    mediaRecorder =
      mimeType
        ? new MediaRecorder(
            stream,
            {mimeType}
          )
        : new MediaRecorder(
            stream
          );


    mediaRecorder.ondataavailable =
      event => {

        if(
          event.data.size > 0
        ){

          audioChunks.push(
            event.data
          );

        }

      };


    mediaRecorder.onstop =
      async () => {

        const blob =
          new Blob(
            audioChunks,
            {
              type:
                mediaRecorder.mimeType
            }
          );


        stream
          .getTracks()
          .forEach(
            track =>
              track.stop()
          );


        await sendAudio(
          blob
        );

      };


    mediaRecorder.start();

    recording =
      true;


    document
      .getElementById(
        "micButton"
      )
      .textContent =
      "⏹️";


    showStatus(
      "Тыңдап тұрмын..."
    );


  }catch(error){

    showStatus(
      "Микрофонға рұқсат берілмеді."
    );

  }

}


function stopRecording(){

  if(
    mediaRecorder &&
    recording
  ){

    mediaRecorder.stop();

    recording =
      false;


    document
      .getElementById(
        "micButton"
      )
      .textContent =
      "🎤";

  }

}


/*
============================================================
 AUDIO
============================================================
*/

async function sendAudio(
  blob
){

  showStatus(
    "Дауыс мәтінге айналдырылуда..."
  );


  try{

    const base64 =
      await blobToBase64(
        blob
      );


    const response =
      await fetch(

        WORKER_URL,

        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              action:
                "transcribe",

              audioBase64:
                base64

            })

        }

      );


    const data =
      await response.json();


    if(
      !response.ok ||
      !data.ok
    ){

      throw new Error(
        data.error ||
        "Аудио қатесі."
      );

    }


    hideStatus();


    const input =
      document.getElementById(
        "messageInput"
      );


    input.value =
      data.text || "";


    autoResize(input);


  }catch(error){

    showStatus(
      "Дауыс қатесі: " +
      error.message
    );

  }

}


/*
============================================================
 BASE64
============================================================
*/

function blobToBase64(
  blob
){

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const reader =
        new FileReader();


      reader.onloadend =
        () => {

          const result =
            reader.result;


          resolve(
            String(result)
              .split(",")[1]
          );

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(
        blob
      );

    }
  );

}

/*
============================================================
 AUTO RESIZE
============================================================
*/

function autoResize(
  element
){

  element.style.height =
    "auto";


  element.style.height =
    Math.min(
      element.scrollHeight,
      130
    ) + "px";

}


/*
============================================================
 STATUS
============================================================
*/

function showStatus(
  text
){

  const status =
    document.getElementById(
      "status"
    );


  status.textContent =
    text;


  status.classList.add(
    "show"
  );

}


function hideStatus(){

  document
    .getElementById(
      "status"
    )
    .classList.remove(
      "show"
    );

}


/*
============================================================
 ENTER
============================================================
*/

document
  .getElementById(
    "messageInput"
  )
  .addEventListener(
    "keydown",
    event => {

      if(
        event.key === "Enter" &&
        !event.shiftKey
      ){

        event.preventDefault();

        sendMessage();

      }

    }
  );


/*
============================================================
 CLOSE MENU OUTSIDE
============================================================
*/

document.addEventListener(
  "click",
  event => {

    const menu =
      document.getElementById(
        "menu"
      );


    const button =
      event.target.closest(
        ".icon-btn"
      );


    if(
      !menu.contains(event.target) &&
      !button
    ){

      menu.classList.remove(
        "show"
      );

    }

  }
);
