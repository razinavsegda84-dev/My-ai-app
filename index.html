<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My AI</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#0b0b0f;
  color:#fff;
  font-family:Arial,sans-serif;
  height:100vh;
  overflow:hidden;
  transition:.25s;
}

body.light{
  background:#f5f5f7;
  color:#111;
}

.app{
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* HEADER */

header{
  height:58px;
  display:flex;
  align-items:center;
  padding:0 12px;
  border-bottom:1px solid #292929;
  background:#101014;
  flex-shrink:0;
  z-index:10;
}

body.light header{
  background:#fff;
  border-color:#ddd;
}

.menu-btn{
  width:42px;
  height:42px;
  border:0;
  background:transparent;
  font-size:25px;
  color:#fff;
  cursor:pointer;
}

body.light .menu-btn{
  color:#111;
}

.logo{
  font-size:20px;
  font-weight:bold;
  margin-left:5px;
}

.status{
  margin-left:auto;
  font-size:12px;
  color:#8f8f8f;
}

.status.online{
  color:#54d17a;
}

/* SIDEBAR */

.sidebar{
  position:fixed;
  top:0;
  left:-290px;
  width:280px;
  height:100vh;
  background:#111116;
  border-right:1px solid #29292f;
  z-index:100;
  transition:left .25s ease;
  display:flex;
  flex-direction:column;
  padding:12px;
}

body.light .sidebar{
  background:#fff;
  color:#111;
  border-color:#ddd;
}

.sidebar.open{
  left:0;
}

.sidebar-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:5px;
  margin-bottom:10px;
}

.sidebar-title{
  font-size:20px;
  font-weight:bold;
}

.close-menu{
  background:#25252c;
  border:0;
  color:#fff;
  border-radius:10px;
  width:38px;
  height:38px;
  font-size:20px;
}

.new-chat{
  width:100%;
  padding:12px;
  background:#fff;
  color:#000;
  font-weight:bold;
  border:0;
  border-radius:12px;
  cursor:pointer;
  margin-bottom:8px;
}

.menu-item{
  width:100%;
  text-align:left;
  padding:12px;
  background:transparent;
  color:#fff;
  border:0;
  border-radius:10px;
  cursor:pointer;
  font-size:14px;
  margin-bottom:3px;
}

.menu-item:hover{
  background:#222229;
}

body.light .menu-item{
  color:#111;
}

body.light .menu-item:hover{
  background:#eee;
}

.history-title{
  color:#888;
  font-size:12px;
  padding:8px 5px;
}

.history{
  flex:1;
  overflow-y:auto;
}

.history-item{
  padding:11px;
  border-radius:10px;
  cursor:pointer;
  margin-bottom:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.history-item:hover{
  background:#222229;
}

.clear-history{
  width:100%;
  background:#25252c;
  color:#fff;
  border:0;
  border-radius:10px;
  padding:11px;
  margin-top:10px;
}

/* OVERLAY */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:90;
  display:none;
}

.overlay.show{
  display:block;
}

/* CHAT */

#chat{
  flex:1;
  overflow-y:auto;
  padding:20px 14px 145px;
}

.message{
  max-width:850px;
  margin:0 auto 18px;
  display:flex;
  flex-direction:column;
}

.message.user{
  align-items:flex-end;
}

.message.assistant{
  align-items:flex-start;
}

.bubble{
  max-width:85%;
  padding:12px 15px;
  border-radius:16px;
  line-height:1.5;
  white-space:pre-wrap;
  word-wrap:break-word;
}

.assistant .bubble{
  background:#17171c;
  border:1px solid #29292f;
}

.user .bubble{
  background:#303036;
}

body.light .assistant .bubble{
  background:#fff;
  border-color:#ddd;
}

body.light .user .bubble{
  background:#e2e2e7;
}

.message-actions{
  display:flex;
  gap:6px;
  margin-top:7px;
}

.message-actions button{
  background:#202027;
  border:1px solid #303038;
  color:#bbb;
  border-radius:8px;
  padding:6px 9px;
  font-size:12px;
}

.message-actions button:hover{
  background:#303038;
  color:#fff;
}

/* FILE */

.file-card{
  max-width:85%;
  background:#17171c;
  border:1px solid #303038;
  border-radius:14px;
  padding:12px;
  display:flex;
  align-items:center;
  gap:10px;
}

.file-icon{
  font-size:30px;
}

.file-info{
  min-width:0;
}

.file-name{
  font-size:14px;
  font-weight:bold;
  word-break:break-word;
}

.file-type{
  color:#888;
  font-size:12px;
  margin-top:3px;
}

/* IMAGE */

.generated-image{
  max-width:100%;
  border-radius:14px;
  display:block;
}

.preview-image{
  max-width:100px;
  max-height:100px;
  border-radius:10px;
}

/* COMPOSER */

.composer{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:linear-gradient(transparent,#0b0b0f 22%);
  padding:35px 12px 12px;
  z-index:20;
}

body.light .composer{
  background:linear-gradient(transparent,#f5f5f7 22%);
}

.composer-inner{
  max-width:850px;
  margin:auto;
  background:#15151a;
  border:1px solid #303038;
  border-radius:18px;
  padding:8px;
}

body.light .composer-inner{
  background:#fff;
  border-color:#ddd;
}

textarea{
  width:100%;
  resize:none;
  min-height:48px;
  max-height:150px;
  background:transparent;
  border:0;
  outline:0;
  color:white;
  font-size:16px;
  padding:10px;
  font-family:inherit;
}

body.light textarea{
  color:#111;
}

.toolbar{
  display:flex;
  align-items:center;
  gap:7px;
  padding:5px;
}

button{
  border:0;
  cursor:pointer;
  color:white;
  background:#27272e;
  border-radius:10px;
  padding:9px 12px;
  font-size:14px;
}

button:hover{
  background:#35353e;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.send{
  margin-left:auto;
  background:#fff;
  color:#000;
  font-weight:bold;
}

input[type=file]{
  display:none;
}

.preview{
  display:none;
  padding:8px;
  border-bottom:1px solid #29292f;
}

/* WELCOME */

.welcome{
  max-width:850px;
  margin:80px auto;
  text-align:center;
  color:#888;
}

.welcome h2{
  color:#fff;
}

body.light .welcome h2{
  color:#111;
}

/* SETTINGS */

.settings-panel{
  position:fixed;
  inset:0;
  background:#0b0b0f;
  z-index:200;
  display:none;
  flex-direction:column;
}

.settings-panel.open{
  display:flex;
}

body.light .settings-panel{
  background:#f5f5f7;
  color:#111;
}

.settings-header{
  height:58px;
  display:flex;
  align-items:center;
  padding:0 15px;
  border-bottom:1px solid #292929;
}

body.light .settings-header{
  border-color:#ddd;
}

.settings-header button{
  margin-right:10px;
}

.settings-content{
  width:100%;
  max-width:700px;
  margin:auto;
  padding:20px;
}

.settings-title{
  font-size:24px;
  font-weight:bold;
  margin-bottom:25px;
}

.setting-row{
  background:#17171c;
  border:1px solid #29292f;
  border-radius:14px;
  padding:15px;
  margin-bottom:12px;
}

body.light .setting-row{
  background:#fff;
  border-color:#ddd;
}

.setting-name{
  font-weight:bold;
  margin-bottom:5px;
}

.setting-description{
  font-size:12px;
  color:#888;
  margin-bottom:12px;
}

.setting-select{
  width:100%;
  padding:10px;
  border-radius:9px;
  background:#27272e;
  color:#fff;
  border:0;
}

body.light .setting-select{
  background:#eee;
  color:#111;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:300;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.open{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:500px;
  background:#17171c;
  border:1px solid #303038;
  border-radius:18px;
  padding:20px;
}

body.light .modal-box{
  background:#fff;
  color:#111;
  border-color:#ddd;
}

.modal-title{
  font-size:20px;
  font-weight:bold;
  margin-bottom:12px;
}

.modal-text{
  color:#aaa;
  line-height:1.5;
}

body.light .modal-text{
  color:#555;
}

.modal-close{
  margin-top:18px;
  width:100%;
}

/* MOBILE */

@media(max-width:600px){

  .bubble,
  .file-card{
    max-width:92%;
  }

  #chat{
    padding-left:8px;
    padding-right:8px;
  }

  textarea{
    font-size:16px;
  }

  .sidebar{
    width:285px;
  }

}

</style>
</head>

<body>

<div class="app">

<!-- SIDE MENU -->

<aside id="sidebar" class="sidebar">

  <div class="sidebar-top">

    <div class="sidebar-title">
      My AI
    </div>

    <button
      class="close-menu"
      onclick="closeSidebar()"
    >×</button>

  </div>

  <button
    class="new-chat"
    onclick="newChat()"
  >
    ＋ Жаңа чат
  </button>

  <button
    class="menu-item"
    onclick="showImages()"
  >
    🖼️ Суреттер
  </button>

  <button
    class="menu-item"
    onclick="showDocuments()"
  >
    📄 Құжаттар
  </button>

  <button
    class="menu-item"
    onclick="openSettings()"
  >
    ⚙️ Баптаулар
  </button>

  <button
    class="menu-item"
    onclick="showAbout()"
  >
    ℹ️ My AI туралы
  </button>

  <div class="history-title">
    Чат тарихы
  </div>

  <div
    id="historyList"
    class="history"
  ></div>

  <button
    class="clear-history"
    onclick="clearHistory()"
  >
    🗑️ Тарихты тазалау
  </button>

</aside>

<div
  id="overlay"
  class="overlay"
  onclick="closeSidebar()"
></div>


<!-- HEADER -->

<header>

  <button
    class="menu-btn"
    onclick="openSidebar()"
  >
    ☰
  </button>

  <div class="logo">
    My AI
  </div>

  <div
    id="status"
    class="status"
  >
    Қосылуда...
  </div>

</header>


<!-- CHAT -->

<main id="chat">

  <div
    id="welcome"
    class="welcome"
  >

    <h2>My AI</h2>

    <div>
      Сұрағыңызды жазыңыз
    </div>

  </div>

</main>


<!-- COMPOSER -->

<div class="composer">

  <div class="composer-inner">

    <div
      id="preview"
      class="preview"
    ></div>

    <textarea
      id="message"
      placeholder="My AI-ға сұрақ қойыңыз..."
      autocomplete="off"
    ></textarea>

    <div class="toolbar">

      <button
        type="button"
        onclick="document.getElementById('imageInput').click()"
      >
        📷
      </button>

      <input
        id="imageInput"
        type="file"
        accept="image/*"
      >

      <button
        type="button"
        onclick="document.getElementById('fileInput').click()"
      >
        📎
      </button>

      <input
        id="fileInput"
        type="file"
        accept=".txt,.md,.json,.csv,.html,.js,.css,.xml,.pdf"
      >

      <button
        type="button"
        onclick="generateImage()"
      >
        🖼️
      </button>

      <button
        type="button"
        class="send"
        id="sendButton"
        onclick="sendMessage()"
      >
        ➤
      </button>

    </div>

  </div>

</div>

</div>


<!-- SETTINGS -->

<div
  id="settingsPanel"
  class="settings-panel"
>

  <div class="settings-header">

    <button
      onclick="closeSettings()"
    >
      ←
    </button>

    <strong>
      ⚙️ Баптаулар
    </strong>

  </div>

  <div class="settings-content">

    <div class="settings-title">
      My AI баптаулары
    </div>

    <div class="setting-row">

      <div class="setting-name">
        🎨 Тақырып
      </div>

      <div class="setting-description">
        Қолданбаның сыртқы көрінісін таңдаңыз.
      </div>

      <select
        id="themeSelect"
        class="setting-select"
        onchange="changeTheme(this.value)"
      >

        <option value="dark">
          Қараңғы
        </option>

        <option value="light">
          Ашық
        </option>

      </select>

    </div>

    <div class="setting-row">

      <div class="setting-name">
        🌐 Тіл
      </div>

      <div class="setting-description">
        Қолданба мәзірінің тілін таңдаңыз.
      </div>

      <select
        id="languageSelect"
        class="setting-select"
        onchange="changeLanguage(this.value)"
      >

        <option value="kk">
          Қазақша
        </option>

        <option value="ru">
          Русский
        </option>

        <option value="en">
          English
        </option>

      </select>

    </div>

  </div>

</div>


<!-- MODAL -->

<div
  id="modal"
  class="modal"
>

  <div class="modal-box">

    <div
      id="modalTitle"
      class="modal-title"
    ></div>

    <div
      id="modalText"
      class="modal-text"
    ></div>

    <button
      class="modal-close"
      onclick="closeModal()"
    >
      Жабу
    </button>

  </div>

</div>


<script>

const API_URL =
  "https://my-ai-backend.razinavsegda84.workers.dev";

const chatElement =
  document.getElementById("chat");

const messageElement =
  document.getElementById("message");

const sendButton =
  document.getElementById("sendButton");

const statusElement =
  document.getElementById("status");

const imageInput =
  document.getElementById("imageInput");

const fileInput =
  document.getElementById("fileInput");

const previewElement =
  document.getElementById("preview");

const sidebar =
  document.getElementById("sidebar");

const overlay =
  document.getElementById("overlay");

const historyList =
  document.getElementById("historyList");

const settingsPanel =
  document.getElementById("settingsPanel");

const modal =
  document.getElementById("modal");

const modalTitle =
  document.getElementById("modalTitle");

const modalText =
  document.getElementById("modalText");

let selectedImages = [];

let selectedFileText = "";

let selectedFile = null;

let history = [];

let chatSessions =
  JSON.parse(
    localStorage.getItem(
      "myAI_chat_sessions"
    ) || "[]"
  );


// =====================================================
// START
// =====================================================

window.addEventListener(
  "load",
  async () => {

    loadSettings();

    renderHistory();

    await checkBackend();

    messageElement.focus();

  }
);


// =====================================================
// SIDEBAR
// =====================================================

function openSidebar(){

  sidebar.classList.add("open");

  overlay.classList.add("show");

}

function closeSidebar(){

  sidebar.classList.remove("open");

  overlay.classList.remove("show");

}


// =====================================================
// NEW CHAT
// =====================================================

function newChat(){

  saveHistoryLocally();

  history = [];

  selectedImages = [];

  selectedFileText = "";

  selectedFile = null;

  chatElement.innerHTML = `
    <div
      id="welcome"
      class="welcome"
    >
      <h2>My AI</h2>
      <div>Сұрағыңызды жазыңыз</div>
    </div>
  `;

  messageElement.value = "";

  previewElement.style.display =
    "none";

  previewElement.innerHTML = "";

  closeSidebar();

  messageElement.focus();

}


// =====================================================
// HISTORY
// =====================================================

function renderHistory(){

  historyList.innerHTML = "";

  if(!chatSessions.length){

    historyList.innerHTML =
      `<div style="color:#666;padding:10px">
        Әзірге чат тарихы жоқ.
      </div>`;

    return;

  }

  chatSessions.forEach(
    session => {

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "history-item";

      item.textContent =
        session.title;

      item.onclick =
        () => loadChat(
          session.id
        );

      historyList.appendChild(
        item
      );

    }
  );

}


// =====================================================
// LOAD CHAT
// =====================================================

function loadChat(id){

  const session =
    chatSessions.find(
      x => x.id === id
    );

  if(!session){
    return;
  }

  history =
    [...session.messages];

  chatElement.innerHTML = "";

  history.forEach(
    item => {

      addMessage(
        item.role,
        item.content,
        false
      );

    }
  );

  closeSidebar();

}


// =====================================================
// CLEAR HISTORY
// =====================================================

function clearHistory(){

  if(
    !confirm(
      "Барлық чат тарихын өшіру керек пе?"
    )
  ){

    return;

  }

  chatSessions = [];

  localStorage.removeItem(
    "myAI_chat_sessions"
  );

  renderHistory();

}


// =====================================================
// SAVE HISTORY
// =====================================================

function saveHistoryLocally(){

  if(!history.length){
    return;
  }

  const first =
    history.find(
      x => x.role === "user"
    );

  if(!first){
    return;
  }

  const title =
    first.content.slice(
      0,
      60
    );

  const existing =
    chatSessions.find(
      x => x.active === true
    );

  if(existing){

    existing.messages =
      [...history];

    existing.title =
      title;

  }else{

    chatSessions.forEach(
      x => x.active = false
    );

    chatSessions.unshift({

      id:Date.now(),

      title,

      active:true,

      messages:[
        ...history
      ]

    });

  }

  chatSessions =
    chatSessions.slice(
      0,
      30
    );

  localStorage.setItem(
    "myAI_chat_sessions",
    JSON.stringify(
      chatSessions
    )
  );

  renderHistory();

}


// =====================================================
// BACKEND
// =====================================================

async function checkBackend(){

  try{

    const response =
      await fetch(
        API_URL
      );

    const data =
      await response.json();

    if(data && data.ok){

      statusElement.textContent =
        "Онлайн";

      statusElement.classList.add(
        "online"
      );

    }else{

      statusElement.textContent =
        "Backend қатесі";

    }

  }catch(error){

    console.error(error);

    statusElement.textContent =
      "Backend қосылмады";

  }

}


// =====================================================
// ENTER
// =====================================================

messageElement.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


// =====================================================
// IMAGE SELECT
// =====================================================

imageInput.addEventListener(
  "change",
  function(){

    const file =
      this.files[0];

    if(!file){
      return;
    }

    const reader =
      new FileReader();

    reader.onload =
      function(event){

        selectedImages =
          [
            event.target.result
          ];

        previewElement.style.display =
          "block";

        previewElement.innerHTML = `
          <img
            class="preview-image"
            src="${event.target.result}"
          >
        `;

      };

    reader.readAsDataURL(file);

  }
);


// =====================================================
// FILE SELECT
// =====================================================

fileInput.addEventListener(
  "change",
  async function(){

    const file =
      this.files[0];

    if(!file){
      return;
    }

    selectedFile = file;

    previewElement.style.display =
      "block";

    previewElement.innerHTML = `
      <div class="file-card">

        <div class="file-icon">
          📄
        </div>

        <div class="file-info">

          <div class="file-name">
            ${escapeHtml(file.name)}
          </div>

          <div class="file-type">
            ${escapeHtml(
              file.type ||
              "PDF / файл"
            )}
          </div>

        </div>

      </div>
    `;

    if(
      file.type === "text/plain" ||
      file.name.endsWith(".txt") ||
      file.name.endsWith(".md") ||
      file.name.endsWith(".json") ||
      file.name.endsWith(".csv") ||
      file.name.endsWith(".js") ||
      file.name.endsWith(".css") ||
      file.name.endsWith(".html") ||
      file.name.endsWith(".xml")
    ){

      try{

        selectedFileText =
          await file.text();

      }catch(error){

        selectedFileText = "";

        console.error(error);

      }

    }else{

      selectedFileText = "";

    }

  }
);


// =====================================================
// SEND
// =====================================================

async function sendMessage(){

  const message =
    messageElement.value.trim();

  if(
    !message &&
    selectedImages.length === 0 &&
    !selectedFile
  ){

    return;

  }

  setLoading(true);

  if(message){

    addMessage(
      "user",
      message
    );

  }

  const currentImages =
    [...selectedImages];

  const currentFileText =
    selectedFileText;

  const currentFile =
    selectedFile;

  messageElement.value = "";

  selectedImages = [];

  selectedFileText = "";

  selectedFile = null;

  previewElement.style.display =
    "none";

  previewElement.innerHTML = "";

  try{

    const response =
      await fetch(
        API_URL,
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              action:"chat",

              message:
                message ||
                (
                  currentFile
                    ? `Файлды талдаңыз: ${currentFile.name}`
                    : "Суретті талда."
                ),

              history:
                history.slice(-20),

              images:
                currentImages,

              fileText:
                currentFileText,

              fileName:
                currentFile
                  ? currentFile.name
                  : "",

              mimeType:
                currentFile
                  ? currentFile.type
                  : ""

            })

        }
      );

    const data =
      await response.json();

    if(
      !response.ok ||
      !data.ok
    ){

      throw new Error(
        data.error ||
        `HTTP ${response.status}`
      );

    }

    const answer =
      data.answer ||
      "AI жауап бере алмады.";

    addMessage(
      "assistant",
      answer
    );

    history.push({

      role:"user",

      content:
        message ||
        (
          currentFile
            ? `Файл: ${currentFile.name}`
            : "Суретті талдау"
        )

    });

    history.push({

      role:"assistant",

      content:answer

    });

    history =
      history.slice(-20);

    saveHistoryLocally();

  }catch(error){

    console.error(error);

    addMessage(
      "assistant",
      "Қате: " +
      error.message
    );

  }finally{

    setLoading(false);

  }

}


// =====================================================
// IMAGE GENERATION
// =====================================================

async function generateImage(){

  const prompt =
    messageElement.value.trim();

  if(!prompt){

    addMessage(
      "assistant",
      "Сурет жасау үшін алдымен сипаттама жазыңыз."
    );

    return;

  }

  setLoading(true);

  addMessage(
    "user",
    "🖼️ " + prompt
  );

  messageElement.value = "";

  try{

    const response =
      await fetch(
        API_URL,
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              action:"image",

              prompt,

              width:1024,

              height:1024

            })

        }
      );

    const data =
      await response.json();

    if(
      !response.ok ||
      !data.ok
    ){

      throw new Error(
        data.error ||
        `HTTP ${response.status}`
      );

    }

    if(!data.image){

      throw new Error(
        "Сурет қайтарылмады."
      );

    }

    addImageMessage(
      data.image
    );

  }catch(error){

    console.error(error);

    addMessage(
      "assistant",
      "Сурет жасау қатесі: " +
      error.message
    );

  }finally{

    setLoading(false);

  }

}


// =====================================================
// ADD MESSAGE
// =====================================================

function addMessage(
  role,
  text,
  actions = true
){

  const wrapper =
    document.createElement(
      "div"
    );

  wrapper.className =
    `message ${role}`;

  const bubble =
    document.createElement(
      "div"
    );

  bubble.className =
    "bubble";

  bubble.textContent =
    text;

  wrapper.appendChild(
    bubble
  );

  if(
    role === "assistant" &&
    actions
  ){

    const actionBar =
      document.createElement(
        "div"
      );

    actionBar.className =
      "message-actions";

    const copyButton =
      document.createElement(
        "button"
      );

    copyButton.textContent =
      "📋 Көшіру";

    copyButton.onclick =
      async () => {

        try{

          await navigator.clipboard.writeText(
            text
          );

          copyButton.textContent =
            "✓ Көшірілді";

          setTimeout(
            () => {

              copyButton.textContent =
                "📋 Көшіру";

            },
            1500
          );

        }catch{

          alert(
            "Көшіру мүмкін болмады."
          );

        }

      };

    const retryButton =
      document.createElement(
        "button"
      );

    retryButton.textContent =
      "🔄 Қайта жауап";

    retryButton.onclick =
      () => retryLast();

    actionBar.appendChild(
      copyButton
    );

    actionBar.appendChild(
      retryButton
    );

    wrapper.appendChild(
      actionBar
    );

  }

  chatElement.appendChild(
    wrapper
  );

  scrollChat();

}


// =====================================================
// RETRY
// =====================================================

async function retryLast(){

  let lastUser = null;

  for(
    let i =
      history.length - 1;
    i >= 0;
    i--
  ){

    if(
      history[i].role === "user"
    ){

      lastUser =
        history[i].content;

      break;

    }

  }

  if(!lastUser){
    return;
  }

  messageElement.value =
    lastUser;

  await sendMessage();

}


// =====================================================
// IMAGE MESSAGE
// =====================================================

function addImageMessage(
  image
){

  const wrapper =
    document.createElement(
      "div"
    );

  wrapper.className =
    "message assistant";

  const bubble =
    document.createElement(
      "div"
    );

  bubble.className =
    "bubble";

  const img =
    document.createElement(
      "img"
    );

  img.className =
    "generated-image";

  img.src =
    image;

  img.alt =
    "Generated image";

  bubble.appendChild(
    img
  );

  wrapper.appendChild(
    bubble
  );

  chatElement.appendChild(
    wrapper
  );

  scrollChat();

}

function changeTheme(
  theme
){

  if(theme === "light"){

    document.body.classList.add(
      "light"
    );

  }else{

    document.body.classList.remove(
      "light"
    );

  }

  localStorage.setItem(
    "myAI_theme",
    theme
  );

}

  const theme =
    localStorage.getItem(
      "myAI_theme"
    ) || "dark";

  changeTheme(
    theme
  );

  document.getElementById(
    "themeSelect"
  ).value =
    theme;

  const language =
    localStorage.getItem(
      "myAI_language"
    ) || "kk";

    "languageSelect"
  ).value =
    language;

}

  language
){

  localStorage.setItem(
    "myAI_language",
    language
  );

    messageElement.placeholder =
      "Задайте вопрос My AI...";

      "Ask My AI a question...";

    messageElement.placeholder =
      "My AI-ға сұрақ қойыңыз...";

  }

}

// =====================================================
// SCROLL
// =====================================================

function scrollChat(){

  setTimeout(
    () => {

      chatElement.scrollTop =
        chatElement.scrollHeight;

    },
    50
  );

}


// =====================================================
// ESCAPE
// =====================================================

function escapeHtml(
  text
){

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}
