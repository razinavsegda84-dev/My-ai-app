<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My AI</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#0b0b0f;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

button{
  font-family:inherit;
}

/* =========================
   APP
========================= */

.app{
  width:100%;
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* =========================
   HEADER
========================= */

header{
  height:58px;
  min-height:58px;
  width:100%;
  display:flex;
  align-items:center;
  padding:0 12px;
  background:#101014;
  border-bottom:1px solid #29292f;
  position:relative;
  z-index:20;
}

.menu-button{
  width:42px;
  height:42px;
  padding:0;
  margin:0;
  border:0;
  border-radius:10px;
  background:transparent;
  color:#fff;
  font-size:25px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.menu-button:active{
  background:#25252c;
}

.logo{
  margin-left:6px;
  font-size:20px;
  font-weight:bold;
}

.status{
  margin-left:auto;
  font-size:12px;
  color:#999;
}

.status.online{
  color:#54d17a;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
  position:fixed;
  top:0;
  left:0;

  width:300px;
  max-width:88vw;
  height:100vh;

  background:#111116;
  border-right:1px solid #303038;

  transform:translateX(-100%);
  transition:transform .25s ease;

  z-index:1000;

  display:flex;
  flex-direction:column;

  padding:12px;
}

.sidebar.open{
  transform:translateX(0);
}

/* sidebar header */

.sidebar-header{
  width:100%;
  height:48px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-bottom:10px;
}

.sidebar-logo{
  font-size:20px;
  font-weight:bold;
}

.close-button{
  width:40px;
  height:40px;

  border:0;
  border-radius:10px;

  background:#25252c;
  color:#fff;

  font-size:22px;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;
}

.close-button:active{
  background:#35353e;
}

/* =========================
   NEW CHAT
========================= */

.new-chat-button{
  width:100%;
  min-height:46px;

  border:0;
  border-radius:12px;

  background:#fff;
  color:#000;

  font-size:15px;
  font-weight:bold;

  cursor:pointer;

  margin-bottom:10px;
}

.new-chat-button:active{
  background:#ddd;
}

/* =========================
   MENU ITEMS
========================= */

.menu-section{
  width:100%;
  margin-bottom:6px;
}

.menu-item{
  width:100%;
  min-height:48px;

  display:flex;
  align-items:center;

  padding:0 12px;
  margin:3px 0;

  border:0;
  border-radius:11px;

  background:transparent;
  color:#fff;

  text-align:left;
  font-size:15px;

  cursor:pointer;
}

.menu-item:hover{
  background:#222229;
}

.menu-item:active{
  background:#303038;
}

.menu-icon{
  width:30px;
  min-width:30px;
  font-size:19px;
  text-align:center;
  margin-right:8px;
}

.menu-text{
  flex:1;
}

/* =========================
   HISTORY
========================= */

.history-title{
  color:#888;
  font-size:12px;
  padding:12px 8px 7px;
}

.history{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding-bottom:8px;
}

.history-empty{
  color:#666;
  font-size:13px;
  padding:12px 8px;
}

.history-item{
  width:100%;
  padding:11px;

  margin-bottom:4px;

  border-radius:10px;

  background:transparent;
  color:#ddd;

  cursor:pointer;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.history-item:hover{
  background:#222229;
}

/* =========================
   DELETE HISTORY
========================= */

.delete-history-button{
  width:100%;
  min-height:45px;

  flex-shrink:0;

  border:1px solid #3a3030;
  border-radius:11px;

  background:#21181a;
  color:#ff8a8a;

  font-size:14px;

  cursor:pointer;

  margin-top:8px;
}

.delete-history-button:hover{
  background:#302022;
}

/* =========================
   OVERLAY
========================= */

.overlay{
  position:fixed;
  inset:0;

  background:rgba(0,0,0,.60);

  z-index:900;

  opacity:0;
  visibility:hidden;

  transition:
    opacity .2s ease,
    visibility .2s ease;
}

.overlay.show{
  opacity:1;
  visibility:visible;
}

/* =========================
   CHAT
========================= */

#chat{
  flex:1;
  min-height:0;

  overflow-y:auto;

  padding:
    20px
    14px
    150px;
}

.message{
  width:100%;
  max-width:850px;

  margin:
    0 auto 18px;

  display:flex;
  flex-direction:column;
}

.message.user{
  align-items:flex-end;
}

.message.assistant{
  align-items:flex-start;
}

.bubble{
  max-width:85%;

  padding:12px 15px;

  border-radius:16px;

  line-height:1.5;

  white-space:pre-wrap;
  word-break:break-word;
}

.user .bubble{
  background:#303036;
}

.assistant .bubble{
  background:#17171c;
  border:1px solid #29292f;
}

/* =========================
   MESSAGE BUTTONS
========================= */

.message-actions{
  display:flex;
  gap:6px;
  margin-top:7px;
}

.message-actions button{
  border:1px solid #303038;
  border-radius:8px;

  background:#202027;
  color:#bbb;

  padding:6px 9px;

  font-size:12px;

  cursor:pointer;
}

.message-actions button:hover{
  background:#303038;
  color:#fff;
}

/* =========================
   IMAGES
========================= */

.generated-image{
  display:block;

  max-width:100%;

  border-radius:14px;

  margin-top:2px;
}

.preview-image{
  max-width:100px;
  max-height:100px;

  border-radius:10px;
}

/* =========================
   WELCOME
========================= */

.welcome{
  max-width:850px;

  margin:
    80px auto;

  text-align:center;

  color:#888;
}

.welcome h2{
  color:#fff;
  margin-bottom:8px;
}

/* =========================
   COMPOSER
========================= */

.composer{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  z-index:50;

  padding:
    35px
    12px
    12px;

  background:
    linear-gradient(
      transparent,
      #0b0b0f 25%
    );
}

.composer-inner{
  max-width:850px;

  margin:auto;

  background:#15151a;

  border:1px solid #303038;

  border-radius:18px;

  padding:8px;
}

textarea{
  width:100%;

  min-height:48px;
  max-height:150px;

  resize:none;

  border:0;
  outline:0;

  background:transparent;

  color:#fff;

  font-size:16px;

  padding:10px;

  font-family:inherit;
}

.toolbar{
  display:flex;
  align-items:center;

  gap:7px;

  padding:5px;
}

.tool-button{
  width:42px;
  height:40px;

  border:0;
  border-radius:10px;

  background:#27272e;
  color:#fff;

  font-size:18px;

  cursor:pointer;
}

.tool-button:hover{
  background:#35353e;
}

.send-button{
  margin-left:auto;

  width:44px;
  height:40px;

  border:0;
  border-radius:10px;

  background:#fff;
  color:#000;

  font-size:18px;
  font-weight:bold;

  cursor:pointer;
}

.send-button:hover{
  background:#ddd;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

input[type=file]{
  display:none;
}

/* =========================
   PREVIEW
========================= */

.preview{
  display:none;

  padding:8px;

  border-bottom:1px solid #29292f;
}

.file-preview{
  display:flex;
  align-items:center;
  gap:10px;

  padding:8px;

  background:#202027;

  border-radius:10px;
}

.file-preview-icon{
  font-size:28px;
}

.file-preview-name{
  font-size:13px;
  color:#ddd;

  word-break:break-word;
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;

  inset:0;

  z-index:2000;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;

  background:rgba(0,0,0,.70);

  opacity:0;
  visibility:hidden;

  transition:
    opacity .2s ease,
    visibility .2s ease;
}

.modal.show{
  opacity:1;
  visibility:visible;
}

.modal-box{
  width:100%;
  max-width:420px;

  background:#15151a;

  border:1px solid #303038;

  border-radius:18px;

  padding:20px;

  box-shadow:
    0 20px 60px rgba(0,0,0,.5);
}

.modal-header{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-bottom:16px;
}

.modal-title{
  font-size:19px;
  font-weight:bold;
}

.modal-close{
  width:38px;
  height:38px;

  border:0;
  border-radius:9px;

  background:#27272e;
  color:#fff;

  font-size:20px;

  cursor:pointer;
}

.modal-content{
  color:#aaa;

  font-size:14px;

  line-height:1.6;
}

.setting-row{
  width:100%;

  padding:13px;

  margin-bottom:8px;

  border-radius:11px;

  background:#202027;

  display:flex;
  align-items:center;
  justify-content:space-between;

  color:#fff;
}

.setting-row button{
  border:0;
  border-radius:8px;

  background:#303038;
  color:#fff;

  padding:7px 10px;

  cursor:pointer;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  #chat{
    padding-left:8px;
    padding-right:8px;
  }

  .bubble{
    max-width:92%;
  }

  .sidebar{
    width:290px;
  }

  .composer{
    padding-left:8px;
    padding-right:8px;
  }

  textarea{
    font-size:16px;
  }

}

</style>
</head>


<body>

<div class="app">

<!-- =========================
     SIDEBAR
========================= -->

<aside
  id="sidebar"
  class="sidebar"
>

  <div class="sidebar-header">

    <div class="sidebar-logo">
      My AI
    </div>

    <button
      id="closeSidebarButton"
      class="close-button"
      type="button"
    >
      ×
    </button>

  </div>


  <button
    id="newChatButton"
    class="new-chat-button"
    type="button"
  >
    ＋ Жаңа чат
  </button>


  <div class="menu-section">

    <button
      id="imagesMenuButton"
      class="menu-item"
      type="button"
    >

      <span class="menu-icon">
        🖼️
      </span>

      <span class="menu-text">
        Суреттер
      </span>

    </button>


    <button
      id="documentsMenuButton"
      class="menu-item"
      type="button"
    >

      <span class="menu-icon">
        📄
      </span>

      <span class="menu-text">
        Құжаттар
      </span>

    </button>


    <button
      id="settingsMenuButton"
      class="menu-item"
      type="button"
    >

      <span class="menu-icon">
        ⚙️
      </span>

      <span class="menu-text">
        Баптаулар
      </span>

    </button>


    <button
      id="aboutMenuButton"
      class="menu-item"
      type="button"
    >

      <span class="menu-icon">
        ℹ️
      </span>

      <span class="menu-text">
        My AI туралы
      </span>

    </button>

  </div>


  <div class="history-title">
    Чат тарихы
  </div>


  <div
    id="historyList"
    class="history"
  ></div>


  <button
    id="deleteHistoryButton"
    class="delete-history-button"
    type="button"
  >
    🗑️ Барлық чат тарихын өшіру
  </button>

</aside>


<!-- =========================
     OVERLAY
========================= -->

<div
  id="overlay"
  class="overlay"
></div>


<!-- =========================
     HEADER
========================= -->

<header>

  <button
    id="menuButton"
    class="menu-button"
    type="button"
  >
    ☰
  </button>

  <div class="logo">
    My AI
  </div>

  <div
    id="status"
    class="status"
  >
    Қосылуда...
  </div>

</header>


<!-- =========================
     CHAT
========================= -->

<main id="chat">

  <div
    id="welcome"
    class="welcome"
  >

    <h2>
      My AI
    </h2>

    <div>
      Сұрағыңызды жазыңыз
    </div>

  </div>

</main>


<!-- =========================
     COMPOSER
========================= -->

<div class="composer">

  <div class="composer-inner">

    <div
      id="preview"
      class="preview"
    ></div>


    <textarea
      id="message"
      placeholder="My AI-ға сұрақ қойыңыз..."
      autocomplete="off"
    ></textarea>


    <div class="toolbar">


      <button
        id="imageSelectButton"
        class="tool-button"
        type="button"
      >
        📷
      </button>


      <input
        id="imageInput"
        type="file"
        accept="image/*"
      >


      <button
        id="fileSelectButton"
        class="tool-button"
        type="button"
      >
        📎
      </button>


      <input
        id="fileInput"
        type="file"
        accept=".txt,.md,.json,.csv,.html,.js,.css,.xml,.pdf"
      >


      <button
        id="generateImageButton"
        class="tool-button"
        type="button"
      >
        🖼️
      </button>


      <button
        id="sendButton"
        class="send-button"
        type="button"
      >
        ➤
      </button>

    </div>

  </div>

</div>

</div>


<!-- =========================
     SETTINGS MODAL
========================= -->

<div
  id="settingsModal"
  class="modal"
>

  <div class="modal-box">

    <div class="modal-header">

      <div class="modal-title">
        ⚙️ Баптаулар
      </div>

      <button
        id="closeSettingsButton"
        class="modal-close"
        type="button"
      >
        ×
      </button>

    </div>


    <div class="modal-content">

      <div class="setting-row">

        <span>
          Тіл
        </span>

        <button
          type="button"
          id="languageButton"
        >
          Қазақша
        </button>

      </div>


      <div class="setting-row">

        <span>
          Тақырып
        </span>

        <button
          type="button"
          id="themeButton"
        >
          Қараңғы
        </button>

      </div>


      <div class="setting-row">

        <span>
          Дауыс
        </span>

        <button
          type="button"
          id="voiceButton"
        >
          Әзірге өшірулі
        </button>

      </div>

    </div>

  </div>

</div>


<!-- =========================
     ABOUT MODAL
========================= -->

<div
  id="aboutModal"
  class="modal"
>

  <div class="modal-box">

    <div class="modal-header">

      <div class="modal-title">
        ℹ️ My AI туралы
      </div>

      <button
        id="closeAboutButton"
        class="modal-close"
        type="button"
      >
        ×
      </button>

    </div>


    <div class="modal-content">

      <p>
        <strong>My AI</strong>
      </p>

      <p>
        Сұрақтарға жауап беруге,
        суреттерді талдауға,
        құжаттарды өңдеуге және
        басқа AI функцияларымен
        жұмыс істеуге арналған жеке
        AI қосымша.
      </p>

      <p>
        Нұсқа: 1.0
      </p>

    </div>

  </div>

</div>


<script>

/* =====================================================
   API
===================================================== */

const API_URL =
  "https://my-ai-backend.razinavsegda84.workers.dev";


/* =====================================================
   ELEMENTS
===================================================== */

const sidebar =
  document.getElementById("sidebar");

const overlay =
  document.getElementById("overlay");

const menuButton =
  document.getElementById("menuButton");

const closeSidebarButton =
  document.getElementById(
    "closeSidebarButton"
  );

const newChatButton =
  document.getElementById(
    "newChatButton"
  );

const imagesMenuButton =
  document.getElementById(
    "imagesMenuButton"
  );

const documentsMenuButton =
  document.getElementById(
    "documentsMenuButton"
  );

const settingsMenuButton =
  document.getElementById(
    "settingsMenuButton"
  );

const aboutMenuButton =
  document.getElementById(
    "aboutMenuButton"
  );

const deleteHistoryButton =
  document.getElementById(
    "deleteHistoryButton"
  );

const historyList =
  document.getElementById(
    "historyList"
  );

const chatElement =
  document.getElementById(
    "chat"
  );

const messageElement =
  document.getElementById(
    "message"
  );

const sendButton =
  document.getElementById(
    "sendButton"
  );

const statusElement =
  document.getElementById(
    "status"
  );

const imageInput =
  document.getElementById(
    "imageInput"
  );

const fileInput =
  document.getElementById(
    "fileInput"
  );

const imageSelectButton =
  document.getElementById(
    "imageSelectButton"
  );

const fileSelectButton =
  document.getElementById(
    "fileSelectButton"
  );

const generateImageButton =
  document.getElementById(
    "generateImageButton"
  );

const previewElement =
  document.getElementById(
    "preview"
  );


/* =====================================================
   MODALS
===================================================== */

const settingsModal =
  document.getElementById(
    "settingsModal"
  );

const aboutModal =
  document.getElementById(
    "aboutModal"
  );

const closeSettingsButton =
  document.getElementById(
    "closeSettingsButton"
  );

const closeAboutButton =
  document.getElementById(
    "closeAboutButton"
  );


/* =====================================================
   DATA
===================================================== */

let history = [];

let selectedImages = [];

let selectedFileText = "";

let selectedFile = null;

let chatSessions = [];

try{

  chatSessions =
    JSON.parse(
      localStorage.getItem(
        "myAI_chat_sessions"
      ) || "[]"
    );

  if(!Array.isArray(chatSessions)){
    chatSessions = [];
  }

}catch{

  chatSessions = [];

}


/* =====================================================
   SIDEBAR
===================================================== */

function openSidebar(){

  sidebar.classList.add("open");

  overlay.classList.add("show");

}


function closeSidebar(){

  sidebar.classList.remove("open");

  overlay.classList.remove("show");

}


menuButton.addEventListener(
  "click",
  openSidebar
);


closeSidebarButton.addEventListener(
  "click",
  closeSidebar
);


overlay.addEventListener(
  "click",
  closeSidebar
);


/* =====================================================
   NEW CHAT
===================================================== */

newChatButton.addEventListener(
  "click",
  function(){

    history = [];

    selectedImages = [];

    selectedFileText = "";

    selectedFile = null;

    messageElement.value = "";

    previewElement.innerHTML = "";

    previewElement.style.display =
      "none";

    chatElement.innerHTML = `

      <div
        id="welcome"
        class="welcome"
      >

        <h2>
          My AI
        </h2>

        <div>
          Сұрағыңызды жазыңыз
        </div>

      </div>

    `;

    closeSidebar();

    messageElement.focus();

  }
);


/* =====================================================
   SETTINGS
===================================================== */

settingsMenuButton.addEventListener(
  "click",
  function(){

    closeSidebar();

    settingsModal.classList.add(
      "show"
    );

  }
);


closeSettingsButton.addEventListener(
  "click",
  function(){

    settingsModal.classList.remove(
      "show"
    );

  }
);


/* =====================================================
   ABOUT
===================================================== */

aboutMenuButton.addEventListener(
  "click",
  function(){

    closeSidebar();

    aboutModal.classList.add(
      "show"
    );

  }
);


closeAboutButton.addEventListener(
  "click",
  function(){

    aboutModal.classList.remove(
      "show"
    );

  }
);


/* =====================================================
   MODAL BACKGROUND CLOSE
===================================================== */

settingsModal.addEventListener(
  "click",
  function(event){

    if(
      event.target ===
      settingsModal
    ){

      settingsModal.classList.remove(
        "show"
      );

    }

  }
);


aboutModal.addEventListener(
  "click",
  function(event){

    if(
      event.target ===
      aboutModal
    ){

      aboutModal.classList.remove(
        "show"
      );

    }

  }
);


/* =====================================================
   IMAGES MENU
===================================================== */

imagesMenuButton.addEventListener(
  "click",
  function(){

    closeSidebar();

    messageElement.focus();

  }
);


/* =====================================================
   DOCUMENTS MENU
===================================================== */

documentsMenuButton.addEventListener(
  "click",
  function(){

    closeSidebar();

    fileInput.click();

  }
);


/* =====================================================
   DELETE HISTORY
===================================================== */

deleteHistoryButton.addEventListener(
  "click",
  function(){

    const answer =
      confirm(
        "Барлық чат тарихын өшіру керек пе?"
      );

    if(!answer){
      return;
    }

    chatSessions = [];

    history = [];

    localStorage.removeItem(
      "myAI_chat_sessions"
    );

    renderHistory();

    closeSidebar();

  }
);


/* =====================================================
   RENDER HISTORY
===================================================== */

function renderHistory(){

  historyList.innerHTML = "";

  if(
    !chatSessions.length
  ){

    historyList.innerHTML = `

      <div class="history-empty">
        Әзірге чат тарихы жоқ
      </div>

    `;

    return;

  }

  chatSessions.forEach(
    function(session){

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "history-item";

      item.textContent =
        session.title ||
        "Жаңа чат";

      item.addEventListener(
        "click",
        function(){

          loadChat(
            session.id
          );

        }
      );

      historyList.appendChild(
        item
      );

    }
  );

}


/* =====================================================
   SAVE CURRENT CHAT
===================================================== */

function saveCurrentChat(){

  if(
    !history.length
  ){
    return;
  }

  const firstUser =
    history.find(
      function(item){

        return (
          item.role ===
          "user"
        );

      }
    );

  if(!firstUser){
    return;
  }

  const title =
    String(
      firstUser.content ||
      "Жаңа чат"
    ).slice(0,60);


  const existing =
    chatSessions.find(
      function(session){

        return (
          session.active ===
          true
        );

      }
    );


  if(existing){

    existing.title =
      title;

    existing.messages =
      [...history];

  }else{

    chatSessions.forEach(
      function(session){

        session.active =
          false;

      }
    );

    chatSessions.unshift({

      id:Date.now(),

      title:title,

      active:true,

      messages:[
        ...history
      ]

    });

  }


  chatSessions =
    chatSessions.slice(
      0,
      30
    );


  localStorage.setItem(
    "myAI_chat_sessions",
    JSON.stringify(
      chatSessions
    )
  );


  renderHistory();

}


/* =====================================================
   LOAD CHAT
===================================================== */

function loadChat(id){

  const session =
    chatSessions.find(
      function(item){

        return (
          item.id === id
        );

      }
    );

  if(!session){
    return;
  }

  chatSessions.forEach(
    function(item){

      item.active =
        item.id === id;

    }
  );

  localStorage.setItem(
    "myAI_chat_sessions",
    JSON.stringify(
      chatSessions
    )
  );


  history =
    [...session.messages];


  chatElement.innerHTML =
    "";


  history.forEach(
    function(item){

      if(
        item.role ===
        "user"
      ){

        addMessage(
          "user",
          item.content,
          false
        );

      }


      if(
        item.role ===
        "assistant"
      ){

        addMessage(
          "assistant",
          item.content,
          true
        );

      }

    }
  );


  closeSidebar();

  scrollChat();

}


/* =====================================================
   BACKEND CHECK
===================================================== */

async function checkBackend(){

  try{

    const response =
      await fetch(
        API_URL,
        {
          method:"GET"
        }
      );


    const data =
      await response.json();


    if(
      response.ok &&
      data &&
      data.ok
    ){

      statusElement.textContent =
        "Онлайн";

      statusElement.classList.add(
        "online"
      );

    }else{

      statusElement.textContent =
        "Backend қатесі";

    }

  }catch(error){

    console.error(
      "Backend check:",
      error
    );

    statusElement.textContent =
      "Backend қосылмады";

  }

}


/* =====================================================
   IMAGE SELECT
===================================================== */

imageSelectButton.addEventListener(
  "click",
  function(){

    imageInput.click();

  }
);


imageInput.addEventListener(
  "change",
  function(){

    const file =
      this.files[0];

    if(!file){
      return;
    }


    const reader =
      new FileReader();


    reader.onload =
      function(event){

        selectedImages = [
          event.target.result
        ];


        previewElement.style.display =
          "block";


        previewElement.innerHTML = `

          <img
            class="preview-image"
            src="${event.target.result}"
          >

        `;

      };


    reader.readAsDataURL(file);

  }
);


/* =====================================================
   FILE SELECT
===================================================== */

fileSelectButton.addEventListener(
  "click",
  function(){

    fileInput.click();

  }
);


fileInput.addEventListener(
  "change",
  async function(){

    const file =
      this.files[0];

    if(!file){
      return;
    }


    selectedFile =
      file;


    previewElement.style.display =
      "block";


    previewElement.innerHTML = `

      <div class="file-preview">

        <div class="file-preview-icon">
          📄
        </div>

        <div class="file-preview-name">
          ${escapeHtml(file.name)}
        </div>

      </div>

    `;


    const isText =
      file.type ===
        "text/plain" ||

      file.name.endsWith(".txt") ||
      file.name.endsWith(".md") ||
      file.name.endsWith(".json") ||
      file.name.endsWith(".csv") ||
      file.name.endsWith(".html") ||
      file.name.endsWith(".js") ||
      file.name.endsWith(".css") ||
      file.name.endsWith(".xml");


    if(isText){

      try{

        selectedFileText =
          await file.text();

      }catch(error){

        console.error(error);

        selectedFileText =
          "";

      }

    }else{

      selectedFileText =
        "";

    }

  }
);


/* =====================================================
   SEND MESSAGE
===================================================== */

sendButton.addEventListener(
  "click",
  sendMessage
);


messageElement.addEventListener(
  "keydown",
  function(event){

    if(
      event.key ===
        "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


async function sendMessage(){

  const message =
    messageElement.value.trim();


  if(
    !message &&
    selectedImages.length === 0 &&
    !selectedFile
  ){

    return;

  }


  setLoading(true);


  if(message){

    addMessage(
      "user",
      message
    );

  }


  const currentImages =
    [...selectedImages];


  const currentFileText =
    selectedFileText;


  const currentFile =
    selectedFile;


  messageElement.value =
    "";


  selectedImages =
    [];


  selectedFileText =
    "";


  selectedFile =
    null;


  previewElement.innerHTML =
    "";

  previewElement.style.display =
    "none";


  try{

    const response =
      await fetch(
        API_URL,
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              action:"chat",

              message:
                message ||
                (
                  currentFile
                    ? `Файлды талдаңыз: ${currentFile.name}`
                    : "Суретті талдаңыз."
                ),

              history:
                history.slice(-20),

              images:
                currentImages,

              fileText:
                currentFileText,

              fileName:
                currentFile
                  ? currentFile.name
                  : "",

              mimeType:
                currentFile
                  ? currentFile.type
                  : ""

            })

        }
      );


    const data =
      await response.json();


    if(
      !response.ok ||
      !data.ok
    ){

      throw new Error(
        data.error ||
        `HTTP ${response.status}`
      );

    }


    const answer =
      data.answer ||
      "AI жауап бере алмады.";


    addMessage(
      "assistant",
      answer
    );


    history.push({

      role:"user",

      content:
        message ||
        (
          currentFile
            ? `Файл: ${currentFile.name}`
            : "Суретті талдау"
        )

    });


    history.push({

      role:"assistant",

      content:answer

    });


    history =
      history.slice(-20);


    saveCurrentChat();


  }catch(error){

    console.error(error);


    addMessage(
      "assistant",
      "Қате: " +
      error.message
    );


  }finally{

    setLoading(false);

  }

}


/* =====================================================
   GENERATE IMAGE
===================================================== */

generateImageButton.addEventListener(
  "click",
  generateImage
);


async function generateImage(){

  const prompt =
    messageElement.value.trim();


  if(!prompt){

    addMessage(
      "assistant",
      "Сурет жасау үшін алдымен сипаттамасын жазыңыз."
    );

    return;

  }


  setLoading(true);


  addMessage(
    "user",
    "🖼️ " + prompt
  );


  messageElement.value =
    "";


  try{

    const response =
      await fetch(
        API_URL,
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              action:"image",

              prompt:prompt,

              width:1024,

              height:1024

            })

        }
      );


    const data =
      await response.json();


    if(
      !response.ok ||
      !data.ok
    ){

      throw new Error(
        data.error ||
        `HTTP ${response.status}`
      );

    }


    if(!data.image){

      throw new Error(
        "Сурет қайтарылмады."
      );

    }


    addImageMessage(
      data.image
    );


  }catch(error){

    console.error(error);


    addMessage(
      "assistant",
      "Сурет жасау қатесі: " +
      error.message
    );


  }finally{

    setLoading(false);

  }

}


/* =====================================================
   ADD MESSAGE
===================================================== */

function addMessage(
  role,
  text,
  showActions = true
){

  const wrapper =
    document.createElement(
      "div"
    );


  wrapper.className =
    `message ${role}`;


  const bubble =
    document.createElement(
      "div"
    );


  bubble.className =
    "bubble";


  bubble.textContent =
    text;


  wrapper.appendChild(
    bubble
  );


  if(
    role === "assistant" &&
    showActions
  ){

    const actions =
      document.createElement(
        "div"
      );


    actions.className =
      "message-actions";


    const copyButton =
      document.createElement(
        "button"
      );


    copyButton.type =
      "button";


    copyButton.textContent =
      "📋 Көшіру";


    copyButton.addEventListener(
      "click",
      async function(){

        try{

          await navigator.clipboard.writeText(
            text
          );

          copyButton.textContent =
            "✓ Көшірілді";


          setTimeout(
            function(){

              copyButton.textContent =
                "📋 Көшіру";

            },
            1500
          );


        }catch{

          alert(
            "Көшіру мүмкін болмады."
          );

        }

      }
    );


    const retryButton =
      document.createElement(
        "button"
      );


    retryButton.type =
      "button";


    retryButton.textContent =
      "🔄 Қайта жауап";


    retryButton.addEventListener(
      "click",
      retryLast
    );


    actions.appendChild(
      copyButton
    );


    actions.appendChild(
      retryButton
    );


    wrapper.appendChild(
      actions
    );

  }


  chatElement.appendChild(
    wrapper
  );


  scrollChat();

}


/* =====================================================
   IMAGE MESSAGE
===================================================== */

function addImageMessage(
  image
){

  const wrapper =
    document.createElement(
      "div"
    );


  wrapper.className =
    "message assistant";


  const bubble =
    document.createElement(
      "div"
    );


  bubble.className =
    "bubble";


  const img =
    document.createElement(
      "img"
    );


  img.className =
    "generated-image";


  img.src =
    image;


  img.alt =
    "Generated image";


  bubble.appendChild(
    img
  );


  wrapper.appendChild(
    bubble
  );


  chatElement.appendChild(
    wrapper
  );


  scrollChat();

}


/* =====================================================
   RETRY
===================================================== */

async function retryLast(){

  let lastUser =
    null;


  for(
    let i =
      history.length - 1;
    i >= 0;
    i--
  ){

    if(
      history[i].role ===
      "user"
    ){

      lastUser =
        history[i].content;

      break;

    }

  }


  if(!lastUser){
    return;
  }


  messageElement.value =
    lastUser;


  await sendMessage();

}


/* =====================================================
   LOADING
===================================================== */

function setLoading(
  loading
){

  sendButton.disabled =
    loading;


  messageElement.disabled =
    loading;


  imageSelectButton.disabled =
    loading;


  fileSelectButton.disabled =
    loading;


  generateImageButton.disabled =
    loading;


  if(loading){

    statusElement.textContent =
      "Жауап дайындалуда...";


    statusElement.classList.remove(
      "online"
    );

  }else{

    statusElement.textContent =
      "Онлайн";


    statusElement.classList.add(
      "online"
    );

  }

}


/* =====================================================
   SCROLL
===================================================== */

function scrollChat(){

  setTimeout(
    function(){

      chatElement.scrollTop =
        chatElement.scrollHeight;

    },
    50
  );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
  text
){

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   START
===================================================== */

renderHistory();

checkBackend();

messageElement.focus();

    ){

      settingsModal.classList.remove(

      );

      aboutModal.classList.remove(

      );

    }

  }
);
