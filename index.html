<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>My AI</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

button {
  border: 0;
  cursor: pointer;
  color: #fff;
}

.app {
  width: 100%;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  background: #000;
}

/* =========================
   HEADER
========================= */

header {
  height: 60px;
  min-height: 60px;
  border-bottom: 1px solid #222;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 12px;
  background: #000;
  z-index: 30;
}

.header-left,
.header-right {
  width: 44px;
  display: flex;
  align-items: center;
}

.header-right {
  justify-content: flex-end;
}

.header-title {
  font-size: 20px;
  font-weight: bold;
}

.icon-button {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: #222;
  font-size: 22px;
}

.icon-button:active {
  transform: scale(.94);
}

/* =========================
   CHAT
========================= */

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 18px;
  padding-bottom: 105px;
  scroll-behavior: smooth;
}

.welcome {
  text-align: center;
  margin-top: 22vh;
  color: #888;
}

.welcome h1 {
  color: #fff;
  font-size: 30px;
  margin-bottom: 12px;
}

.welcome p {
  margin: 7px 0;
}

.message {
  position: relative;
  max-width: 88%;
  padding: 12px 16px;
  margin: 12px 0;
  border-radius: 18px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
}

.user {
  background: #2563eb;
  margin-left: auto;
  border-bottom-right-radius: 5px;
}

.ai {
  background: #1d1d1d;
  margin-right: auto;
  border-bottom-left-radius: 5px;
}

.message img {
  display: block;
  width: auto;
  max-width: 100%;
  max-height: 420px;
  border-radius: 14px;
  margin-bottom: 8px;
}

/* =========================
   INPUT AREA
========================= */

.bottom-area {
  width: 100%;
  background: #000;
  border-top: 1px solid #222;
  padding: 8px;
  padding-bottom: calc(8px + env(safe-area-inset-bottom));
  z-index: 20;
}

.preview {
  display: none;
  position: relative;
  padding: 4px 0 8px;
}

.preview img {
  width: 68px;
  height: 68px;
  object-fit: cover;
  border-radius: 10px;
  border: 1px solid #333;
}

.remove-preview {
  position: absolute;
  left: 52px;
  top: -2px;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: #333;
  font-size: 15px;
}

.controls {
  display: flex;
  gap: 6px;
  align-items: flex-end;
}

textarea {
  flex: 1;
  min-width: 0;
  min-height: 44px;
  max-height: 120px;
  resize: none;
  background: #1b1b1b;
  color: #fff;
  border: 1px solid #333;
  border-radius: 18px;
  padding: 12px;
  font-size: 16px;
  line-height: 20px;
  outline: none;
  font-family: Arial, sans-serif;
}

textarea:focus {
  border-color: #555;
}

.control-button,
.send-button {
  width: 44px;
  height: 44px;
  min-width: 44px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 19px;
}

.control-button {
  background: #222;
}

.send-button {
  background: #fff;
  color: #000;
  font-size: 20px;
}

.control-button:active,
.send-button:active {
  transform: scale(.94);
}

input[type="file"] {
  display: none;
}

/* =========================
   STATUS
========================= */

.status {
  position: fixed;
  bottom: 72px;
  left: 0;
  width: 100%;
  text-align: center;
  color: #777;
  font-size: 12px;
  z-index: 25;
  pointer-events: none;
}

/* =========================
   CHAT LIST PANEL
========================= */

.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.65);
  z-index: 80;
}

.overlay.show {
  display: block;
}

.chat-panel {
  position: fixed;
  left: 0;
  top: 0;
  bottom: 0;
  width: min(330px, 88vw);
  background: #111;
  border-right: 1px solid #333;
  z-index: 90;
  transform: translateX(-100%);
  transition: transform .22s ease;
  display: flex;
  flex-direction: column;
}

.chat-panel.show {
  transform: translateX(0);
}

.panel-header {
  height: 60px;
  min-height: 60px;
  border-bottom: 1px solid #292929;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 12px;
}

.panel-title {
  font-size: 18px;
  font-weight: bold;
}

.panel-new {
  margin: 12px;
  padding: 12px;
  border-radius: 12px;
  background: #2563eb;
  font-size: 15px;
}

.chat-list {
  flex: 1;
  overflow-y: auto;
  padding: 4px 8px 20px;
}

.chat-item {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px;
  border-radius: 12px;
  margin-bottom: 4px;
}

.chat-item.active {
  background: #222;
}

.chat-open {
  flex: 1;
  min-width: 0;
  background: transparent;
  text-align: left;
  padding: 12px 10px;
  border-radius: 9px;
}

.chat-name {
  display: block;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-size: 14px;
}

.chat-date {
  display: block;
  color: #777;
  font-size: 11px;
  margin-top: 4px;
}

.chat-delete {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: transparent;
  color: #888;
  font-size: 16px;
}

.chat-delete:active {
  background: #333;
}

.empty-chats {
  text-align: center;
  color: #666;
  padding: 30px 15px;
  font-size: 14px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

  #chat {
    padding: 14px;
    padding-bottom: 100px;
  }

  .message {
    max-width: 91%;
  }

  .controls {
    gap: 4px;
  }

  .control-button,
  .send-button {
    width: 43px;
    height: 43px;
    min-width: 43px;
  }

  textarea {
    font-size: 15px;
  }

  .welcome {
    margin-top: 20vh;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- =========================
       HEADER
  ========================== -->

  <header>

    <div class="header-left">
      <button
        class="icon-button"
        onclick="openChatPanel()"
        title="Чаттар">
        ☰
      </button>
    </div>

    <div class="header-title">
      🤖 My AI
    </div>

    <div class="header-right">
      <button
        class="icon-button"
        onclick="newChat()"
        title="Жаңа чат">
        ＋
      </button>
    </div>

  </header>


  <!-- =========================
       CHAT
  ========================== -->

  <div id="chat">

    <div class="welcome" id="welcome">
      <h1>Сәлем! 👋</h1>
      <p>Мен — My AI</p>
      <p>Сұрақ қойыңыз немесе сурет жіберіңіз.</p>
    </div>

  </div>


  <div id="status" class="status"></div>


  <!-- =========================
       INPUT
  ========================== -->

  <div class="bottom-area">

    <div id="preview" class="preview">

      <img id="previewImage">

      <button
        class="remove-preview"
        onclick="removeSelectedImage()">
        ✕
      </button>

    </div>


    <div class="controls">

      <!-- Галерея -->

      <button
        class="control-button"
        onclick="document.getElementById('fileInput').click()"
        title="Сурет таңдау">
        📎
      </button>

      <input
        id="fileInput"
        type="file"
        accept="image/jpeg,image/png,image/webp"
        onchange="selectImage(event)">


      <!-- Камера -->

      <button
        class="control-button"
        onclick="document.getElementById('cameraInput').click()"
        title="Камера">
        📷
      </button>

      <input
        id="cameraInput"
        type="file"
        accept="image/*"
        capture="environment"
        onchange="selectImage(event)">


      <!-- Мәтін -->

      <textarea
        id="input"
        rows="1"
        placeholder="Хабарлама жазыңыз..."
        autocomplete="off"></textarea>


      <!-- Жіберу -->

      <button
        class="send-button"
        onclick="sendMessage()"
        title="Жіберу">
        ➤
      </button>

    </div>

  </div>

</div>


<!-- =========================
     OVERLAY
========================= -->

<div
  id="overlay"
  class="overlay"
  onclick="closeChatPanel()">
</div>


<!-- =========================
     CHAT PANEL
========================= -->

<div
  id="chatPanel"
  class="chat-panel">

  <div class="panel-header">

    <div class="panel-title">
      Чаттар
    </div>

    <button
      class="icon-button"
      onclick="closeChatPanel()">
      ✕
    </button>

  </div>


  <button
    class="panel-new"
    onclick="newChatFromPanel()">
    ＋ Жаңа чат
  </button>


  <div
    id="chatList"
    class="chat-list">
  </div>

</div>


<script>

/* =========================================================
   CLOUDFLARE WORKER
========================================================= */

const WORKER_URL =
  "https://my-ai-backend.razinavsegda84.workers.dev";


/* =========================================================
   STORAGE
========================================================= */

const STORAGE_KEY =
  "myAI_saved_chats_v2";


/* =========================================================
   STATE
========================================================= */

let savedChats =
  loadSavedChats();

let currentChatId =
  null;

let chatHistory = [];

let selectedImage =
  null;

let isSending =
  false;


/* =========================================================
   LOAD SAVED CHATS
========================================================= */

function loadSavedChats() {

  try {

    const data =
      localStorage.getItem(
        STORAGE_KEY
      );

    if (!data) {
      return [];
    }

    const parsed =
      JSON.parse(data);

    if (!Array.isArray(parsed)) {
      return [];
    }

    return parsed;

  }

  catch (error) {

    console.error(
      "Chat storage error:",
      error
    );

    return [];

  }
}


/* =========================================================
   SAVE ALL CHATS
========================================================= */

function saveAllChats() {

  try {

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(savedChats)
    );

  }

  catch (error) {

    console.error(
      "Save chats error:",
      error
    );

  }
}


/* =========================================================
   STATUS
========================================================= */

function setStatus(text) {

  document.getElementById(
    "status"
  ).textContent =
    text || "";

}


/* =========================================================
   CHAT ID
========================================================= */

function createChatId() {

  return (
    Date.now().toString(36) +
    Math.random()
      .toString(36)
      .substring(2, 8)
  );

}


/* =========================================================
   CHAT TITLE
========================================================= */

function makeChatTitle(text) {

  if (!text) {
    return "Жаңа чат";
  }

  const clean =
    text
      .replace(/\s+/g, " ")
      .trim();

  if (!clean) {
    return "Жаңа чат";
  }

  return clean.length > 42
    ? clean.substring(0, 42) + "..."
    : clean;
}


/* =========================================================
   DATE
========================================================= */

function formatDate(timestamp) {

  try {

    return new Date(timestamp)
      .toLocaleString(
        "kk-KZ",
        {
          day: "2-digit",
          month: "2-digit",
          hour: "2-digit",
          minute: "2-digit"
        }
      );

  }

  catch {

    return "";

  }
}


/* =========================================================
   CREATE CHAT
========================================================= */

function createNewChat() {

  const chat = {

    id:
      createChatId(),

    title:
      "Жаңа чат",

    history:
      [],

    createdAt:
      Date.now(),

    updatedAt:
      Date.now()

  };

  savedChats.unshift(
    chat
  );

  currentChatId =
    chat.id;

  chatHistory =
    [];

  saveAllChats();

  renderChatList();

}


/* =========================================================
   FIND CURRENT CHAT
========================================================= */

function getCurrentChat() {

  return savedChats.find(
    chat =>
      chat.id ===
      currentChatId
  );

}


/* =========================================================
   UPDATE CURRENT CHAT
========================================================= */

function updateCurrentChat() {

  const current =
    getCurrentChat();

  if (!current) {
    return;
  }

  current.history =
    chatHistory.slice(-12);

  current.updatedAt =
    Date.now();

  saveAllChats();

  renderChatList();

}


/* =========================================================
   OPEN CHAT
========================================================= */

function openSavedChat(id) {

  const found =
    savedChats.find(
      chat =>
        chat.id === id
    );

  if (!found) {
    return;
  }

  currentChatId =
    found.id;

  chatHistory =
    Array.isArray(found.history)
      ? found.history.slice(-12)
      : [];

  renderCurrentChat();

  closeChatPanel();

  renderChatList();

}


/* =========================================================
   RENDER CURRENT CHAT
========================================================= */

function renderCurrentChat() {

  const chat =
    document.getElementById(
      "chat"
    );

  chat.innerHTML = "";

  if (
    !chatHistory ||
    chatHistory.length === 0
  ) {

    chat.innerHTML = `
      <div class="welcome" id="welcome">
        <h1>Сәлем! 👋</h1>
        <p>Мен — My AI</p>
        <p>Сұрақ қойыңыз немесе сурет жіберіңіз.</p>
      </div>
    `;

    return;
  }


  chatHistory.forEach(
    item => {

      if (!item) {
        return;
      }

      if (
        item.role !== "user" &&
        item.role !== "assistant"
      ) {
        return;
      }

      if (
        typeof item.content !==
        "string"
      ) {
        return;
      }

      const text =
        item.content.trim();

      if (!text) {
        return;
      }

      addMessage(
  text,
  item.role === "user"
    ? "user"
    : "ai",
  item.image || null
);

    }
  );

}


/* =========================================================
   NEW CHAT
========================================================= */

function newChat() {

  if (
    chatHistory.length > 0
  ) {

    const confirmed =
      confirm(
        "Жаңа чат бастаймыз ба?"
      );

    if (!confirmed) {
      return;
    }

  }

  createNewChat();

  clearSelectedImage();

  document.getElementById(
    "input"
  ).value = "";

  renderCurrentChat();

  setStatus("");

}


/* =========================================================
   NEW CHAT FROM PANEL
========================================================= */

function newChatFromPanel() {

  createNewChat();

  clearSelectedImage();

  document.getElementById(
    "input"
  ).value = "";

  renderCurrentChat();

  closeChatPanel();

  setStatus("");

}


/* =========================================================
   DELETE CHAT
========================================================= */

function deleteChat(
  event,
  id
) {

  event.stopPropagation();

  const confirmed =
    confirm(
      "Бұл чатты өшіру керек пе?"
    );

  if (!confirmed) {
    return;
  }

  savedChats =
    savedChats.filter(
      chat =>
        chat.id !== id
    );

  saveAllChats();


  if (
    currentChatId === id
  ) {

    if (
      savedChats.length > 0
    ) {

      currentChatId =
        savedChats[0].id;

      chatHistory =
        Array.isArray(
          savedChats[0].history
        )
          ? savedChats[0].history.slice(-12)
          : [];

    }

    else {

      createNewChat();

    }

    renderCurrentChat();

  }

  renderChatList();

}


/* =========================================================
   RENDER CHAT LIST
========================================================= */

function renderChatList() {

  const list =
    document.getElementById(
      "chatList"
    );

  if (!list) {
    return;
  }

  list.innerHTML = "";


  if (
    savedChats.length === 0
  ) {

    list.innerHTML = `
      <div class="empty-chats">
        Әзірге сақталған чат жоқ.
      </div>
    `;

    return;

  }


  savedChats.forEach(
    chat => {

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "chat-item" +
        (
          chat.id === currentChatId
            ? " active"
            : ""
        );


      const openButton =
        document.createElement(
          "button"
        );

      openButton.className =
        "chat-open";


      const name =
        document.createElement(
          "span"
        );

      name.className =
        "chat-name";

      name.textContent =
        chat.title ||
        "Жаңа чат";


      const date =
        document.createElement(
          "span"
        );

      date.className =
        "chat-date";

      date.textContent =
        formatDate(
          chat.updatedAt
        );


      openButton.appendChild(
        name
      );

      openButton.appendChild(
        date
      );


      openButton.onclick =
        function() {

          openSavedChat(
            chat.id
          );

        };


      const deleteButton =
        document.createElement(
          "button"
        );

      deleteButton.className =
        "chat-delete";

      deleteButton.textContent =
        "🗑️";

      deleteButton.title =
        "Чатты өшіру";


      deleteButton.onclick =
        function(event) {

          deleteChat(
            event,
            chat.id
          );

        };


      item.appendChild(
        openButton
      );

      item.appendChild(
        deleteButton
      );

      list.appendChild(
        item
      );

    }
  );

}


/* =========================================================
   PANEL
========================================================= */

function openChatPanel() {

  document
    .getElementById(
      "overlay"
    )
    .classList.add(
      "show"
    );

  document
    .getElementById(
      "chatPanel"
    )
    .classList.add(
      "show"
    );

}


function closeChatPanel() {

  document
    .getElementById(
      "overlay"
    )
    .classList.remove(
      "show"
    );

  document
    .getElementById(
      "chatPanel"
    )
    .classList.remove(
      "show"
    );

}


/* =========================================================
   SELECT IMAGE
========================================================= */

function selectImage(event) {

  const file =
    event.target.files[0];

  if (!file) {
    return;
  }


  if (
    !file.type.startsWith(
      "image/"
    )
  ) {

    alert(
      "Тек сурет таңдаңыз."
    );

    event.target.value = "";

    return;

  }


  if (
    file.size >
    20 * 1024 * 1024
  ) {

    alert(
      "Сурет 20 MB-тан үлкен."
    );

    event.target.value = "";

    return;

  }


  selectedImage =
    file;


  const reader =
    new FileReader();


  reader.onload =
    function(event) {

      document.getElementById(
        "previewImage"
      ).src =
        event.target.result;

      document.getElementById(
        "preview"
      ).style.display =
        "block";

    };


  reader.readAsDataURL(
    file
  );

}


/* =========================================================
   REMOVE IMAGE
========================================================= */

function removeSelectedImage() {

  clearSelectedImage();

}


function clearSelectedImage() {

  selectedImage =
    null;


  document.getElementById(
    "preview"
  ).style.display =
    "none";


  document.getElementById(
    "previewImage"
  ).src =
    "";


  document.getElementById(
    "fileInput"
  ).value =
    "";


  document.getElementById(
    "cameraInput"
  ).value =
    "";

}


/* =========================================================
   COMPRESS IMAGE
========================================================= */

function compressImage(file) {

  return new Promise(
    function(resolve, reject) {

      const reader =
        new FileReader();


      reader.onload =
        function(event) {

          const img =
            new Image();


          img.onload =
            function() {

              const MAX =
                1280;


              let width =
                img.width;

              let height =
                img.height;


              if (
                width > MAX ||
                height > MAX
              ) {

                if (
                  width > height
                ) {

                  height =
                    Math.round(
                      height *
                      MAX /
                      width
                    );

                  width =
                    MAX;

                }

                else {

                  width =
                    Math.round(
                      width *
                      MAX /
                      height
                    );

                  height =
                    MAX;

                }

              }


              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                width;

              canvas.height =
                height;


              const ctx =
                canvas.getContext(
                  "2d"
                );


              ctx.drawImage(
                img,
                0,
                0,
                width,
                height
              );


              resolve(
                canvas.toDataURL(
                  "image/jpeg",
                  0.72
                )
              );

            };


          img.onerror =
            function() {

              reject(
                new Error(
                  "Суретті ашу мүмкін болмады."
                )
              );

            };


          img.src =
            event.target.result;

        };


      reader.onerror =
        function() {

          reject(
            new Error(
              "Суретті оқу мүмкін болмады."
            )
          );

        };


      reader.readAsDataURL(
        file
      );

    }
  );

}


/* =========================================================
   ADD MESSAGE
========================================================= */

function addMessage(
  text,
  type,
  image = null
) {

  const chat =
    document.getElementById(
      "chat"
    );


  const div =
    document.createElement(
      "div"
    );


  div.className =
    "message " +
    type;


  if (image) {

    const img =
      document.createElement(
        "img"
      );

    img.src =
      image;

    img.alt =
      "Жіберілген сурет";

    div.appendChild(
      img
    );

  }


  if (text) {

    const textDiv =
      document.createElement(
        "div"
      );

    textDiv.textContent =
      text;

    div.appendChild(
      textDiv
    );

  }


  chat.appendChild(
    div
  );


  chat.scrollTop =
    chat.scrollHeight;


  return div;

}


/* =========================================================
   SEND MESSAGE
========================================================= */

async function sendMessage() {

  if (isSending) {
    return;
  }


  const input =
    document.getElementById(
      "input"
    );


  const text =
    input.value.trim();


  if (
    !text &&
    !selectedImage
  ) {
    return;
  }


  if (!currentChatId) {
    createNewChat();
  }


  const welcome =
    document.getElementById(
      "welcome"
    );


  if (welcome) {
    welcome.style.display =
      "none";
  }


  let imageData =
    null;


  /* =========================
     IMAGE
  ========================== */

  if (selectedImage) {

    try {

      setStatus(
        "Сурет дайындалып жатыр..."
      );


      imageData =
        await compressImage(
          selectedImage
        );

    }

    catch (error) {

      alert(
        "Суретті дайындау қатесі:\n" +
        error.message
      );

      setStatus("");

      return;

    }

  }


  const userText =
    text ||
    "Осы суретте не бар екенін қазақ тілінде сипатта.";


  /* =========================
     USER MESSAGE
  ========================== */

  addMessage(
    userText,
    "user",
    imageData
  );


  input.value =
    "";


  clearSelectedImage();


  /* =========================
     LOADING
  ========================== */

  setStatus(
    "AI жауап дайындап жатыр..."
  );


  const loading =
    addMessage(
      "AI жауап дайындап жатыр...",
      "ai"
    );


  isSending =
    true;


  try {

    /* =========================
       WORKER REQUEST
    ========================== */

    const response =
      await fetch(
        WORKER_URL,
        {

          method:
            "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              message:
                userText,

              image:
                imageData,

              history:
                chatHistory.slice(-12)

            })

        }
      );


    let data;


    try {

      data =
        await response.json();

    }

    catch {

      throw new Error(
        "Серверден дұрыс жауап келмеді."
      );

    }


    loading.remove();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Сервер қатесі: " +
        response.status
      );

    }


    let answer =
      data.answer;


    if (
      typeof answer !==
      "string"
    ) {

      answer =
        JSON.stringify(
          answer
        );

    }


    if (!answer) {

      answer =
        "AI жауап бере алмады.";

    }


    /* =========================
       SHOW ANSWER
    ========================== */

    addMessage(
      answer,
      "ai"
    );


    /* =========================
       SAVE HISTORY
    ========================== */

    chatHistory.push({
  role: "user",
  content: userText,
  image: imageData || null
});


    chatHistory.push({

      role:
        "assistant",

      content:
        answer

    });


    if (
      chatHistory.length >
      12
    ) {

      chatHistory =
        chatHistory.slice(-12);

    }


    /* =========================
       CHAT TITLE
    ========================== */

    const current =
      getCurrentChat();


    if (current) {

      if (
        current.title ===
        "Жаңа чат"
      ) {

        current.title =
          makeChatTitle(
            userText
          );

      }

    }


    updateCurrentChat();


    setStatus("");

  }

  catch (error) {

    console.error(
      error
    );


    if (
      loading &&
      loading.parentNode
    ) {

      loading.remove();

    }


    addMessage(
      "Қате: " +
      (
        error.message ||
        "Белгісіз қате"
      ),
      "ai"
    );


    setStatus("");

  }

  finally {

    isSending =
      false;

  }

}


/* =========================================================
   ENTER TO SEND
========================================================= */

document
  .getElementById(
    "input"
  )
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();

      }

    }
  );


/* =========================================================
   TEXTAREA AUTO HEIGHT
========================================================= */

document
  .getElementById(
    "input"
  )
  .addEventListener(
    "input",
    function() {

      this.style.height =
        "auto";

      this.style.height =
        Math.min(
          this.scrollHeight,
          120
        ) + "px";

    }
  );


/* =========================================================
   INITIALIZE
========================================================= */

function initialize() {

  if (
    savedChats.length === 0
  ) {

    createNewChat();

  }

  else {

    currentChatId =
      savedChats[0].id;

    const current =
      getCurrentChat();


    chatHistory =
      current &&
      Array.isArray(
        current.history
      )
        ? current.history.slice(-12)
        : [];

  }


  renderCurrentChat();

  renderChatList();

}


initialize();

</script>
