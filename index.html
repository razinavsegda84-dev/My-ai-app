<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0">

<title>My AI</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0b0f14;
  color: #ffffff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
               Arial, sans-serif;
}

.app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* HEADER */

.header {
  height: 58px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  border-bottom: 1px solid #202832;
  background: #0d1218;
  position: sticky;
  top: 0;
  z-index: 20;
}

.logo {
  font-size: 20px;
  font-weight: 700;
}

.header-buttons {
  display: flex;
  gap: 7px;
}

.icon-btn {
  width: 40px;
  height: 40px;
  border: 0;
  border-radius: 12px;
  background: #171e27;
  color: white;
  font-size: 20px;
  cursor: pointer;
}

/* CHAT */

.chat {
  flex: 1;
  padding: 18px 12px 145px;
  overflow-y: auto;
}

.welcome {
  text-align: center;
  margin-top: 80px;
  color: #9da8b5;
}

.welcome h1 {
  color: white;
  margin-bottom: 8px;
}

.message {
  max-width: 900px;
  margin: 12px auto;
  display: flex;
}

.message.user {
  justify-content: flex-end;
}

.bubble {
  max-width: 88%;
  padding: 12px 14px;
  border-radius: 17px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-wrap: break-word;
}

.user .bubble {
  background: #2457d6;
}

.assistant .bubble {
  background: #151c24;
  border: 1px solid #252e38;
}

.message-tools {
  display: flex;
  gap: 6px;
  margin-top: 8px;
}

.small-btn {
  border: 0;
  background: #222b35;
  color: white;
  padding: 7px 10px;
  border-radius: 9px;
  cursor: pointer;
}

/* IMAGE */

.generated-image {
  max-width: 100%;
  border-radius: 15px;
  margin-top: 8px;
}

.generated-video {
  width: 100%;
  max-width: 720px;
  border-radius: 15px;
  margin-top: 8px;
}

/* INPUT AREA */

.bottom {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  background: #0b0f14;
  border-top: 1px solid #202832;
  padding: 9px 10px 12px;
  z-index: 15;
}

.mode-bar {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  padding-bottom: 8px;
}

.mode-btn {
  white-space: nowrap;
  border: 1px solid #303a46;
  background: #151c24;
  color: #dce4ec;
  border-radius: 11px;
  padding: 8px 12px;
  cursor: pointer;
}

.mode-btn.active {
  background: #2457d6;
  border-color: #2457d6;
  color: white;
}

.input-row {
  display: flex;
  gap: 7px;
  align-items: flex-end;
}

textarea {
  flex: 1;
  resize: none;
  min-height: 45px;
  max-height: 130px;
  padding: 12px;
  border-radius: 15px;
  border: 1px solid #303a46;
  background: #151c24;
  color: white;
  outline: none;
  font-size: 16px;
}

.send-btn {
  width: 48px;
  height: 48px;
  border: 0;
  border-radius: 15px;
  background: #2457d6;
  color: white;
  font-size: 21px;
}

.attach-btn {
  width: 44px;
  height: 44px;
  border: 0;
  border-radius: 13px;
  background: #171e27;
  color: white;
  font-size: 20px;
}

.status {
  min-height: 20px;
  padding: 5px 5px 0;
  color: #8d99a7;
  font-size: 12px;
}

/* SIDE MENU */

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  display: none;
  z-index: 40;
}

.overlay.show {
  display: block;
}

.side-menu {
  position: fixed;
  left: -310px;
  top: 0;
  bottom: 0;
  width: 290px;
  background: #10161d;
  border-right: 1px solid #29323d;
  z-index: 50;
  transition: .25s;
  padding: 18px;
  overflow-y: auto;
}

.side-menu.show {
  left: 0;
}

.menu-title {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 20px;
}

.menu-item {
  width: 100%;
  text-align: left;
  border: 0;
  background: #171e27;
  color: white;
  padding: 13px;
  margin-bottom: 8px;
  border-radius: 12px;
  font-size: 15px;
  cursor: pointer;
}

/* SETTINGS */

.settings {
  display: none;
  position: fixed;
  inset: 0;
  background: #0b0f14;
  z-index: 60;
  padding: 18px;
  overflow-y: auto;
}

.settings.show {
  display: block;
}

.settings-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 25px;
}

.setting-card {
  background: #151c24;
  border: 1px solid #252e38;
  padding: 15px;
  border-radius: 14px;
  margin-bottom: 10px;
}

.setting-card label {
  display: block;
  margin-bottom: 7px;
  color: #aab5c1;
}

.setting-card select,
.setting-card input {
  width: 100%;
  padding: 11px;
  border-radius: 10px;
  background: #0d1218;
  color: white;
  border: 1px solid #303a46;
}

/* FILE PREVIEW */

.preview {
  display: none;
  padding: 8px;
}

.preview img {
  width: 90px;
  height: 90px;
  object-fit: cover;
  border-radius: 12px;
}

.hidden {
  display: none !important;
}

.loading {
  opacity: .7;
}

</style>
</head>

<body>

<div class="app">

<header class="header">

  <button class="icon-btn" onclick="openMenu()">☰</button>

  <div class="logo">My AI</div>

  <div class="header-buttons">
    <button class="icon-btn" onclick="newChat()">＋</button>
  </div>

</header>


<main id="chat" class="chat">

  <div class="welcome" id="welcome">

    <h1>My AI</h1>

    <div>
      Қазақша AI көмекшіңіз
    </div>

    <div style="margin-top:15px;font-size:13px">
      Мәтін • Сурет • Видео • Дауыс • Файл
    </div>

  </div>

</main>


<div class="bottom">

  <div class="mode-bar">

    <button
      class="mode-btn active"
      id="chatMode"
      onclick="setMode('chat',this)">
      💬 Chat
    </button>

    <button
      class="mode-btn"
      onclick="setMode('image',this)">
      🎨 Сурет
    </button>

    <button
      class="mode-btn"
      onclick="setMode('video',this)">
      🎬 Видео
    </button>

    <button
      class="mode-btn"
      onclick="setMode('search',this)">
      🔎 Іздеу
    </button>

  </div>


  <div id="preview" class="preview"></div>


  <div class="input-row">

    <input
      type="file"
      id="fileInput"
      class="hidden"
      accept="image/*,.txt,.json,.csv,.md,.html">

    <button
      class="attach-btn"
      onclick="document.getElementById('fileInput').click()">
      📎
    </button>


    <button
      class="attach-btn"
      id="micBtn"
      onclick="toggleRecording()">
      🎤
    </button>


    <textarea
      id="messageInput"
      placeholder="Хабарлама жазыңыз..."
      rows="1"></textarea>


    <button
      class="send-btn"
      onclick="sendMessage()">
      ➤
    </button>

  </div>

  <div id="status" class="status"></div>

</div>

</div>


<!-- MENU -->

<div
  id="overlay"
  class="overlay"
  onclick="closeMenu()">
</div>


<aside
  id="sideMenu"
  class="side-menu">

  <div class="menu-title">
    My AI
  </div>

  <button
    class="menu-item"
    onclick="newChat();closeMenu()">
    💬 Жаңа чат
  </button>

  <button
    class="menu-item"
    onclick="showSettings()">
    ⚙️ Баптаулар
  </button>

  <button
    class="menu-item"
    onclick="setModeFromMenu('image')">
    🎨 Сурет генерациясы
  </button>

  <button
    class="menu-item"
    onclick="setModeFromMenu('video')">
    🎬 Видео генерациясы
  </button>

  <button
    class="menu-item"
    onclick="setModeFromMenu('search')">
    🔎 Web Search
  </button>

</aside>


<!-- SETTINGS -->

<section
  id="settings"
  class="settings">

  <div class="settings-header">

    <h2>⚙️ Баптаулар</h2>

    <button
      class="icon-btn"
      onclick="hideSettings()">
      ✕
    </button>

  </div>


  <div class="setting-card">

    <label>Тіл</label>

    <select id="languageSetting">

      <option value="kk">
        Қазақша
      </option>

      <option value="ru">
        Русский
      </option>

      <option value="en">
        English
      </option>

    </select>

  </div>


  <div class="setting-card">

    <label>Сурет сапасы</label>

    <select id="imageQuality">

      <option value="standard">
        Standard
      </option>

      <option value="high">
        High
      </option>

    </select>

  </div>


  <div class="setting-card">

    <label>Видео ұзақтығы</label>

    <select id="videoDuration">

      <option value="5">
        5 секунд
      </option>

      <option value="10">
        10 секунд
      </option>

      <option value="15">
        15 секунд
      </option>

    </select>

  </div>


  <div class="setting-card">

    <label>Видео форматы</label>

    <select id="videoRatio">

      <option value="16:9">
        16:9
      </option>

      <option value="9:16">
        9:16
      </option>

      <option value="1:1">
        1:1
      </option>

    </select>

  </div>

</section>


<script>

/*
============================================================
 CONFIG
============================================================
*/

const WORKER_URL =
  "https://my-ai-backend.razinavsegda84.workers.dev";


/*
============================================================
 STATE
============================================================
*/

let currentMode = "chat";

let chatHistory = [];

let selectedImage = null;

let selectedFileText = "";

let selectedFileName = "";

let mediaRecorder = null;

let audioChunks = [];


/*
============================================================
 ELEMENTS
============================================================
*/

const chat =
  document.getElementById("chat");

const input =
  document.getElementById("messageInput");

const statusEl =
  document.getElementById("status");

const preview =
  document.getElementById("preview");


/*
============================================================
 STATUS
============================================================
*/

function setStatus(text) {

  statusEl.textContent =
    text || "";

}


/*
============================================================
 MENU
============================================================
*/

function openMenu() {

  document
    .getElementById("sideMenu")
    .classList.add("show");

  document
    .getElementById("overlay")
    .classList.add("show");

}


function closeMenu() {

  document
    .getElementById("sideMenu")
    .classList.remove("show");

  document
    .getElementById("overlay")
    .classList.remove("show");

}


/*
============================================================
 SETTINGS
============================================================
*/

function showSettings() {

  closeMenu();

  document
    .getElementById("settings")
    .classList.add("show");

}


function hideSettings() {

  document
    .getElementById("settings")
    .classList.remove("show");

}


/*
============================================================
 MODE
============================================================
*/

function setMode(mode, button) {

  currentMode =
    mode;

  document
    .querySelectorAll(".mode-btn")
    .forEach(
      b => b.classList.remove("active")
    );

  if (button) {
    button.classList.add("active");
  }


  if (mode === "image") {

    input.placeholder =
      "Қандай сурет жасаймыз?";

  }

  else if (mode === "video") {

    input.placeholder =
      "Қандай видео жасаймыз?";

  }

  else if (mode === "search") {

    input.placeholder =
      "Іздеу сұрауын жазыңыз...";

  }

  else {

    input.placeholder =
      "Хабарлама жазыңыз...";

  }

}


function setModeFromMenu(mode) {

  closeMenu();

  currentMode =
    mode;

  document
    .querySelectorAll(".mode-btn")
    .forEach(
      b => b.classList.remove("active")
    );

  const buttons =
    document.querySelectorAll(".mode-btn");

  buttons.forEach(
    b => {

      if (
        (mode === "image" &&
         b.textContent.includes("Сурет")) ||

        (mode === "video" &&
         b.textContent.includes("Видео")) ||

        (mode === "search" &&
         b.textContent.includes("Іздеу"))
      ) {

        b.classList.add("active");

      }

    }
  );

  setMode(mode);

}


/*
============================================================
 NEW CHAT
============================================================
*/

function newChat() {

  chatHistory = [];

  selectedImage = null;

  selectedFileText = "";

  selectedFileName = "";

  chat.innerHTML = `

    <div class="welcome" id="welcome">

      <h1>My AI</h1>

      <div>
        Қазақша AI көмекшіңіз
      </div>

    </div>

  `;

  preview.style.display =
    "none";

  preview.innerHTML =
    "";

  setStatus("");

}


/*
============================================================
 ADD USER MESSAGE
============================================================
*/

function addUserMessage(text) {

  const div =
    document.createElement("div");

  div.className =
    "message user";

  div.innerHTML = `

    <div class="bubble"></div>

  `;

  div.querySelector(".bubble")
    .textContent =
    text;

  chat.appendChild(div);

  chat.scrollTop =
    chat.scrollHeight;

}


/*
============================================================
 ADD AI MESSAGE
============================================================
*/

function addAIMessage(text) {

  const div =
    document.createElement("div");

  div.className =
    "message assistant";

  div.innerHTML = `

    <div>

      <div class="bubble"></div>

      <div class="message-tools">

        <button
          class="small-btn"
          onclick="speakAnswer(this)">
          🔊 Тыңдау
        </button>

      </div>

    </div>

  `;

  div.querySelector(".bubble")
    .textContent =
    text;

  chat.appendChild(div);

  chat.scrollTop =
    chat.scrollHeight;

}


/*
============================================================
 IMAGE MESSAGE
============================================================
*/

function addImageMessage(image) {

  const div =
    document.createElement("div");

  div.className =
    "message assistant";

  div.innerHTML = `

    <div>

      <div class="bubble">

        <img
          class="generated-image"
          src="${image}"
          alt="Generated image">

      </div>

      <div class="message-tools">

        <button
          class="small-btn"
          onclick="speakAnswer(this)">
          🔊 Тыңдау
        </button>

      </div>

    </div>

  `;

  chat.appendChild(div);

  chat.scrollTop =
    chat.scrollHeight;

}


/*
============================================================
 VIDEO MESSAGE
============================================================
*/

function addVideoMessage(video) {

  const div =
    document.createElement("div");

  div.className =
    "message assistant";

  div.innerHTML = `

    <div>

      <div class="bubble">

        <video
          class="generated-video"
          controls
          playsinline
          src="${video}">
        </video>

      </div>

    </div>

  `;

  chat.appendChild(div);

  chat.scrollTop =
    chat.scrollHeight;

}


/*
============================================================
 SPEECH
============================================================
*/

async function speakAnswer(button) {

  const message =
    button
      .closest(".message")
      .querySelector(".bubble")
      .textContent;

  if (!message) return;

  try {

    setStatus(
      "🔊 Дауыс дайындалып жатыр..."
    );

    const response =
      await fetch(
        WORKER_URL,
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              action: "tts",

              text: message

            })

        }
      );


    if (!response.ok) {

      throw new Error(
        "TTS HTTP " +
        response.status
      );

    }


    const contentType =
      response.headers
        .get("content-type") || "";


    if (
      contentType
        .includes("audio")
    ) {

      const blob =
        await response.blob();

      const audioUrl =
        URL.createObjectURL(blob);

      const audio =
        new Audio(audioUrl);

      await audio.play();

      audio.onended =
        () => URL.revokeObjectURL(audioUrl);

      setStatus("");

      return;

    }


    const data =
      await response.json();


    if (data.audio) {

      const audio =
        new Audio(
          data.audio.startsWith("data:")
            ? data.audio
            : "data:audio/mpeg;base64," +
              data.audio
        );

      await audio.play();

      setStatus("");

      return;

    }


    throw new Error(
      "TTS audio табылмады."
    );


  } catch (err) {

    console.error(err);

    setStatus(
      "TTS қатесі: " +
      err.message
    );

  }

}


/*
============================================================
 SEND MESSAGE
============================================================
*/

async function sendMessage() {

  const text =
    input.value.trim();


  if (
    !text &&
    !selectedImage &&
    !selectedFileText
  ) {

    return;

  }


  if (currentMode === "image") {

    await generateImage(text);

    return;

  }


  if (currentMode === "video") {

    await generateVideo(text);

    return;

  }


  if (currentMode === "search") {

    await searchWeb(text);

    return;

  }


  addUserMessage(
    text ||
    "Суретті/файлды талда."
  );


  input.value =
    "";


  setStatus(
    "⏳ AI жауап дайындап жатыр..."
  );


  try {

    const body = {

      action:
        "chat",

      message:
        text,

      history:
        chatHistory

    };


    if (selectedImage) {

      body.image =
        selectedImage;

    }


    if (selectedFileText) {

      body.fileText =
        selectedFileText;

      body.fileName =
        selectedFileName;

    }


    const response =
      await fetch(

        WORKER_URL,

        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify(body)

        }

      );


    const data =
      await response.json();


    if (!response.ok || !data.ok) {

      throw new Error(
        data.error ||
        "Сервер қатесі"
      );

    }


    addAIMessage(
      data.answer || ""
    );


    chatHistory.push({

      role:
        "user",

      content:
        text

    });


    chatHistory.push({

      role:
        "assistant",

      content:
        data.answer || ""

    });


    chatHistory =
      chatHistory.slice(-20);


    clearAttachment();


    setStatus("");


  } catch (err) {

    console.error(err);

    addAIMessage(
      "Қате: " +
      err.message
    );

    setStatus("");

  }

}


/*
============================================================
 IMAGE GENERATION
============================================================
*/

async function generateImage(text) {

  if (!text) {

    setStatus(
      "Суретті сипаттап жазыңыз."
    );

    return;

  }


  addUserMessage(
    "🎨 " + text
  );


  input.value =
    "";


  setStatus(
    "🎨 Сурет жасалып жатыр..."
  );


  try {

    const response =
      await fetch(

        WORKER_URL,

        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              action:
                "image",

              prompt:
                text

            })

        }

      );


    const data =
      await response.json();


    if (
      !response.ok ||
      !data.ok
    ) {

      throw new Error(
        data.error ||
        "Сурет жасау қатесі"
      );

    }


    if (!data.image) {

      throw new Error(
        "Сурет деректері жоқ."
      );

    }


    addImageMessage(
      data.image
    );


    setStatus("");


  } catch (err) {

    console.error(err);

    addAIMessage(
      "Сурет жасау қатесі: " +
      err.message
    );

    setStatus("");

  }

}


/*
============================================================
 VIDEO GENERATION
============================================================
*/

async function generateVideo(text) {

  if (!text) {

    setStatus(
      "Видео сипаттамасын жазыңыз."
    );

    return;

  }


  addUserMessage(
    "🎬 " + text
  );


  input.value =
    "";


  setStatus(
    "🎬 Видео жасалып жатыр..."
  );


  try {

    const duration =
      Number(
        document
          .getElementById("videoDuration")
          .value
      );


    const aspectRatio =
      document
        .getElementById("videoRatio")
        .value;


    const response =
      await fetch(

        WORKER_URL,

        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              action:
                "video",

              prompt:
                text,

              duration,

              aspect_ratio:
                aspectRatio

            })

        }

      );


    const data =
      await response.json();


    if (
      !response.ok ||
      !data.ok
    ) {

      throw new Error(

        data.error ||

        "Видео генерациясы қосылмаған."

      );

    }


    if (
      data.video
    ) {

      addVideoMessage(
        data.video
      );

    }

    else if (
      data.url
    ) {

      addVideoMessage(
        data.url
      );

    }

    else {

      throw new Error(
        "Видео URL қайтарылмады."
      );

    }


    setStatus("");


  } catch (err) {

    console.error(err);

    addAIMessage(

      "Видео жасау қатесі: " +
      err.message

    );

    setStatus("");

  }

}


/*
============================================================
 WEB SEARCH
============================================================
*/

async function searchWeb(text) {

  if (!text) {

    setStatus(
      "Іздеу сұрауын жазыңыз."
    );

    return;

  }


  addUserMessage(
    "🔎 " + text
  );


  input.value =
    "";


  setStatus(
    "🔎 Іздеп жатырмын..."
  );


  try {

    const response =
      await fetch(

        WORKER_URL,

        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              action:
                "search",

              query:
                text

            })

        }

      );


    const data =
      await response.json();


    if (
      !response.ok ||
      !data.ok
    ) {

      throw new Error(
        data.error ||
        "Search қатесі"
      );

    }


    if (
      data.configured === false
    ) {

      addAIMessage(
        "🔎 Web Search API әлі қосылмаған."
      );

    }

    else {

      addAIMessage(
        JSON.stringify(
          data.results,
          null,
          2
        )
      );

    }


    setStatus("");


  } catch (err) {

    addAIMessage(
      "Іздеу қатесі: " +
      err.message
    );

    setStatus("");

  }

}


/*
============================================================
 FILE INPUT
============================================================
*/

document
  .getElementById("fileInput")
  .addEventListener(
    "change",
    handleFile
  );


async function handleFile(event) {

  const file =
    event.target.files[0];


  if (!file) return;


  selectedFileName =
    file.name;


  if (
    file.type.startsWith("image/")
  ) {

    const reader =
      new FileReader();


    reader.onload =
      () => {

        selectedImage =
          reader.result;

        preview.style.display =
          "block";

        preview.innerHTML = `

          <img
            src="${selectedImage}">
          
        `;

        setStatus(
          "🖼️ Сурет таңдалды."
        );

      };


    reader.readAsDataURL(file);

    return;

  }


  try {

    selectedFileText =
      await file.text();


    selectedFileText =
      selectedFileText.slice(
        0,
        30000
      );


    preview.style.display =
      "block";

    preview.innerHTML = `

      📄 ${file.name}

    `;


    setStatus(
      "📄 Файл дайын."
    );


  } catch (err) {

    setStatus(
      "Файлды оқу мүмкін болмады."
    );

  }

}


/*
============================================================
 CLEAR ATTACHMENT
============================================================
*/

function clearAttachment() {

  selectedImage =
    null;

  selectedFileText =
    "";

  selectedFileName =
    "";

  preview.style.display =
    "none";

  preview.innerHTML =
    "";

  document
    .getElementById("fileInput")
    .value =
    "";

}


/*
============================================================
 MICROPHONE
============================================================
*/

async function toggleRecording() {

  if (
    mediaRecorder &&
    mediaRecorder.state === "recording"
  ) {

    mediaRecorder.stop();

    return;

  }


  try {

    const stream =
      await navigator
        .mediaDevices
        .getUserMedia({
          audio: true
        });


    audioChunks = [];


    let mimeType =
      "";


    if (
      MediaRecorder.isTypeSupported(
        "audio/webm;codecs=opus"
      )
    ) {

      mimeType =
        "audio/webm;codecs=opus";

    }

    else if (
      MediaRecorder.isTypeSupported(
        "audio/mp4"
      )
    ) {

      mimeType =
        "audio/mp4";

    }


    mediaRecorder =
      new MediaRecorder(
        stream,
        mimeType
          ? { mimeType }
          : undefined
      );


    mediaRecorder.ondataavailable =
      event => {

        if (
          event.data.size > 0
        ) {

          audioChunks.push(
            event.data
          );

        }

      };


    mediaRecorder.onstop =
      async () => {

        stream
          .getTracks()
          .forEach(
            track =>
              track.stop()
          );


        const blob =
          new Blob(
            audioChunks,
            {
              type:
                mediaRecorder.mimeType
            }
          );


        await sendAudio(
          blob
        );

      };


    mediaRecorder.start();

    document
      .getElementById("micBtn")
      .textContent =
      "⏹️";


    setStatus(
      "🎤 Тыңдап тұрмын..."
    );


  } catch (err) {

    console.error(err);

    setStatus(
      "Микрофонға рұқсат берілмеді."
    );

  }

}


/*
============================================================
 SEND AUDIO
============================================================
*/

async function sendAudio(blob) {

  try {

    const base64 =
      await blobToBase64(
        blob
      );


    setStatus(
      "📝 Дауысты мәтінге айналдырып жатырмын..."
    );


    const response =
      await fetch(

        WORKER_URL,

        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              action:
                "transcribe",

              audioBase64:
                base64

            })

        }

      );


    const data =
      await response.json();


    if (
      !response.ok ||
      !data.ok
    ) {

      throw new Error(
        data.error ||
        "Аудио қатесі"
      );

    }


    input.value =
      data.text || "";


    document
      .getElementById("micBtn")
      .textContent =
      "🎤";


    setStatus(
      "Мәтін дайын."
    );


    if (data.text) {

      await sendMessage();

    }


  } catch (err) {

    console.error(err);

    document
      .getElementById("micBtn")
      .textContent =
      "🎤";


    setStatus(
      "Дауыс қатесі: " +
      err.message
    );

  }

}


/*
============================================================
 BLOB → BASE64
============================================================
*/

function blobToBase64(blob) {

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();


      reader.onloadend =
        () => {

          const result =
            reader.result;

          resolve(
            String(result)
              .split(",")[1]
          );

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(
        blob
      );

    }
  );

}
