<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  height: 60px;
  border-bottom: 1px solid #222;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: bold;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  padding-bottom: 100px;
}

.welcome {
  text-align: center;
  margin-top: 25vh;
  color: #888;
}

.welcome h1 {
  color: #fff;
  font-size: 32px;
}

.message {
  max-width: 85%;
  padding: 12px 16px;
  margin: 12px 0;
  border-radius: 18px;
  line-height: 1.5;
  white-space: pre-wrap;
}

.user {
  background: #2563eb;
  margin-left: auto;
}

.ai {
  background: #1d1d1d;
  margin-right: auto;
}

.message img {
  max-width: 100%;
  max-height: 350px;
  border-radius: 14px;
  margin-bottom: 8px;
}

.bottom {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  padding: 10px;
  background: #000;
  border-top: 1px solid #222;
  display: flex;
  gap: 8px;
}

textarea {
  flex: 1;
  resize: none;
  background: #1b1b1b;
  color: white;
  border: 1px solid #333;
  border-radius: 18px;
  padding: 12px;
  font-size: 16px;
  outline: none;
}

button {
  border: none;
  border-radius: 50%;
  width: 48px;
  height: 48px;
  background: white;
  color: black;
  font-size: 20px;
}

#file {
  display: none;
}

.file-button {
  background: #222;
  color: white;
  font-size: 22px;
}

#preview {
  display: none;
  position: fixed;
  bottom: 70px;
  left: 10px;
  background: #222;
  padding: 8px;
  border-radius: 12px;
}

#preview img {
  width: 70px;
  height: 70px;
  object-fit: cover;
  border-radius: 8px;
}
</style>
</head>

<body>

<header>🤖 My AI</header>

<div id="chat">

  <div class="welcome" id="welcome">
    <h1>Сәлем! 👋</h1>
    <p>Мен — My AI</p>
    <p>Сұрақ қойыңыз немесе сурет жіберіңіз.</p>
  </div>

</div>

<div id="preview">
  <img id="previewImage">
</div>

<div class="bottom">

  <button
    class="file-button"
    onclick="document.getElementById('file').click()">
    📎
  </button>

  <input
    type="file"
    id="file"
    accept="image/*"
    onchange="selectImage(event)">

  <textarea
    id="input"
    placeholder="Хабарлама жазыңыз..."
    rows="1">
  </textarea>

  <button onclick="sendMessage()">➤</button>

</div>

<script>

const WORKER_URL =
  "https://my-ai-backend.razinavsegda84.workers.dev";

let selectedImage = null;

let messages = [];


/* СУРЕТ ТАҢДАУ */

function selectImage(event) {

  const file = event.target.files[0];

  if (!file) return;

  selectedImage = file;

  const reader = new FileReader();

  reader.onload = function(e) {

    document.getElementById("previewImage").src =
      e.target.result;

    document.getElementById("preview").style.display =
      "block";
  };

  reader.readAsDataURL(file);
}


/* ХАБАРЛАМА ҚОСУ */

function addMessage(text, type, image = null) {

  const chat =
    document.getElementById("chat");

  const div =
    document.createElement("div");

  div.className =
    "message " + type;

  if (image) {

    const img =
      document.createElement("img");

    img.src = image;

    div.appendChild(img);
  }

  if (text) {

    const p =
      document.createElement("div");

    p.textContent = text;

    div.appendChild(p);
  }

  chat.appendChild(div);

  chat.scrollTop =
    chat.scrollHeight;

  return div;
}


/* ЖІБЕРУ */

async function sendMessage() {

  const input =
    document.getElementById("input");

  const text =
    input.value.trim();

  if (!text && !selectedImage)
    return;

  document.getElementById("welcome").style.display =
    "none";


  let imageData = null;

  /* СУРЕТТІ DATA URL-ҒА АЙНАЛДЫРУ */

  if (selectedImage) {

    imageData =
      await fileToDataURL(selectedImage);
  }


  /* USER ХАБАРЛАМАСЫ */

  addMessage(
    text || "Осы суретті талдап бер.",
    "user",
    imageData
  );


  input.value = "";


  document.getElementById("preview").style.display =
    "none";


  const loading =
    addMessage(
      "AI суретті қарап жатыр...",
      "ai"
    );


  try {

    let body = {
      message:
        text ||
        "Осы суретте не бар екенін қазақ тілінде түсіндір."
    };


    /* СУРЕТ БАР */

    if (imageData) {

      body.image = imageData;
    }


    /* МӘТІН БАР */

    if (!imageData) {

      messages.push({
        role: "user",
        content: text
      });

      body.messages =
        messages;
    }


    const response =
      await fetch(
        WORKER_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(body)
        }
      );


    const data =
      await response.json();


    loading.remove();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Сервер қатесі"
      );
    }


const answer =
    typeof data.answer === "string"
        ? data.answer
        : JSON.stringify(data.answer) || "Жауап алынбады.";


    addMessage(
      answer,
      "ai"
    );


    if (!imageData) {

      messages.push({
        role: "assistant",
        content: answer
      });

    }


  } catch (error) {

    loading.remove();

    addMessage(
      "Қате: " + error.message,
      "ai"
    );
  }


  selectedImage = null;

  document.getElementById("file").value = "";
}


/* FILE → DATA URL */

function fileToDataURL(file) {

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();

      reader.onload =
        () => resolve(reader.result);

      reader.onerror =
        reject;

      reader.readAsDataURL(file);
    }
  );
}


/* ENTER */

document
  .getElementById("input")
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();
      }

    }
  );

</script>

</body>
</html>
