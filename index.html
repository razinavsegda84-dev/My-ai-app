<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* HEADER */

    header {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid #242424;
      background: #000;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 21px;
      font-weight: 700;
    }

    .new-chat {
      background: #1d1d1d;
      color: white;
      border: 1px solid #333;
      border-radius: 20px;
      padding: 8px 14px;
      cursor: pointer;
      font-size: 14px;
    }

    .new-chat:hover {
      background: #292929;
    }

    /* CHAT */

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      padding-bottom: 130px;
      max-width: 900px;
      width: 100%;
      margin: auto;
    }

    .welcome {
      text-align: center;
      margin-top: 23vh;
      color: #888;
    }

    .welcome h1 {
      color: white;
      font-size: 34px;
      margin-bottom: 10px;
    }

    .welcome p {
      margin: 6px;
    }

    /* MESSAGE */

    .message {
      max-width: 82%;
      padding: 12px 16px;
      margin: 12px 0;
      border-radius: 20px;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .user {
      background: #2b2b2b;
      margin-left: auto;
      border-bottom-right-radius: 5px;
    }

    .ai {
      background: #111;
      margin-right: auto;
      border-bottom-left-radius: 5px;
    }

    /* MEDIA */

    .message img,
    .message video {
      display: block;
      max-width: 100%;
      max-height: 400px;
      border-radius: 15px;
      margin-bottom: 8px;
    }

    .file-name {
      color: #aaa;
      font-size: 13px;
      margin-top: 5px;
    }

    /* BOTTOM */

    .bottom-wrapper {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: linear-gradient(
        to top,
        #000 75%,
        transparent
      );
      padding: 15px;
      z-index: 20;
    }

    .bottom {
      max-width: 850px;
      margin: auto;
      background: #1b1b1b;
      border: 1px solid #333;
      border-radius: 25px;
      padding: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* FILE BUTTON */

    .attach {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: #aaa;
      font-size: 23px;
      cursor: pointer;
    }

    .attach:hover {
      background: #2a2a2a;
      color: white;
    }

    /* INPUT */

    input[type="text"] {
      flex: 1;
      min-width: 0;
      background: transparent;
      color: white;
      border: none;
      outline: none;
      padding: 11px 5px;
      font-size: 16px;
    }

    input::placeholder {
      color: #777;
    }

    /* SEND */

    .send {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      border: none;
      border-radius: 50%;
      background: white;
      color: black;
      font-size: 19px;
      cursor: pointer;
    }

    .send:hover {
      background: #ddd;
    }

    /* FILE PREVIEW */

    .preview {
      max-width: 850px;
      margin: 0 auto 8px;
      display: none;
    }

    .preview-box {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 15px;
      padding: 8px 12px;
    }

    .preview-name {
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #ccc;
      font-size: 13px;
    }

    .remove-file {
      border: none;
      background: transparent;
      color: #aaa;
      font-size: 18px;
      cursor: pointer;
    }

    .remove-file:hover {
      color: white;
    }

    /* HIDDEN FILE INPUT */

    #fileInput {
      display: none;
    }

    /* MOBILE */

    @media (max-width: 600px) {

      header {
        height: 55px;
        padding: 0 14px;
      }

      .logo {
        font-size: 19px;
      }

      .chat {
        padding: 15px;
        padding-bottom: 125px;
      }

      .welcome {
        margin-top: 20vh;
      }

      .welcome h1 {
        font-size: 28px;
      }

      .message {
        max-width: 90%;
      }

      .bottom-wrapper {
        padding: 10px;
      }

      .bottom {
        padding: 6px;
      }

      input[type="text"] {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">🤖 My AI</div>
  <button class="new-chat" onclick="newChat()">＋ New Chat</button>
</header>

<div class="chat" id="chat">

  <div class="welcome" id="welcome">
    <h1>Сәлем! 👋</h1>
    <p>Мен — My AI</p>
    <p>Сұрақ қойыңыз немесе сурет/видео жіберіңіз.</p>
  </div>

</div>

<div class="bottom-wrapper">

  <div class="preview" id="preview">
    <div class="preview-box">
      <span id="previewIcon">📎</span>
      <span class="preview-name" id="previewName"></span>
      <button class="remove-file" onclick="removeFile()">×</button>
    </div>
  </div>

  <div class="bottom">

    <button
      class="attach"
      onclick="document.getElementById('fileInput').click()">
      ＋
    </button>

    <input
      type="file"
      id="fileInput"
      accept="image/*,video/*"
      onchange="selectFile(event)"
    >

    <input
      type="text"
      id="input"
      placeholder="Хабарлама жаз..."
      autocomplete="off"
    >

    <button class="send" onclick="sendMessage()">➤</button>

  </div>

</div>

<script>

let selectedFile = null;

/* FILE SELECT */

function selectFile(event) {

  const file = event.target.files[0];

  if (!file) return;

  selectedFile = file;

  const preview = document.getElementById("preview");
  const previewName = document.getElementById("previewName");
  const previewIcon = document.getElementById("previewIcon");

  previewName.textContent = file.name;

  if (file.type.startsWith("image/")) {
    previewIcon.textContent = "🖼️";
  }
  else if (file.type.startsWith("video/")) {
    previewIcon.textContent = "🎥";
  }
  else {
    previewIcon.textContent = "📎";
  }

  preview.style.display = "block";
}


/* REMOVE FILE */

function removeFile() {

  selectedFile = null;

  document.getElementById("fileInput").value = "";
  document.getElementById("preview").style.display = "none";
}


/* SEND MESSAGE */

function sendMessage() {

  const input = document.getElementById("input");
  const chat = document.getElementById("chat");
  const welcome = document.getElementById("welcome");

  const text = input.value.trim();

  if (!text && !selectedFile) return;

  if (welcome) {
    welcome.remove();
  }

  /* USER MESSAGE */

  const userMessage = document.createElement("div");
  userMessage.className = "message user";

  /* FILE */

  if (selectedFile) {

    const url = URL.createObjectURL(selectedFile);

    if (selectedFile.type.startsWith("image/")) {

      const image = document.createElement("img");

      image.src = url;
      image.alt = selectedFile.name;

      userMessage.appendChild(image);

    }

    else if (selectedFile.type.startsWith("video/")) {

      const video = document.createElement("video");

      video.src = url;
      video.controls = true;

      userMessage.appendChild(video);
    }

    const fileName = document.createElement("div");

    fileName.className = "file-name";
    fileName.textContent = selectedFile.name;

    userMessage.appendChild(fileName);
  }

  /* TEXT */

  if (text) {

    const textElement = document.createElement("div");

    textElement.textContent = text;

    userMessage.appendChild(textElement);
  }

  chat.appendChild(userMessage);

  /* CLEAR */

  input.value = "";

  removeFile();

  /* TEMP AI RESPONSE */

  setTimeout(() => {

    const aiMessage = document.createElement("div");

    aiMessage.className = "message ai";

    aiMessage.textContent =
      "Файлды қабылдадым 🤖\n\n" +
      "Келесі кезеңде мен осы суретті немесе видеоны AI арқылы талдай алатын боламын.";

    chat.appendChild(aiMessage);

    chat.scrollTop = chat.scrollHeight;

  }, 600);

  chat.scrollTop = chat.scrollHeight;
}


/* NEW CHAT */

function newChat() {

  const chat = document.getElementById("chat");

  chat.innerHTML = `
    <div class="welcome" id="welcome">
      <h1>Сәлем! 👋</h1>
      <p>Мен — My AI</p>
      <p>Сұрақ қойыңыз немесе сурет/видео жіберіңіз.</p>
    </div>
  `;

  removeFile();

}


/* ENTER */

document.getElementById("input").addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {

      event.preventDefault();

      sendMessage();

    }

  }
);

</script>

</body>
</html>
