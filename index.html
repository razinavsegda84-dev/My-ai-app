<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 60px;
      display: flex;
      align-items: center;
      padding: 0 18px;
      border-bottom: 1px solid #333;
      font-size: 20px;
      font-weight: bold;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .welcome {
      text-align: center;
      margin-top: 25vh;
      color: #aaa;
    }

    .welcome h1 {
      color: white;
      font-size: 30px;
    }

    .message {
      max-width: 85%;
      padding: 12px 16px;
      margin: 10px 0;
      border-radius: 18px;
      line-height: 1.5;
    }

    .user {
      background: #333;
      margin-left: auto;
    }

    .ai {
      background: #1d1d1d;
      margin-right: auto;
    }

    .bottom {
      padding: 12px;
      border-top: 1px solid #333;
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      background: #222;
      color: white;
      border: 1px solid #444;
      border-radius: 22px;
      padding: 13px 16px;
      font-size: 16px;
      outline: none;
    }

    button {
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 50%;
      background: white;
      color: black;
      font-size: 20px;
    }
  </style>
</head>

<body>

<header>🤖 My AI</header>

<div class="chat" id="chat">
  <div class="welcome" id="welcome">
    <h1>Сәлем! 👋</h1>
    <p>Менің AI көмекшімін.</p>
    <p>Маған кез келген сұрақ қой.</p>
  </div>
</div>

<div class="bottom">
  <input id="input" type="text" placeholder="Хабарлама жаз...">
  <button onclick="sendMessage()">➤</button>
</div>

<script>
function sendMessage() {
  const input = document.getElementById("input");
  const chat = document.getElementById("chat");
  const welcome = document.getElementById("welcome");

  const text = input.value.trim();
  if (!text) return;

  if (welcome) welcome.remove();

  const userMessage = document.createElement("div");
  userMessage.className = "message user";
  userMessage.textContent = text;
  chat.appendChild(userMessage);

  input.value = "";

  const aiMessage = document.createElement("div");
  aiMessage.className = "message ai";
  aiMessage.textContent =
    "Сұрағыңызды алдым. AI ядросын қазір қосып жатырмыз 🤖";
  chat.appendChild(aiMessage);

  chat.scrollTop = chat.scrollHeight;
}

document.getElementById("input").addEventListener("keydown", function(e) {
  if (e.key === "Enter") sendMessage();
});
</script>

</body>
</html>
