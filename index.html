<!DOCTYPE html>
<html lang="kk">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1"
>

<title>My AI</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#0b0f14;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,
    "Segoe UI",Arial,sans-serif;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  height:100vh;
  display:flex;
  flex-direction:column;
}

header{
  height:58px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  border-bottom:1px solid #202833;
  background:#10151c;
}

.logo{
  font-size:20px;
  font-weight:700;
}

.headerButtons{
  display:flex;
  gap:7px;
}

.iconBtn{
  width:40px;
  height:40px;
  border:0;
  border-radius:12px;
  background:#1b222c;
  color:white;
  font-size:20px;
}

#chat{
  flex:1;
  overflow-y:auto;
  padding:16px 12px 170px;
}

.welcome{
  max-width:650px;
  margin:50px auto;
  text-align:center;
}

.welcome h1{
  font-size:30px;
  margin-bottom:10px;
}

.welcome p{
  color:#9ba5b3;
}

.message{
  max-width:850px;
  margin:12px auto;
  display:flex;
}

.message.user{
  justify-content:flex-end;
}

.bubble{
  max-width:90%;
  padding:12px 15px;
  border-radius:18px;
  line-height:1.5;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}

.user .bubble{
  background:#1d5fd1;
}

.ai .bubble{
  background:#171d25;
  border:1px solid #242d38;
}

.message img,
.message video{
  max-width:100%;
  border-radius:14px;
  margin-top:8px;
  display:block;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:8px;
}

.smallBtn{
  border:0;
  border-radius:10px;
  padding:7px 10px;
  background:#252d38;
  color:white;
}

.composer{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  padding:10px;
  background:rgba(11,15,20,.96);
  border-top:1px solid #202833;
  backdrop-filter:blur(12px);
  z-index:20;
}

.composerInner{
  max-width:900px;
  margin:auto;
}

.preview{
  display:none;
  margin-bottom:8px;
  position:relative;
}

.preview img{
  width:110px;
  height:110px;
  object-fit:cover;
  border-radius:12px;
}

.preview video{
  width:180px;
  max-height:120px;
  border-radius:12px;
}

.removePreview{
  position:absolute;
  left:85px;
  top:-6px;
  border:0;
  background:#d92d20;
  color:white;
  width:28px;
  height:28px;
  border-radius:50%;
}

.inputRow{
  display:flex;
  gap:7px;
  align-items:flex-end;
}

textarea{
  flex:1;
  resize:none;
  min-height:46px;
  max-height:140px;
  border:1px solid #293340;
  border-radius:15px;
  padding:12px;
  color:white;
  background:#151b23;
  outline:none;
}

.send{
  width:48px;
  height:48px;
  border:0;
  border-radius:15px;
  background:#2563eb;
  color:white;
  font-size:20px;
}

.toolRow{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding-top:8px;
}

.tool{
  flex-shrink:0;
  border:1px solid #293340;
  background:#151b23;
  color:white;
  padding:8px 11px;
  border-radius:11px;
}

.tool.recording{
  background:#a51d2d;
  border-color:#d92d20;
}

.status{
  text-align:center;
  color:#8e99a8;
  font-size:12px;
  min-height:18px;
  padding-top:5px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:50;
  background:rgba(0,0,0,.75);
  padding:15px;
}

.modalBox{
  max-width:600px;
  max-height:90vh;
  overflow:auto;
  margin:30px auto;
  background:#121820;
  border:1px solid #293340;
  border-radius:18px;
  padding:18px;
}

.modalHeader{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}

.close{
  border:0;
  background:#252d38;
  color:#fff;
  border-radius:10px;
  width:38px;
  height:38px;
}

.setting{
  padding:14px 0;
  border-bottom:1px solid #252d38;
}

.setting label{
  display:block;
  margin-bottom:8px;
  color:#d9dee7;
}

.setting select,
.setting input{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid #293340;
  background:#171e27;
  color:white;
}

.canvasWrap{
  position:relative;
  max-width:100%;
  overflow:auto;
  background:#050505;
  border-radius:14px;
}

#editCanvas,
#maskCanvas{
  display:block;
  max-width:100%;
}

#maskCanvas{
  position:absolute;
  left:0;
  top:0;
  opacity:.45;
}

.editorButtons{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:10px;
}

</style>

</head>

<body>

<div class="app">

<header>

  <div class="logo">
    My AI
  </div>

  <div class="headerButtons">

    <button
      class="iconBtn"
      onclick="newChat()">
      ＋
    </button>

    <button
      class="iconBtn"
      onclick="openSettings()">
      ⚙️
    </button>

    <button
      class="iconBtn"
      onclick="openMenu()">
      ☰
    </button>

  </div>

</header>


<main id="chat">

  <div
    class="welcome"
    id="welcome">

    <h1>
      My AI
    </h1>

    <p>
      Қазақша сөйлесіңіз.
      Сурет, видео, файл және
      дауыспен жұмыс істей аласыз.
    </p>

  </div>

</main>


<div class="composer">

  <div class="composerInner">

    <div
      id="preview"
      class="preview">
    </div>


    <div class="inputRow">

      <button
        class="iconBtn"
        onclick="document
          .getElementById('fileInput')
          .click()">
        📎
      </button>


      <textarea
        id="message"
        placeholder="Хабарлама жазыңыз..."
        onkeydown="handleKey(event)"
      ></textarea>


      <button
        class="send"
        onclick="sendMessage()">
        ➤
      </button>

    </div>


    <div class="toolRow">

      <button
        class="tool"
        onclick="document
          .getElementById('imageInput')
          .click()">
        🖼️ Сурет
      </button>


      <button
        class="tool"
        onclick="openImageEditor()">
        ✏️ Өңдеу
      </button>


      <button
        class="tool"
        onclick="generateImage()">
        🎨 Сурет жасау
      </button>


      <button
        class="tool"
        onclick="generateVideo()">
        🎬 Видео
      </button>


      <button
        id="recordButton"
        class="tool"
        onclick="toggleRecording()">
        🎤 Дауыс
      </button>


      <button
        class="tool"
        onclick="openSettings()">
        ⚙️ Баптаулар
      </button>

    </div>


    <div
      id="status"
      class="status">
    </div>

  </div>

</div>


<input
  id="imageInput"
  type="file"
  accept="image/*"
  hidden
  onchange="selectImage(event)"
>


<input
  id="fileInput"
  type="file"
  hidden
  onchange="selectFile(event)"
>


<input
  id="videoInput"
  type="file"
  accept="video/*"
  hidden
  onchange="selectVideo(event)"
>


<!-- SETTINGS -->

<div
  id="settingsModal"
  class="modal">

  <div class="modalBox">

    <div class="modalHeader">

      <h2>
        ⚙️ Баптаулар
      </h2>

      <button
        class="close"
        onclick="closeModal('settingsModal')">
        ×
      </button>

    </div>


    <div class="setting">

      <label>
        Жауап тілі
      </label>

      <select id="language">

        <option value="auto">
          Автоматты
        </option>

        <option value="kk">
          Қазақша
        </option>

        <option value="ru">
          Русский
        </option>

        <option value="en">
          English
        </option>

      </select>

    </div>


    <div class="setting">

      <label>
        Видео сапасы
      </label>

      <select id="videoResolution">

        <option value="hd">
          HD
        </option>

        <option value="fhd">
          FHD
        </option>

      </select>

    </div>


    <div class="setting">

      <label>
        Видео ұзақтығы
      </label>

      <select id="videoDuration">

        <option value="5">
          5 секунд
        </option>

        <option value="10">
          10 секунд
        </option>

        <option value="15">
          15 секунд
        </option>

        <option value="20">
          20 секунд
        </option>

      </select>

    </div>


    <div class="setting">

      <label>
        Видео дыбысы
      </label>

      <select id="videoAudio">

        <option value="true">
          Қосулы
        </option>

        <option value="false">
          Өшірулі
        </option>

      </select>

    </div>


    <button
      class="tool"
      onclick="saveSettings()">
      Сақтау
    </button>

  </div>

</div>


<!-- MENU -->

<div
  id="menuModal"
  class="modal">

  <div class="modalBox">

    <div class="modalHeader">

      <h2>
        ☰ Мәзір
      </h2>

      <button
        class="close"
        onclick="closeModal('menuModal')">
        ×
      </button>

    </div>


    <button
      class="tool"
      style="width:100%;margin-bottom:8px"
      onclick="newChat();closeModal('menuModal')">
      🆕 Жаңа чат
    </button>


    <button
      class="tool"
      style="width:100%;margin-bottom:8px"
      onclick="openSettings();closeModal('menuModal')">
      ⚙️ Баптаулар
    </button>


    <button
      class="tool"
      style="width:100%;margin-bottom:8px"
      onclick="clearHistory();closeModal('menuModal')">
      🗑️ Чатты тазалау
    </button>

  </div>

</div>


<!-- IMAGE EDITOR -->

<div
  id="editorModal"
  class="modal">

  <div class="modalBox">

    <div class="modalHeader">

      <h2>
        ✏️ Суретті өңдеу
      </h2>

      <button
        class="close"
        onclick="closeModal('editorModal')">
        ×
      </button>

    </div>


    <p style="color:#9ba5b3">

      Өшіргіңіз немесе өзгерткіңіз
      келетін объектінің үстінен
      саусағыңызбен бояңыз.

    </p>


    <div
      class="canvasWrap"
      id="canvasWrap">

      <canvas
        id="editCanvas">
      </canvas>

      <canvas
        id="maskCanvas">
      </canvas>

    </div>


    <div class="setting">

      <label>
        Не істеу керек?
      </label>

      <textarea
        id="editPrompt"
        style="width:100%"
        placeholder="Мысалы: көлікті алып таста, оның орнын жолмен табиғи толтыр"
      ></textarea>

    </div>


    <div class="editorButtons">

      <button
        class="tool"
        onclick="clearMask()">
        🧹 Масканы тазалау
      </button>


      <button
        class="tool"
        onclick="editImage()">
        ✨ AI өңдеу
      </button>

    </div>

  </div>

</div>


<script>


/* =========================================================
   CONFIG
========================================================= */

const WORKER_URL =
  "https://my-ai-backend.razinavsegda84.workers.dev";


/* =========================================================
   STATE
========================================================= */

let chatHistory = [];

let selectedImage = null;

let selectedFile = null;

let selectedVideo = null;

let editImageData = null;

let canvasScale = 1;

let mediaRecorder = null;

let audioChunks = [];

let isRecording = false;

let recordingTimer = null;


/* =========================================================
   ELEMENTS
========================================================= */

const chat =
  document.getElementById("chat");


const messageInput =
  document.getElementById("message");


const preview =
  document.getElementById("preview");


const statusBox =
  document.getElementById("status");


const recordButton =
  document.getElementById("recordButton");


/* =========================================================
   STATUS
========================================================= */

function setStatus(text){

  statusBox.textContent =
    text || "";

}


/* =========================================================
   MODALS
========================================================= */

function openSettings(){

  document
    .getElementById("settingsModal")
    .style.display =
      "block";

}


function openMenu(){

  document
    .getElementById("menuModal")
    .style.display =
      "block";

}


function closeModal(id){

  document
    .getElementById(id)
    .style.display =
      "none";

}


/* =========================================================
   SETTINGS
========================================================= */

function saveSettings(){

  localStorage.setItem(
    "myai_language",
    document.getElementById(
      "language"
    ).value
  );


  localStorage.setItem(
    "myai_video_resolution",
    document.getElementById(
      "videoResolution"
    ).value
  );


  localStorage.setItem(
    "myai_video_duration",
    document.getElementById(
      "videoDuration"
    ).value
  );


  localStorage.setItem(
    "myai_video_audio",
    document.getElementById(
      "videoAudio"
    ).value
  );


  setStatus(
    "Баптаулар сақталды."
  );


  closeModal(
    "settingsModal"
  );

}


function loadSettings(){

  const language =
    localStorage.getItem(
      "myai_language"
    );


  const resolution =
    localStorage.getItem(
      "myai_video_resolution"
    );


  const duration =
    localStorage.getItem(
      "myai_video_duration"
    );


  const audio =
    localStorage.getItem(
      "myai_video_audio"
    );


  if(language){

    document.getElementById(
      "language"
    ).value =
      language;

  }


  if(resolution){

    document.getElementById(
      "videoResolution"
    ).value =
      resolution;

  }


  if(duration){

    document.getElementById(
      "videoDuration"
    ).value =
      duration;

  }


  if(audio){

    document.getElementById(
      "videoAudio"
    ).value =
      audio;

  }

}


/* =========================================================
   NEW CHAT
========================================================= */

function newChat(){

  chatHistory = [];

  chat.innerHTML = `

    <div class="welcome">

      <h1>
        My AI
      </h1>

      <p>
        Жаңа чат басталды.
      </p>

    </div>

  `;


  setStatus("");

}


/* =========================================================
   CLEAR
========================================================= */

function clearHistory(){

  newChat();

}


/* =========================================================
   KEYBOARD
========================================================= */

function handleKey(event){

  if(
    event.key === "Enter" &&
    !event.shiftKey
  ){

    event.preventDefault();

    sendMessage();

  }

}


/* =========================================================
   ADD MESSAGE
========================================================= */

function addMessage(
  role,
  text,
  media = null
){

  const row =
    document.createElement("div");


  row.className =
    "message " +
    (
      role === "user"
        ? "user"
        : "ai"
    );


  const bubble =
    document.createElement("div");


  bubble.className =
    "bubble";


  if(text){

    const textNode =
      document.createElement("div");


    textNode.textContent =
      text;


    bubble.appendChild(
      textNode
    );

  }


  if(media){

    if(
      media.type === "image"
    ){

      const img =
        document.createElement(
          "img"
        );


      img.src =
        media.src;


      img.alt =
        "My AI image";


      bubble.appendChild(
        img
      );

    }


    if(
      media.type === "video"
    ){

      const video =
        document.createElement(
          "video"
        );


      video.src =
        media.src;


      video.controls =
        true;


      video.playsInline =
        true;


      video.preload =
        "metadata";


      bubble.appendChild(
        video
      );

    }

  }


  if(
    role === "assistant" &&
    text
  ){

    const actions =
      document.createElement(
        "div"
      );


    actions.className =
      "actions";


    const speak =
      document.createElement(
        "button"
      );


    speak.className =
      "smallBtn";


    speak.textContent =
      "🔊 Тыңдау";


    speak.onclick =
      () => speakText(text);


    actions.appendChild(
      speak
    );


    bubble.appendChild(
      actions
    );

  }


  row.appendChild(
    bubble
  );


  chat.appendChild(
    row
  );


  chat.scrollTop =
    chat.scrollHeight;

}


/* =========================================================
   IMAGE SELECT
========================================================= */

function selectImage(event){

  const file =
    event.target.files[0];


  if(!file)
    return;


  selectedImage =
    file;


  const reader =
    new FileReader();


  reader.onload =
    e => {

      preview.innerHTML = `

        <img
          src="${e.target.result}"
          alt="preview"
        >

        <button
          class="removePreview"
          onclick="removeImage()">
          ×
        </button>

      `;


      preview.style.display =
        "block";


      editImageData =
        e.target.result;

    };


  reader.readAsDataURL(file);


  event.target.value =
    "";

}


/* =========================================================
   REMOVE IMAGE
========================================================= */

function removeImage(){

  selectedImage =
    null;


  editImageData =
    null;


  preview.innerHTML =
    "";


  preview.style.display =
    "none";

}


/* =========================================================
   FILE
========================================================= */

async function selectFile(event){

  const file =
    event.target.files[0];


  if(!file)
    return;


  selectedFile =
    file;


  setStatus(
    "Файл оқылуда..."
  );


  try{

    if(
      file.type.startsWith(
        "text/"
      ) ||
      file.name.endsWith(
        ".txt"
      ) ||
      file.name.endsWith(
        ".csv"
      )
    ){

      const text =
        await file.text();


      addMessage(
        "user",
        "📎 " +
        file.name
      );


      const result =
        await callWorkerRaw({

          action:
            "file_chat",

          fileName:
            file.name,

          fileText:
            text

        });


      if(
        result &&
        result.answer
      ){

        addMessage(
          "assistant",
          result.answer
        );

      }

    }

    else{

      addMessage(
        "user",
        "📎 " +
        file.name
      );


      setStatus(
        "Бұл файл түрін оқу үшін арнайы parser қажет."
      );

    }

  }

  catch(error){

    setStatus(
      "Файл қатесі: " +
      error.message
    );

  }


  event.target.value =
    "";

}


/* =========================================================
   VIDEO SELECT
========================================================= */

function selectVideo(event){

  const file =
    event.target.files[0];


  if(!file)
    return;


  selectedVideo =
    file;


  const url =
    URL.createObjectURL(
      file
    );


  addMessage(

    "user",

    "🎬 " +
    file.name,

    {

      type:
        "video",

      src:
        url

    }

  );


  setStatus(
    "Видео таңдалды."
  );


  event.target.value =
    "";

}


/* =========================================================
   SEND CHAT
========================================================= */

async function sendMessage(){

  const text =
    messageInput.value.trim();


  if(
    !text &&
    !selectedImage
  ){

    return;

  }


  const language =
    document.getElementById(
      "language"
    ).value;


  /*
  ----------------------------------------------------------
  IMAGE CHAT
  ----------------------------------------------------------
  */

  if(selectedImage){

    const image =
      await fileToDataURL(
        selectedImage
      );


    addMessage(

      "user",

      text ||
      "Суретті мұқият талда.",

      {

        type:
          "image",

        src:
          image

      }

    );


    messageInput.value =
      "";


    setStatus(
      "Сурет талдануда..."
    );


    const result =
      await callWorkerRaw({

        action:
          "chat",

        message:
          text ||
          "Суретті мұқият талда.",

        image,

        language,

        history:
          chatHistory

      });


    if(
      result &&
      result.answer
    ){

      addMessage(
        "assistant",
        result.answer
      );


      chatHistory.push({

        role:
          "user",

        content:
          text ||
          "Суретті талда."

      });


      chatHistory.push({

        role:
          "assistant",

        content:
          result.answer

      });

    }


    removeImage();


    setStatus("");

    return;

  }


  /*
  ----------------------------------------------------------
  NORMAL CHAT
  ----------------------------------------------------------
  */

  addMessage(
    "user",
    text
  );


  messageInput.value =
    "";


  setStatus(
    "Жауап дайындалуда..."
  );


  const result =
    await callWorkerRaw({

      action:
        "chat",

      message:
        text,

      language,

      history:
        chatHistory

    });


  if(
    result &&
    result.answer
  ){

    addMessage(
      "assistant",
      result.answer
    );


    chatHistory.push({

      role:
        "user",

      content:
        text

    });


    chatHistory.push({

      role:
        "assistant",

      content:
        result.answer

    });

  }


  setStatus("");

}


/* =========================================================
   GENERATE IMAGE
========================================================= */

async function generateImage(){

  const prompt =
    messageInput.value.trim();


  if(!prompt){

    setStatus(
      "Алдымен суретті сипаттаңыз."
    );

/* =========================================================
   IMAGE EDITOR
========================================================= */

function openImageEditor(){

  if(!editImageData){

    setStatus(
      "Алдымен сурет таңдаңыз."
    );


    document
      .getElementById(
        "imageInput"
      )

  document
    .getElementById(
      "editorModal"
    )

/* =========================================================
   PREPARE EDITOR
========================================================= */

function prepareEditor(){

  const img =
    new Image();


  img.onload =
    () => {

      const max =
        Math.min(
          window.innerWidth - 40,
          900
        );


      canvasScale =
        Math.min(
          1,
          max / img.width
        );


      const width =
        Math.round(
          img.width *
          canvasScale
        );


      const height =
        Math.round(
          img.height *
          canvasScale
        );


      const editCanvas =
        document.getElementById(
          "editCanvas"
        );


      const maskCanvas =
        document.getElementById(
          "maskCanvas"
        );


      editCanvas.width =
        width;


      editCanvas.height =
        height;


      maskCanvas.width =
        width;


      maskCanvas.height =
        height;


      const ctx =
        editCanvas.getContext(
          "2d"
        );


      ctx.clearRect(
        0,
        0,
        width,
        height
      );


      ctx.drawImage(

        img,

        0,
        0,

        width,
        height

      );


      clearMask();


      enableMaskDrawing();

    };


  img.src =
    editImageData;

}


/* =========================================================
   MASK DRAWING
========================================================= */

let drawing =
  false;


function enableMaskDrawing(){

  const canvas =
    document.getElementById(
      "maskCanvas"
    );


  const ctx =
    canvas.getContext(
      "2d"
    );


  ctx.lineCap =
    "round";


  ctx.lineJoin =
    "round";


  ctx.lineWidth =
    35;


  function position(e){

    const rect =
      canvas.getBoundingClientRect();


    const touch =
      e.touches
        ? e.touches[0]
        : e;


    return {

      x:
        touch.clientX -
        rect.left,

      y:
        touch.clientY -
        rect.top

    };

  }


  function start(e){

    e.preventDefault();


    drawing =
      true;


    const p =
      position(e);


    ctx.beginPath();


    ctx.moveTo(
      p.x,
      p.y
    );

  }


  function move(e){

    if(!drawing)
      return;


    e.preventDefault();


    const p =
      position(e);


    ctx.strokeStyle =
      "rgba(255,0,0,.85)";


    ctx.lineTo(
      p.x,
      p.y
    );


    ctx.stroke();

  }


  function end(){

    drawing =
      false;


    ctx.closePath();

  }


  canvas.onmousedown =
    start;


  canvas.onmousemove =
    move;


  canvas.onmouseup =
    end;


  canvas.onmouseleave =
    end;


  canvas.ontouchstart =
    start;


  canvas.ontouchmove =
    move;


  canvas.ontouchend =
    end;

}


/* =========================================================
   CLEAR MASK
========================================================= */

function clearMask(){

  const canvas =
    document.getElementById(
      "maskCanvas"
    );


  const ctx =
    canvas.getContext(
      "2d"
    );


  ctx.clearRect(

    0,
    0,

    canvas.width,
    canvas.height

  );

}


/* =========================================================
   RESIZE IMAGE FOR FLUX REFERENCE
=========================================================

Cloudflare requires reference images
to be smaller than 512x512.

We therefore create a 512px version
before sending the image to FLUX.

========================================================= */

function canvasTo512DataURL(
  sourceDataURL
){

  return new Promise(
    (resolve,reject) => {

      const img =
        new Image();


      img.onload =
        () => {

          const max =
            512;


          const scale =
            Math.min(

              1,

              max /
              Math.max(
                img.width,
                img.height
              )

            );


          const width =
            Math.max(
              1,
              Math.round(
                img.width *
                scale
              )
            );


          const height =
            Math.max(
              1,
              Math.round(
                img.height *
                scale
              )
            );


          const canvas =
            document.createElement(
              "canvas"
            );


          canvas.width =
            width;


          canvas.height =
            height;


          const ctx =
            canvas.getContext(
              "2d"
            );


          ctx.drawImage(

            img,

            0,
            0,

            width,
            height

          );


          resolve(

            canvas.toDataURL(
              "image/jpeg",
              0.88
            )

          );

        };


      img.onerror =
        reject;


      img.src =
        sourceDataURL;

    }

  );

}


/* =========================================================
   IMAGE EDIT
========================================================= */

async function editImage(){

  const editCanvas =
    document.getElementById(
      "editCanvas"
    );


  const maskCanvas =
    document.getElementById(
      "maskCanvas"
    );


  const prompt =
    document.getElementById(
      "editPrompt"
    ).value.trim();


  if(!prompt){

    setStatus(
      "Не істеу керегін жазыңыз."
    );

    return;

  }


  /*
  Check that user actually painted.
  */

  const maskCtx =
    maskCanvas.getContext(
      "2d"
    );


  const maskPixels =
    maskCtx.getImageData(

      0,
      0,

      maskCanvas.width,
      maskCanvas.height

    ).data;


  let hasMask =
    false;


  for(
    let i = 3;
    i < maskPixels.length;
    i += 4
  ){

    if(
      maskPixels[i] > 10
    ){

      hasMask =
        true;

      break;

    }

  }


  if(!hasMask){

    setStatus(
      "Алдымен өзгертілетін жерді қызылмен бояңыз."
    );

    return;

  }


  const original =
    editCanvas.toDataURL(
      "image/jpeg",
      .88
    );


  const mask =
    maskCanvas.toDataURL(
      "image/png"
    );


  /*
  Resize both reference images.
  */

  setStatus(
    "Сурет дайындалуда..."
  );


  const smallOriginal =
    await canvasTo512DataURL(
      original
    );


  const smallMask =
    await canvasTo512DataURL(
      mask
    );


  closeModal(
    "editorModal"
  );


  setStatus(
    "✨ Сурет AI арқылы өңделуде..."
  );


  const result =
    await callWorkerRaw({

      action:
        "image_edit",

      prompt,

      image:
        smallOriginal,

      mask:
        smallMask

    });


  if(
    result &&
    result.image
  ){

    addMessage(

      "assistant",

      "✨ Сурет өңделді.",

      {

        type:
          "image",

        src:
          result.image

      }

    );


    editImageData =
      result.image;

  }


  setStatus("");

}


/* =========================================================
   RECORDING TOGGLE
========================================================= */

async function toggleRecording(){

  /*
  SECOND PRESS
  */

  if(
    isRecording &&
    mediaRecorder
  ){

    stopRecording();

    return;

  }


  /*
  FIRST PRESS
  */

  await startRecording();

}


/* =========================================================
   START RECORDING
========================================================= */

async function startRecording(){

  if(isRecording)
    return;


  try{

    if(
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ){

      throw new Error(
        "Бұл браузер микрофонды қолдамайды."
      );

    }


    const stream =
      await navigator
        .mediaDevices
        .getUserMedia({

          audio:true

        });


    audioChunks =
      [];


    /*
    iPhone Safari compatible
    MIME selection.
    */

    let mimeType =
      "";


    const mimeTypes = [

      "audio/mp4",

      "audio/webm;codecs=opus",

      "audio/webm",

      "audio/ogg;codecs=opus"

    ];


    for(
      const type of mimeTypes
    ){

      if(
        MediaRecorder.isTypeSupported &&
        MediaRecorder.isTypeSupported(type)
      ){

        mimeType =
          type;

        break;

      }

    }


    if(mimeType){

      mediaRecorder =
        new MediaRecorder(

          stream,

          {
            mimeType
          }

        );

    }

    else{

      mediaRecorder =
        new MediaRecorder(
          stream
        );

    }


    isRecording =
      true;


    recordButton.classList.add(
      "recording"
    );


    recordButton.textContent =
      "⏹️ Тоқтату";


    mediaRecorder.ondataavailable =
      event => {

        if(
          event.data &&
          event.data.size > 0
        ){

          audioChunks.push(
            event.data
          );

        }

      };


    mediaRecorder.onerror =
      event => {

        console.error(
          "Recorder error:",
          event
        );

        finishRecordingState();

      };


    mediaRecorder.onstop =
      async () => {

        try{

          const finalMime =
            mediaRecorder.mimeType ||
            mimeType ||
            "audio/mp4";


          const blob =
            new Blob(

              audioChunks,

              {
                type:
                  finalMime
              }

            );


          stream
            .getTracks()
            .forEach(
              track =>
                track.stop()
            );


          setStatus(
            "🎤 Дауыс мәтінге айналдырылуда..."
          );


          const audioBase64 =
            await blobToBase64(
              blob
            );


          const result =
            await callWorkerRaw({

              action:
                "transcribe",

              audioBase64

            });


          if(
            result &&
            result.text
          ){

            messageInput.value =
              result.text;


            setStatus(
              "Мәтін дайын. Жіберу үшін ➤ басыңыз."
            );

          }

        }

        catch(error){

          setStatus(
            "Дауыс қатесі: " +
            error.message
          );

        }

        finally{

          finishRecordingState();

        }

      };


    mediaRecorder.start();


    setStatus(
      "🎤 Тыңдап тұрмын... Тоқтату үшін қайта басыңыз."
    );


    /*
    Maximum 30 seconds.
    */

    recordingTimer =
      setTimeout(

        () => {

          if(
            isRecording
          ){

            stopRecording();

          }

        },

        30000

      );

  }

  catch(error){

    finishRecordingState();


    setStatus(
      "Микрофон қатесі: " +
      error.message
    );

  }

}


/* =========================================================
   STOP RECORDING
========================================================= */

function stopRecording(){

  if(
    recordingTimer
  ){

    clearTimeout(
      recordingTimer
    );

    recordingTimer =
      null;

  }


  if(
    mediaRecorder &&
    mediaRecorder.state ===
      "recording"
  ){

    mediaRecorder.stop();

  }

  else{

    finishRecordingState();

  }

}


/* =========================================================
   FINISH RECORDING STATE
========================================================= */

function finishRecordingState(){

  isRecording =
    false;


  recordButton.classList.remove(
    "recording"
  );


  recordButton.textContent =
    "🎤 Дауыс";


  mediaRecorder =
    null;

}


/* =========================================================
   TTS
========================================================= */

async function speakText(text){

  if(!text)
    return;


  setStatus(
    "🔊 Қазақша дауыс дайындалуда..."
  );


  try{

    const response =
      await fetch(

        WORKER_URL,

        {

          method:
            "POST",

          headers:{

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              action:
                "tts",

              text

            })

        }

      );


    const type =
      response.headers.get(
        "content-type"
      ) || "";


    if(
      !response.ok
    ){

      const errorText =
        await response.text();


      throw new Error(
        errorText ||
        "TTS қатесі."
      );

    }


    /*
    JSON with audio URL
    */

    if(
      type.includes(
        "application/json"
      )
    ){

      const result =
        await response.json();


      if(
        result.audio
      ){

        const audio =
          new Audio(
            result.audio
          );


        audio.preload =
          "auto";


        await audio.play();


        audio.onended =
          () => {

            setStatus("");

          };


        return;

      }

    }


    /*
    Direct audio fallback
    */

    if(
      type.includes(
        "audio"
      )
    ){

      const blob =
        await response.blob();


      const url =
        URL.createObjectURL(
          blob
        );


      const audio =
        new Audio(url);


      audio.onended =
        () => {

          URL.revokeObjectURL(
            url
          );

          setStatus("");

        };


      await audio.play();


      return;

    }


    throw new Error(
      "TTS аудио форматы танылмады."
    );

  }

  catch(error){

    setStatus(
      "Дауыс қатесі: " +
      error.message
    );

  }

}


/* =========================================================
   WORKER
========================================================= */

async function callWorkerRaw(data){

  try{

    const response =
      await fetch(

        WORKER_URL,

        {

          method:
            "POST",

          headers:{

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify(data)

        }

      );


    const text =
      await response.text();


    let result;


    try{

      result =
        JSON.parse(text);

    }

    catch{

      throw new Error(

        text ||
        "Worker JSON қайтармады."

      );

    }


    if(
      !response.ok ||
      result.ok === false
    ){

      throw new Error(

        result.error ||
        "Worker қатесі."

      );

    }


    return result;

  }

  catch(error){

    console.error(
      error
    );


    addMessage(

      "assistant",

      "Қате: " +
      error.message

    );


    return null;

  }

}


/* =========================================================
   FILE → DATA URL
========================================================= */

function fileToDataURL(file){

  return new Promise(

    (resolve,reject) => {

      const reader =
        new FileReader();


      reader.onload =
        () =>
          resolve(
            reader.result
          );


      reader.onerror =
        reject;


      reader.readAsDataURL(
        file
      );

    }

  );

}


/* =========================================================
   BLOB → DATA URL
========================================================= */

function blobToBase64(blob){

  return new Promise(

    (resolve,reject) => {

      const reader =
        new FileReader();


      reader.onload =
        () =>
          resolve(
            reader.result
          );


      reader.onerror =
        reject;


      reader.readAsDataURL(
        blob
      );

    }

  );

}
