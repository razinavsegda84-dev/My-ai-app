<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My AI</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  background:#0b0b0f;
  color:#fff;
  font-family:Arial,sans-serif;
}

body{
  overflow:hidden;
}

button{
  font-family:inherit;
  cursor:pointer;
}

.app{
  width:100%;
  height:100vh;
  display:flex;
  flex-direction:column;
}


/* =====================================================
   HEADER
===================================================== */

header{
  height:58px;
  min-height:58px;
  display:flex;
  align-items:center;
  padding:0 10px;
  background:#101014;
  border-bottom:1px solid #29292f;
  position:relative;
  z-index:20;
}

.menu-button{
  width:42px;
  height:42px;
  border:0;
  border-radius:10px;
  background:transparent;
  color:#fff;
  font-size:25px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.menu-button:active{
  background:#29292f;
}

.logo{
  margin-left:5px;
  font-size:20px;
  font-weight:bold;
}

.status{
  margin-left:auto;
  font-size:12px;
  color:#999;
}

.status.online{
  color:#54d17a;
}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{
  position:fixed;
  top:0;
  left:0;
  width:290px;
  height:100vh;
  background:#111116;
  border-right:1px solid #303038;
  z-index:100;
  transform:translateX(-100%);
  transition:transform .25s ease;
  display:flex;
  flex-direction:column;
  padding:12px;
}

.sidebar.open{
  transform:translateX(0);
}

.sidebar-header{
  height:48px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
}

.sidebar-title{
  font-size:20px;
  font-weight:bold;
}

.close-button{
  width:40px;
  height:40px;
  border:0;
  border-radius:10px;
  background:#27272e;
  color:#fff;
  font-size:22px;
}

.close-button:active{
  background:#38383f;
}


/* =====================================================
   MENU ITEMS
===================================================== */

.menu-item{
  width:100%;
  min-height:48px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 12px;
  margin-bottom:5px;
  border:0;
  border-radius:11px;
  background:transparent;
  color:#fff;
  text-align:left;
  font-size:15px;
}

.menu-item:hover{
  background:#222229;
}

.menu-item:active{
  background:#303038;
}

.menu-icon{
  width:28px;
  text-align:center;
  font-size:19px;
}

.menu-text{
  flex:1;
}


/* =====================================================
   HISTORY
===================================================== */

.history-heading{
  margin-top:12px;
  padding:8px 8px;
  color:#888;
  font-size:12px;
}

.history-list{
  flex:1;
  overflow-y:auto;
  min-height:0;
}

.no-history{
  color:#666;
  padding:10px 8px;
  font-size:13px;
}

.history-item{
  width:100%;
  padding:11px;
  margin-bottom:4px;
  border:0;
  border-radius:10px;
  background:transparent;
  color:#ddd;
  text-align:left;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.history-item:hover{
  background:#222229;
}

.history-item.active{
  background:#292930;
}


/* =====================================================
   DELETE BUTTON
===================================================== */

.delete-history{
  width:100%;
  min-height:45px;
  margin-top:10px;
  margin-bottom:4px;
  border:1px solid #3a3030;
  border-radius:10px;
  background:#21191b;
  color:#ff7777;
  font-size:14px;
  flex-shrink:0;
}

.delete-history:hover{
  background:#2b1d1f;
}


/* =====================================================
   OVERLAY
===================================================== */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:90;
  display:none;
}

.overlay.show{
  display:block;
}


/* =====================================================
   CHAT
===================================================== */

#chat{
  flex:1;
  overflow-y:auto;
  padding:20px 12px 150px;
}

.welcome{
  max-width:850px;
  margin:80px auto;
  text-align:center;
  color:#777;
}

.welcome h2{
  color:#fff;
  margin-bottom:8px;
}

.message{
  max-width:850px;
  margin:0 auto 18px;
  display:flex;
  flex-direction:column;
}

.message.user{
  align-items:flex-end;
}

.message.assistant{
  align-items:flex-start;
}

.bubble{
  max-width:88%;
  padding:12px 15px;
  border-radius:16px;
  line-height:1.55;
  white-space:pre-wrap;
  word-break:break-word;
}

.user .bubble{
  background:#303036;
}

.assistant .bubble{
  background:#17171c;
  border:1px solid #29292f;
}


/* =====================================================
   MESSAGE ACTIONS
===================================================== */

.message-actions{
  display:flex;
  gap:6px;
  margin-top:7px;
}

.message-actions button{
  padding:6px 9px;
  border-radius:8px;
  border:1px solid #303038;
  background:#202027;
  color:#bbb;
  font-size:12px;
}

.message-actions button:hover{
  background:#303038;
  color:#fff;
}


/* =====================================================
   IMAGE
===================================================== */

.generated-image{
  display:block;
  max-width:100%;
  border-radius:14px;
}

.preview-image{
  max-width:100px;
  max-height:100px;
  border-radius:10px;
}


/* =====================================================
   FILE
===================================================== */

.file-card{
  max-width:88%;
  padding:12px;
  display:flex;
  align-items:center;
  gap:10px;
  background:#17171c;
  border:1px solid #303038;
  border-radius:14px;
}

.file-icon{
  font-size:28px;
}

.file-info{
  min-width:0;
}

.file-name{
  font-size:14px;
  font-weight:bold;
  word-break:break-word;
}

.file-type{
  margin-top:4px;
  color:#888;
  font-size:12px;
}


/* =====================================================
   COMPOSER
===================================================== */

.composer{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:20;
  padding:35px 12px 12px;
  background:linear-gradient(
    transparent,
    #0b0b0f 25%
  );
}

.composer-inner{
  max-width:850px;
  margin:auto;
  padding:8px;
  background:#15151a;
  border:1px solid #303038;
  border-radius:18px;
}

.preview{
  display:none;
  padding:8px;
  border-bottom:1px solid #29292f;
  margin-bottom:5px;
}

textarea{
  width:100%;
  min-height:48px;
  max-height:150px;
  resize:none;
  padding:10px;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  font-size:16px;
  font-family:inherit;
}

.toolbar{
  display:flex;
  align-items:center;
  gap:7px;
  padding:5px;
}

.tool-button{
  width:42px;
  height:40px;
  padding:0;
  border:0;
  border-radius:10px;
  background:#27272e;
  color:#fff;
  font-size:18px;
}

.tool-button:hover{
  background:#35353e;
}

.send-button{
  margin-left:auto;
  width:45px;
  height:40px;
  border:0;
  border-radius:10px;
  background:#fff;
  color:#000;
  font-size:18px;
  font-weight:bold;
}

.send-button:hover{
  background:#ddd;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

input[type=file]{
  display:none;
}


/* =====================================================
   MODAL
===================================================== */

.modal{
  position:fixed;
  inset:0;
  z-index:200;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.65);
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:430px;
  max-height:80vh;
  overflow-y:auto;
  padding:20px;
  background:#17171c;
  border:1px solid #303038;
  border-radius:16px;
}

.modal-title{
  font-size:20px;
  font-weight:bold;
  margin-bottom:15px;
}

.modal-text{
  color:#bbb;
  line-height:1.6;
  white-space:pre-wrap;
}

.modal-close{
  width:100%;
  margin-top:18px;
  padding:11px;
  border:0;
  border-radius:10px;
  background:#fff;
  color:#000;
  font-weight:bold;
}


/* =====================================================
   SETTINGS
===================================================== */

.setting-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:13px 0;
  border-bottom:1px solid #29292f;
}

.setting-name{
  font-size:14px;
}

.setting-value{
  color:#888;
  font-size:13px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

  .sidebar{
    width:285px;
  }

  #chat{
    padding-left:8px;
    padding-right:8px;
  }

  .bubble,
  .file-card{
    max-width:93%;
  }

  .composer{
    padding-left:8px;
    padding-right:8px;
  }

  textarea{
    font-size:16px;
  }

}

</style>
</head>


<body>

<div class="app">


<!-- =====================================================
     SIDEBAR
===================================================== -->

<aside
  id="sidebar"
  class="sidebar"
>

  <div class="sidebar-header">

    <div class="sidebar-title">
      My AI
    </div>

    <button
      class="close-button"
      type="button"
      onclick="closeSidebar()"
    >
      ×
    </button>

  </div>


  <button
    class="menu-item"
    type="button"
    onclick="newChat()"
  >

    <span class="menu-icon">＋</span>

    <span class="menu-text">
      Жаңа чат
    </span>

  </button>


  <button
    class="menu-item"
    type="button"
    onclick="openImages()"
  >

    <span class="menu-icon">🖼️</span>

    <span class="menu-text">
      Суреттер
    </span>

  </button>


  <button
    class="menu-item"
    type="button"
    onclick="openDocuments()"
  >

    <span class="menu-icon">📄</span>

    <span class="menu-text">
      Құжаттар
    </span>

  </button>


  <button
    class="menu-item"
    type="button"
    onclick="openSettings()"
  >

    <span class="menu-icon">⚙️</span>

    <span class="menu-text">
      Баптаулар
    </span>

  </button>


  <button
    class="menu-item"
    type="button"
    onclick="openAbout()"
  >

    <span class="menu-icon">ℹ️</span>

    <span class="menu-text">
      My AI туралы
    </span>

  </button>


  <div class="history-heading">
    Чат тарихы
  </div>


  <div
    id="historyList"
    class="history-list"
  ></div>


  <button
    class="delete-history"
    type="button"
    onclick="clearHistory()"
  >
    🗑️ Чат тарихын толық өшіру
  </button>

</aside>


<!-- OVERLAY -->

<div
  id="overlay"
  class="overlay"
  onclick="closeSidebar()"
></div>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

  <button
    class="menu-button"
    type="button"
    onclick="openSidebar()"
  >
    ☰
  </button>

  <div class="logo">
    My AI
  </div>

  <div
    id="status"
    class="status"
  >
    Қосылуда...
  </div>

</header>


<!-- =====================================================
     CHAT
===================================================== -->

<main id="chat">

  <div
    id="welcome"
    class="welcome"
  >

    <h2>
      My AI
    </h2>

    <div>
      Сұрағыңызды жазыңыз
    </div>

  </div>

</main>


<!-- =====================================================
     COMPOSER
===================================================== -->

<div class="composer">

  <div class="composer-inner">

    <div
      id="preview"
      class="preview"
    ></div>


    <textarea
      id="message"
      placeholder="My AI-ға сұрақ қойыңыз..."
      autocomplete="off"
    ></textarea>


    <div class="toolbar">


      <button
        class="tool-button"
        type="button"
        onclick="chooseImage()"
        title="Сурет жіберу"
      >
        📷
      </button>


      <input
        id="imageInput"
        type="file"
        accept="image/*"
      >


      <button
        class="tool-button"
        type="button"
        onclick="chooseFile()"
        title="Құжат жіберу"
      >
        📎
      </button>


      <input
        id="fileInput"
        type="file"
        accept=".txt,.md,.json,.csv,.html,.js,.css,.xml,.pdf"
      >


      <button
        class="tool-button"
        type="button"
        onclick="generateImage()"
        title="Сурет жасау"
      >
        🖼️
      </button>


      <button
        class="send-button"
        id="sendButton"
        type="button"
        onclick="sendMessage()"
        title="Жіберу"
      >
        ➤
      </button>

    </div>

  </div>

</div>

</div>


<!-- =====================================================
     MODAL
===================================================== -->

<div
  id="modal"
  class="modal"
  onclick="closeModal(event)"
>

  <div
    class="modal-box"
    onclick="event.stopPropagation()"
  >

    <div
      id="modalTitle"
      class="modal-title"
    ></div>

    <div
      id="modalContent"
      class="modal-text"
    ></div>

    <button
      class="modal-close"
      type="button"
      onclick="hideModal()"
    >
      Жабу
    </button>

  </div>

</div>


<script>


/* =====================================================
   API
===================================================== */

const API_URL =
  "https://my-ai-backend.razinavsegda84.workers.dev";


/* =====================================================
   ELEMENTS
===================================================== */

const chatElement =
  document.getElementById("chat");

const messageElement =
  document.getElementById("message");

const sendButton =
  document.getElementById("sendButton");

const statusElement =
  document.getElementById("status");

const imageInput =
  document.getElementById("imageInput");

const fileInput =
  document.getElementById("fileInput");

const previewElement =
  document.getElementById("preview");

const sidebar =
  document.getElementById("sidebar");

const overlay =
  document.getElementById("overlay");

const historyList =
  document.getElementById("historyList");

const modal =
  document.getElementById("modal");

const modalTitle =
  document.getElementById("modalTitle");

const modalContent =
  document.getElementById("modalContent");


/* =====================================================
   STATE
===================================================== */

let selectedImages = [];

let selectedFileText = "";

let selectedFile = null;

let history = [];

let chatSessions = [];

try{

  chatSessions =
    JSON.parse(
      localStorage.getItem(
        "myAI_chat_sessions"
      ) || "[]"
    );

  if(!Array.isArray(chatSessions)){
    chatSessions = [];
  }

}catch{

  chatSessions = [];

}


/* =====================================================
   START
===================================================== */

window.addEventListener(
  "load",
  async function(){

    renderHistory();

    await checkBackend();

    messageElement.focus();

  }
);


/* =====================================================
   SIDEBAR OPEN
===================================================== */

function openSidebar(){

  sidebar.classList.add(
    "open"
  );

  overlay.classList.add(
    "show"
  );

}


/* =====================================================
   SIDEBAR CLOSE
===================================================== */

function closeSidebar(){

  sidebar.classList.remove(
    "open"
  );

  overlay.classList.remove(
    "show"
  );

}


/* =====================================================
   NEW CHAT
===================================================== */

function newChat(){

  history = [];

  selectedImages = [];

  selectedFileText = "";

  selectedFile = null;

  chatElement.innerHTML = `

    <div
      id="welcome"
      class="welcome"
    >

      <h2>My AI</h2>

      <div>
        Сұрағыңызды жазыңыз
      </div>

    </div>

  `;

  messageElement.value = "";

  previewElement.style.display =
    "none";

  previewElement.innerHTML = "";

  imageInput.value = "";

  fileInput.value = "";

  closeSidebar();

  messageElement.focus();

}


/* =====================================================
   IMAGE MENU
===================================================== */

function openImages(){

  closeSidebar();

  chooseImage();

}


/* =====================================================
   DOCUMENT MENU
===================================================== */

function openDocuments(){

  closeSidebar();

  chooseFile();

}


/* =====================================================
   SETTINGS
===================================================== */

function openSettings(){

  showModal(
    "⚙️ Баптаулар",
    `
Жалпы баптаулар

• Тіл: Қазақша
• Интерфейс: Қараңғы режим
• Сервер: Cloudflare Workers
• AI моделі: Workers AI

Бұл бөлімді кейін кеңейтеміз.
    `
  );

}


/* =====================================================
   ABOUT
===================================================== */

function openAbout(){

  showModal(
    "ℹ️ My AI туралы",
    `
My AI

Жеке AI көмекші қосымшасы.

Қазіргі функциялар:

• AI чат
• Суретті талдау
• Құжат жіберу
• PDF файлын AI арқылы талдау
• Сурет генерациясы
• Чат тарихы
• Жауапты көшіру
• Қайта жауап алу

Келесі функцияларды кейін қосуға болады.
    `
  );

}


/* =====================================================
   MODAL
===================================================== */

function showModal(
  title,
  content
){

  modalTitle.textContent =
    title;

  modalContent.textContent =
    content;

  modal.classList.add(
    "show"
  );

}


function hideModal(){

  modal.classList.remove(
    "show"
  );

}


function closeModal(event){

  if(
    event.target === modal
  ){

    hideModal();

  }

}


/* =====================================================
   CLEAR HISTORY
===================================================== */

function clearHistory(){

  if(
    chatSessions.length === 0
  ){

    alert(
      "Чат тарихы бос."
    );

    return;

  }


  const confirmed =
    confirm(
      "Барлық чат тарихын өшіру керек пе?"
    );


  if(!confirmed){

    return;

  }


  chatSessions = [];

  history = [];


  localStorage.removeItem(
    "myAI_chat_sessions"
  );


  renderHistory();


  newChat();

}


/* =====================================================
   RENDER HISTORY
===================================================== */

function renderHistory(){

  historyList.innerHTML = "";


  if(
    !chatSessions.length
  ){

    historyList.innerHTML = `

      <div class="no-history">
        Әзірге чат тарихы жоқ.
      </div>

    `;

    return;

  }


  chatSessions.forEach(
    function(session){

      const button =
        document.createElement(
          "button"
        );

      button.className =
        "history-item";

      button.type =
        "button";

      button.textContent =
        session.title ||
        "Жаңа чат";

      button.onclick =
        function(){

          loadChat(
            session.id
          );

        };

      historyList.appendChild(
        button
      );

    }
  );

}


/* =====================================================
   LOAD CHAT
===================================================== */

function loadChat(id){

  const session =
    chatSessions.find(
      function(item){

        return item.id === id;

      }
    );


  if(!session){

    return;

  }


  history =
    Array.isArray(
      session.messages
    )
      ? [...session.messages]
      : [];


  chatElement.innerHTML =
    "";


  history.forEach(
    function(item){

      if(
        item.role === "user" ||
        item.role === "assistant"
      ){

        addMessage(
          item.role,
          item.content,
          false
        );

      }

    }
  );


  closeSidebar();


  scrollChat();

}


/* =====================================================
   SAVE HISTORY
===================================================== */

function saveHistory(){

  if(
    !history.length
  ){

    return;

  }


  const firstUser =
    history.find(
      function(item){

        return item.role === "user";

      }
    );


  if(!firstUser){

    return;

  }


  let title =
    firstUser.content ||
    "Жаңа чат";


  title =
    title.substring(
      0,
      60
    );


  let session =
    chatSessions.find(
      function(item){

        return item.active === true;

      }
    );


  if(session){

    session.messages =
      [...history];

    session.title =
      title;

  }else{

    chatSessions.forEach(
      function(item){

        item.active = false;

      }
    );


    session = {

      id:
        Date.now(),

      title:
        title,

      active:
        true,

      messages:
        [...history]

    };


    chatSessions.unshift(
      session
    );

  }


  chatSessions =
    chatSessions.slice(
      0,
      30
    );


  try{

    localStorage.setItem(
      "myAI_chat_sessions",
      JSON.stringify(
        chatSessions
      )
    );

  }catch(error){

    console.error(
      "History save error:",
      error
    );

  }


  renderHistory();

}


/* =====================================================
   BACKEND CHECK
===================================================== */

async function checkBackend(){

  try{

    const response =
      await fetch(
        API_URL,
        {
          method:"GET"
        }
      );


    const data =
      await response.json();


    if(
      response.ok &&
      data &&
      data.ok
    ){

      statusElement.textContent =
        "Онлайн";

      statusElement.classList.add(
        "online"
      );

    }else{

      statusElement.textContent =
        "Backend қатесі";

    }

  }catch(error){

    console.error(
      error
    );

    statusElement.textContent =
      "Backend қосылмады";

  }

}


/* =====================================================
   FILE CHOOSERS
===================================================== */

function chooseImage(){

  imageInput.click();

}


function chooseFile(){

  fileInput.click();

}


/* =====================================================
   IMAGE SELECT
===================================================== */

imageInput.addEventListener(
  "change",
  function(){

    const file =
      this.files[0];


    if(!file){

      return;

    }


    const reader =
      new FileReader();


    reader.onload =
      function(event){

        selectedImages = [
          event.target.result
        ];


        previewElement.style.display =
          "block";


        previewElement.innerHTML = `

          <img
            class="preview-image"
            src="${event.target.result}"
            alt="Preview"
          >

        `;

      };


    reader.readAsDataURL(
      file
    );

  }
);


/* =====================================================
   FILE SELECT
===================================================== */

fileInput.addEventListener(
  "change",
  async function(){

    const file =
      this.files[0];


    if(!file){

      return;

    }


    selectedFile =
      file;


    selectedFileText =
      "";


    previewElement.style.display =
      "block";


    previewElement.innerHTML = `

      <div class="file-card">

        <div class="file-icon">
          📄
        </div>

        <div class="file-info">

          <div class="file-name">
            ${escapeHtml(file.name)}
          </div>

          <div class="file-type">
            ${escapeHtml(
              file.type ||
              "Құжат"
            )}
          </div>

        </div>

      </div>

    `;


    const name =
      file.name.toLowerCase();


    const isText =
      name.endsWith(".txt") ||
      name.endsWith(".md") ||
      name.endsWith(".json") ||
      name.endsWith(".csv") ||
      name.endsWith(".html") ||
      name.endsWith(".js") ||
      name.endsWith(".css") ||
      name.endsWith(".xml");


    if(isText){

      try{

        selectedFileText =
          await file.text();

      }catch(error){

        console.error(
          error
        );

      }

    }

  }
);


/* =====================================================
   ENTER
===================================================== */

messageElement.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(){

  const message =
    messageElement.value.trim();


  if(
    !message &&
    selectedImages.length === 0 &&
    !selectedFile
  ){

    return;

  }


  setLoading(
    true
  );


  if(message){

    addMessage(
      "user",
      message
    );

  }


  const currentImages =
    [...selectedImages];


  const currentFile =
    selectedFile;


  const currentFileText =
    selectedFileText;


  messageElement.value =
    "";


  selectedImages =
    [];


  selectedFile =
    null;


  selectedFileText =
    "";


  previewElement.style.display =
    "none";


  previewElement.innerHTML =
    "";


  imageInput.value =
    "";


  fileInput.value =
    "";


  try{

    const response =
      await fetch(
        API_URL,
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              action:"chat",

              message:
                message ||
                (
                  currentFile
                    ? "Құжатты талдаңыз."
                    : "Суретті талдаңыз."
                ),

              history:
                history.slice(-20),

              images:
                currentImages,

              fileText:
                currentFileText,

              fileName:
                currentFile
                  ? currentFile.name
                  : "",

              mimeType:
                currentFile
                  ? currentFile.type
                  : ""

            })

        }
      );


    const data =
      await response.json();


    if(
      !response.ok ||
      !data.ok
    ){

      throw new Error(
        data.error ||
        `HTTP ${response.status}`
      );

    }


    const answer =
      data.answer ||
      "AI жауап бере алмады.";


    addMessage(
      "assistant",
      answer
    );


    history.push({

      role:"user",

      content:
        message ||
        (
          currentFile
            ? "Құжатты талдау"
            : "Суретті талдау"
        )

    });


    history.push({

      role:"assistant",

      content:
        answer

    });


    history =
      history.slice(
        -20
      );


    saveHistory();


  }catch(error){

    console.error(
      error
    );


    addMessage(
      "assistant",
      "Қате: " +
      error.message
    );


  }finally{

    setLoading(
      false
    );

  }

}


/* =====================================================
   IMAGE GENERATION
===================================================== */

async function generateImage(){

  const prompt =
    messageElement.value.trim();


  if(!prompt){

    addMessage(
      "assistant",
      "Сурет жасау үшін алдымен сипаттамасын жазыңыз."
    );

    return;

  }


  setLoading(
    true
  );


  addMessage(
    "user",
    "🖼️ " + prompt
  );


  messageElement.value =
    "";


  try{

    const response =
      await fetch(
        API_URL,
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              action:"image",

              prompt:
                prompt,

              width:
                1024,

              height:
                1024

            })

        }
      );


    const data =
      await response.json();


    if(
      !response.ok ||
      !data.ok
    ){

      throw new Error(
        data.error ||
        `HTTP ${response.status}`
      );

    }


    if(!data.image){

      throw new Error(
        "Сурет қайтарылмады."
      );

    }


    addImageMessage(
      data.image
    );


  }catch(error){

    console.error(
      error
    );


    addMessage(
      "assistant",
      "Сурет жасау қатесі: " +
      error.message
    );


  }finally{

    setLoading(
      false
    );

  }

}


/* =====================================================
   ADD MESSAGE
===================================================== */

function addMessage(
  role,
  text,
  actions = true
){

  const wrapper =
    document.createElement(
      "div"
    );


  wrapper.className =
    "message " + role;


  const bubble =
    document.createElement(
      "div"
    );


  bubble.className =
    "bubble";


  bubble.textContent =
    text;


  wrapper.appendChild(
    bubble
  );


  if(
    role === "assistant" &&
    actions
  ){

    const actionBar =
      document.createElement(
        "div"
      );


    actionBar.className =
      "message-actions";


    const copyButton =
      document.createElement(
        "button"
      );


    copyButton.type =
      "button";


    copyButton.textContent =
      "📋 Көшіру";


    copyButton.onclick =
      async function(){

        try{

          await navigator.clipboard.writeText(
            text
          );


          copyButton.textContent =
            "✓ Көшірілді";


          setTimeout(
            function(){

              copyButton.textContent =
                "📋 Көшіру";

            },
            1500
          );


        }catch{

          alert(
            "Көшіру мүмкін болмады."
          );

        }

      };


    const retryButton =
      document.createElement(
        "button"
      );


    retryButton.type =
      "button";


    retryButton.textContent =
      "🔄 Қайта жауап";


    retryButton.onclick =
      function(){

        retryLast();

      };


    actionBar.appendChild(
      copyButton
    );


    actionBar.appendChild(
      retryButton
    );


    wrapper.appendChild(
      actionBar
    );

  }


  chatElement.appendChild(
    wrapper
  );


  scrollChat();

}


/* =====================================================
   IMAGE MESSAGE
===================================================== */

function addImageMessage(
  image
){

  const wrapper =
    document.createElement(
      "div"
    );


  wrapper.className =
    "message assistant";


  const bubble =
    document.createElement(
      "div"
    );


  bubble.className =
    "bubble";


  const img =
    document.createElement(
      "img"
    );


  img.className =
    "generated-image";


  img.src =
    image;


  img.alt =
    "Generated image";


  bubble.appendChild(
    img
  );


  wrapper.appendChild(
    bubble
  );


  chatElement.appendChild(
    wrapper
  );


  scrollChat();

}


/* =====================================================
   RETRY
===================================================== */

async function retryLast(){

  let lastUser =
    null;


  for(
    let i =
      history.length - 1;
    i >= 0;
    i--
  ){

    if(
      history[i].role === "user"
    ){

      lastUser =
        history[i].content;

      break;

    }

  }


  if(!lastUser){

    return;

  }


  messageElement.value =
    lastUser;


  await sendMessage();

}


/* =====================================================
   LOADING
===================================================== */

function setLoading(
  loading
){

  sendButton.disabled =
    loading;


  messageElement.disabled =
    loading;


  if(loading){

    statusElement.textContent =
      "Жауап дайындалуда...";

    statusElement.classList.remove(
      "online"
    );

  }else{

    statusElement.textContent =
      "Онлайн";

    statusElement.classList.add(
      "online"
    );

  }

}


/* =====================================================
   SCROLL
===================================================== */

function scrollChat(){

  setTimeout(
    function(){

      chatElement.scrollTop =
        chatElement.scrollHeight;

    },
    50
  );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
  text
){

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}
