<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My AI</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#0b0b0f;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

body{
  height:100dvh;
}

.app{
  width:100%;
  height:100dvh;
  display:flex;
  flex-direction:column;
}

/* =====================================================
   HEADER
===================================================== */

header{
  height:58px;
  min-height:58px;
  display:flex;
  align-items:center;
  padding:0 12px;
  border-bottom:1px solid #292929;
  background:#101014;
  flex-shrink:0;
  z-index:50;
}

.menu-btn{
  width:42px;
  height:42px;
  border:0;
  background:transparent;
  color:#fff;
  font-size:25px;
  cursor:pointer;
  border-radius:10px;
}

.menu-btn:hover{
  background:#222229;
}

.logo{
  font-size:20px;
  font-weight:bold;
  margin-left:5px;
}

.status{
  margin-left:auto;
  font-size:12px;
  color:#8f8f8f;
}

.status.online{
  color:#54d17a;
}

/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{
  position:fixed;
  top:0;
  left:0;

  width:285px;
  max-width:88vw;
  height:100dvh;

  background:#111116;
  border-right:1px solid #29292f;

  z-index:200;

  transform:translateX(-100%);
  transition:transform .25s ease;

  display:flex;
  flex-direction:column;

  padding:12px;

  overflow:hidden;

  box-shadow:8px 0 30px rgba(0,0,0,.35);
}

.sidebar.open{
  transform:translateX(0);
}

/* Жоғарғы бөлік */

.sidebar-top{
  flex:0 0 auto;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:5px;
  margin-bottom:10px;
}

.sidebar-title{
  font-size:20px;
  font-weight:bold;
}

.close-menu{
  width:38px;
  height:38px;

  background:#25252c;
  border:0;
  color:#fff;

  border-radius:10px;

  font-size:20px;
  cursor:pointer;
}

.close-menu:hover{
  background:#35353e;
}

/* Жаңа чат */

.new-chat{
  flex:0 0 auto;

  width:100%;

  padding:12px;

  background:#fff;
  color:#000;

  font-weight:bold;

  border:0;
  border-radius:12px;

  cursor:pointer;

  margin-bottom:10px;
}

.new-chat:hover{
  background:#ddd;
}

/* Тақырып */

.history-title{
  flex:0 0 auto;

  color:#888;
  font-size:12px;

  padding:8px 5px 6px;
}

/* Тарих */

.history{
  flex:1 1 auto;

  min-height:0;

  overflow-y:auto;
  overflow-x:hidden;

  padding-bottom:8px;

  -webkit-overflow-scrolling:touch;
}

.history-item{
  padding:11px;

  border-radius:10px;

  cursor:pointer;

  margin-bottom:4px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;

  color:#eee;
}

.history-item:hover{
  background:#222229;
}

.history-empty{
  color:#666;
  padding:10px 8px;
  line-height:1.4;
}

/* МӘЗІРДІҢ ЕҢ ТӨМЕНГІ БӨЛІГІ */

.sidebar-bottom{
  flex:0 0 auto;

  padding-top:10px;

  border-top:1px solid #29292f;

  background:#111116;
}

.clear-history{
  display:block;

  width:100%;

  background:#25252c;
  color:#ff7777;

  border:1px solid #383840;
  border-radius:10px;

  padding:12px;

  cursor:pointer;

  font-size:14px;

  margin:0;
}

.clear-history:hover{
  background:#30242a;
  border-color:#554047;
}

/* =====================================================
   OVERLAY
===================================================== */

.overlay{
  position:fixed;
  inset:0;

  background:rgba(0,0,0,.58);

  z-index:150;

  display:none;
}

.overlay.show{
  display:block;
}

/* =====================================================
   CHAT
===================================================== */

#chat{
  flex:1;

  min-height:0;

  overflow-y:auto;

  padding:20px 14px 150px;

  -webkit-overflow-scrolling:touch;
}

.message{
  max-width:850px;

  margin:0 auto 18px;

  display:flex;
  flex-direction:column;
}

.message.user{
  align-items:flex-end;
}

.message.assistant{
  align-items:flex-start;
}

.bubble{
  max-width:85%;

  padding:12px 15px;

  border-radius:16px;

  line-height:1.5;

  white-space:pre-wrap;
  word-wrap:break-word;
  overflow-wrap:anywhere;
}

.assistant .bubble{
  background:#17171c;
  border:1px solid #29292f;
}

.user .bubble{
  background:#303036;
}

/* =====================================================
   MESSAGE ACTIONS
===================================================== */

.message-actions{
  display:flex;

  gap:6px;

  margin-top:7px;
}

.message-actions button{
  background:#202027;

  border:1px solid #303038;

  color:#bbb;

  border-radius:8px;

  padding:6px 9px;

  font-size:12px;

  cursor:pointer;
}

.message-actions button:hover{
  background:#303038;
  color:#fff;
}

/* =====================================================
   FILE CARD
===================================================== */

.file-card{
  max-width:85%;

  background:#17171c;

  border:1px solid #303038;

  border-radius:14px;

  padding:12px;

  display:flex;
  align-items:center;

  gap:10px;
}

.file-icon{
  font-size:30px;
  flex-shrink:0;
}

.file-info{
  min-width:0;
  flex:1;
}

.file-name{
  font-size:14px;
  font-weight:bold;

  word-break:break-word;
}

.file-type{
  color:#888;

  font-size:12px;

  margin-top:3px;
}

.file-open{
  margin-left:auto;

  background:#27272e;
  color:#fff;

  border:0;
  border-radius:8px;

  padding:7px 9px;
}

/* =====================================================
   IMAGES
===================================================== */

.generated-image{
  max-width:100%;

  border-radius:14px;

  display:block;
}

.preview-image{
  max-width:100px;
  max-height:100px;

  border-radius:10px;
}

/* =====================================================
   COMPOSER
===================================================== */

.composer{
  position:fixed;

  bottom:0;
  left:0;
  right:0;

  background:linear-gradient(
    transparent,
    #0b0b0f 22%
  );

  padding:35px 12px 12px;

  z-index:100;
}

.composer-inner{
  max-width:850px;

  margin:auto;

  background:#15151a;

  border:1px solid #303038;

  border-radius:18px;

  padding:8px;
}

textarea{
  width:100%;

  resize:none;

  min-height:48px;
  max-height:150px;

  background:transparent;

  border:0;
  outline:0;

  color:white;

  font-size:16px;

  padding:10px;

  font-family:inherit;
}

textarea::placeholder{
  color:#777;
}

.toolbar{
  display:flex;

  align-items:center;

  gap:7px;

  padding:5px;
}

button{
  border:0;

  cursor:pointer;

  color:white;

  background:#27272e;

  border-radius:10px;

  padding:9px 12px;

  font-size:14px;
}

button:hover{
  background:#35353e;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.send{
  margin-left:auto;

  background:#fff;
  color:#000;

  font-weight:bold;
}

.send:hover{
  background:#ddd;
}

input[type=file]{
  display:none;
}

.preview{
  display:none;

  padding:8px;

  border-bottom:1px solid #29292f;
}

.typing{
  opacity:.7;
}

.error{
  color:#ff6b6b;
}

/* =====================================================
   WELCOME
===================================================== */

.welcome{
  max-width:850px;

  margin:80px auto;

  text-align:center;

  color:#888;
}

.welcome h2{
  color:#fff;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

  .bubble,
  .file-card{
    max-width:92%;
  }

  #chat{
    padding-left:8px;
    padding-right:8px;
  }

  textarea{
    font-size:16px;
  }

  .sidebar{
    width:285px;
    max-width:88vw;
  }

  .composer{
    padding-left:8px;
    padding-right:8px;
  }

  .toolbar{
    gap:5px;
  }

  .toolbar button{
    padding:9px 10px;
  }
}

/* =====================================================
   VERY SMALL SCREEN
===================================================== */

@media(max-height:550px){

  .sidebar-top{
    margin-bottom:5px;
  }

  .new-chat{
    padding:9px;
    margin-bottom:5px;
  }

  .history-title{
    padding:5px;
  }

  .clear-history{
    padding:9px;
  }
}
</style>
</head>

<body>

<div class="app">

<!-- ===================================================
     SIDE MENU
=================================================== -->

<aside
  id="sidebar"
  class="sidebar"
>

  <div class="sidebar-top">

    <div class="sidebar-title">
      My AI
    </div>

    <button
      type="button"
      class="close-menu"
      onclick="closeSidebar()"
    >
      ×
    </button>

  </div>


  <button
    type="button"
    class="new-chat"
    onclick="newChat()"
  >
    ＋ Жаңа чат
  </button>


  <div class="history-title">
    Чат тарихы
  </div>


  <div
    id="historyList"
    class="history"
  ></div>


  <!-- БҰЛ БӨЛІК ЕНДІ ӘРҚАШАН КӨРІНЕДІ -->

  <div class="sidebar-bottom">

    <button
      type="button"
      class="clear-history"
      onclick="clearHistory()"
    >
      🗑️ Барлық чат тарихын өшіру
    </button>

  </div>

</aside>


<div
  id="overlay"
  class="overlay"
  onclick="closeSidebar()"
></div>


<!-- ===================================================
     HEADER
=================================================== -->

<header>

  <button
    type="button"
    class="menu-btn"
    onclick="openSidebar()"
    aria-label="Мәзір"
  >
    ☰
  </button>


  <div class="logo">
    My AI
  </div>


  <div
    id="status"
    class="status"
  >
    Қосылуда...
  </div>

</header>


<!-- ===================================================
     CHAT
=================================================== -->

<main id="chat">

  <div
    id="welcome"
    class="welcome"
  >

    <h2>
      My AI
    </h2>

    <div>
      Сұрағыңызды жазыңыз
    </div>

  </div>

</main>


<!-- ===================================================
     COMPOSER
=================================================== -->

<div class="composer">

  <div class="composer-inner">


    <div
      id="preview"
      class="preview"
    ></div>


    <textarea
      id="message"
      placeholder="My AI-ға сұрақ қойыңыз..."
      autocomplete="off"
    ></textarea>


    <div class="toolbar">


      <!-- IMAGE -->

      <button
        type="button"
        onclick="document.getElementById('imageInput').click()"
        aria-label="Сурет таңдау"
      >
        📷
      </button>


      <input
        id="imageInput"
        type="file"
        accept="image/*"
      >


      <!-- FILE -->

      <button
        type="button"
        onclick="document.getElementById('fileInput').click()"
        aria-label="Файл таңдау"
      >
        📎
      </button>


      <input
        id="fileInput"
        type="file"
        accept=".txt,.md,.json,.csv,.html,.js,.css,.xml,.pdf"
      >


      <!-- IMAGE GENERATION -->

      <button
        type="button"
        onclick="generateImage()"
        aria-label="Сурет жасау"
      >
        🖼️
      </button>


      <!-- SEND -->

      <button
        type="button"
        class="send"
        id="sendButton"
        onclick="sendMessage()"
        aria-label="Жіберу"
      >
        ➤
      </button>

    </div>

  </div>

</div>

</div>


<script>

/* =====================================================
   API
===================================================== */

const API_URL =
  "https://my-ai-backend.razinavsegda84.workers.dev";


/* =====================================================
   ELEMENTS
===================================================== */

const chatElement =
  document.getElementById("chat");

const messageElement =
  document.getElementById("message");

const sendButton =
  document.getElementById("sendButton");

const statusElement =
  document.getElementById("status");

const imageInput =
  document.getElementById("imageInput");

const fileInput =
  document.getElementById("fileInput");

const previewElement =
  document.getElementById("preview");

const sidebar =
  document.getElementById("sidebar");

const overlay =
  document.getElementById("overlay");

const historyList =
  document.getElementById("historyList");


/* =====================================================
   STATE
===================================================== */

let selectedImages = [];

let selectedFileText = "";

let selectedFile = null;

let history = [];

let chatSessions = [];

try{

  chatSessions =
    JSON.parse(
      localStorage.getItem(
        "myAI_chat_sessions"
      ) || "[]"
    );

  if(!Array.isArray(chatSessions)){
    chatSessions = [];
  }

}catch{

  chatSessions = [];

}


/* =====================================================
   START
===================================================== */

window.addEventListener(
  "load",
  async () => {

    renderHistory();

    await checkBackend();

    messageElement.focus();

  }
);


/* =====================================================
   SIDEBAR
===================================================== */

function openSidebar(){

  sidebar.classList.add(
    "open"
  );

  overlay.classList.add(
    "show"
  );

}


function closeSidebar(){

  sidebar.classList.remove(
    "open"
  );

  overlay.classList.remove(
    "show"
  );

}


/* =====================================================
   NEW CHAT
===================================================== */

function newChat(){

  saveCurrentChat();

  history = [];

  selectedImages = [];

  selectedFileText = "";

  selectedFile = null;

  chatElement.innerHTML = `
    <div
      id="welcome"
      class="welcome"
    >
      <h2>My AI</h2>
      <div>Сұрағыңызды жазыңыз</div>
    </div>
  `;

  messageElement.value = "";

  previewElement.style.display =
    "none";

  previewElement.innerHTML = "";

  closeSidebar();

  messageElement.focus();

}


/* =====================================================
   SAVE CURRENT CHAT
===================================================== */

function saveCurrentChat(){

  if(!history.length){
    return;
  }

  const firstUser =
    history.find(
      x =>
        x &&
        x.role === "user"
    );

  if(!firstUser){
    return;
  }

  const title =
    String(
      firstUser.content || "Жаңа чат"
    ).slice(0,60);


  /*
    Егер ағымдағы чат бұрын сақталған болса,
    соны жаңартамыз.
  */

  let current =
    chatSessions.find(
      x => x.active === true
    );


  if(current){

    current.title =
      title;

    current.messages =
      [...history];

  }else{

    chatSessions.forEach(
      x => {
        x.active = false;
      }
    );

    current = {

      id:Date.now(),

      title,

      active:true,

      messages:[
        ...history
      ]

    };

    chatSessions.unshift(
      current
    );

  }


  chatSessions =
    chatSessions.slice(
      0,
      30
    );


  localStorage.setItem(
    "myAI_chat_sessions",
    JSON.stringify(
      chatSessions
    )
  );


  renderHistory();

}


/* =====================================================
   HISTORY
===================================================== */

function renderHistory(){

  historyList.innerHTML = "";


  if(!chatSessions.length){

    const empty =
      document.createElement(
        "div"
      );

    empty.className =
      "history-empty";

    empty.textContent =
      "Әзірге чат тарихы жоқ.";

    historyList.appendChild(
      empty
    );

    return;

  }


  chatSessions.forEach(
    session => {

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "history-item";

      item.textContent =
        session.title ||
        "Жаңа чат";

      item.title =
        session.title ||
        "Жаңа чат";

      item.onclick =
        () =>
          loadChat(
            session.id
          );

      historyList.appendChild(
        item
      );

    }
  );

}


/* =====================================================
   LOAD CHAT
===================================================== */

function loadChat(id){

  const session =
    chatSessions.find(
      x =>
        x.id === id
    );

  if(!session){
    return;
  }


  chatSessions.forEach(
    x => {
      x.active =
        x.id === id;
    }
  );


  localStorage.setItem(
    "myAI_chat_sessions",
    JSON.stringify(
      chatSessions
    )
  );


  history =
    Array.isArray(
      session.messages
    )
      ? [...session.messages]
      : [];


  chatElement.innerHTML = "";


  if(!history.length){

    chatElement.innerHTML = `
      <div
        id="welcome"
        class="welcome"
      >
        <h2>My AI</h2>
        <div>Сұрағыңызды жазыңыз</div>
      </div>
    `;

  }else{

    history.forEach(
      item => {

        if(
          !item ||
          !item.content
        ){
          return;
        }


        if(
          item.role === "user"
        ){

          addMessage(
            "user",
            item.content,
            false
          );

        }


        if(
          item.role === "assistant"
        ){

          addMessage(
            "assistant",
            item.content,
            true
          );

        }

      }
    );

  }


  closeSidebar();

  scrollChat();

}


/* =====================================================
   CLEAR HISTORY
===================================================== */

function clearHistory(){

  const answer =
    confirm(
      "Барлық чат тарихын өшіру керек пе?"
    );


  if(!answer){
    return;
  }


  chatSessions = [];

  history = [];


  localStorage.removeItem(
    "myAI_chat_sessions"
  );


  renderHistory();


  chatElement.innerHTML = `
    <div
      id="welcome"
      class="welcome"
    >
      <h2>My AI</h2>
      <div>Сұрағыңызды жазыңыз</div>
    </div>
  `;


  closeSidebar();

}


/* =====================================================
   BACKEND CHECK
===================================================== */

async function checkBackend(){

  try{

    const response =
      await fetch(
        API_URL,
        {
          method:"GET"
        }
      );


    const data =
      await response.json();


    if(
      data &&
      data.ok
    ){

      statusElement.textContent =
        "Онлайн";

      statusElement.classList.add(
        "online"
      );

    }else{

      statusElement.textContent =
        "Backend қатесі";

    }

  }catch(error){

    console.error(error);

    statusElement.textContent =
      "Backend қосылмады";

  }

}


/* =====================================================
   ENTER
===================================================== */

messageElement.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =====================================================
   IMAGE SELECT
===================================================== */

imageInput.addEventListener(
  "change",
  function(){

    const file =
      this.files[0];

    if(!file){
      return;
    }


    const reader =
      new FileReader();


    reader.onload =
      function(event){

        selectedImages =
          [
            event.target.result
          ];


        previewElement.style.display =
          "block";


        previewElement.innerHTML = `
          <img
            class="preview-image"
            src="${event.target.result}"
            alt="Таңдалған сурет"
          >
        `;

      };


    reader.readAsDataURL(
      file
    );

  }
);


/* =====================================================
   FILE SELECT
===================================================== */

fileInput.addEventListener(
  "change",
  async function(){

    const file =
      this.files[0];

    if(!file){
      return;
    }


    selectedFile =
      file;


    selectedFileText =
      "";


    previewElement.style.display =
      "block";


    previewElement.innerHTML = `
      <div class="file-card">

        <div class="file-icon">
          📄
        </div>

        <div class="file-info">

          <div class="file-name">
            ${escapeHtml(file.name)}
          </div>

          <div class="file-type">
            ${escapeHtml(
              file.type ||
              "PDF / файл"
            )}
          </div>

        </div>

      </div>
    `;


    /*
      Мәтіндік файлдарды браузер оқи алады.
      PDF үшін файлдың өзін Worker-ге жіберуге
      арналған дайындық бөлігі төменде бар.
    */

    const isTextFile =
      file.type === "text/plain" ||
      file.name.endsWith(".txt") ||
      file.name.endsWith(".md") ||
      file.name.endsWith(".json") ||
      file.name.endsWith(".csv") ||
      file.name.endsWith(".js") ||
      file.name.endsWith(".css") ||
      file.name.endsWith(".html") ||
      file.name.endsWith(".xml");


    if(isTextFile){

      try{

        selectedFileText =
          await file.text();

      }catch(error){

        selectedFileText =
          "";

        console.error(
          error
        );

      }

    }

  }
);


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(){

  const message =
    messageElement.value.trim();


  if(
    !message &&
    selectedImages.length === 0 &&
    !selectedFile
  ){

    return;

  }


  setLoading(true);


  if(message){

    addMessage(
      "user",
      message
    );

  }


  const currentImages =
    [...selectedImages];


  const currentFileText =
    selectedFileText;


  const currentFile =
    selectedFile;


  messageElement.value =
    "";

  selectedImages =
    [];

  selectedFileText =
    "";

  selectedFile =
    null;


  previewElement.style.display =
    "none";

  previewElement.innerHTML =
    "";


  /*
    Worker-ге жіберілетін мәлімет.
  */

  try{

    const requestBody = {

      action:"chat",

      message:
        message ||
        (
          currentFile
            ? `Файлды талдаңыз: ${currentFile.name}`
            : "Суретті талда."
        ),

      history:
        history.slice(-20),

      images:
        currentImages,

      fileText:
        currentFileText,

      fileName:
        currentFile
          ? currentFile.name
          : "",

      mimeType:
        currentFile
          ? currentFile.type
          : ""

    };


    /*
      PDF-тің өзін Base64 ретінде Worker-ге
      жіберуге мүмкіндік дайындаймыз.
    */

    if(
      currentFile &&
      currentFile.type === "application/pdf"
    ){

      requestBody.fileBase64 =
        await fileToBase64(
          currentFile
        );

    }


    const response =
      await fetch(
        API_URL,
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(
              requestBody
            )

        }
      );


    const data =
      await response.json();


    if(
      !response.ok ||
      !data.ok
    ){

      throw new Error(
        data.error ||
        `HTTP ${response.status}`
      );

    }


    const answer =
      data.answer ||
      "AI жауап бере алмады.";


    addMessage(
      "assistant",
      answer
    );


    /*
      History-ге пайдаланушы хабарын
      қосамыз.
    */

    history.push({

      role:"user",

      content:
        message ||
        (
          currentFile
            ? `Файл: ${currentFile.name}`
            : "Суретті талдау"
        )

    });


    history.push({

      role:"assistant",

      content:
        answer

    });


    history =
      history.slice(-20);


    saveCurrentChat();


  }catch(error){

    console.error(
      error
    );


    addMessage(
      "assistant",
      "Қате: " +
      error.message
    );


  }finally{

    setLoading(false);

  }

}


/* =====================================================
   FILE → BASE64
===================================================== */

function fileToBase64(
  file
){

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const reader =
        new FileReader();


      reader.onload =
        () => {

          const result =
            String(
              reader.result || ""
            );


          /*
            data:application/pdf;base64,...
            деген бөліктен тек Base64 бөлігін аламыз.
          */

          const comma =
            result.indexOf(",");


          if(
            comma >= 0
          ){

            resolve(
              result.slice(
                comma + 1
              )
            );

          }else{

            resolve(
              result
            );

          }

        };


      reader.onerror =
        () => {

          reject(
            new Error(
              "Файлды оқу мүмкін болмады."
            )
          );

        };


      reader.readAsDataURL(
        file
      );

    }
  );

}


/* =====================================================
   GENERATE IMAGE
===================================================== */

async function generateImage(){

  const prompt =
    messageElement.value.trim();


  if(!prompt){

    addMessage(
      "assistant",
      "Сурет жасау үшін алдымен сипаттама жазыңыз."
    );

    return;

  }


  setLoading(true);


  addMessage(
    "user",
    "🖼️ " + prompt
  );


  messageElement.value =
    "";


  try{

    const response =
      await fetch(
        API_URL,
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              action:"image",

              prompt,

              width:1024,

              height:1024

            })

        }
      );


    const data =
      await response.json();


    if(
      !response.ok ||
      !data.ok
    ){

      throw new Error(
        data.error ||
        `HTTP ${response.status}`
      );

    }


    if(!data.image){

      throw new Error(
        "Сурет қайтарылмады."
      );

    }


    addImageMessage(
      data.image
    );


  }catch(error){

    console.error(
      error
    );


    addMessage(
      "assistant",
      "Сурет жасау қатесі: " +
      error.message
    );


  }finally{

    setLoading(false);

  }

}


/* =====================================================
   ADD TEXT MESSAGE
===================================================== */

function addMessage(
  role,
  text,
  actions = true
){

  const wrapper =
    document.createElement(
      "div"
    );


  wrapper.className =
    `message ${role}`;


  const bubble =
    document.createElement(
      "div"
    );


  bubble.className =
    "bubble";


  bubble.textContent =
    text;


  wrapper.appendChild(
    bubble
  );


  /*
    Assistant жауабына:
    Көшіру
    Қайта жауап
  */

  if(
    role === "assistant" &&
    actions &&
    text
  ){

    const actionBar =
      document.createElement(
        "div"
      );


    actionBar.className =
      "message-actions";


    /* КӨШІРУ */

    const copyButton =
      document.createElement(
        "button"
      );


    copyButton.type =
      "button";


    copyButton.textContent =
      "📋 Көшіру";


    copyButton.onclick =
      async () => {

        try{

          await navigator.clipboard.writeText(
            text
          );


          copyButton.textContent =
            "✓ Көшірілді";


          setTimeout(
            () => {

              copyButton.textContent =
                "📋 Көшіру";

            },
            1500
          );


        }catch{

          alert(
            "Көшіру мүмкін болмады."
          );

        }

      };


    /* ҚАЙТА ЖАУАП */

    const retryButton =
      document.createElement(
        "button"
      );


    retryButton.type =
      "button";


    retryButton.textContent =
      "🔄 Қайта жауап";


    retryButton.onclick =
      () => {

        retryLast();

      };


    actionBar.appendChild(
      copyButton
    );


    actionBar.appendChild(
      retryButton
    );


    wrapper.appendChild(
      actionBar
    );

  }


  chatElement.appendChild(
    wrapper
  );


  scrollChat();

}


/* =====================================================
   RETRY
===================================================== */

async function retryLast(){

  let lastUser =
    null;


  for(
    let i =
      history.length - 1;
    i >= 0;
    i--
  ){

    if(
      history[i] &&
      history[i].role === "user"
    ){

      lastUser =
        history[i].content;

      break;

    }

  }


  if(!lastUser){
    return;
  }


  messageElement.value =
    lastUser;


  await sendMessage();

}


/* =====================================================
   IMAGE MESSAGE
===================================================== */

function addImageMessage(
  image
){

  const wrapper =
    document.createElement(
      "div"
    );


  wrapper.className =
    "message assistant";


  const bubble =
    document.createElement(
      "div"
    );


  bubble.className =
    "bubble";


  const img =
    document.createElement(
      "img"
    );


  img.className =
    "generated-image";


  img.src =
    image;


  img.alt =
    "Generated image";


  bubble.appendChild(
    img
  );


  wrapper.appendChild(
    bubble
  );


  chatElement.appendChild(
    wrapper
  );


  scrollChat();

}


/* =====================================================
   LOADING
===================================================== */

function setLoading(
  loading
){

  sendButton.disabled =
    loading;


  messageElement.disabled =
    loading;


  if(loading){

    statusElement.textContent =
      "Жауап дайындалуда...";

  }else{

    statusElement.textContent =
      "Онлайн";

  }

}


/* =====================================================
   SCROLL
===================================================== */

function scrollChat(){

  setTimeout(
    () => {

      chatElement.scrollTop =
        chatElement.scrollHeight;

    },
    50
  );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
  text
){

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

   CLOSE MENU WITH ESC
===================================================== */

document.addEventListener(

  function(event){

    if(
      event.key === "Escape"
    ){

      closeSidebar();

    }

  }
);
