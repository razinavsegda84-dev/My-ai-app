<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
  height: 100vh;
}

.app {
  height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  height: 60px;
  border-bottom: 1px solid #222;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  flex-shrink: 0;
}

.header-title {
  font-size: 20px;
  font-weight: bold;
}

.icon-button {
  width: 42px;
  height: 42px;
  border: 0;
  border-radius: 50%;
  background: #222;
  color: #fff;
  font-size: 20px;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 18px;
  padding-bottom: 120px;
}

.welcome {
  text-align: center;
  margin-top: 24vh;
  color: #888;
}

.welcome h1 {
  color: #fff;
  font-size: 30px;
}

.message {
  max-width: 86%;
  padding: 12px 16px;
  margin: 12px 0;
  border-radius: 18px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
}

.user {
  background: #2563eb;
  margin-left: auto;
}

.ai {
  background: #1d1d1d;
  margin-right: auto;
}

.message img {
  display: block;
  max-width: 100%;
  max-height: 400px;
  border-radius: 14px;
  margin-bottom: 8px;
}

.bottom-area {
  position: fixed;
  left: 0;
  bottom: 0;
  width: 100%;
  background: #000;
  border-top: 1px solid #222;
  padding: 8px;
  z-index: 20;
}

.preview {
  display: none;
  padding-bottom: 7px;
}

.preview img {
  width: 65px;
  height: 65px;
  object-fit: cover;
  border-radius: 10px;
}

.recording-status {
  display: none;
  color: #ff4d4d;
  font-size: 13px;
  padding: 4px 5px 7px;
}

.controls {
  display: flex;
  gap: 6px;
  align-items: center;
}

textarea {
  flex: 1;
  min-width: 0;
  resize: none;
  background: #1b1b1b;
  color: #fff;
  border: 1px solid #333;
  border-radius: 18px;
  padding: 12px;
  font-size: 16px;
  outline: none;
  max-height: 120px;
}

button {
  border: 0;
  cursor: pointer;
  flex-shrink: 0;
}

.control-button {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: #222;
  color: #fff;
  font-size: 19px;
}

.send-button {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: #fff;
  color: #000;
  font-size: 19px;
}

.recording {
  background: #b91c1c !important;
}

input[type="file"] {
  display: none;
}

.status {
  position: fixed;
  bottom: 72px;
  left: 0;
  width: 100%;
  text-align: center;
  color: #777;
  font-size: 12px;
  z-index: 25;
  pointer-events: none;
}

@media (max-width: 600px) {
  #chat {
    padding: 14px;
  }

  .controls {
    gap: 4px;
  }

  .control-button,
  .send-button {
    width: 43px;
    height: 43px;
  }

  textarea {
    font-size: 15px;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <button
    class="icon-button"
    onclick="newChat()"
    title="Жаңа чат">
    ＋
  </button>

  <div class="header-title">
    🤖 My AI
  </div>

  <div style="width:42px"></div>
</header>


<div id="chat">

  <div class="welcome" id="welcome">
    <h1>Сәлем! 👋</h1>
    <p>Мен — My AI</p>
    <p>Сұрақ қойыңыз немесе сурет жіберіңіз.</p>
  </div>

</div>


<div id="status" class="status"></div>


<div class="bottom-area">

  <div id="preview" class="preview">
    <img id="previewImage">
  </div>

  <div
    id="recordingStatus"
    class="recording-status">
    🔴 Жазылып жатыр... Тоқтату үшін 🎤 батырмасын басыңыз
  </div>


  <div class="controls">

    <!-- Галерея -->
    <button
      class="control-button"
      onclick="document.getElementById('fileInput').click()"
      title="Сурет таңдау">
      📎
    </button>

    <input
      id="fileInput"
      type="file"
      accept="image/jpeg,image/png,image/webp"
      onchange="selectImage(event)">


    <!-- Камера -->
    <button
      class="control-button"
      onclick="document.getElementById('cameraInput').click()"
      title="Камера">
      📷
    </button>

    <input
      id="cameraInput"
      type="file"
      accept="image/*"
      capture="environment"
      onchange="selectImage(event)">


    <!-- Микрофон -->
    <button
      id="micButton"
      class="control-button"
      onclick="toggleRecording()"
      title="Дауыс">
      🎤
    </button>


    <textarea
      id="input"
      rows="1"
      placeholder="Хабарлама жазыңыз..."></textarea>


    <button
      class="send-button"
      onclick="sendMessage()"
      title="Жіберу">
      ➤
    </button>

  </div>

</div>

</div>


<script>

/* =========================================
   CLOUDFLARE WORKER
========================================= */

const WORKER_URL =
"https://my-ai-backend.razinavsegda84.workers.dev";


/* =========================================
   STATE
========================================= */

let chatHistory = [];

let selectedImage = null;

let mediaRecorder = null;

let audioChunks = [];

let isRecording = false;

let audioMimeType = "audio/webm";


/* =========================================
   STATUS
========================================= */

function setStatus(text) {

  document.getElementById("status").textContent =
    text || "";

}


/* =========================================
   NEW CHAT
========================================= */

function newChat() {

  if (
    !confirm("Жаңа чат бастаймыз ба?")
  ) {
    return;
  }

  chatHistory = [];

  selectedImage = null;

  document.getElementById("chat").innerHTML = `
    <div class="welcome" id="welcome">
      <h1>Сәлем! 👋</h1>
      <p>Мен — My AI</p>
      <p>Сұрақ қойыңыз немесе сурет жіберіңіз.</p>
    </div>
  `;

  document.getElementById("input").value = "";

  document.getElementById("preview").style.display =
    "none";

  document.getElementById("fileInput").value = "";

  document.getElementById("cameraInput").value = "";

  setStatus("");
}


/* =========================================
   SELECT IMAGE
========================================= */

function selectImage(event) {

  const file =
    event.target.files[0];

  if (!file) return;

  if (!file.type.startsWith("image/")) {

    alert("Тек сурет таңдаңыз.");

    event.target.value = "";

    return;
  }

  if (file.size > 20 * 1024 * 1024) {

    alert("Сурет 20 MB-тан үлкен.");

    event.target.value = "";

    return;
  }

  selectedImage = file;

  const reader =
    new FileReader();

  reader.onload =
    function(e) {

      document.getElementById(
        "previewImage"
      ).src = e.target.result;

      document.getElementById(
        "preview"
      ).style.display = "block";
    };

  reader.readAsDataURL(file);
}


/* =========================================
   COMPRESS IMAGE
========================================= */

function compressImage(file) {

  return new Promise(
    function(resolve, reject) {

      const reader =
        new FileReader();

      reader.onload =
        function(e) {

          const img =
            new Image();

          img.onload =
            function() {

              const MAX =
                1280;

              let width =
                img.width;

              let height =
                img.height;


              if (
                width > MAX ||
                height > MAX
              ) {

                if (width > height) {

                  height =
                    Math.round(
                      height *
                      MAX /
                      width
                    );

                  width =
                    MAX;

                } else {

                  width =
                    Math.round(
                      width *
                      MAX /
                      height
                    );

                  height =
                    MAX;
                }
              }


              const canvas =
                document.createElement(
                  "canvas"
                );

              canvas.width =
                width;

              canvas.height =
                height;


              const ctx =
                canvas.getContext("2d");

              ctx.drawImage(
                img,
                0,
                0,
                width,
                height
              );


              resolve(
                canvas.toDataURL(
                  "image/jpeg",
                  0.70
                )
              );
            };


          img.onerror =
            function() {

              reject(
                new Error(
                  "Суретті ашу мүмкін болмады."
                )
              );
            };


          img.src =
            e.target.result;
        };


      reader.onerror =
        function() {

          reject(
            new Error(
              "Суретті оқу мүмкін болмады."
            )
          );
        };


      reader.readAsDataURL(file);

    }
  );
}


/* =========================================
   ADD MESSAGE
========================================= */
function addMessage(
  text,
  type,
  image = null
) {

  const chat =
    document.getElementById("chat");

  const div =
    document.createElement("div");

  div.className =
    "message " + type;


  if (image) {

    const img =
      document.createElement("img");

    img.src =
      image;

    div.appendChild(img);
  }


  if (text) {

    const textDiv =
      document.createElement("div");

    textDiv.textContent =
      text;

    div.appendChild(textDiv);


    // AI жауабына 🔊 батырмасын қосу
    if (type === "ai") {

      const speakButton =
        document.createElement("button");

      speakButton.textContent =
        "🔊";

      speakButton.style.marginTop =
        "10px";

      speakButton.style.background =
        "#333";

      speakButton.style.color =
        "#fff";

      speakButton.style.border =
        "0";

      speakButton.style.borderRadius =
        "50%";

      speakButton.style.width =
        "40px";

      speakButton.style.height =
        "40px";

      speakButton.style.fontSize =
        "18px";

      speakButton.style.cursor =
        "pointer";


      speakButton.onclick =
        function() {

          speakAnswer(text);

        };


      div.appendChild(
        speakButton
      );
    }
  }


  chat.appendChild(div);

  chat.scrollTop =
    chat.scrollHeight;


  return div;
}



/* =========================================
   MICROPHONE
========================================= */

async function toggleRecording() {

  if (isRecording) {

    stopRecording();

    return;
  }


  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    alert(
      "Бұл браузер микрофонды жазуды қолдамайды."
    );

    return;
  }


  try {

    const stream =
      await navigator.mediaDevices.getUserMedia({
        audio: true
      });


    audioChunks = [];


    /*
     * iPhone Safari көбіне mp4/aac
     * немесе webm форматтарын қолдануы мүмкін.
     */

    let options = {};


    if (
      MediaRecorder.isTypeSupported(
        "audio/mp4"
      )
    ) {

      options.mimeType =
        "audio/mp4";

      audioMimeType =
        "audio/mp4";

    }

    else if (
      MediaRecorder.isTypeSupported(
        "audio/webm;codecs=opus"
      )
    ) {

      options.mimeType =
        "audio/webm;codecs=opus";

      audioMimeType =
        "audio/webm";

    }

    else if (
      MediaRecorder.isTypeSupported(
        "audio/webm"
      )
    ) {

      options.mimeType =
        "audio/webm";

      audioMimeType =
        "audio/webm";

    }

    else {

      audioMimeType =
        "audio/webm";
    }


    mediaRecorder =
      new MediaRecorder(
        stream,
        options
      );


    mediaRecorder.ondataavailable =
      function(event) {

        if (
          event.data &&
          event.data.size > 0
        ) {

          audioChunks.push(
            event.data
          );
        }
      };


    mediaRecorder.onstop =
      async function() {

        stream
          .getTracks()
          .forEach(
            track => track.stop()
          );


        const blob =
          new Blob(
            audioChunks,
            {
              type:
                audioMimeType
            }
          );


        await sendAudio(
          blob
        );
      };


    mediaRecorder.start();


    isRecording =
      true;


    document
      .getElementById(
        "micButton"
      )
      .classList.add(
        "recording"
      );


    document
      .getElementById(
        "micButton"
      )
      .textContent =
        "⏹️";


    document
      .getElementById(
        "recordingStatus"
      )
      .style.display =
        "block";


    setStatus(
      "Микрофон қосылды..."
    );


  }

  catch (error) {

    console.error(error);

    alert(
      "Микрофонға рұқсат берілмеді немесе микрофон қолжетімсіз."
    );

  }
}


/* =========================================
   STOP RECORDING
========================================= */

function stopRecording() {

  if (
    mediaRecorder &&
    mediaRecorder.state !== "inactive"
  ) {

    mediaRecorder.stop();
  }


  isRecording =
    false;


  document
    .getElementById(
      "micButton"
    )
    .classList.remove(
      "recording"
    );


  document
    .getElementById(
      "micButton"
    )
    .textContent =
      "🎤";


  document
    .getElementById(
      "recordingStatus"
    )
    .style.display =
      "none";


  setStatus(
    "Аудио өңделіп жатыр..."
  );
}


/* =========================================
   BLOB → BASE64
========================================= */

function blobToBase64(blob) {

  return new Promise(
    function(resolve, reject) {

      const reader =
        new FileReader();

      reader.onloadend =
        function() {

          resolve(
            reader.result
          );
        };


      reader.onerror =
        function() {

          reject(
            new Error(
              "Аудионы оқу мүмкін болмады."
            )
          );
        };


      reader.readAsDataURL(blob);

    }
  );
}


/* =========================================
   SEND AUDIO
========================================= */

async function sendAudio(blob) {

  try {

    if (!blob || blob.size === 0) {

      throw new Error(
        "Аудио бос."
      );
    }


    setStatus(
      "🎤 Сөйлеу мәтінге айналдырылып жатыр..."
    );


    const audioBase64 =
      await blobToBase64(blob);


    const response =
      await fetch(
        WORKER_URL,
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              message: "",

              audio:
                audioBase64,

              audioMimeType:
                audioMimeType,

              history:
                chatHistory.slice(-12)

            })

        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Аудио өңдеу қатесі."
      );
    }


    const transcript =
      data.transcript ||
      "";


    if (!transcript) {

      throw new Error(
        "Сөйлеу мәтінге айналмады."
      );
    }


    /*
     * Whisper нәтижесін textarea-ға саламыз.
     * Бірден AI-ға жібермейміз.
     */

    const input =
      document.getElementById(
        "input"
      );

    input.value =
      transcript;


    setStatus(
      "🎤 Дауыс мәтінге айналды. Енді ➤ басыңыз."
    );


  }

  catch (error) {

    console.error(error);

    alert(
      "Дауыс өңдеу қатесі:\n" +
      error.message
    );

    setStatus("");
  }

}


/* =========================================
   SEND TEXT / IMAGE
========================================= */

async function sendMessage() {

  const input =
    document.getElementById("input");

  const text =
    input.value.trim();


  if (
    !text &&
    !selectedImage
  ) {

    return;
  }


  const welcome =
    document.getElementById("welcome");

  if (welcome) {

    welcome.style.display =
      "none";
  }


  let imageData =
    null;


  if (selectedImage) {

    try {

      setStatus(
        "Сурет дайындалып жатыр..."
      );


      imageData =
        await compressImage(
          selectedImage
        );

    }

    catch (error) {

      alert(
        "Суретті дайындау қатесі:\n" +
        error.message
      );

      setStatus("");

      return;
    }
  }


  const userText =
    text ||
    "Осы суретте не бар екенін қазақ тілінде сипатта.";


  addMessage(
    userText,
    "user",
    imageData
  );


  input.value =
    "";


  document.getElementById(
    "preview"
  ).style.display =
    "none";


  setStatus(
    "AI жауап дайындап жатыр..."
  );


  const loading =
    addMessage(
      "AI жауап дайындап жатыр...",
      "ai"
    );


  try {

    const response =
      await fetch(
        WORKER_URL,
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              message:
                userText,

              image:
                imageData,

              history:
                chatHistory.slice(-12)

            })

        }
      );


    const data =
      await response.json();


    loading.remove();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Сервер қатесі: " +
        response.status
      );
    }


    let answer =
      data.answer;


    if (
      typeof answer !==
      "string"
    ) {

      answer =
        JSON.stringify(answer);
    }


    if (!answer) {

      answer =
        "AI жауап бере алмады.";
    }


    addMessage(
      answer,
      "ai"
    );


    chatHistory.push({

      role:
        "user",

      content:
        userText

    });


    chatHistory.push({

      role:
        "assistant",

      content:
        answer

    });


    if (
      chatHistory.length >
      12
    ) {

      chatHistory =
        chatHistory.slice(-12);
    }


    speakAnswer(
      answer
    );


    setStatus("");

  }

  catch (error) {

    loading.remove();


    addMessage(
      "Қате: " +
      error.message,
      "ai"
    );


    setStatus("");
  }


  selectedImage =
    null;


  document.getElementById(
    "fileInput"
  ).value = "";


  document.getElementById(
    "cameraInput"
  ).value = "";
}


/* =========================================
   TEXT TO SPEECH
========================================= */

function speakAnswer(text) {

  if (
    !("speechSynthesis" in window)
  ) {

    alert(
      "Бұл браузер дауыстап оқуды қолдамайды."
    );

    return;
  }


  if (!text) {
    return;
  }


  window.speechSynthesis.cancel();


  const utterance =
    new SpeechSynthesisUtterance(text);


  utterance.lang =
    "kk-KZ";

  utterance.rate =
    0.95;

  utterance.pitch =
    1;


  window.speechSynthesis.speak(
    utterance
  );
}


/* =========================================
   ENTER TO SEND
========================================= */

document
  .getElementById("input")
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();
      }

    }
  );

</script>

</body>
</html>
