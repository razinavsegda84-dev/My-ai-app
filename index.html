<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My AI</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
  height:100vh;
  display:flex;
  flex-direction:column;
}

header{
  height:58px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  border-bottom:1px solid #222;
}

.logo{
  font-size:20px;
  font-weight:bold;
}

.new-chat{
  background:#1d1d1d;
  color:#fff;
  border:1px solid #333;
  border-radius:18px;
  padding:8px 13px;
}

.chat{
  flex:1;
  overflow-y:auto;
  padding:20px;
  max-width:900px;
  width:100%;
  margin:auto;
  padding-bottom:130px;
}

.welcome{
  text-align:center;
  margin-top:22vh;
  color:#888;
}

.welcome h1{
  color:#fff;
  font-size:32px;
}

.message{
  max-width:85%;
  padding:12px 16px;
  margin:12px 0;
  border-radius:18px;
  line-height:1.5;
  white-space:pre-wrap;
  word-wrap:break-word;
}

.user{
  background:#2b2b2b;
  margin-left:auto;
}

.ai{
  background:#151515;
  margin-right:auto;
}

.message img{
  max-width:100%;
  max-height:400px;
  border-radius:14px;
  display:block;
  margin-bottom:8px;
}

.bottom-wrapper{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  background:linear-gradient(to top,#000 75%,transparent);
  padding:12px;
}

.bottom{
  max-width:850px;
  margin:auto;
  background:#1b1b1b;
  border:1px solid #333;
  border-radius:25px;
  padding:7px;
  display:flex;
  align-items:center;
  gap:6px;
}

.attach,
.send{
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  flex-shrink:0;
  cursor:pointer;
}

.attach{
  background:transparent;
  color:#aaa;
  font-size:24px;
}

.send{
  background:#fff;
  color:#000;
  font-size:18px;
}

input[type=text]{
  flex:1;
  min-width:0;
  background:transparent;
  border:0;
  outline:0;
  color:#fff;
  font-size:16px;
  padding:10px;
}

#fileInput{
  display:none;
}

.preview{
  max-width:850px;
  margin:0 auto 8px;
  display:none;
}

.preview-box{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:#1b1b1b;
  border:1px solid #333;
  border-radius:12px;
  padding:8px 12px;
}

.remove{
  border:0;
  background:transparent;
  color:#aaa;
  font-size:18px;
}

.loading{
  color:#888;
  font-style:italic;
}
</style>
</head>

<body>

<header>
  <div class="logo">🤖 My AI</div>
  <button class="new-chat" onclick="newChat()">＋ Жаңа чат</button>
</header>

<div class="chat" id="chat">

  <div class="welcome" id="welcome">
    <h1>Сәлем! 👋</h1>
    <p>Мен — My AI</p>
    <p>Сұрағыңызды жазыңыз.</p>
  </div>

</div>

<div class="bottom-wrapper">

  <div class="preview" id="preview">
    <div class="preview-box">
      <span>🖼️</span>
      <span id="previewName"></span>
      <button class="remove" onclick="removeFile()">×</button>
    </div>
  </div>

  <div class="bottom">

    <button
      class="attach"
      onclick="document.getElementById('fileInput').click()">
      ＋
    </button>

    <input
      type="file"
      id="fileInput"
      accept="image/*"
      onchange="selectFile(event)"
    >

    <input
      id="input"
      type="text"
      placeholder="Хабарлама жаз..."
      autocomplete="off"
    >

    <button
      class="send"
      onclick="sendMessage()">
      ➤
    </button>

  </div>

</div>

<script>

const API_URL =
  "https://my-ai-backend.razinavsegda84.workers.dev";

let conversation = [];
let selectedFile = null;


/* FILE */

function selectFile(event){

  const file = event.target.files[0];

  if(!file) return;

  selectedFile = file;

  document.getElementById("previewName").textContent =
    file.name;

  document.getElementById("preview").style.display =
    "block";
}


/* REMOVE FILE */

function removeFile(){

  selectedFile = null;

  document.getElementById("fileInput").value = "";

  document.getElementById("preview").style.display =
    "none";
}


/* ADD MESSAGE */

function addMessage(text,type,imageUrl=null){

  const chat =
    document.getElementById("chat");

  const message =
    document.createElement("div");

  message.className =
    "message " + type;

  if(imageUrl){

    const img =
      document.createElement("img");

    img.src = imageUrl;

    message.appendChild(img);
  }

  if(text){

    const textElement =
      document.createElement("div");

    textElement.textContent =
      text;

    message.appendChild(textElement);
  }

  chat.appendChild(message);

  chat.scrollTop =
    chat.scrollHeight;

  return message;
}


/* SEND MESSAGE */

async function sendMessage(){

  const input =
    document.getElementById("input");

  const text =
    input.value.trim();

  if(!text && !selectedFile)
    return;

  const welcome =
    document.getElementById("welcome");

  if(welcome)
    welcome.remove();


  let imageUrl = null;

  if(selectedFile){

    imageUrl =
      URL.createObjectURL(selectedFile);
  }


  const userText =
    text ||
    "Сурет жіберілді. Осы сурет туралы айтып бер.";


  addMessage(
    userText,
    "user",
    imageUrl
  );


  input.value = "";

  removeFile();


  const loading =
    addMessage(
      "AI ойланып жатыр...",
      "ai"
    );

  loading.classList.add("loading");


  try{

    conversation.push({
      role:"user",
      content:userText
    });


    const response =
      await fetch(
        API_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            messages:conversation
          })
        }
      );


    const data =
      await response.json();


    loading.remove();


    if(!response.ok){

      throw new Error(
        data.error ||
        "AI сервер қатесі"
      );

    }


    const answer =
      data.answer ||
      "AI жауап бермеді.";


    conversation.push({
      role:"assistant",
      content:answer
    });


    addMessage(
      answer,
      "ai"
    );


  }catch(error){

    loading.remove();

    addMessage(
      "Қате: " + error.message,
      "ai"
    );

  }

}


/* NEW CHAT */

function newChat(){

  conversation = [];

  const chat =
    document.getElementById("chat");

  chat.innerHTML = `
    <div class="welcome" id="welcome">
      <h1>Сәлем! 👋</h1>
      <p>Мен — My AI</p>
      <p>Сұрағыңызды жазыңыз.</p>
    </div>
  `;

  removeFile();
}


/* ENTER */

document
  .getElementById("input")
  .addEventListener(
    "keydown",
    function(e){

      if(e.key === "Enter"){

        e.preventDefault();

        sendMessage();

      }

    }
  );

</script>

</body>
</html>
