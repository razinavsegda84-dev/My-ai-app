<!DOCTYPE html>
<html lang="kk">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
>

<title>My AI</title>

<style>

*{
  box-sizing:border-box;
}

body{

  margin:0;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:#0b0d10;

  color:#fff;

  height:100vh;

  overflow:hidden;

}

button,
input,
textarea,
select{

  font:inherit;

}

button{

  cursor:pointer;

}

.app{

  height:100vh;

  display:flex;

  flex-direction:column;

}


/* HEADER */

.header{

  height:60px;

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:0 14px;

  border-bottom:
    1px solid #24272d;

  background:#101216;

}

.logo{

  font-size:20px;

  font-weight:700;

}

.headerButtons{

  display:flex;

  gap:7px;

}

.iconBtn{

  width:40px;

  height:40px;

  border:0;

  border-radius:12px;

  background:#1b1f25;

  color:#fff;

  font-size:19px;

}


/* CHAT */

.chat{

  flex:1;

  overflow-y:auto;

  padding:18px 14px 150px;

}

.welcome{

  text-align:center;

  padding:50px 20px;

}

.welcome h1{

  font-size:30px;

  margin-bottom:10px;

}

.welcome p{

  color:#9298a3;

}


/* MESSAGE */

.message{

  max-width:90%;

  margin:10px 0;

  padding:12px 14px;

  border-radius:17px;

  line-height:1.5;

  white-space:pre-wrap;

  word-break:break-word;

}

.user{

  margin-left:auto;

  background:#315cff;

}

.ai{

  margin-right:auto;

  background:#191d23;

}

.message img{

  max-width:100%;

  border-radius:12px;

  margin-top:8px;

}

.message video{

  width:100%;

  border-radius:12px;

  margin-top:8px;

}


/* ACTIONS */

.messageActions{

  display:flex;

  gap:7px;

  margin-top:9px;

  flex-wrap:wrap;

}

.smallBtn{

  border:0;

  border-radius:9px;

  padding:7px 10px;

  background:#252a31;

  color:#fff;

  font-size:13px;

}


/* INPUT */

.bottom{

  position:fixed;

  left:0;

  right:0;

  bottom:0;

  padding:10px;

  background:
    linear-gradient(
      transparent,
      #0b0d10 20%
    );

}

.inputBox{

  max-width:900px;

  margin:auto;

  background:#181c21;

  border:
    1px solid #292e36;

  border-radius:20px;

  padding:9px;

}

textarea{

  width:100%;

  resize:none;

  border:0;

  outline:0;

  background:transparent;

  color:#fff;

  min-height:46px;

  max-height:130px;

  padding:8px;

}

.toolbar{

  display:flex;

  align-items:center;

  gap:7px;

}

.tool{

  width:40px;

  height:40px;

  border:0;

  border-radius:11px;

  background:#252a31;

  color:#fff;

}

.send{

  margin-left:auto;

  background:#315cff;

}


/* IMAGE PREVIEW */

.preview{

  display:none;

  padding:6px;

}

.preview img{

  width:80px;

  height:80px;

  object-fit:cover;

  border-radius:12px;

}


/* MENU */

.overlay{

  position:fixed;

  inset:0;

  background:rgba(0,0,0,.6);

  display:none;

  z-index:20;

}

.menu{

  position:absolute;

  right:10px;

  top:60px;

  width:260px;

  background:#171a1f;

  border:1px solid #2b3038;

  border-radius:16px;

  padding:8px;

}

.menu button{

  width:100%;

  padding:13px;

  border:0;

  background:transparent;

  color:#fff;

  text-align:left;

  border-radius:10px;

}

.menu button:hover{

  background:#252a31;

}


/* MODAL */

.modal{

  position:fixed;

  inset:0;

  background:rgba(0,0,0,.72);

  display:none;

  align-items:flex-end;

  justify-content:center;

  z-index:30;

}

.modalBox{

  width:100%;

  max-width:600px;

  max-height:90vh;

  overflow:auto;

  background:#171a1f;

  border-radius:22px 22px 0 0;

  padding:20px;

}

.modalBox h2{

  margin-top:0;

}

.setting{

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:13px 0;

  border-bottom:1px solid #292e35;

}

.setting select{

  background:#252a31;

  color:#fff;

  border:0;

  padding:8px;

  border-radius:9px;

}


/* GENERATOR */

.generator{

  display:none;

}

.generator textarea{

  background:#20242a;

  border-radius:12px;

  margin:10px 0;

}

.genBtn{

  width:100%;

  padding:13px;

  border:0;

  border-radius:12px;

  background:#315cff;

  color:#fff;

  margin-bottom:8px;

}

.closeBtn{

  width:100%;

  padding:12px;

  border:0;

  border-radius:12px;

  background:#292e35;

  color:#fff;

}


/* LOADING */

.loading{

  display:inline-flex;

  gap:5px;

  align-items:center;

}

.dot{

  width:6px;

  height:6px;

  background:#fff;

  border-radius:50%;

  animation:
    blink 1s infinite;

}

.dot:nth-child(2){

  animation-delay:.2s;

}

.dot:nth-child(3){

  animation-delay:.4s;

}

@keyframes blink{

  0%,100%{

    opacity:.2;

  }

  50%{

    opacity:1;

  }

}


/* DARK/LIGHT */

.light{

  background:#f5f5f5;

  color:#111;

}

.light .header,
.light .inputBox,
.light .modalBox,
.light .menu{

  background:#fff;

  color:#111;

}

.light textarea{

  color:#111;

}

.light .ai{

  background:#e5e5e5;

  color:#111;

}

.light .iconBtn,
.light .tool,
.light .smallBtn{

  background:#e8e8e8;

  color:#111;

}

</style>

</head>


<body>

<div class="app">


<!-- HEADER -->

<header class="header">

  <div class="logo">
    My AI
  </div>

  <div class="headerButtons">

    <button
      class="iconBtn"
      onclick="newChat()"
      title="Жаңа чат"
    >
      ＋
    </button>

    <button
      class="iconBtn"
      onclick="toggleMenu()"
      title="Мәзір"
    >
      ☰
    </button>

  </div>

</header>


<!-- CHAT -->

<main
  id="chat"
  class="chat"
>

  <div
    id="welcome"
    class="welcome"
  >

    <h1>My AI</h1>

    <p>
      Қазақша сөйлесіңіз.
      Сурет, файл, дауыс, видео және
      мәтінмен жұмыс істей аламын.
    </p>

  </div>

</main>


<!-- BOTTOM -->

<div class="bottom">

  <div class="inputBox">

    <div
      id="preview"
      class="preview"
    >

      <img
        id="previewImage"
      >

    </div>


    <textarea
      id="message"
      placeholder="My AI-ға сұрақ қойыңыз..."
      rows="1"
      onkeydown="handleKey(event)"
    ></textarea>


    <div class="toolbar">

      <button
        class="tool"
        onclick="openFile()"
        title="Файл"
      >
        📎
      </button>

      <button
        class="tool"
        onclick="openCamera()"
        title="Камера"
      >
        📷
      </button>

      <button
        class="tool"
        onclick="toggleRecording()"
        id="micBtn"
        title="Дауыс"
      >
        🎤
      </button>

      <button
        class="tool"
        onclick="openGenerator('image')"
        title="Сурет жасау"
      >
        🎨
      </button>

      <button
        class="tool"
        onclick="openGenerator('video')"
        title="Видео жасау"
      >
        🎬
      </button>

      <button
        class="tool"
        onclick="openSearch()"
        title="Іздеу"
      >
        🔎
      </button>

      <button
        class="tool send"
        onclick="sendMessage()"
        title="Жіберу"
      >
        ➤
      </button>

    </div>

  </div>

</div>


<!-- HIDDEN FILE -->

<input
  id="fileInput"
  type="file"
  accept="image/*,.txt,.pdf,.doc,.docx"
  style="display:none"
  onchange="handleFile(event)"
>


<input
  id="cameraInput"
  type="file"
  accept="image/*"
  capture="environment"
  style="display:none"
  onchange="handleCamera(event)"
>


<!-- MENU -->

<div
  id="menuOverlay"
  class="overlay"
  onclick="closeMenu(event)"
>

  <div
    class="menu"
    onclick="event.stopPropagation()"
  >

    <button onclick="newChat()">
      🆕 Жаңа чат
    </button>

    <button onclick="openSettings()">
      ⚙️ Баптаулар
    </button>

    <button onclick="openGenerator('image')">
      🎨 Сурет генерациясы
    </button>

    <button onclick="openGenerator('video')">
      🎬 Видео генерациясы
    </button>

    <button onclick="openSearch()">
      🔎 Интернеттен іздеу
    </button>

    <button onclick="openURL()">
      🌐 Сайт оқу
    </button>

    <button onclick="clearHistory()">
      🗑️ Чатты тазалау
    </button>

  </div>

</div>


<!-- GENERATOR MODAL -->

<div
  id="generatorModal"
  class="modal"
>

  <div class="modalBox">

    <h2 id="generatorTitle">
      🎨 Сурет жасау
    </h2>

    <textarea
      id="generatorPrompt"
      rows="5"
      placeholder="Мысалы: Қазақстанның тауларында тұрған ақ бүркіт"
    ></textarea>


    <div
      id="videoOptions"
      style="display:none"
    >

      <div class="setting">

        <span>Ұзақтығы</span>

        <select id="videoDuration">

          <option value="5">
            5 секунд
          </option>

          <option value="10">
            10 секунд
          </option>

          <option value="15">
            15 секунд
          </option>

          <option value="20">
            20 секунд
          </option>

        </select>

      </div>


      <div class="setting">

        <span>Сапасы</span>

        <select id="videoResolution">

          <option value="hd">
            HD
          </option>

          <option value="fhd">
            Full HD
          </option>

        </select>

      </div>


      <div class="setting">

        <span>Дыбыс</span>

        <input
          id="videoAudio"
          type="checkbox"
          checked
        >

      </div>

    </div>


    <button
      class="genBtn"
      onclick="generateContent()"
    >
      Жасау
    </button>

    <button
      class="closeBtn"
      onclick="closeGenerator()"
    >
      Жабу
    </button>

  </div>

</div>


<!-- SETTINGS -->

<div
  id="settingsModal"
  class="modal"
>

  <div class="modalBox">

    <h2>
      ⚙️ Баптаулар
    </h2>


    <div class="setting">

      <span>
        Тақырып
      </span>

      <select
        id="theme"
        onchange="changeTheme()"
      >

        <option value="dark">
          Қара
        </option>

        <option value="light">
          Ақ
        </option>

      </select>

    </div>


    <div class="setting">

      <span>
        Интерфейс тілі
      </span>

      <select id="language">

        <option value="kk">
          Қазақша
        </option>

        <option value="ru">
          Русский
        </option>

        <option value="en">
          English
        </option>

      </select>

    </div>


    <div class="setting">

      <span>
        AI жауабын сақтау
      </span>

      <input
        id="saveAnswers"
        type="checkbox"
        checked
      >

    </div>


    <div class="setting">

      <span>
        Автоматты дауыс
      </span>

      <input
        id="autoSpeak"
        type="checkbox"
      >

    </div>


    <button
      class="genBtn"
      onclick="saveSettings()"
    >
      Сақтау
    </button>

    <button
      class="closeBtn"
      onclick="closeSettings()"
    >
      Жабу
    </button>

  </div>

</div>


<script>


/*
============================================================
 WORKER URL
============================================================
*/

const WORKER_URL =
  "https://my-ai-backend.razinavsegda84.workers.dev";


/*
============================================================
 STATE
============================================================
*/

let selectedImage = null;

let selectedFileText = "";

let selectedFileName = "";

let chatHistory = [];

let recorder = null;

let audioChunks = [];

let recording = false;

let generatorType = "image";


/*
============================================================
 STORAGE
============================================================
*/

function saveLocal(){

  localStorage.setItem(

    "my_ai_history",

    JSON.stringify(
      chatHistory
    )

  );

}


function loadLocal(){

  try{

    chatHistory =
      JSON.parse(

        localStorage.getItem(
          "my_ai_history"
        ) || "[]"

      );

  }catch{

    chatHistory = [];

  }

}


/*
============================================================
 INIT
============================================================
*/

loadLocal();

loadSettings();


/*
============================================================
 KEYBOARD
============================================================
*/

function handleKey(event){

  if(
    event.key === "Enter" &&
    !event.shiftKey
  ){

    event.preventDefault();

    sendMessage();

  }

}


/*
============================================================
 MENU
============================================================
*/

function toggleMenu(){

  document
    .getElementById("menuOverlay")
    .style.display = "block";

}


function closeMenu(event){

  if(
    !event ||
    event.target.id ===
    "menuOverlay"
  ){

    document
      .getElementById("menuOverlay")
      .style.display = "none";

  }

}


/*
============================================================
 NEW CHAT
============================================================
*/

function newChat(){

  chatHistory = [];

  selectedImage = null;

  selectedFileText = "";

  selectedFileName = "";

  document
    .getElementById("chat")
    .innerHTML = `

      <div
        id="welcome"
        class="welcome"
      >

        <h1>My AI</h1>

        <p>
          Жаңа чат басталды.
        </p>

      </div>

  `;

  document
    .getElementById("message")
    .value = "";

  document
    .getElementById("preview")
    .style.display = "none";

  saveLocal();

  closeMenu();

}


/*
============================================================
 CLEAR
============================================================
*/

function clearHistory(){

  if(
    confirm(
      "Чатты толық тазалаймыз ба?"
    )
  ){

    newChat();

  }

}


/*
============================================================
 ADD MESSAGE
============================================================
*/

function addMessage(

  text,
  role = "ai",
  extra = null

){

  const chat =
    document.getElementById("chat");


  const welcome =
    document.getElementById("welcome");


  if(
    welcome
  ){

    welcome.remove();

  }


  const div =
    document.createElement("div");


  div.className =
    "message " +
    role;


  div.textContent =
    text;


  if(
    extra?.image
  ){

    const img =
      document.createElement("img");

    img.src =
      extra.image;

    div.appendChild(img);

  }


  if(
    extra?.video
  ){

    const video =
      document.createElement("video");

    video.controls = true;

    video.playsInline = true;

    video.src =
      extra.video;

    div.appendChild(video);

  }


  if(
    role === "ai"
  ){

    const actions =
      document.createElement("div");

    actions.className =
      "messageActions";


    const speak =
      document.createElement("button");

    speak.className =
      "smallBtn";

    speak.textContent =
      "🔊 Тыңдау";

    speak.onclick = () =>
      speakAnswer(text);


    actions.appendChild(
      speak
    );


    const copy =
      document.createElement("button");

    copy.className =
      "smallBtn";

    copy.textContent =
      "📋 Көшіру";

    copy.onclick = () =>
      navigator.clipboard.writeText(text);


    actions.appendChild(
      copy
    );


    div.appendChild(
      actions
    );

  }


  chat.appendChild(div);

  chat.scrollTop =
    chat.scrollHeight;

}


/*
============================================================
 SEND MESSAGE
============================================================
*/

async function sendMessage(){

  const input =
    document.getElementById(
      "message"
    );


  const message =
    input.value.trim();


  if(
    !message &&
    !selectedImage &&
    !selectedFileText
  ){

    return;

  }


  addMessage(
    message ||
    "Медиа жіберілді.",
    "user"
  );


  input.value = "";


  const loading =
    document.createElement("div");

  loading.className =
    "message ai";

  loading.innerHTML = `

    <div class="loading">

      <span>AI жұмыс істеп жатыр</span>

      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>

    </div>

  `;


  document
    .getElementById("chat")
    .appendChild(loading);


  try{

    const response =
      await fetch(

        WORKER_URL,

        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              action:
                "chat",

              message,

              image:
                selectedImage,

              fileText:
                selectedFileText,

              fileName:
                selectedFileName,

              history:
                chatHistory

            })

        }

      );


    const data =
      await response.json();


    loading.remove();


    if(
      !response.ok ||
      !data.ok
    ){

      addMessage(

        data.error ||
        "Сервер қатесі.",

        "ai"

      );

      return;

    }


    addMessage(
      data.answer,
      "ai"
    );


    chatHistory.push({

      role:"user",

      content:
        message

    });


    chatHistory.push({

      role:"assistant",

      content:
        data.answer

    });


    chatHistory =
      chatHistory.slice(-20);


    saveLocal();


    if(
      document.getElementById(
        "autoSpeak"
      )?.checked
    ){

      speakAnswer(
        data.answer
      );

    }


  }catch(err){

    loading.remove();

    addMessage(

      "Байланыс қатесі: " +
      err.message,

      "ai"

    );

  }


  selectedImage = null;

  selectedFileText = "";

  selectedFileName = "";

  document
    .getElementById("preview")
    .style.display = "none";

}


/*
============================================================
 FILE
============================================================
*/

function openFile(){

  document
    .getElementById("fileInput")
    .click();

}


async function handleFile(event){

  const file =
    event.target.files[0];


  if(
    !file
  ){

    return;

  }


  selectedFileName =
    file.name;


  if(
    file.type.startsWith(
      "image/"
    )
  ){

    selectedImage =
      await fileToDataURL(file);


    showPreview(
      selectedImage
    );

    return;

  }


  if(
    file.type ===
    "text/plain"
  ){

    selectedFileText =
      await file.text();

    addMessage(
      "📄 Файл дайын: " +
      file.name,
      "user"
    );

    return;

  }


  /*
  PDF/DOCX
  ----------------------------------------------------------
  Frontend browser extraction is limited.
  Worker receives text if available.
  */

  addMessage(

    "📄 " +
    file.name +
    " таңдалды. Бұл файл форматын толық талдау үшін PDF/DOCX мәтінін шығаратын модуль қажет.",

    "ai"

  );

}


/*
============================================================
 CAMERA
============================================================
*/

function openCamera(){

  document
    .getElementById("cameraInput")
    .click();

}


async function handleCamera(event){

  const file =
    event.target.files[0];


  if(
    !file
  ){

    return;

  }


  selectedImage =
    await fileToDataURL(file);


  showPreview(
    selectedImage
  );

}


function fileToDataURL(file){

  return new Promise(
    resolve => {

      const reader =
        new FileReader();

      reader.onload =
        () =>
          resolve(
            reader.result
          );

      reader.readAsDataURL(
        file
      );

    }
  );

}


/*
============================================================
 PREVIEW
============================================================
*/

function showPreview(src){

  document
    .getElementById(
      "preview"
    )
    .style.display =
      "block";


  document
    .getElementById(
      "previewImage"
    )
    .src =
      src;

}


/*
============================================================
 AUDIO
============================================================
*/

async function toggleRecording(){

  if(
    recording
  ){

    stopRecording();

    return;

  }


  try{

    const stream =
      await navigator.mediaDevices
        .getUserMedia({
          audio:true
        });


    recorder =
      new MediaRecorder(
        stream
      );


    audioChunks = [];


    recorder.ondataavailable =
      event => {

        if(
          event.data.size
        ){

          audioChunks.push(
            event.data
          );

        }

      };


    recorder.onstop =
      async () => {

        const blob =
          new Blob(
            audioChunks,
            {
              type:
                recorder.mimeType ||
                "audio/webm"
            }
          );


        stream
          .getTracks()
          .forEach(
            track =>
              track.stop()
          );


        await sendAudio(
          blob
        );

      };


    recorder.start();

    recording = true;


    document
      .getElementById(
        "micBtn"
      )
      .textContent =
        "⏹️";


  }catch(err){

    addMessage(

      "Микрофонға рұқсат берілмеді: " +
      err.message,

      "ai"

    );

  }

}


function stopRecording(){

  if(
    recorder &&
    recorder.state !==
    "inactive"
  ){

    recorder.stop();

  }


  recording = false;


  document
    .getElementById(
      "micBtn"
    )
    .textContent =
      "🎤";

}


/*
============================================================
 SEND AUDIO
============================================================
*/

async function sendAudio(blob){

  const base64 =
    await blobToBase64(
      blob
    );


  try{

    const response =
      await fetch(

        WORKER_URL,

        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              action:
                "transcribe",

              audioBase64:
                base64

            })

        }

      );


    const data =
      await response.json();


    if(
      data.ok &&
      data.text
    ){

      document
        .getElementById(
          "message"
        )
        .value =
          data.text;

    }else{

      addMessage(

        data.error ||
        "Дауыс танылмады.",

        "ai"

      );

    }

  }catch(err){

    addMessage(

      "Дауыс өңдеу қатесі: " +
      err.message,

      "ai"

    );

  }

}


function blobToBase64(blob){

  return new Promise(
    resolve => {

      const reader =
        new FileReader();

      reader.onloadend =
        () => {

          resolve(
            reader.result
          );

        };

      reader.readAsDataURL(
        blob
      );

    }
  );

}


/*
============================================================
 TTS
============================================================
*/

async function speakAnswer(text){

  try{

    const response =
      await fetch(

        WORKER_URL,

        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              action:
                "tts",

              text

            })

        }

      );


    const contentType =
      response.headers.get(
        "content-type"
      ) || "";


    if(
      contentType.includes(
        "audio"
      )
    ){

      const blob =
        await response.blob();


      const url =
        URL.createObjectURL(
          blob
        );


      const audio =
        new Audio(url);


      audio.play();


      return;

    }


    const data =
      await response.json();


    if(
      data.audio
    ){

      const audio =
        new Audio(

          data.audio.startsWith(
            "data:"
          )
            ? data.audio
            : "data:audio/mpeg;base64," +
              data.audio

        );


      audio.play();

      return;

    }


    /*
    Browser fallback
    */

    const utterance =
      new SpeechSynthesisUtterance(
        text
      );

    utterance.lang =
      "kk-KZ";

    speechSynthesis.speak(
      utterance
    );


  }catch(err){

    const utterance =
      new SpeechSynthesisUtterance(
        text
      );

    utterance.lang =
      "kk-KZ";

    speechSynthesis.speak(
      utterance
    );

  }

}

    .getElementById(
      "generatorModal"

}


/*
============================================================
 GENERATE
============================================================
*/

async function generateContent(){

  const prompt =
    document
      .getElementById(
        "generatorPrompt"
      )
      .value.trim();


  if(
    !prompt
  ){

    alert(
      "Сипаттама жазыңыз."
    );

    return;

  }


  const action =
    generatorType === "image"
      ? "image_generation"
      : "video_generation";


  const payload = {

    action,

    prompt

  };


  if(
    generatorType === "video"
  ){

    payload.duration =
      Number(

        document
          .getElementById(
            "videoDuration"
          )
          .value

      );


    payload.resolution =
      document
        .getElementById(
          "videoResolution"
        )
        .value;


    payload.generate_audio =
      document
        .getElementById(
          "videoAudio"
        )
        .checked;

  }


  closeGenerator();


  addMessage(

    (
      generatorType === "image"
        ? "🎨 Сурет жасалуда: "
        : "🎬 Видео жасалуда: "
    ) +

    prompt,

    "user"

  );


  const loading =
    document.createElement(
      "div"
    );


  loading.className =
    "message ai";


  loading.innerHTML = `

    <div class="loading">

      <span>
        ${
          generatorType ===
          "image"
            ? "Сурет жасалуда"
            : "Видео жасалуда"
        }
      </span>

      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>

    </div>

  `;


  document
    .getElementById(
      "chat"
    )
    .appendChild(
      loading
    );


  try{

    const response =
      await fetch(

        WORKER_URL,

        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(
              payload
            )

        }

      );


    const data =
      await response.json();


    loading.remove();


    if(
      !response.ok ||
      !data.ok
    ){

      addMessage(

        data.error ||
        "Генерация қатесі.",

        "ai"

      );

      return;

    }


    if(
      data.type ===
      "image"
    ){

      addMessage(

        "🎨 Сурет дайын.",

        "ai",

        {
          image:
            data.image
        }

      );

    }


    else if(
      data.type ===
      "video"
    ){

      if(
        data.video
      ){

        addMessage(

          "🎬 Видео дайын.",

          "ai",

          {
            video:
              data.video
          }

        );

      }else{

        addMessage(

          "Видео генераторы жауап қайтарды, бірақ видео URL берілмеді.",

          "ai"

        );

      }

    }


  }catch(err){

    loading.remove();

    addMessage(

      "Генерация қатесі: " +
      err.message,

      "ai"

    );

  }

}

    "🔎 Іздеу: " + query,

  );


  try{

    const response =
      await fetch(

        WORKER_URL,

        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              action:
                "search",

              query

            })

        }

    const data =
      await response.json();


    if(

      addMessage(

    }else{

}

function openSettings(){

  document
    .getElementById(
      "settingsModal"

      "flex";

}


function closeSettings(){

  document
    .getElementById(
      "settingsModal"
    )
    .style.display =
      "none";

}


function saveSettings(){

  localStorage.setItem(

    "my_ai_settings",

    JSON.stringify({

      theme:
        document
          .getElementById(
            "theme"
          )
          .value,

      language:
        document
          .getElementById(
            "language"
          )
          .value,

      saveAnswers:
        document
          .getElementById(
            "saveAnswers"
          )
          .checked,

      autoSpeak:
        document
          .getElementById(
            "autoSpeak"
          )
          .checked

    })

  );


  changeTheme();

  closeSettings();

}


function loadSettings(){

  try{

    const settings =
      JSON.parse(

        localStorage.getItem(
          "my_ai_settings"
        ) || "{}"

      );


    if(
      settings.theme
    ){

      document
        .getElementById(
          "theme"
        )
        .value =
          settings.theme;

    }


    if(
      settings.language
    ){

      document
        .getElementById(
          "language"
        )
        .value =
          settings.language;

    }


    if(
      typeof settings.saveAnswers ===
      "boolean"
    ){

      document
        .getElementById(
          "saveAnswers"
        )
        .checked =
          settings.saveAnswers;

    }


    if(
      typeof settings.autoSpeak ===
      "boolean"
    ){

      document
        .getElementById(
          "autoSpeak"
        )
        .checked =
          settings.autoSpeak;

    }


    changeTheme();


  }catch{

  }

}


/*
============================================================
 THEME
============================================================
*/

function changeTheme(){

  const theme =
    document
      .getElementById(
        "theme"
      )
      ?.value;


  if(
    theme === "light"
  ){

    document.body
      .classList
      .add("light");

  }else{

    document.body
      .classList
      .remove("light");

  }

}
