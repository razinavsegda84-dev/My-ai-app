<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0b0f;
      color: #ffffff;
      font-family: Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid #292929;
      background: #101014;
      flex-shrink: 0;
    }

    .logo {
      font-size: 21px;
      font-weight: bold;
    }

    .status {
      font-size: 12px;
      color: #8f8f8f;
    }

    .status.online {
      color: #54d17a;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px 14px 130px;
    }

    .message {
      max-width: 850px;
      margin: 0 auto 18px;
      display: flex;
    }

    .message.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 85%;
      padding: 12px 15px;
      border-radius: 16px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .assistant .bubble {
      background: #17171c;
      border: 1px solid #29292f;
    }

    .user .bubble {
      background: #303036;
    }

    .bubble img {
      max-width: 100%;
      border-radius: 12px;
      margin-top: 8px;
    }

    .composer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(
        transparent,
        #0b0b0f 22%
      );
      padding: 35px 12px 12px;
    }

    .composer-inner {
      max-width: 850px;
      margin: auto;
      background: #15151a;
      border: 1px solid #303038;
      border-radius: 18px;
      padding: 8px;
    }

    textarea {
      width: 100%;
      resize: none;
      min-height: 48px;
      max-height: 150px;
      background: transparent;
      border: 0;
      outline: 0;
      color: white;
      font-size: 16px;
      padding: 10px;
      font-family: inherit;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px;
    }

    button {
      border: 0;
      cursor: pointer;
      color: white;
      background: #27272e;
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 14px;
    }

    button:hover {
      background: #35353e;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .send {
      margin-left: auto;
      background: #ffffff;
      color: #000000;
      font-weight: bold;
    }

    .send:hover {
      background: #dddddd;
    }

    input[type="file"] {
      display: none;
    }

    .preview {
      display: none;
      padding: 8px;
      border-bottom: 1px solid #29292f;
    }

    .preview img {
      max-width: 100px;
      max-height: 100px;
      border-radius: 10px;
    }

    .file-name {
      color: #aaa;
      font-size: 13px;
      padding: 5px;
    }

    .typing {
      opacity: .7;
    }

    .error {
      color: #ff6b6b;
    }

    .generated-image {
      max-width: 100%;
      border-radius: 14px;
      display: block;
      margin-top: 8px;
    }

    @media (max-width: 600px) {
      header {
        height: 54px;
      }

      .bubble {
        max-width: 92%;
      }

      #chat {
        padding-left: 8px;
        padding-right: 8px;
      }

      textarea {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="logo">My AI</div>
    <div id="status" class="status">
      Қосылуда...
    </div>
  </header>

  <main id="chat"></main>

  <div class="composer">

    <div class="composer-inner">

      <div id="preview" class="preview"></div>

      <textarea
        id="message"
        placeholder="My AI-ға сұрақ қойыңыз..."
        autocomplete="off"
      ></textarea>

      <div class="toolbar">

        <label for="imageInput">
          <button
            type="button"
            onclick="document.getElementById('imageInput').click()"
          >
            📷
          </button>
        </label>

        <input
          id="imageInput"
          type="file"
          accept="image/*"
        >

        <label for="fileInput">
          <button
            type="button"
            onclick="document.getElementById('fileInput').click()"
          >
            📎
          </button>
        </label>

        <input
          id="fileInput"
          type="file"
          accept=".txt,.md,.json,.csv,.html,.js,.css,.xml,.pdf"
        >

        <button
          type="button"
          onclick="generateImage()"
        >
          🖼️
        </button>

        <button
          type="button"
          class="send"
          id="sendButton"
          onclick="sendMessage()"
        >
          ➤
        </button>

      </div>

    </div>

  </div>

</div>

<script>

const API_URL =
  "https://my-ai-backend.razinavsegda84.workers.dev";

const chatElement =
  document.getElementById("chat");

const messageElement =
  document.getElementById("message");

const sendButton =
  document.getElementById("sendButton");

const statusElement =
  document.getElementById("status");

const imageInput =
  document.getElementById("imageInput");

const fileInput =
  document.getElementById("fileInput");

const previewElement =
  document.getElementById("preview");

let selectedImages = [];

let selectedFileText = "";

let history = [];


// =====================================================
// START
// =====================================================

window.addEventListener("load", async () => {

  await checkBackend();

  messageElement.focus();

});


// =====================================================
// BACKEND CHECK
// =====================================================

async function checkBackend() {

  try {

    const response =
      await fetch(API_URL, {
        method: "GET"
      });

    const data =
      await response.json();

    if (data && data.ok) {

      statusElement.textContent =
        "Онлайн";

      statusElement.classList.add(
        "online"
      );

    } else {

      statusElement.textContent =
        "Backend қатесі";

    }

  } catch (error) {

    console.error(error);

    statusElement.textContent =
      "Backend қосылмады";

  }
}


// =====================================================
// ENTER
// =====================================================

messageElement.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);


// =====================================================
// IMAGE SELECT
// =====================================================

imageInput.addEventListener(
  "change",
  async function() {

    const file =
      this.files[0];

    if (!file) {
      return;
    }

    const reader =
      new FileReader();

    reader.onload =
      function(event) {

        selectedImages = [
          event.target.result
        ];

        previewElement.style.display =
          "block";

        previewElement.innerHTML = `
          <img src="${event.target.result}">
        `;

      };

    reader.readAsDataURL(file);

  }
);


// =====================================================
// FILE SELECT
// =====================================================

fileInput.addEventListener(
  "change",
  async function() {

    const file =
      this.files[0];

    if (!file) {
      return;
    }

    previewElement.style.display =
      "block";

    previewElement.innerHTML = `
      <div class="file-name">
        📎 ${escapeHtml(file.name)}
      </div>
    `;

    if (
      file.type === "text/plain" ||
      file.name.endsWith(".txt") ||
      file.name.endsWith(".md") ||
      file.name.endsWith(".json") ||
      file.name.endsWith(".csv") ||
      file.name.endsWith(".js") ||
      file.name.endsWith(".css") ||
      file.name.endsWith(".html") ||
      file.name.endsWith(".xml")
    ) {

      try {

        selectedFileText =
          await file.text();

      } catch (error) {

        selectedFileText = "";

        console.error(error);

      }

    } else {

      selectedFileText = "";

      addMessage(
        "assistant",
        "Файл таңдалды: " +
        file.name +
        ". Бұл файл түрінің мәтінін браузер тікелей оқи алмады."
      );

    }

  }
);


// =====================================================
// SEND MESSAGE
// =====================================================

async function sendMessage() {

  const message =
    messageElement.value.trim();

  if (
    !message &&
    selectedImages.length === 0
  ) {
    return;
  }

  setLoading(true);

  if (message) {

    addMessage(
      "user",
      message
    );

  }

  const currentImages =
    [...selectedImages];

  const currentFileText =
    selectedFileText;

  messageElement.value = "";

  selectedImages = [];

  selectedFileText = "";

  previewElement.style.display =
    "none";

  previewElement.innerHTML = "";

  try {

    const response =
      await fetch(
        API_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              action: "chat",

              message:
                message || "Суретті талда.",

              history:
                history.slice(-20),

              images:
                currentImages,

              fileText:
                currentFileText

            })
        }
      );

    const data =
      await response.json();

    if (!response.ok || !data.ok) {

      throw new Error(
        data.error ||
        `HTTP ${response.status}`
      );

    }

    const answer =
      data.answer ||
      "AI жауап бере алмады.";

    addMessage(
      "assistant",
      answer
    );

    history.push({
      role: "user",
      content: message
    });

    history.push({
      role: "assistant",
      content: answer
    });

    history =
      history.slice(-20);

  } catch (error) {

    console.error(error);

    addMessage(
      "assistant",
      "Қате: " +
      error.message
    );

  } finally {

    setLoading(false);

  }
}


// =====================================================
// GENERATE IMAGE
// =====================================================

async function generateImage() {

  const prompt =
    messageElement.value.trim();

  if (!prompt) {

    addMessage(
      "assistant",
      "Сурет жасау үшін алдымен суреттің сипаттамасын жазыңыз."
    );

    return;

  }

  setLoading(true);

  addMessage(
    "user",
    "🖼️ " + prompt
  );

  messageElement.value = "";

  try {

    const response =
      await fetch(
        API_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              action:
                "image",

              prompt:
                prompt,

              width:
                1024,

              height:
                1024

            })
        }
      );

    const data =
      await response.json();

    if (!response.ok || !data.ok) {

      throw new Error(
        data.error ||
        `HTTP ${response.status}`
      );

    }

    if (!data.image) {

      throw new Error(
        "Сурет қайтарылмады."
      );

    }

    addImageMessage(
      data.image
    );

  } catch (error) {

    console.error(error);

    addMessage(
      "assistant",
      "Сурет жасау қатесі: " +
      error.message
    );

  } finally {

    setLoading(false);

  }
}


// =====================================================
// ADD TEXT MESSAGE
// =====================================================

function addMessage(
  role,
  text
) {

  const wrapper =
    document.createElement("div");

  wrapper.className =
    `message ${role}`;

  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";

  bubble.textContent =
    text;

  wrapper.appendChild(
    bubble
  );

  chatElement.appendChild(
    wrapper
  );

  scrollChat();

}


// =====================================================
// ADD IMAGE
// =====================================================

function addImageMessage(
  image
) {

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "message assistant";

  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";

  const img =
    document.createElement("img");

  img.className =
    "generated-image";

  img.src =
    image;

  img.alt =
    "Generated image";

  bubble.appendChild(
    img
  );

  wrapper.appendChild(
    bubble
  );

  chatElement.appendChild(
    wrapper
  );

  scrollChat();

}


// =====================================================
// LOADING
// =====================================================

function setLoading(
  loading
) {

  sendButton.disabled =
    loading;

  messageElement.disabled =
    loading;

  if (loading) {

    statusElement.textContent =
      "Жауап дайындалуда...";

  } else {

    statusElement.textContent =
      "Онлайн";

  }

}


// =====================================================
// SCROLL
// =====================================================

function scrollChat() {

  setTimeout(() => {

    chatElement.scrollTop =
      chatElement.scrollHeight;

  }, 50);

}


// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHtml(
  text
) {

  return String(text)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}

</script>

</body>
</html>
