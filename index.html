<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>My AI</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
}

body{
  background:#0b0b0f;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow:hidden;
  transition:.2s;
}

body.light{
  background:#f5f5f7;
  color:#111;
}

.app{
  width:100%;
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* HEADER */

header{
  height:58px;
  display:flex;
  align-items:center;
  padding:0 12px;
  background:#101014;
  border-bottom:1px solid #292929;
  flex-shrink:0;
  z-index:20;
}

body.light header{
  background:#fff;
  border-color:#ddd;
}

.menu-btn{
  width:42px;
  height:42px;
  padding:0;
  border:0;
  border-radius:10px;
  background:transparent;
  color:#fff;
  font-size:25px;
  cursor:pointer;
}

body.light .menu-btn{
  color:#111;
}

.menu-btn:active{
  background:#29292f;
}

.logo{
  margin-left:5px;
  font-size:20px;
  font-weight:bold;
}

.status{
  margin-left:auto;
  font-size:12px;
  color:#888;
}

.status.online{
  color:#54d17a;
}

/* SIDEBAR */

.sidebar{
  position:fixed;
  top:0;
  left:0;
  width:290px;
  height:100vh;
  padding:12px;
  background:#111116;
  color:#fff;
  border-right:1px solid #29292f;
  z-index:100;
  transform:translateX(-100%);
  transition:transform .25s ease;
  display:flex;
  flex-direction:column;
}

.sidebar.open{
  transform:translateX(0);
}

body.light .sidebar{
  background:#fff;
  color:#111;
  border-color:#ddd;
}

.sidebar-top{
  height:46px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
}

.sidebar-title{
  font-size:20px;
  font-weight:bold;
}

.close-menu{
  width:40px;
  height:40px;
  border:0;
  border-radius:10px;
  background:#25252c;
  color:#fff;
  font-size:23px;
  cursor:pointer;
}

body.light .close-menu{
  background:#eee;
  color:#111;
}

.new-chat{
  width:100%;
  padding:12px;
  margin-bottom:8px;
  border:0;
  border-radius:12px;
  background:#fff;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}

.menu-section{
  margin-top:2px;
}

.menu-item{
  width:100%;
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 10px;
  margin:2px 0;
  border:0;
  border-radius:10px;
  background:transparent;
  color:#fff;
  text-align:left;
  font-size:15px;
  cursor:pointer;
}

body.light .menu-item{
  color:#111;
}

.menu-item:hover,
.menu-item:active{
  background:#222229;
}

body.light .menu-item:hover,
body.light .menu-item:active{
  background:#eee;
}

.menu-icon{
  width:24px;
  text-align:center;
  font-size:19px;
}

.menu-text{
  flex:1;
}

.history-title{
  color:#888;
  font-size:12px;
  padding:12px 5px 7px;
}

.history{
  flex:1;
  min-height:40px;
  overflow-y:auto;
}

.history-empty{
  color:#666;
  padding:10px 7px;
  font-size:13px;
}

.history-item{
  width:100%;
  padding:11px;
  margin-bottom:4px;
  border-radius:10px;
  cursor:pointer;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-size:14px;
}

.history-item:hover{
  background:#222229;
}

body.light .history-item:hover{
  background:#eee;
}

/* DELETE */

.sidebar-bottom{
  flex-shrink:0;
  padding-top:10px;
  margin-top:8px;
  border-top:1px solid #29292f;
}

body.light .sidebar-bottom{
  border-color:#ddd;
}

.clear-history{
  width:100%;
  min-height:44px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 10px;
  border:0;
  border-radius:10px;
  background:#25252c;
  color:#fff;
  font-size:14px;
  cursor:pointer;
}

body.light .clear-history{
  background:#eee;
  color:#111;
}

/* OVERLAY */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:90;
  opacity:0;
  visibility:hidden;
  transition:.2s;
}

.overlay.show{
  opacity:1;
  visibility:visible;
}

/* POPUP */

.popup{
  position:fixed;
  top:70px;
  left:50%;
  width:min(430px,calc(100% - 24px));
  max-height:calc(100vh - 90px);
  overflow-y:auto;
  transform:translate(-50%,-15px);
  opacity:0;
  visibility:hidden;
  z-index:150;
  background:#15151a;
  color:#fff;
  border:1px solid #303038;
  border-radius:16px;
  padding:16px;
  transition:.2s;
}

.popup.show{
  opacity:1;
  visibility:visible;
  transform:translate(-50%,0);
}

body.light .popup{
  background:#fff;
  color:#111;
  border-color:#ddd;
}

.popup-title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:18px;
}

.popup-section{
  margin-bottom:20px;
}

.popup-label{
  display:block;
  color:#999;
  font-size:13px;
  margin-bottom:9px;
}

.option-row{
  display:flex;
  gap:7px;
}

.option-btn{
  flex:1;
  padding:11px 7px;
  border:1px solid #303038;
  border-radius:10px;
  background:#202027;
  color:#fff;
  cursor:pointer;
}

body.light .option-btn{
  background:#f1f1f3;
  color:#111;
  border-color:#ddd;
}

.option-btn.active{
  background:#fff;
  color:#000;
  border-color:#fff;
  font-weight:bold;
}

body.light .option-btn.active{
  background:#111;
  color:#fff;
  border-color:#111;
}

.popup-close{
  width:100%;
  padding:11px;
  border:0;
  border-radius:10px;
  background:#27272e;
  color:#fff;
  cursor:pointer;
}

body.light .popup-close{
  background:#eee;
  color:#111;
}

/* CHAT */

#chat{
  flex:1;
  overflow-y:auto;
  padding:20px 14px 145px;
}

.message{
  max-width:850px;
  margin:0 auto 18px;
  display:flex;
  flex-direction:column;
}

.message.user{
  align-items:flex-end;
}

.message.assistant{
  align-items:flex-start;
}

.bubble{
  max-width:85%;
  padding:12px 15px;
  border-radius:16px;
  line-height:1.5;
  white-space:pre-wrap;
  word-break:break-word;
}

.assistant .bubble{
  background:#17171c;
  border:1px solid #29292f;
}

body.light .assistant .bubble{
  background:#fff;
  border-color:#ddd;
}

.user .bubble{
  background:#303036;
  color:#fff;
}

body.light .user .bubble{
  background:#e2e2e7;
  color:#111;
}

.message-actions{
  display:flex;
  gap:6px;
  margin-top:7px;
}

.message-actions button{
  padding:6px 9px;
  border:1px solid #303038;
  border-radius:8px;
  background:#202027;
  color:#bbb;
  font-size:12px;
  cursor:pointer;
}

body.light .message-actions button{
  background:#eee;
  color:#333;
  border-color:#ddd;
}

/* WELCOME */

.welcome{
  max-width:850px;
  margin:80px auto;
  text-align:center;
  color:#888;
}

.welcome h2{
  color:#fff;
}

body.light .welcome h2{
  color:#111;
}

/* COMPOSER */

.composer{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  padding:35px 12px 12px;
  background:linear-gradient(transparent,#0b0b0f 22%);
  z-index:20;
}

body.light .composer{
  background:linear-gradient(transparent,#f5f5f7 22%);
}

.composer-inner{
  max-width:850px;
  margin:auto;
  padding:8px;
  background:#15151a;
  border:1px solid #303038;
  border-radius:18px;
}

body.light .composer-inner{
  background:#fff;
  border-color:#ddd;
}

textarea{
  width:100%;
  min-height:48px;
  max-height:150px;
  resize:none;
  padding:10px;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  font-size:16px;
  font-family:inherit;
}

body.light textarea{
  color:#111;
}

textarea::placeholder{
  color:#777;
}

.toolbar{
  display:flex;
  align-items:center;
  gap:7px;
  padding:5px;
}

.toolbar button{
  padding:9px 12px;
  border:0;
  border-radius:10px;
  background:#27272e;
  color:#fff;
  cursor:pointer;
}

body.light .toolbar button{
  background:#eee;
  color:#111;
}

.send{
  margin-left:auto;
  background:#fff !important;
  color:#000 !important;
  font-weight:bold;
}

input[type=file]{
  display:none;
}

.preview{
  display:none;
  padding:8px;
  border-bottom:1px solid #29292f;
}

.preview-image{
  max-width:100px;
  max-height:100px;
  border-radius:10px;
}

.generated-image{
  max-width:100%;
  border-radius:14px;
  display:block;
}

@media(max-width:600px){
  .sidebar{
    width:290px;
  }

  .bubble{
    max-width:92%;
  }

  #chat{
    padding-left:8px;
    padding-right:8px;
  }
}
</style>
</head>

<body>

<div class="app">

<!-- SIDEBAR -->

<aside id="sidebar" class="sidebar">

  <div class="sidebar-top">
    <div class="sidebar-title">My AI</div>

    <button type="button"
            class="close-menu"
            onclick="closeAll()">
      ×
    </button>
  </div>

  <button type="button"
          class="new-chat"
          onclick="newChat()">
    ＋ Жаңа чат
  </button>

  <div class="menu-section">

    <button type="button"
            class="menu-item"
            onclick="openImages()">
      <span class="menu-icon">🖼️</span>
      <span class="menu-text" id="menuImages">
        Суреттер
      </span>
    </button>

    <button type="button"
            class="menu-item"
            onclick="openDocuments()">
      <span class="menu-icon">📄</span>
      <span class="menu-text" id="menuDocuments">
        Құжаттар
      </span>
    </button>

    <button type="button"
            class="menu-item"
            onclick="openSettings()">
      <span class="menu-icon">⚙️</span>
      <span class="menu-text" id="menuSettings">
        Баптаулар
      </span>
    </button>

    <button type="button"
            class="menu-item"
            onclick="openAbout()">
      <span class="menu-icon">ℹ️</span>
      <span class="menu-text" id="menuAbout">
        My AI туралы
      </span>
    </button>

  </div>

  <div class="history-title" id="historyTitle">
    Чат тарихы
  </div>

  <div id="historyList" class="history"></div>

  <div class="sidebar-bottom">

    <button type="button"
            class="clear-history"
            onclick="clearHistory()">

      <span>🗑️</span>

      <span id="deleteAllText">
        Барлық чаттарды өшіру
      </span>

    </button>

  </div>

</aside>


<!-- OVERLAY -->

<div id="overlay"
     class="overlay"
     onclick="closeAll()">
</div>


<!-- SETTINGS -->

<div id="settingsPopup" class="popup">

  <div class="popup-title" id="settingsTitle">
    ⚙️ Баптаулар
  </div>

  <div class="popup-section">

    <span class="popup-label">
      🌐 Тіл
    </span>

    <div class="option-row">

      <button type="button"
              class="option-btn"
              id="langKK"
              onclick="setLanguage('kk')">
        Қазақша
      </button>

      <button type="button"
              class="option-btn"
              id="langRU"
              onclick="setLanguage('ru')">
        Русский
      </button>

      <button type="button"
              class="option-btn"
              id="langEN"
              onclick="setLanguage('en')">
        English
      </button>

    </div>

  </div>

  <div class="popup-section">

    <span class="popup-label">
      🎨 Интерфейс
    </span>

    <div class="option-row">

      <button type="button"
              class="option-btn"
              id="themeDark"
              onclick="setTheme('dark')">
        🌙 Қараңғы
      </button>

      <button type="button"
              class="option-btn"
              id="themeLight"
              onclick="setTheme('light')">
        ☀️ Жарық
      </button>

    </div>

  </div>

  <button type="button"
          class="popup-close"
          id="settingsClose"
          onclick="closeAll()">
    Жабу
  </button>

</div>


<!-- ABOUT -->

<div id="aboutPopup" class="popup">

  <div class="popup-title">
    ℹ️ <span id="aboutTitle">My AI туралы</span>
  </div>

  <div id="aboutText"
       style="line-height:1.6;color:#aaa;margin-bottom:18px;">
    My AI — жеке AI көмекшіңіз.
    <br><br>
    Мәтінмен сөйлесу, суреттерді талдау,
    құжаттармен жұмыс және сурет генерациялау
    функциялары бар.
  </div>

  <button type="button"
          class="popup-close"
          id="aboutClose"
          onclick="closeAll()">
    Жабу
  </button>

</div>


<!-- HEADER -->

<header>

  <button type="button"
          class="menu-btn"
          onclick="toggleSidebar()">
    ☰
  </button>

  <div class="logo">
    My AI
  </div>

  <div id="status"
       class="status">
    Қосылуда...
  </div>

</header>


<!-- CHAT -->

<main id="chat">

  <div id="welcome"
       class="welcome">

    <h2>My AI</h2>

    <div id="welcomeText">
      Сұрағыңызды жазыңыз
    </div>

  </div>

</main>


<!-- COMPOSER -->

<div class="composer">

  <div class="composer-inner">

    <div id="preview"
         class="preview">
    </div>

    <textarea id="message"
              placeholder="My AI-ға сұрақ қойыңыз..."
              autocomplete="off">
    </textarea>

    <div class="toolbar">

      <button type="button"
              onclick="document.getElementById('imageInput').click()">
        📷
      </button>

      <input id="imageInput"
             type="file"
             accept="image/*">

      <button type="button"
              onclick="document.getElementById('fileInput').click()">
        📎
      </button>

      <input id="fileInput"
             type="file"
             accept=".txt,.md,.json,.csv,.html,.js,.css,.xml,.pdf">

      <button type="button"
              onclick="generateImage()">
        🖼️
      </button>

      <button type="button"
              class="send"
              id="sendButton"
              onclick="sendMessage()">
        ➤
      </button>

    </div>

  </div>

</div>

</div>


<script>

/* =====================================================
   API
===================================================== */

const API_URL =
  "https://my-ai-backend.razinavsegda84.workers.dev";


/* =====================================================
   ELEMENTS
===================================================== */

const chatElement =
  document.getElementById("chat");

const messageElement =
  document.getElementById("message");

const sendButton =
  document.getElementById("sendButton");

const statusElement =
  document.getElementById("status");

const sidebar =
  document.getElementById("sidebar");

const overlay =
  document.getElementById("overlay");

const settingsPopup =
  document.getElementById("settingsPopup");

const aboutPopup =
  document.getElementById("aboutPopup");

const historyList =
  document.getElementById("historyList");

const imageInput =
  document.getElementById("imageInput");

const fileInput =
  document.getElementById("fileInput");

const preview =
  document.getElementById("preview");


/* =====================================================
   STATE
===================================================== */

let history = [];

let selectedImages = [];

let selectedFile = null;

let selectedFileText = "";

let language =
  localStorage.getItem("myAI_language") || "kk";

let theme =
  localStorage.getItem("myAI_theme") || "dark";

let chatSessions = [];

try{
  chatSessions =
    JSON.parse(
      localStorage.getItem("myAI_chat_sessions") || "[]"
    );
}catch{
  chatSessions = [];
}


/* =====================================================
   TRANSLATIONS
===================================================== */

const T = {

  kk:{
    newChat:"＋ Жаңа чат",
    images:"Суреттер",
    documents:"Құжаттар",
    settings:"Баптаулар",
    about:"My AI туралы",
    history:"Чат тарихы",
    empty:"Әзірге чат тарихы жоқ",
    deleteAll:"Барлық чаттарды өшіру",
    settingsTitle:"⚙️ Баптаулар",
    interface:"🎨 Интерфейс",
    close:"Жабу",
    placeholder:"My AI-ға сұрақ қойыңыз...",
    welcome:"Сұрағыңызды жазыңыз",
    online:"Онлайн",
    connecting:"Қосылуда...",
    deleting:"Барлық чат тарихын өшіру керек пе?",
    aboutText:
      "My AI — жеке AI көмекшіңіз.\n\nМәтінмен сөйлесу, суреттерді талдау, құжаттармен жұмыс және сурет генерациялау функциялары бар.",
    imageSection:
      "🖼️ Суреттер бөлімі.\n\nСурет жасау үшін төмендегі 🖼️ батырмасын пайдаланыңыз."
  },

  ru:{
    newChat:"＋ Новый чат",
    images:"Изображения",
    documents:"Документы",
    settings:"Настройки",
    about:"О My AI",
    history:"История чатов",
    empty:"История чатов пока пуста",
    deleteAll:"Удалить все чаты",
    settingsTitle:"⚙️ Настройки",
    interface:"🎨 Интерфейс",
    close:"Закрыть",
    placeholder:"Задайте вопрос My AI...",
    welcome:"Напишите свой вопрос",
    online:"Онлайн",
    connecting:"Подключение...",
    deleting:"Удалить всю историю чатов?",
    aboutText:
      "My AI — ваш личный AI-помощник.\n\nПоддерживает общение, анализ изображений, работу с документами и генерацию изображений.",
    imageSection:
      "🖼️ Раздел изображений.\n\nДля создания изображения используйте кнопку 🖼️ ниже."
  },

  en:{
    newChat:"＋ New chat",
    images:"Images",
    documents:"Documents",
    settings:"Settings",
    about:"About My AI",
    history:"Chat history",
    empty:"No chat history yet",
    deleteAll:"Delete all chats",
    settingsTitle:"⚙️ Settings",
    interface:"🎨 Interface",
    close:"Close",
    placeholder:"Ask My AI a question...",
    welcome:"Ask your question",
    online:"Online",
    connecting:"Connecting...",
    deleting:"Delete all chat history?",
    aboutText:
      "My AI — your personal AI assistant.\n\nIt supports chat, image analysis, document work and image generation.",
    imageSection:
      "🖼️ Images section.\n\nUse the 🖼️ button below to generate an image."
  }

};


function t(){
  return T[language] || T.kk;
}


/* =====================================================
   START
===================================================== */

window.addEventListener("load",async function(){

  applyTheme();

  updateInterface();

  renderHistory();

  await checkBackend();

});


/* =====================================================
   MENU
===================================================== */

function toggleSidebar(){

  if(sidebar.classList.contains("open")){
    closeAll();
  }else{
    openSidebar();
  }

}


function openSidebar(){

  settingsPopup.classList.remove("show");
  aboutPopup.classList.remove("show");

  sidebar.classList.add("open");
  overlay.classList.add("show");

}


function closeAll(){

  sidebar.classList.remove("open");
  settingsPopup.classList.remove("show");
  aboutPopup.classList.remove("show");
  overlay.classList.remove("show");

}


/* =====================================================
   SETTINGS
===================================================== */

function openSettings(){

  sidebar.classList.remove("open");

  settingsPopup.classList.add("show");

  overlay.classList.add("show");

  updateSettingButtons();

}


function setLanguage(value){

  language = value;

  localStorage.setItem(
    "myAI_language",
    language
  );

  updateInterface();

  updateSettingButtons();

  renderHistory();

}


function setTheme(value){

  theme = value;

  localStorage.setItem(
    "myAI_theme",
    theme
  );

  applyTheme();

  updateSettingButtons();

}


function applyTheme(){

  document.body.classList.toggle(
    "light",
    theme === "light"
  );

}


function updateSettingButtons(){

  document.getElementById("langKK")
    .classList.toggle("active",language==="kk");

  document.getElementById("langRU")
    .classList.toggle("active",language==="ru");

  document.getElementById("langEN")
    .classList.toggle("active",language==="en");

  document.getElementById("themeDark")
    .classList.toggle("active",theme==="dark");

  document.getElementById("themeLight")
    .classList.toggle("active",theme==="light");

}


/* =====================================================
   INTERFACE LANGUAGE
===================================================== */

function updateInterface(){

  const x = t();

  document.documentElement.lang =
    language;

  document.querySelector(".new-chat")
    .textContent = x.newChat;

  document.getElementById("menuImages")
    .textContent = x.images;

  document.getElementById("menuDocuments")
    .textContent = x.documents;

  document.getElementById("menuSettings")
    .textContent = x.settings;

  document.getElementById("menuAbout")
    .textContent = x.about;

  document.getElementById("historyTitle")
    .textContent = x.history;

  document.getElementById("deleteAllText")
    .textContent = x.deleteAll;

/* =====================================================
   NEW CHAT
===================================================== */

function newChat(){

  saveCurrentChat();

  history = [];

  selectedImages = [];

  selectedFile = null;

  selectedFileText = "";

  chatElement.innerHTML = `
    <div class="welcome">
      <h2>My AI</h2>
      <div>${escapeHtml(t().welcome)}</div>
    </div>
  `;

  preview.style.display = "none";
  preview.innerHTML = "";

  messageElement.focus();

/* =====================================================
   HISTORY
===================================================== */

function renderHistory(){

  historyList.innerHTML = "";

  if(!chatSessions.length){

    const empty =
      document.createElement("div");

    empty.className =
      "history-empty";

    empty.textContent =
      t().empty;

    historyList.appendChild(empty);

    return;

  }

  chatSessions.forEach(function(session){

    const item =
      document.createElement("div");

    item.className =
      "history-item";

    item.textContent =
      session.title || "Chat";

    item.onclick =
      function(){
        loadChat(session.id);
      };

    historyList.appendChild(item);

  });

}


function saveCurrentChat(){

  if(!history.length){
    return;
  }

  const firstUser =
    history.find(function(x){
      return x.role === "user";
    });

  if(!firstUser){
    return;
  }

  let existing =
    chatSessions.find(function(x){
      return x.active === true;
    });

  if(existing){

    existing.messages =
      [...history];

    existing.title =
      String(firstUser.content).slice(0,60);

  }else{

    chatSessions.forEach(function(x){
      x.active = false;
    });

    chatSessions.unshift({

      id:Date.now(),

      title:
        String(firstUser.content).slice(0,60),

      active:true,

      messages:
        [...history]

    });

  }

  chatSessions =
    chatSessions.slice(0,30);

  localStorage.setItem(
    "myAI_chat_sessions",
    JSON.stringify(chatSessions)
  );

  renderHistory();

}


function loadChat(id){

  const session =
    chatSessions.find(function(x){
      return x.id === id;
    });

  if(!session){
    return;
  }

  chatSessions.forEach(function(x){
    x.active = false;
  });

  session.active = true;

  history =
    [...(session.messages || [])];

  chatElement.innerHTML = "";

  history.forEach(function(item){

    if(item.role === "user"){
      addMessage(
        "user",
        item.content,
        false
      );
    }

    if(item.role === "assistant"){
      addMessage(
        "assistant",
        item.content,
        true
      );
    }

  });

  localStorage.setItem(
    "myAI_chat_sessions",
    JSON.stringify(chatSessions)
  );

  closeAll();

}


/* =====================================================
   DELETE ALL
===================================================== */

function clearHistory(){

  if(!confirm(t().deleting)){
    return;
  }

  chatSessions = [];

  history = [];

  localStorage.removeItem(
    "myAI_chat_sessions"
  );

  renderHistory();

  chatElement.innerHTML = `
    <div class="welcome">
      <h2>My AI</h2>
      <div>${escapeHtml(t().welcome)}</div>
    </div>
  `;

}


/* =====================================================
   BACKEND
===================================================== */

async function checkBackend(){

  statusElement.classList.remove("online");

  statusElement.textContent =
    t().connecting;

  try{

    const response =
      await fetch(API_URL,{
        method:"GET"
      });

    const data =
      await response.json();

    if(data && data.ok){

      statusElement.textContent =
        t().online;

      statusElement.classList.add("online");

    }else{

      statusElement.textContent =
        "Backend қатесі";

    }

  }catch(error){

    console.error(error);

    statusElement.textContent =
      "Backend қосылмады";

  }

}

messageElement.addEventListener(

/* =====================================================
   IMAGE SELECT
===================================================== */

imageInput.addEventListener(
  "change",
  function(){

    const file =
      this.files[0];

    if(!file){
      return;
    }

    const reader =
      new FileReader();

    reader.onload =
      function(event){

        selectedImages =
          [event.target.result];

        preview.style.display =
          "block";

        preview.innerHTML =
          `<img class="preview-image"
                src="${event.target.result}">`;

      };

    reader.readAsDataURL(file);

  }
);


/* =====================================================
   FILE SELECT
===================================================== */

fileInput.addEventListener(
  "change",
  async function(){

    const file =
      this.files[0];

    if(!file){
      return;
    }

    selectedFile =
      file;

    selectedFileText =
      "";

    preview.style.display =
      "block";

    preview.innerHTML = `
      <div style="padding:8px">
        📄 ${escapeHtml(file.name)}
      </div>
    `;

    const textExtensions =
      [
        ".txt",
        ".md",
        ".json",
        ".csv",
        ".html",
        ".js",
        ".css",
        ".xml"
      ];

    const lower =
      file.name.toLowerCase();

    if(
      file.type === "text/plain" ||
      textExtensions.some(function(ext){
        return lower.endsWith(ext);
      })
    ){

      try{

        selectedFileText =
          await file.text();

      }catch(error){

        console.error(error);

        selectedFileText = "";

      }

    }

  }
);


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(){

  const message =
    messageElement.value.trim();

  if(
    !message &&
    !selectedImages.length &&
    !selectedFile
  ){
    return;
  }

  setLoading(true);

  if(message){

    addMessage(
      "user",
      message
    );

  }

  const currentImages =
    [...selectedImages];

  const currentFile =
    selectedFile;

  const currentFileText =
    selectedFileText;

  messageElement.value = "";

  selectedImages = [];

  selectedFile = null;

  selectedFileText = "";

  preview.style.display =
    "none";

  preview.innerHTML = "";

  try{

    const response =
      await fetch(API_URL,{
        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:JSON.stringify({

          action:"chat",

          message:
            message ||
            (
              currentFile
                ? `Файлды талдаңыз: ${currentFile.name}`
                : "Суретті талда."
            ),

          history:
            history.slice(-20),

          images:
            currentImages,

          fileText:
            currentFileText,

          fileName:
            currentFile
              ? currentFile.name
              : "",

          mimeType:
            currentFile
              ? currentFile.type
              : ""

        })

      });

    const data =
      await response.json();

    if(
      !response.ok ||
      !data.ok
    ){

      throw new Error(
        data.error ||
        `HTTP ${response.status}`
      );

    }

    const answer =
      data.answer ||
      "AI жауап бере алмады.";

    addMessage(
      "assistant",
      answer
    );

    history.push({
      role:"user",
      content:
        message ||
        (
          currentFile
            ? `Файл: ${currentFile.name}`
            : "Суретті талдау"
        )
    });

    history.push({
      role:"assistant",
      content:answer
    });

    history =
      history.slice(-20);

    saveCurrentChat();

  }catch(error){

    console.error(error);

    addMessage(
      "assistant",
      "Қате: " + error.message
    );

  }finally{

    setLoading(false);

  }

}


/* =====================================================
   IMAGE GENERATION
===================================================== */

async function generateImage(){

  const prompt =
    messageElement.value.trim();

  if(!prompt){

    addMessage(
      "assistant",
      language === "ru"
        ? "Сначала напишите описание изображения."
        : language === "en"
          ? "First write an image description."
          : "Сурет жасау үшін алдымен сипаттама жазыңыз."
    );

    return;
  }

  setLoading(true);

  addMessage(
    "user",
    "🖼️ " + prompt
  );

  messageElement.value = "";

  try{

    const response =
      await fetch(API_URL,{
        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:JSON.stringify({

          action:"image",

          prompt:prompt,

          width:1024,

          height:1024

        })

      });

    const data =
      await response.json();

    if(
      !response.ok ||
      !data.ok
    ){

      throw new Error(
        data.error ||
        `HTTP ${response.status}`
      );

    }

    if(!data.image){

      throw new Error(
        "Сурет қайтарылмады."
      );

    }

    addImageMessage(
      data.image
    );

  }catch(error){

    console.error(error);

    addMessage(
      "assistant",
      "Сурет жасау қатесі: " +
      error.message
    );

  }finally{

    setLoading(false);

  }

}


/* =====================================================
   ADD MESSAGE
===================================================== */

function addMessage(
  role,
  text,
  actions=true
){

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "message " + role;

  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";

  bubble.textContent =
    text;

  wrapper.appendChild(bubble);

  if(
    role === "assistant" &&
    actions
  ){

    const actionsBar =
      document.createElement("div");

    actionsBar.className =
      "message-actions";

    const copy =
      document.createElement("button");

    copy.textContent =
      "📋 Көшіру";

    copy.onclick =
      async function(){

        try{

          await navigator.clipboard.writeText(text);

          copy.textContent =
            "✓ Көшірілді";

          setTimeout(function(){
            copy.textContent =
              "📋 Көшіру";
          },1500);

        }catch{

          alert("Көшіру мүмкін болмады.");

        }

      };

    const retry =
      document.createElement("button");

    retry.textContent =
      "🔄 Қайта жауап";

    retry.onclick =
      function(){
        retryLast();
      };

    actionsBar.appendChild(copy);
    actionsBar.appendChild(retry);

    wrapper.appendChild(actionsBar);

  }

  chatElement.appendChild(wrapper);

  scrollChat();

}


/* =====================================================
   IMAGE MESSAGE
===================================================== */

function addImageMessage(image){

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "message assistant";

  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";

  const img =
    document.createElement("img");

  img.className =
    "generated-image";

  img.src =
    image;

  img.alt =
    "Generated image";

  bubble.appendChild(img);

  wrapper.appendChild(bubble);

  chatElement.appendChild(wrapper);

  scrollChat();

}


/* =====================================================
   RETRY
===================================================== */

async function retryLast(){

  let lastUser = null;

  for(
    let i=history.length-1;
    i>=0;
    i--
  ){

    if(history[i].role === "user"){

      lastUser =
        history[i].content;

      break;

    }

  }

  if(!lastUser){
    return;
  }

  messageElement.value =
    lastUser;

  await sendMessage();

}


/* =====================================================
   LOADING
===================================================== */

function setLoading(loading){

  sendButton.disabled =
    loading;

  messageElement.disabled =
    loading;

  if(loading){

    statusElement.classList.remove("online");

    statusElement.textContent =
      language === "ru"
        ? "Подготовка ответа..."
        : language === "en"
          ? "Preparing answer..."
          : "Жауап дайындалуда...";

  }else{

    statusElement.textContent =
      t().online;

    statusElement.classList.add("online");

  }

}


/* =====================================================
   SCROLL
===================================================== */

function scrollChat(){

  setTimeout(function(){

    chatElement.scrollTop =
      chatElement.scrollHeight;

  },50);

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}
