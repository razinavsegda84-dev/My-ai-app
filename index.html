<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My AI</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
}

body{
  background:#0b0b0f;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow:hidden;
  transition:background .2s,color .2s;
}

body.light{
  background:#f5f5f7;
  color:#111;
}

.app{
  width:100%;
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* HEADER */

header{
  height:58px;
  display:flex;
  align-items:center;
  padding:0 12px;
  background:#101014;
  border-bottom:1px solid #292929;
  flex-shrink:0;
  z-index:20;
}

body.light header{
  background:#fff;
  border-bottom:1px solid #ddd;
}

.menu-btn{
  width:42px;
  height:42px;
  padding:0;
  background:transparent;
  color:#fff;
  border:0;
  font-size:25px;
  border-radius:10px;
  cursor:pointer;
}

body.light .menu-btn{
  color:#111;
}

.logo{
  margin-left:5px;
  font-size:20px;
  font-weight:bold;
}

.status{
  margin-left:auto;
  font-size:12px;
  color:#8f8f8f;
}

.status.online{
  color:#54d17a;
}

/* SIDEBAR */

.sidebar{
  position:fixed;
  top:0;
  left:0;
  width:290px;
  height:100vh;
  background:#111116;
  color:#fff;
  border-right:1px solid #29292f;
  z-index:100;
  transform:translateX(-100%);
  transition:transform .25s ease;
  display:flex;
  flex-direction:column;
  padding:12px;
}

.sidebar.open{
  transform:translateX(0);
}

body.light .sidebar{
  background:#fff;
  color:#111;
  border-right:1px solid #ddd;
}

.sidebar-top{
  height:46px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
}

.sidebar-title{
  font-size:20px;
  font-weight:bold;
}

.close-menu{
  width:40px;
  height:40px;
  background:#25252c;
  color:#fff;
  border:0;
  border-radius:10px;
  font-size:23px;
  cursor:pointer;
}

body.light .close-menu{
  background:#eeeeef;
  color:#111;
}

.new-chat{
  width:100%;
  padding:12px;
  background:#fff;
  color:#000;
  border:0;
  border-radius:12px;
  font-weight:bold;
  font-size:14px;
  cursor:pointer;
  margin-bottom:8px;
}

.menu-section{
  margin-top:4px;
}

.menu-item{
  width:100%;
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 10px;
  background:transparent;
  color:#fff;
  border:0;
  border-radius:10px;
  text-align:left;
  font-size:15px;
  cursor:pointer;
}

body.light .menu-item{
  color:#111;
}

.menu-item:hover{
  background:#222229;
}

body.light .menu-item:hover{
  background:#eeeeef;
}

.menu-icon{
  width:24px;
  text-align:center;
  font-size:19px;
}

.menu-text{
  flex:1;
}

/* HISTORY */

.history-title{
  color:#888;
  font-size:12px;
  padding:12px 5px 7px;
}

.history{
  flex:1;
  overflow-y:auto;
  min-height:40px;
}

.history-empty{
  color:#666;
  padding:10px 7px;
  font-size:13px;
}

.history-item{
  width:100%;
  padding:11px;
  margin-bottom:4px;
  border-radius:10px;
  cursor:pointer;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-size:14px;
}

.history-item:hover{
  background:#222229;
}

body.light .history-item:hover{
  background:#eeeeef;
}

/* DELETE AREA */

.sidebar-bottom{
  flex-shrink:0;
  padding-top:10px;
  margin-top:8px;
  border-top:1px solid #29292f;
  background:inherit;
}

body.light .sidebar-bottom{
  border-top:1px solid #ddd;
}

.clear-history{
  width:100%;
  min-height:44px;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  gap:10px;
  padding:12px 10px;
  background:#25252c;
  color:#fff;
  border:0;
  border-radius:10px;
  font-size:14px;
  cursor:pointer;
}

.clear-history span:last-child{
  display:block;
  white-space:nowrap;
  overflow:visible;
}

body.light .clear-history{
  background:#eeeeef;
  color:#111;
}

/* OVERLAY */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:90;
  opacity:0;
  visibility:hidden;
  transition:opacity .2s ease;
}

.overlay.show{
  opacity:1;
  visibility:visible;
}

/* SETTINGS */

.settings-panel{
  position:fixed;
  top:58px;
  left:50%;
  width:min(420px,calc(100% - 24px));
  transform:translate(-50%,-20px);
  background:#15151a;
  color:#fff;
  border:1px solid #303038;
  border-radius:16px;
  padding:16px;
  z-index:150;
  opacity:0;
  visibility:hidden;
  transition:.2s ease;
}

.settings-panel.show{
  opacity:1;
  visibility:visible;
  transform:translate(-50%,0);
}

body.light .settings-panel{
  background:#fff;
  color:#111;
  border-color:#ddd;
}

.settings-title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:15px;
}

.setting-row{
  margin-bottom:18px;
}

.setting-label{
  display:block;
  font-size:13px;
  color:#999;
  margin-bottom:8px;
}

.setting-buttons{
  display:flex;
  gap:7px;
}

.setting-button{
  flex:1;
  padding:10px 8px;
  border:1px solid #303038;
  border-radius:10px;
  background:#202027;
  color:#fff;
  cursor:pointer;
  font-size:13px;
}

body.light .setting-button{
  background:#f1f1f3;
  color:#111;
  border-color:#ddd;
}

.setting-button.active{
  background:#fff;
  color:#000;
  border-color:#fff;
  font-weight:bold;
}

body.light .setting-button.active{
  background:#111;
  color:#fff;
  border-color:#111;
}

.settings-close{
  width:100%;
  padding:10px;
  background:#27272e;
  color:#fff;
  border:0;
  border-radius:10px;
  cursor:pointer;
}

body.light .settings-close{
  background:#eee;
  color:#111;
}

/* ABOUT */

.about-panel{
  position:fixed;
  top:50%;
  left:50%;
  width:min(440px,calc(100% - 24px));
  transform:translate(-50%,-45%);
  background:#15151a;
  color:#fff;
  border:1px solid #303038;
  border-radius:18px;
  padding:20px;
  z-index:160;
  opacity:0;
  visibility:hidden;
  transition:.2s ease;
}

.about-panel.show{
  opacity:1;
  visibility:visible;
  transform:translate(-50%,-50%);
}

body.light .about-panel{
  background:#fff;
  color:#111;
  border-color:#ddd;
}

.about-title{
  font-size:21px;
  font-weight:bold;
  margin-bottom:15px;
}

.about-text{
  line-height:1.6;
  color:#bbb;
  white-space:pre-line;
}

body.light .about-text{
  color:#555;
}

.about-close{
  width:100%;
  margin-top:18px;
  padding:11px;
  border:0;
  border-radius:10px;
  background:#27272e;
  color:#fff;
  cursor:pointer;
}

body.light .about-close{
  background:#eee;
  color:#111;
}

/* CHAT */

#chat{
  flex:1;
  overflow-y:auto;
  padding:20px 14px 145px;
}

.message{
  max-width:850px;
  margin:0 auto 18px;
  display:flex;
  flex-direction:column;
}

.message.user{
  align-items:flex-end;
}

.message.assistant{
  align-items:flex-start;
}

.bubble{
  max-width:85%;
  padding:12px 15px;
  border-radius:16px;
  line-height:1.5;
  white-space:pre-wrap;
  word-break:break-word;
}

.assistant .bubble{
  background:#17171c;
  border:1px solid #29292f;
}

body.light .assistant .bubble{
  background:#fff;
  border-color:#ddd;
}

.user .bubble{
  background:#303036;
  color:#fff;
}

body.light .user .bubble{
  background:#e2e2e7;
  color:#111;
}

/* MESSAGE ACTIONS */

.message-actions{
  display:flex;
  gap:6px;
  margin-top:7px;
}

.message-actions button{
  background:#202027;
  border:1px solid #303038;
  color:#bbb;
  border-radius:8px;
  padding:6px 9px;
  font-size:12px;
  cursor:pointer;
}

/* IMAGE */

.generated-image{
  max-width:100%;
  border-radius:14px;
  display:block;
}

.preview-image{
  max-width:100px;
  max-height:100px;
  border-radius:10px;
}

/* WELCOME */

.welcome{
  max-width:850px;
  margin:80px auto;
  text-align:center;
  color:#888;
}

.welcome h2{
  color:#fff;
}

body.light .welcome h2{
  color:#111;
}

/* COMPOSER */

.composer{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:linear-gradient(transparent,#0b0b0f 22%);
  padding:35px 12px 12px;
  z-index:20;
}

body.light .composer{
  background:linear-gradient(transparent,#f5f5f7 22%);
}

.composer-inner{
  max-width:850px;
  margin:auto;
  background:#15151a;
  border:1px solid #303038;
  border-radius:18px;
  padding:8px;
}

body.light .composer-inner{
  background:#fff;
  border-color:#ddd;
}

textarea{
  width:100%;
  resize:none;
  min-height:48px;
  max-height:150px;
  background:transparent;
  border:0;
  outline:0;
  color:#fff;
  font-size:16px;
  padding:10px;
  font-family:inherit;
}

body.light textarea{
  color:#111;
}

textarea::placeholder{
  color:#777;
}

.toolbar{
  display:flex;
  align-items:center;
  gap:7px;
  padding:5px;
}

.toolbar button{
  border:0;
  cursor:pointer;
  color:#fff;
  background:#27272e;
  border-radius:10px;
  padding:9px 12px;
  font-size:14px;
}

body.light .toolbar button{
  background:#eee;
  color:#111;
}

.send{
  margin-left:auto;
  background:#fff !important;
  color:#000 !important;
  font-weight:bold;
}

input[type=file]{
  display:none;
}

.preview{
  display:none;
  padding:8px;
  border-bottom:1px solid #29292f;
}

@media(max-width:600px){

  .sidebar{
    width:290px;
  }

  .bubble{
    max-width:92%;
  }

  #chat{
    padding-left:8px;
    padding-right:8px;
  }

  textarea{
    font-size:16px;
  }
}
</style>
</head>

<!-- ABOUT -->

window.addEventListener("load",async()=>{

  applyTheme();
  updateInterfaceLanguage();
  renderHistory();

  await checkBackend();

  messageElement.focus();

});

/* ================= SIDEBAR ================= */

function toggleSidebar(){

  if(sidebar.classList.contains("open")){
    closeSidebar();
  }else{
    openSidebar();
  }

}

function openSidebar(){

  settingsPanel.classList.remove("show");
  aboutPanel.classList.remove("show");

  sidebar.classList.add("open");
  overlay.classList.add("show");

}

function closeSidebar(){

  sidebar.classList.remove("open");

  if(
    !settingsPanel.classList.contains("show") &&
    !aboutPanel.classList.contains("show")
  ){
    overlay.classList.remove("show");
  }

}

function closeAllPanels(){

  sidebar.classList.remove("open");
  settingsPanel.classList.remove("show");
  aboutPanel.classList.remove("show");
  overlay.classList.remove("show");

}

/* ================= SETTINGS ================= */

function openSettings(){

  sidebar.classList.remove("open");
  aboutPanel.classList.remove("show");

  settingsPanel.classList.add("show");
  overlay.classList.add("show");

  updateSettingButtons();

}

function closeSettings(){

  settingsPanel.classList.remove("show");

  if(!aboutPanel.classList.contains("show")){
    overlay.classList.remove("show");
  }

}

function setLanguage(language){

  currentLanguage=language;

  localStorage.setItem(
    "myAI_language",
    language
  );

  updateInterfaceLanguage();
  updateSettingButtons();

}

function setTheme(theme){

  currentTheme=theme;

  localStorage.setItem(
    "myAI_theme",
    theme
  );

  applyTheme();
  updateSettingButtons();

}

function applyTheme(){

  document.body.classList.toggle(
    "light",
    currentTheme==="light"
  );

}

function updateSettingButtons(){

  document.querySelectorAll(".setting-button")
    .forEach(
      x=>x.classList.remove("active")
    );

  const langButton=
    document.getElementById(
      "lang-"+currentLanguage
    );

  if(langButton){
    langButton.classList.add("active");
  }

  const themeButton=
    document.getElementById(
      "theme-"+currentTheme
    );

  if(themeButton){
    themeButton.classList.add("active");
  }

}

function updateInterfaceLanguage(){

  const data=t();

  document.querySelector(".new-chat").textContent=
    data.newChat;

  document.querySelector('[data-i18n="images"]').textContent=
    data.images;

  document.querySelector('[data-i18n="documents"]').textContent=
    data.documents;

  document.querySelector('[data-i18n="settings"]').textContent=
    data.settings;

  document.querySelector('[data-i18n="about"]').textContent=
    data.about;

  document.querySelector('[data-i18n="history"]').textContent=
    data.history;

  document.getElementById("deleteAllText").textContent=
    data.deleteAll;

  document.querySelector('[data-i18n="settingsTitle"]').textContent=
    data.settingsTitle;

  document.querySelector('[data-i18n="language"]').textContent=
    data.language;

  document.querySelector('[data-i18n="interface"]').textContent=
    data.interface;

  document.getElementById("theme-dark").textContent=
    data.dark;

  document.getElementById("theme-light").textContent=
    data.light;

  document.querySelectorAll('[data-i18n="close"]')
    .forEach(
      x=>x.textContent=data.close
    );

  messageElement.placeholder=
    data.placeholder;

  document.getElementById("welcomeText").textContent=
    data.welcome;

  aboutText.textContent=
    data.aboutText;

  renderHistory();

}

/* ================= ABOUT ================= */

function openAbout(){

  sidebar.classList.remove("open");
  settingsPanel.classList.remove("show");

  aboutText.textContent=t().aboutText;

  aboutPanel.classList.add("show");
  overlay.classList.add("show");

}

function closeAbout(){

  aboutPanel.classList.remove("show");

  if(!settingsPanel.classList.contains("show")){
    overlay.classList.remove("show");
  }

}

/* ================= NEW CHAT ================= */

function newChat(){

  saveCurrentChat();

  history=[];
  selectedImages=[];
  selectedFileText="";
  selectedFile=null;

  chatElement.innerHTML=`
    <div id="welcome" class="welcome">
      <h2>My AI</h2>
      <div id="welcomeText">${escapeHtml(t().welcome)}</div>
    </div>
  `;

  messageElement.value="";
  previewElement.style.display="none";
  previewElement.innerHTML="";

  closeAllPanels();
  messageElement.focus();

}

/* ================= HISTORY ================= */

function renderHistory(){

  historyList.innerHTML="";

  if(!chatSessions.length){

    const empty=
      document.createElement("div");

    empty.className="history-empty";
    empty.textContent=t().empty;

    historyList.appendChild(empty);

    return;

  }

  chatSessions.forEach(session=>{

    const item=
      document.createElement("div");

    item.className="history-item";
    item.textContent=session.title;

    item.onclick=()=>{
      loadChat(session.id);
    };

    historyList.appendChild(item);

  });

}

function saveCurrentChat(){

  if(!history.length)return;

  const firstUser=
    history.find(
      x=>x.role==="user"
    );

  if(!firstUser)return;

  let existing=
    chatSessions.find(
      x=>x.active===true
    );

  if(existing){

    existing.messages=[...history];

    existing.title=
      String(firstUser.content).slice(0,60);

  }else{

    chatSessions.forEach(
      x=>x.active=false
    );

    chatSessions.unshift({

      id:Date.now(),

      title:
        String(firstUser.content).slice(0,60),

      active:true,

      messages:[...history]

    });

  }

  chatSessions=
    chatSessions.slice(0,30);

  localStorage.setItem(
    "myAI_chat_sessions",
    JSON.stringify(chatSessions)
  );

  renderHistory();

}

function loadChat(id){

  const session=
    chatSessions.find(
      x=>x.id===id
    );

  if(!session)return;

  chatSessions.forEach(
    x=>x.active=false
  );

  session.active=true;

  history=[...session.messages];

  chatElement.innerHTML="";

  history.forEach(item=>{

    addMessage(
      item.role,
      item.content,
      item.role==="assistant"
    );

  });

  localStorage.setItem(
    "myAI_chat_sessions",
    JSON.stringify(chatSessions)
  );

  closeAllPanels();

}

/* ================= DELETE ================= */

function clearHistory(){

  const questions={

    kk:"Барлық чат тарихын өшіру керек пе?",

    ru:"Удалить всю историю чатов?",

    en:"Delete all chat history?"

  };

  if(!confirm(questions[currentLanguage])){
    return;
  }

  chatSessions=[];
  history=[];

  localStorage.removeItem(
    "myAI_chat_sessions"
  );

  renderHistory();

  chatElement.innerHTML=`
    <div id="welcome" class="welcome">
      <h2>My AI</h2>
      <div id="welcomeText">${escapeHtml(t().welcome)}</div>
    </div>
  `;

}

/* ================= IMAGES ================= */

function openImages(){

  closeSidebar();

  addMessage(
    "assistant",
    t().imagesInfo
  );

}

/* ================= DOCUMENTS ================= */

function openDocuments(){

  closeSidebar();

  fileInput.click();

}

/* ================= BACKEND ================= */

async function checkBackend(){

  try{

    const response=
      await fetch(API_URL);

    const data=
      await response.json();

    if(data && data.ok){

      statusElement.textContent=
        currentLanguage==="ru"
        ?"Онлайн"
        :currentLanguage==="en"
        ?"Online"
        :"Онлайн";

      statusElement.classList.add("online");

    }else{

      statusElement.textContent=
        currentLanguage==="ru"
        ?"Ошибка backend"
        :currentLanguage==="en"
        ?"Backend error"
        :"Backend қатесі";

    }

  }catch(error){

    console.error(error);

    statusElement.textContent=
      currentLanguage==="ru"
      ?"Backend не подключён"
      :currentLanguage==="en"
      ?"Backend disconnected"
      :"Backend қосылмады";

  }

}

/* ================= ENTER ================= */

messageElement.addEventListener(
  "keydown",
  event=>{

    if(
      event.key==="Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();
      sendMessage();

    }

  }
);

/* ================= IMAGE SELECT ================= */

imageInput.addEventListener(
  "change",
  function(){

    const file=this.files[0];

    if(!file)return;

    const reader=new FileReader();

    reader.onload=event=>{

      selectedImages=[
        event.target.result
      ];

      previewElement.style.display="block";

      previewElement.innerHTML=`
        <img
          class="preview-image"
          src="${event.target.result}"
        >
      `;

    };

    reader.readAsDataURL(file);

  }
);

/* ================= FILE ================= */

fileInput.addEventListener(
  "change",
  async function(){

    const file=this.files[0];

    if(!file)return;

    selectedFile=file;

    previewElement.style.display="block";

    previewElement.innerHTML=`
      <div class="file-card">
        <div class="file-icon">📄</div>
        <div class="file-info">
          <div class="file-name">
            ${escapeHtml(file.name)}
          </div>
          <div class="file-type">
            ${escapeHtml(file.type || "File")}
          </div>
        </div>
      </div>
    `;

    if(
      file.type==="text/plain" ||
      /\.(txt|md|json|csv|js|css|html|xml)$/i.test(file.name)
    ){

      try{

        selectedFileText=
          await file.text();

      }catch(error){

        selectedFileText="";

      }

    }else{

      selectedFileText="";

    }

  }
);

/* ================= SEND ================= */

async function sendMessage(){

  const message=
    messageElement.value.trim();

  if(
    !message &&
    selectedImages.length===0 &&
    !selectedFile
  ){
    return;
  }

  setLoading(true);

  if(message){

    addMessage(
      "user",
      message
    );

  }

  const currentImages=[...selectedImages];
  const currentFileText=selectedFileText;
  const currentFile=selectedFile;

  messageElement.value="";
  selectedImages=[];
  selectedFileText="";
  selectedFile=null;

  previewElement.style.display="none";
  previewElement.innerHTML="";

  try{

    const response=
      await fetch(
        API_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            action:"chat",

            message:
              message ||
              (
                currentFile
                ?`Файлды талдаңыз: ${currentFile.name}`
                :"Суретті талда."
              ),

            history:
              history.slice(-20),

            images:
              currentImages,

            fileText:
              currentFileText,

            fileName:
              currentFile
              ?currentFile.name
              :"",

            mimeType:
              currentFile
              ?currentFile.type
              :""

          })

        }
      );

    const data=
      await response.json();

    if(
      !response.ok ||
      !data.ok
    ){

      throw new Error(
        data.error ||
        `HTTP ${response.status}`
      );

    }

    const answer=
      data.answer ||
      "AI жауап бере алмады.";

    addMessage(
      "assistant",
      answer
    );

    history.push({

      role:"user",

      content:
        message ||
        (
          currentFile
          ?`Файл: ${currentFile.name}`
          :"Суретті талдау"
        )

    });

    history.push({

      role:"assistant",
      content:answer

    });

    history=history.slice(-20);

    saveCurrentChat();

  }catch(error){

    console.error(error);

    addMessage(
      "assistant",
      "Қате: "+error.message
    );

  }finally{

    setLoading(false);

  }

}

/* ================= IMAGE GENERATION ================= */

async function generateImage(){

  const prompt=
    messageElement.value.trim();

  if(!prompt){

    addMessage(
      "assistant",
      currentLanguage==="ru"
      ?"Сначала напишите описание изображения."
      :currentLanguage==="en"
      ?"First write an image description."
      :"Сурет жасау үшін алдымен сипаттама жазыңыз."
    );

    return;

  }

  setLoading(true);

  addMessage(
    "user",
    "🖼️ "+prompt
  );

  messageElement.value="";

  try{

    const response=
      await fetch(
        API_URL,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({

            action:"image",
            prompt:prompt,
            width:1024,
            height:1024

          })

        }
      );

    const data=
      await response.json();

    if(
      !response.ok ||
      !data.ok
    ){

      throw new Error(
        data.error ||
        `HTTP ${response.status}`
      );

    }

    if(!data.image){

      throw new Error(
        "Сурет қайтарылмады."
      );

    }

    addImageMessage(
      data.image
    );

  }catch(error){

    console.error(error);

    addMessage(
      "assistant",
      "Сурет жасау қатесі: "+
      error.message
    );

  }finally{

    setLoading(false);

  }

}

/* ================= MESSAGE ================= */

function addMessage(
  role,
  text,
  actions=true
){

  const wrapper=
    document.createElement("div");

  wrapper.className=
    `message ${role}`;

  const bubble=
    document.createElement("div");

  bubble.className="bubble";

  bubble.textContent=text;

  wrapper.appendChild(bubble);

  if(
    role==="assistant" &&
    actions
  ){

    const actionBar=
      document.createElement("div");

    actionBar.className=
      "message-actions";

    const copyButton=
      document.createElement("button");

    copyButton.textContent=
      "📋 Көшіру";

    copyButton.onclick=
      async()=>{

        try{

          await navigator.clipboard.writeText(
            text
          );

          copyButton.textContent=
            "✓ Көшірілді";

          setTimeout(
            ()=>{
              copyButton.textContent=
                "📋 Көшіру";
            },
            1500
          );

        }catch{}

      };

    const retryButton=
      document.createElement("button");

    retryButton.textContent=
      "🔄 Қайта жауап";

    retryButton.onclick=
      ()=>retryLast();

    actionBar.appendChild(copyButton);
    actionBar.appendChild(retryButton);

    wrapper.appendChild(actionBar);

  }

  chatElement.appendChild(wrapper);

  scrollChat();

}

/* ================= IMAGE MESSAGE ================= */

function addImageMessage(image){

  const wrapper=
    document.createElement("div");

  wrapper.className=
    "message assistant";

  const bubble=
    document.createElement("div");

  bubble.className="bubble";

  const img=
    document.createElement("img");

  img.className="generated-image";
  img.src=image;
  img.alt="Generated image";

  bubble.appendChild(img);
  wrapper.appendChild(bubble);

  chatElement.appendChild(wrapper);

  scrollChat();

}

/* ================= RETRY ================= */

async function retryLast(){

  let lastUser=null;

  for(
    let i=history.length-1;
    i>=0;
    i--
  ){

    if(
      history[i].role==="user"
    ){

      lastUser=
        history[i].content;

      break;

    }

  }

  if(!lastUser)return;

  messageElement.value=
    lastUser;

  await sendMessage();

}

/* ================= LOADING ================= */

function setLoading(loading){

  sendButton.disabled=loading;
  messageElement.disabled=loading;

  if(loading){

    statusElement.textContent=
      currentLanguage==="ru"
      ?"Подготовка ответа..."
      :currentLanguage==="en"
      ?"Preparing answer..."
      :"Жауап дайындалуда...";

    statusElement.classList.remove("online");

  }else{

    statusElement.textContent=
      currentLanguage==="ru"
      ?"Онлайн"
      :currentLanguage==="en"
      ?"Online"
      :"Онлайн";

    statusElement.classList.add("online");

  }

}

/* ================= SCROLL ================= */

function scrollChat(){

  setTimeout(
    ()=>{
      chatElement.scrollTop=
        chatElement.scrollHeight;
    },
    50
  );

}

/* ================= ESCAPE ================= */

function escapeHtml(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}
